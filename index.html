xC4` (offset 2) are the tempting wrong answers."}]}, {"id": "elem-addr", "title": "Arrays: where element i lives", "read": "Slide: \"Arrays are stored contiguously in memory. All the elements of an array are placed in consecutive memory locations.\" **Element 0 is at the lowest address** and the indexes climb toward higher addresses. The **base address** is the address of element 0.\n\n> **Rule:** address of element i = (base address) + (size of each element) × i\n\n**Method:** multiply in decimal, convert the product to hex, add in hex.\n\n**Worked example.** `int32_t a[20]` has base address `0x0000_0062_0FE8`.\n\n- **Address of element 7.** 7 × 4 = 28 = `0x1C`. Then `0xFE8 + 0x1C`: 8 + C = 20 = `0x14`, write 4 carry 1. E + 1 + 1 = 16, write 0 carry 1. F + 1 = 16, write 0 carry 1. Result: `0x0000_0062_1004`.\n- **Addresses element 7 occupies.** Four of them: `…1004` to `…1007`.\n- **Going backwards.** Knowing only that element 7 is at `…1004`, element 3 is 4 elements earlier: 4 × 4 = 16 = `0x10`, and `0x1004 − 0x10 = 0x0FF4`.\n- **Which element contains address `…1012`?** Distance from the base: `0x1012 − 0xFE8 = 0x2A` = 42 bytes. 42 ÷ 4 = 10 remainder 2. It is inside **element 10** (its third byte).\n\nThings that go wrong:\n\n- **\"Element 9\" means index 9**, not the ninth or tenth element. Multiply by 9.\n- **The array's length never appears in the formula.** It only tells you which indexes exist.\n- **Subtracting as if the digits were decimal.** `0x1004 − 0x10` is `0x0FF4`, not `0x0994`.\n\n> **Lecture:** \"Index 0 is always at the lowest address.\" In a stack diagram that makes the array look backwards: element 0 is drawn at the bottom of the array's rows.", "questions": [{"id": "ea-fwd", "type": "short", "mode": "hex", "q": "`int64_t d[8]` has base address `0x0000_0071_00D8`. What is the address of `d[5]`?", "accept": ["0x000000710100"], "placeholder": "0x…", "why": "5 × 8 = 40 = `0x28`.\n\n`0xD8 + 0x28`: 8 + 8 = 16, write 0 carry 1. D + 2 + 1 = 16, write 0 carry 1. So `0xD8 + 0x28 = 0x100`.\n\nAddress: `0x0000_0071_0100`.\n\nTempting wrong answers: `…00DD` (added the index without multiplying by the size) and `…0118` (used the length 8 instead of the index 5: that is the first byte after the array)."}, {"id": "ea-span", "type": "blanks", "q": "`int16_t s[10]` has base address `0x0000_0071_2FF6`. Which addresses does element 6 occupy? Give full addresses.", "blanks": [{"label": "first address of element 6", "mode": "hex", "accept": ["0x000000713002"]}, {"label": "last address of element 6", "mode": "hex", "accept": ["0x000000713003"]}], "why": "6 × 2 = 12 = `0xC`.\n\n`0x2FF6 + 0xC`: 6 + C = 18 = `0x12`, write 2 carry 1. F + 1 = 16, write 0 carry 1. F + 1 = 16, write 0 carry 1. 2 + 1 = 3. That is `0x3002`.\n\nAn `int16_t` is 2 bytes, so element 6 occupies `0x0000_0071_3002` and `0x0000_0071_3003`.\n\nTempting wrong answer: `…2FFC` (adding 6 without scaling by the element size)."}, {"id": "ea-rev", "type": "short", "mode": "hex", "q": "In an `int32_t` array, element 5 is at address `0x0000_7FFF_0200`. What is the address of element 2?", "accept": ["0x00007FFF01F4"], "placeholder": "0x…", "hint": "How many elements back, and how many bytes is that in hex?", "why": "Element 2 is 5 − 2 = 3 elements earlier: 3 × 4 = 12 bytes = `0xC`.\n\n`0x200 − 0xC`: borrow, `0x10 − 0xC = 4`; the middle 0 becomes F after the borrow; the 2 becomes 1. So `0x1F4`.\n\nAddress: `0x0000_7FFF_01F4`.\n\nTempting wrong answers: `…01FD` (subtracted 3 without scaling) and `…0188` (did 200 − 12 in decimal)."}, {"id": "ea-which", "type": "short", "mode": "num", "q": "An `int32_t` array has base address `0x0000_0071_0A40`. Which element (give its index, in decimal) contains the byte at address `0x0000_0071_0A6E`?", "accept": ["11"], "why": "Distance from the base: `0xA6E − 0xA40 = 0x2E` = 2 × 16 + 14 = 46 bytes.\n\n46 ÷ 4 = 11 remainder 2, so the byte is inside **element 11** (which occupies `…0A6C` to `…0A6F`).\n\nTempting wrong answers: 12 (rounding up; element 12 does not start until `…0A70`) and 46 (that is the byte offset, not the index)."}]}, {"id": "fill", "title": "Filling in a low-level diagram", "read": "Now put it together. A typical problem gives a short program and an empty column of addresses, and you write what each row holds.\n\n1. **Row size:** read the step between row addresses.\n2. **Order, top to bottom:** main's RA first (8 bytes, value 0), then each local variable **in the order it is declared**. The stack grows toward lower addresses.\n3. **Arrays:** the array as a whole follows that order, but inside it **element 0 goes at the lowest address**, so the last element is drawn on top.\n4. **Pointers:** find the address of the row it points to, put `0000` in front, and split it across the pointer's rows with the low part on the lowest row.\n5. **Run the code line by line.** `*p = v` changes the row `p` points at. `p = …` or `p++` changes `p`'s own rows. Write the new value beside the old one.\n\n**Worked example** (4 bytes per row, state after line 9):\n\n```c\n5  int32_t n = 3;\n6  int32_t vals[] = {7, 8, 9};\n7  int32_t* p = &vals[1];\n8  *p = n;\n9  p = p + 1;\n```\n\n| Byte address | Data | What |\n|---|---|---|\n| `0xFFFF_A1B2_0034` | 0 | RA (4–7) |\n| `0xFFFF_A1B2_0030` | 0 | RA (0–3) |\n| `0xFFFF_A1B2_002C` | 3 | n |\n| `0xFFFF_A1B2_0028` | 9 | vals[2] |\n| `0xFFFF_A1B2_0024` | 8 → 3 | vals[1] |\n| `0xFFFF_A1B2_0020` | 7 | vals[0] |\n| `0xFFFF_A1B2_001C` | `0x0000FFFF` | p (4–7) |\n| `0xFFFF_A1B2_0018` | `0xA1B20024` → `0xA1B20028` | p (0–3) |\n\nLine 7 puts the address of `vals[1]`, `…0024`, in `p`. Line 8 writes 3 into that row. Line 9 moves `p` on by one `int32_t`, 4 bytes, so only its low row changes.\n\nA **heap** block is filled in by the same rules in its own column: a `malloc`'d array has element 0 at the address `malloc` returned, and the pointer variable on the stack holds that address.", "questions": [{"id": "fd-stack4", "type": "blanks", "q": "Four bytes per row. Give the contents of the rows **after line 10** has run.\n\n```c\n 3  int main() {\n 4      int32_t a = 6;\n 5      int32_t b = 11;\n 6      int32_t* p = &a;\n 7      int32_t* q = &b;\n 8      *p = *q + 1;\n 9      q = p;\n10      *q = *q * 2;\n11  }\n```\n\n| Byte address | What |\n|---|---|\n| `0xFFFF_C0DE_0A2C` | RA (4–7) |\n| `0xFFFF_C0DE_0A28` | RA (0–3) |\n| `0xFFFF_C0DE_0A24` | a |\n| `0xFFFF_C0DE_0A20` | b |\n| `0xFFFF_C0DE_0A1C` | p (4–7) |\n| `0xFFFF_C0DE_0A18` | p (0–3) |\n| `0xFFFF_C0DE_0A14` | q (4–7) |\n| `0xFFFF_C0DE_0A10` | q (0–3) |", "blanks": [{"label": "row …0A24 (a), in decimal", "mode": "num", "accept": ["24"]}, {"label": "row …0A20 (b), in decimal", "mode": "num", "accept": ["11"]}, {"label": "row …0A1C, p (4–7), in hex", "mode": "hex", "accept": ["0x0000FFFF"]}, {"label": "row …0A18, p (0–3), in hex", "mode": "hex", "accept": ["0xC0DE0A24"]}, {"label": "row …0A10, q (0–3), in hex", "mode": "hex", "accept": ["0xC0DE0A24"]}], "why": "- Line 6: `p` holds the address of `a`, `0x0000_FFFF_C0DE_0A24`. Upper row `0x0000FFFF`, lower row `0xC0DE0A24`.\n- Line 7: `q` holds the address of `b`, so its lower row starts as `0xC0DE0A20`.\n- Line 8: `a` = 11 + 1 = 12.\n- Line 9: no `*`, so `q` itself changes. Its lower row becomes `0xC0DE0A24`; it now points at `a`.\n- Line 10: through `q`, `a` = 12 × 2 = **24**. `b` is never written, so it stays **11**.\n\nTempting wrong answer: leaving `q` pointing at `b` and doubling `b` to 22."}, {"id": "fd-stack2", "type": "blanks", "q": "**Two bytes per row.** The top row, `0xFFFF_B7A0_0126`, is the top of main's RA. Work out what lives in each row, then give the contents **after line 7** has run.\n\n```c\n 3  int main() {\n 4      int16_t s[] = {40, 30, 20, 10};\n 5      int16_t* p = s + 1;\n 6      *p = *(p + 2);\n 7      p[1] = s[0] + 2;\n 8      return 0;\n 9  }\n```\n\nRows, top to bottom: `…0126`, `…0124`, `…0122`, `…0120`, `…011E`, `…011C`, `…011A`, `…0118`, `…0116`, `…0114`, `…0112`, `…0110`.", "blanks": [{"label": "row …011E, in decimal", "mode": "num", "accept": ["10"]}, {"label": "row …011C, in decimal", "mode": "num", "accept": ["42"]}, {"label": "row …011A, in decimal", "mode": "num", "accept": ["10"]}, {"label": "row …0118, in decimal", "mode": "num", "accept": ["40"]}, {"label": "row …0112, in hex", "mode": "hex", "accept": ["0xB7A0"]}, {"label": "row …0110, in hex", "mode": "hex", "accept": ["0x011A"]}], "hint": "RA takes the first four rows. Inside the array, index 0 is at the lowest address.", "why": "Layout: the RA is 8 bytes, so four rows (`…0126` down to `…0120`). `s` is 4 × 2 = 8 bytes, four rows, with `s[0]` lowest: `s[3]` at `…011E`, `s[2]` at `…011C`, `s[1]` at `…011A`, `s[0]` at `…0118`. `p` is the bottom four rows.\n\n- Line 5: `p` = address of `s[1]` = `0x0000_FFFF_B7A0_011A`. From the top its rows are `0x0000`, `0xFFFF`, `0xB7A0`, `0x011A`.\n- Line 6: `s[1] = s[3]` = 10.\n- Line 7: `p[1]` is `s[2]`, which becomes 40 + 2 = 42.\n\nFinal `s` = {40, 10, 42, 10}. Tempting wrong answers: drawing `s[0]` at the top (`…011E`), or `0x0118` in p's low row (forgetting the `+ 1`)."}, {"id": "fd-heap", "type": "blanks", "q": "**Eight bytes per row.** The call to `malloc` returns `0xAAAA_0040_2010`. Give the contents **after line 10** has run.\n\n```c\n 4  int main() {\n 5      int64_t* h = malloc(3 * sizeof(int64_t));\n 6      int64_t* e = h + 2;\n 7      *h = 5;\n 8      *e = *h + 4;\n 9      e--;\n10      *e = h[2] - h[0];\n11  }\n```\n\nStack:\n\n| Byte address | What |\n|---|---|\n| `0xFFFF_E120_0058` | RA |\n| `0xFFFF_E120_0050` | h |\n| `0xFFFF_E120_0048` | e |\n\nHeap rows, top to bottom: `0xAAAA_0040_2020`, `0xAAAA_0040_2018`, `0xAAAA_0040_2010`.", "blanks": [{"label": "stack row …0050 (h), in hex", "mode": "hex", "accept": ["0x0000AAAA00402010"]}, {"label": "stack row …0048 (e), in hex", "mode": "hex", "accept": ["0x0000AAAA00402018"]}, {"label": "heap row …2020, in decimal", "mode": "num", "accept": ["9"]}, {"label": "heap row …2018, in decimal", "mode": "num", "accept": ["4"]}, {"label": "heap row …2010, in decimal", "mode": "num", "accept": ["5"]}], "why": "`h` holds what `malloc` returned, the address of `h[0]`: `0x0000_AAAA_0040_2010`. So `h[0]` is the bottom heap row, `h[1]` is `…2018` and `h[2]` is `…2020`.\n\n- Line 6: `e = h + 2` is 2 × 8 = 16 = `0x10` bytes on: `…2020`.\n- Lines 7 and 8: `h[0]` = 5, then through `e`, `h[2]` = 5 + 4 = 9.\n- Line 9: `e--` moves back one `int64_t`, 8 bytes: `…2018`.\n- Line 10: through `e`, `h[1]` = 9 − 5 = 4.\n\nTempting wrong answers: `…201F` for `e` (stepping back 1 byte instead of 8), or putting `h[0]` in the top heap row."}, {"id": "fd-draw", "type": "self", "lines": 14, "q": "**On paper.** Draw the complete low-level diagram for this program at the moment `main` is about to return. **Two bytes per row.** The top row is `0xFFFF_AC10_0056`, and it is the top of main's RA. Give every row an address, a value and a label.\n\n```c\n 3  int main() {\n 4      int16_t n = 2;\n 5      int16_t w[] = {9, 8, 7};\n 6      int16_t* p = &w[n];\n 7      *p = *(p - 2) + n;\n 8      p--;\n 9      *p = 0;\n10  }\n```", "model": "| Byte address | Data | What |\n|---|---|---|\n| `0xFFFF_AC10_0056` | 0 | RA (bytes 6–7) |\n| `0xFFFF_AC10_0054` | 0 | RA (bytes 4–5) |\n| `0xFFFF_AC10_0052` | 0 | RA (bytes 2–3) |\n| `0xFFFF_AC10_0050` | 0 | RA (bytes 0–1) |\n| `0xFFFF_AC10_004E` | 2 | n |\n| `0xFFFF_AC10_004C` | 7 → 11 | w[2] |\n| `0xFFFF_AC10_004A` | 8 → 0 | w[1] |\n| `0xFFFF_AC10_0048` | 9 | w[0] |\n| `0xFFFF_AC10_0046` | `0x0000` | p (bytes 6–7) |\n| `0xFFFF_AC10_0044` | `0xFFFF` | p (bytes 4–5) |\n| `0xFFFF_AC10_0042` | `0xAC10` | p (bytes 2–3) |\n| `0xFFFF_AC10_0040` | `0x004C` → `0x004A` | p (bytes 0–1) |", "rubric": ["RA fills the top four rows (`…0056` down to `…0050`), all 0", "`n` = 2 is at `…004E`, directly below the RA", "`w[0]` is at the lowest of the array's three rows (`…0048`) and `w[2]` at `…004C`", "final array values: `w[0]` = 9, `w[1]` = 0, `w[2]` = 11", "`p` takes four rows; from the top they read `0x0000`, `0xFFFF`, `0xAC10`, `0x004A`"], "why": "Line 6: `p` holds the address of `w[2]`, `…004C`. Line 7: `*(p - 2)` is `w[0]` = 9, so `w[2]` = 9 + 2 = 11. Line 8: `p` moves back one `int16_t`, 2 bytes, to `…004A`. Line 9: `w[1]` = 0.\n\nThe two slips to look for: drawing `w[0]` on top of the array, and moving `p` back by 1 byte (to `…004B`) instead of one element."}]}], "checkpoint": [{"id": "ck-fwd", "type": "short", "mode": "hex", "q": "`int64_t m[30]` has base address `0x0000_0009_3FB8`. What is the address of `m[13]`?", "accept": ["0x000000094020"], "placeholder": "0x…", "why": "13 × 8 = 104 = 6 × 16 + 8 = `0x68`.\n\n`0x3FB8 + 0x68`: 8 + 8 = 16, write 0 carry 1. B + 6 + 1 = 18 = `0x12`, write 2 carry 1. F + 1 = 16, write 0 carry 1. 3 + 1 = 4. That is `0x4020`.\n\nAddress: `0x0000_0009_4020`.\n\nTempting wrong answers: `…40BC` (added 104 as if it were hex) and `…3FC5` (added 13 without multiplying by 8)."}, {"id": "ck-rev", "type": "blanks", "q": "In an `int16_t` array, element 12 is at address `0x0000_0009_1006`. Give full addresses.", "blanks": [{"label": "base address (address of element 0)", "mode": "hex", "accept": ["0x000000090FEE"]}, {"label": "address of element 20", "mode": "hex", "accept": ["0x000000091016"]}, {"label": "last address element 20 occupies", "mode": "hex", "accept": ["0x000000091017"]}], "hint": "Go back 12 elements for the base. Element 20 is 8 elements after element 12.", "why": "**Base:** 12 elements back = 12 × 2 = 24 = `0x18`. `0x1006 − 0x18`: 6 − 8 needs a borrow, `0x16 − 8 = E`. Next digit 0 − 1 − 1 needs a borrow, `0x10 − 2 = E`. Next 0 − 1 needs a borrow, giving F. Then 1 − 1 = 0. Result `0x0FEE`, so the base is `0x0000_0009_0FEE`.\n\n**Element 20:** 8 elements after element 12 = 16 bytes = `0x10`. `0x1006 + 0x10 = 0x1016`.\n\n**Its last byte:** an `int16_t` is 2 bytes, so `0x1017`.\n\nTempting wrong answer for the base: `…0FFA` (subtracting 12 instead of 12 × 2)."}, {"id": "ck-which", "type": "short", "mode": "num", "q": "An `int64_t` array has base address `0x0000_0009_0FF0`. Which element (give its index, in decimal) contains the byte at address `0x0000_0009_1033`?", "accept": ["8"], "why": "Distance from the base: `0x1033 − 0xFF0 = 0x43` = 4 × 16 + 3 = 67 bytes.\n\n67 ÷ 8 = 8 remainder 3, so the byte is inside **element 8** (which runs from `…1030` to `…1037`).\n\nTempting wrong answers: 9 (rounding up) and 16 (dividing by 4 as if the elements were `int32_t`)."}, {"id": "ck-neg", "type": "blanks", "q": "`int32_t k = -300;` is stored at address `0x0000_0009_0C10`. Fill in its four bytes in hex.", "blanks": [{"label": "byte at …0C10", "mode": "hex", "accept": ["0xD4"]}, {"label": "byte at …0C11", "mode": "hex", "accept": ["0xFE"]}, {"label": "byte at …0C12", "mode": "hex", "accept": ["0xFF"]}, {"label": "byte at …0C13", "mode": "hex", "accept": ["0xFF"]}], "why": "300 = `0x0000012C`. Two's complement: flip every bit, `0xFFFFFED3`, then add 1, `0xFFFFFED4`.\n\nPairs: `FF FF FE D4`. The least significant byte goes at the lowest address: `D4`, `FE`, `FF`, `FF`.\n\nTempting wrong answers: `FF FF FE D4` (big-endian) and `2C 01 00 80` (setting a sign bit instead of using two's complement)."}, {"id": "ck-byte64", "type": "short", "mode": "hex", "q": "`int64_t big = 0x00C0FFEE12345678;` is stored at address `0x0000_0009_0D00`. Which byte is at `0x0000_0009_0D06`? Answer in hex.", "accept": ["0xC0"], "placeholder": "0x…", "why": "Pairs: `00 C0 FF EE 12 34 56 78`. Number them from the right: `78` +0, `56` +1, `34` +2, `12` +3, `EE` +4, `FF` +5, `C0` +6, `00` +7.\n\n`…0D06` is offset +6: `0xC0`.\n\nCounting 6 in from the left gives `0x56`, the big-endian answer."}, {"id": "ck-signed", "type": "blanks", "q": "Little-endian machine, one byte per row:\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0009_0E00` | `0xF0` |\n| `0x0000_0009_0E01` | `0xFF` |\n| `0x0000_0009_0E02` | `0x2A` |\n| `0x0000_0009_0E03` | `0x00` |\n\nA program reads these bytes as two `int16_t` values. Give each value **in decimal**.", "blanks": [{"label": "int16_t at …0E00", "mode": "num", "accept": ["-16"]}, {"label": "int16_t at …0E02", "mode": "num", "accept": ["42"]}], "why": "**At `…0E00`:** bytes `F0` then `FF`, higher address on the left: `0xFFF0`. The top bit is 1, so it is negative. Flip, `0x000F`; add 1, `0x0010` = 16. The value is **−16**.\n\n**At `…0E02`:** bytes `2A` then `00`: `0x002A` = 2 × 16 + 10 = **42**.\n\nTempting wrong answers: 65520 (reading `0xFFF0` as unsigned) and −3841 (reading the bytes in address order, `0xF0FF`)."}, {"id": "ck-straddle", "type": "short", "mode": "hex", "q": "Little-endian machine, 4 bytes per row:\n\n| Byte address | Data |\n|---|---|\n| `0xFFFF_0A1C_500C` | `0x0BADF00D` |\n| `0xFFFF_0A1C_5008` | `0x7766AA55` |\n| `0xFFFF_0A1C_5004` | `0xC1D2E3F4` |\n| `0xFFFF_0A1C_5000` | `0x00000019` |\n\nWhat is the 32-bit value stored at `0xFFFF_0A1C_5006`? (It starts in the middle of a row.) Answer in hex.", "accept": ["0xAA55C1D2"], "placeholder": "0x…", "hint": "List the four addresses, find each byte, then write the highest address first.", "why": "The value occupies `…5006`, `…5007`, `…5008`, `…5009`.\n\n- Row `…5004` is `C1 D2 E3 F4`. Offsets 2 and 3 from the right are `D2` (at `…5006`) and `C1` (at `…5007`).\n- Row `…5008` is `77 66 AA 55`. Offsets 0 and 1 are `55` (at `…5008`) and `AA` (at `…5009`).\n\nHighest address first: `AA 55 C1 D2`, so the value is `0xAA55C1D2`.\n\nTempting wrong answer: `0xC1D2AA55`, which puts the lower row's bytes on the left."}, {"id": "ck-dump", "type": "blanks", "q": "Little-endian machine, 4 bytes per row. **In this question a word is 64 bits and a half-word is 32 bits.**\n\n| Byte address | Data |\n|---|---|\n| `0xFFFF_0A1C_500C` | `0x0BADF00D` |\n| `0xFFFF_0A1C_5008` | `0x7766AA55` |\n| `0xFFFF_0A1C_5004` | `0xC1D2E3F4` |\n| `0xFFFF_0A1C_5000` | `0x00000019` |\n\nAnswer each part.", "blanks": [{"label": "byte at …500E, in hex", "mode": "hex", "accept": ["0xAD"]}, {"label": "word at …5008, in hex", "mode": "hex", "accept": ["0x0BADF00D7766AA55"]}, {"label": "half-word at …5000, in decimal", "mode": "num", "accept": ["25"]}], "why": "**Byte at `…500E`:** row `…500C` is `0B AD F0 0D`; offset 2 from the right is `0xAD`.\n\n**Word at `…5008`:** 8 bytes, rows `…5008` and `…500C`, higher row on the left: `0x0BADF00D7766AA55`.\n\n**Half-word at `…5000`:** 4 bytes, the whole row: `0x00000019` = 16 + 9 = **25**.\n\nTempting wrong answers: `0xF0` for the byte (counting from the left) and `0x7766AA550BADF00D` for the word (rows in address order)."}, {"id": "ck-ptr", "type": "short", "mode": "hex", "q": "Four bytes per row:\n\n| Byte address | Data | What |\n|---|---|---|\n| `0xFFFF_9A34_0044` | `0x0000FFFF` | p (4–7) |\n| `0xFFFF_9A34_0040` | `0x9A340058` | p (0–3) |\n\n`p` is an `int16_t*` that points at element 0 of an `int16_t` array. What is the address of element 6 of that array? Give all 12 hex digits.", "accept": ["0xFFFF9A340064"], "placeholder": "0x…", "why": "Rebuild the pointer, upper row on the left: `0x0000_FFFF_9A34_0058`. So the array's base address is `0xFFFF_9A34_0058`.\n\nElement 6: 6 × 2 = 12 = `0xC`. `0x58 + 0xC`: 8 + C = 20 = `0x14`, write 4 carry 1; 5 + 1 = 6. That is `0x64`.\n\nAddress: `0xFFFF_9A34_0064`.\n\nTempting wrong answers: `…004C` (used the address where `p` lives as the base) and `…005E` (added 6 without scaling)."}, {"id": "ck-call", "type": "blanks", "q": "**Eight bytes per row.** Frames follow the class convention: parameters, then RA, then locals; main's RA is 0 and a callee's RA is the line number of the call. Fill in the diagram for the moment execution reaches line 5.\n\n```c\n 1  #include <stdint.h>\n 2\n 3  void fix(int64_t* t, int64_t k) {\n 4      t[k] = t[0] + k;\n 5  }\n 6\n 7  int main() {\n 8      int64_t len = 3;\n 9      int64_t v[] = {20, 30, 40};\n10      fix(v, len - 1);\n11  }\n```\n\n| Byte address | What |\n|---|---|\n| `0xFFFF_B00C_2E70` | main: RA |\n| `0xFFFF_B00C_2E68` | main: len |\n| `0xFFFF_B00C_2E60` | main: an element of v |\n| `0xFFFF_B00C_2E58` | main: an element of v |\n| `0xFFFF_B00C_2E50` | main: an element of v |\n| `0xFFFF_B00C_2E48` | fix: t |\n| `0xFFFF_B00C_2E40` | fix: k |\n| `0xFFFF_B00C_2E38` | fix: RA |", "blanks": [{"label": "row …2E60, in decimal", "mode": "num", "accept": ["22"]}, {"label": "row …2E50, in decimal", "mode": "num", "accept": ["20"]}, {"label": "row …2E48 (t), in hex", "mode": "hex", "accept": ["0x0000FFFFB00C2E50"]}, {"label": "row …2E40 (k), in decimal", "mode": "num", "accept": ["2"]}, {"label": "row …2E38 (fix's RA), in decimal", "mode": "num", "accept": ["10"]}], "hint": "Where is v[0]? That address is what t holds.", "why": "- Element 0 is at the lowest of the array's rows: `v[0]` at `…2E50`, `v[1]` at `…2E58`, `v[2]` at `…2E60`.\n- The array decays to a pointer, so `t` holds the address of `v[0]`: `0x0000_FFFF_B00C_2E50`, all in one 8-byte row.\n- `k` = 3 − 1 = 2. The call is on line 10, so fix's RA is 10.\n- Line 4: `t[2] = t[0] + 2` = 22. That write lands in **main's** frame at `…2E60`. `v[0]` stays 20.\n\nTempting wrong answers: 40 → 22 written at `…2E50` (array drawn first element on top), and `…2E60` as the value of `t`."}, {"id": "ck-notype", "type": "mc", "q": "In a one-byte-per-row diagram, the byte at address `0x0000_0009_0D07` is `0x00`. Is that a one-byte zero, or part of a larger number?", "options": ["You cannot tell from memory alone; how the program reads it decides", "It is a one-byte zero, because the diagram gives every byte its own row", "It is the top byte of a 4-byte value, because its address ends in 7", "It is unused padding, because meaningful data never contains `0x00`"], "answer": 0, "why": "Lecture: \"You cannot tell just by looking at memory.\" Memory is a sequence of bytes with no record of types or of where one value stops and the next starts.\n\nThe meaning comes from how the program reads it: every access gives a starting address **and** a size. The same byte could be a `char`, the top byte of an `int32_t` at `…0D04`, or the top byte of an `int64_t` at `…0D00`.\n\nThe row size of a diagram is a drawing choice and says nothing about the types."}, {"id": "ck-explain", "type": "self", "lines": 7, "q": "**Short answer, on paper.** One or two sentences each.\n\n1. State the little-endian rule.\n2. What is \"the address\" of a variable that is 4 bytes long?\n3. In a stack diagram, where is element 0 of an array drawn, and why does the element-address formula need it there?", "model": "1. Little-endian: the least significant byte of the value goes in the lowest address (and the most significant byte in the highest).\n2. The lowest of the addresses it occupies, its starting byte. A 4-byte variable at address A occupies A to A + 3.\n3. Element 0 is at the lowest address of the array, so it is drawn at the bottom of the array's rows and the array looks backwards. The formula is base + size × index, so a bigger index has to mean a higher address, with index 0 exactly at the base.", "rubric": ["1: least significant byte at the lowest address", "2: the lowest address the variable occupies (its starting byte)", "3: element 0 at the lowest address, drawn at the bottom of the array's rows", "3: reason given: address = base + size × index, so indexes must climb toward higher addresses"], "why": "These three sentences are the rules lecture repeated most: \"The least significant byte of the integer goes in the lowest address\", \"It's always just the lowest of the addresses that it occupies\", and \"Index 0 is always at the lowest address\".\n\nA common weak answer to part 3 says only \"at the bottom\" without the reason. Tie it to the formula."}]}, {"id": "pointer-arithmetic", "title": "Pointer arithmetic and pointer types", "blurb": "Predict the address any pointer expression lands on, trace code that walks an array with pointers, and say exactly which bytes a pointer of a given type reads or writes.", "objective": "Objective 5: Pointers", "sources": "CL17 · CL19 · HW6 · HW7 · DIS §2.9.4", "minutes": 70, "cheats": ["`p + n` moves **n elements**: new address = p + n × `sizeof(*p)`. `char` 1, `short` 2, `int` and `float` 4, `long`, `double` and every pointer 8.", "`p[i]` is `*(p + i)` for any pointer, so `p[-1]` is the element before `p`. `&p[i]` is `p + i`.", "`*(p + 2)` is the element two further on. `*p + 2` is the value at `p`, plus 2.", "`*p++` uses the value, then moves the pointer. `(*p)++` adds 1 to the value and leaves the pointer where it is.", "`q - p` = number of **elements** between them = (address difference) ÷ `sizeof(*p)`. Same array only.", "A pointer's type sets the step **and** how many bytes `*p` reads or writes. Same address, different type, different bytes.", "Cast reads: write the bytes in address order, start at the pointer's byte offset, take `sizeof` bytes, highest address on the left.", "`sizeof(array)` is its total bytes; `sizeof(pointer)` is 8; an array parameter is really a pointer. C never checks bounds: `a[n]` and `p + i * sizeof(T)` are bugs."], "chunks": [{"id": "scale", "title": "p + n moves n elements, not n bytes", "read": "A pointer holds an address, so you might expect `p + 1` to be the next byte. It is not.\n\n> **Rule:** `p + n` is the address `n` **elements** further on: (address in `p`) + n × `sizeof(*p)`.\n\nSlide wording: \"Pointer increments depend on data type size (p + 1 adds sizeof(*p) bytes).\" The compiler does the multiplying for you. You write `p + 3`; it adds 3 × the element size. `p - n` moves back the same way.\n\nSo the first thing to read off any pointer question is **what the pointer points to**:\n\n| Declared as | Points to | `p + 1` adds |\n|---|---|---|\n| `char*`, `int8_t*` | 1-byte values | 1 |\n| `short*`, `int16_t*` | 2-byte values | 2 |\n| `int*`, `int32_t*`, `float*` | 4-byte values | 4 |\n| `long*`, `int64_t*`, `double*` | 8-byte values | 8 |\n| `int**`, `char**` (pointer to a pointer) | 8-byte pointers | 8 |\n\nThe pointer variable itself is always 8 bytes. That has nothing to do with the step. The step comes from the thing pointed **to**.\n\n**Method** (the same as for element addresses): n × size in decimal, convert to hex, add in hex.\n\n**Worked example.** Four pointers all hold `0x0000_0060_2FF8`.\n\n- `int32_t* p`: `p + 3` is 3 × 4 = 12 = `0xC` bytes on. `0x2FF8 + 0xC = 0x3004`.\n- `double* d`: `d + 1` is 8 bytes on: `0x3000`.\n- `char* c`: `c + 3` is 3 bytes on: `0x2FFB`.\n- `int** pp`: `pp + 2` is 2 × 8 = 16 = `0x10` bytes on: `0x3008`.\n\n> **Trap:** adding n itself (`0x2FF8 + 3`) is only right for `char*`. And do not multiply by 8 \"because pointers are 8 bytes\" unless the pointer points at 8-byte things.", "questions": [{"id": "sc-short", "type": "short", "mode": "hex", "q": "`int16_t* p` holds `0x0000_0060_7FFC`. What address is `p + 5`?", "accept": ["0x000000608006"], "placeholder": "0x…", "why": "5 × 2 = 10 = `0xA`.\n\n`0x7FFC + 0xA`: C + A = 22 = `0x16`, write 6 carry 1. F + 1 = 16, write 0 carry 1. F + 1 = 16, write 0 carry 1. 7 + 1 = 8. That is `0x8006`.\n\nAddress: `0x0000_0060_8006`.\n\nTempting wrong answer: `…8001`, from adding 5 without scaling by the 2-byte element size."}, {"id": "sc-double", "type": "short", "mode": "hex", "q": "`double* d` holds `0x0000_0060_13F0`. What address is `d + 4`?", "accept": ["0x000000601410"], "placeholder": "0x…", "why": "A `double` is 8 bytes: 4 × 8 = 32 = `0x20`.\n\n`0x13F0 + 0x20`: 0 + 0 = 0. F + 2 = 17 = `0x11`, write 1 carry 1. 3 + 1 = 4. That is `0x1410`.\n\nAddress: `0x0000_0060_1410`.\n\nTempting wrong answers: `…13F4` (no scaling) and `…1400` (treating a `double` as 4 bytes)."}, {"id": "sc-char", "type": "short", "mode": "hex", "q": "`char* s` holds `0x0000_0060_13F0`. What address is `s + 18`? (The 18 is decimal.)", "accept": ["0x000000601402"], "placeholder": "0x…", "why": "A `char` is 1 byte, so this really is 18 bytes on. Convert: 18 = `0x12`.\n\n`0x13F0 + 0x12`: 0 + 2 = 2. F + 1 = 16, write 0 carry 1. 3 + 1 = 4. That is `0x1402`.\n\nAddress: `0x0000_0060_1402`.\n\nTempting wrong answer: `…1408`, from adding 18 as if it were already hex."}, {"id": "sc-back", "type": "short", "mode": "hex", "q": "`long* q` holds `0x0000_0060_2040`. What address is `q - 3`?", "accept": ["0x000000602028"], "placeholder": "0x…", "why": "A `long` is 8 bytes on this machine: 3 × 8 = 24 = `0x18`.\n\n`0x2040 − 0x18`: 0 − 8 needs a borrow, `0x10 − 8 = 8`. Then 4 − 1 − 1 = 2. That is `0x2028`.\n\nAddress: `0x0000_0060_2028`.\n\nTempting wrong answers: `…203D` (no scaling), `…2034` (treating `long` as 4 bytes) and `…2016` (subtracting 24 as decimal digits)."}]}, {"id": "index", "title": "p[i] is *(p + i)", "read": "Slide: \"In C, array indexing and pointer arithmetic are two views of the same thing.\"\n\n> **Rule:** `p[i]` is equivalent to `*(p + i)`. Both mean \"the element i positions after what p points to\".\n\nBoth forms scale by the element size, because both are built on `p + i`. Consequences:\n\n- It works on **any pointer**, not only on array names. If `p` points into the middle of an array, `p[0]` is the element it points at and `p[1]` is the one after.\n- **Negative indexes are legal** when there really is an element before `p`: `p[-1]` is `*(p - 1)`.\n- `&p[i]` is just `p + i`: an address, with no dereference. `p[0]` is `*p`.\n\nWatch the parentheses. `*` binds tighter than `+`:\n\n| Expression | Means |\n|---|---|\n| `*(p + 2)` | go 2 elements on, then read that element |\n| `*p + 2` | read the element `p` points at, then add 2 to the **value** |\n\nLecture's read/write rule still applies: a `*` or `[]` on the left of `=` writes to that element; on the right it reads it.\n\n**Worked example.**\n\n```c\nint32_t a[] = {4, 9, 16, 25, 36};\nint32_t* p = a + 2;        // same as &a[2]\n```\n\n| Expression | Which element | Value |\n|---|---|---|\n| `p[0]` or `*p` | `a[2]` | 16 |\n| `p[1]` | `a[3]` | 25 |\n| `p[-2]` | `a[0]` | 4 |\n| `*(p + 2)` | `a[4]` | 36 |\n| `*p + 2` | `a[2]`, plus 2 | 18 |\n\n> **On paper:** write the array out with its indexes and mark which index `p` points at. Then `p[i]` is index (that + i).", "questions": [{"id": "ix-rewrite", "type": "short", "mode": "code", "q": "Rewrite `p[4]` using `*` and `+` instead of square brackets.", "accept": ["*(p+4)", "*(4+p)", "(*(p+4))", "*((p)+4)", "*(p+(4))"], "why": "`p[i]` is defined as `*(p + i)`, so `p[4]` is `*(p + 4)`.\n\nThe parentheses matter. `*p + 4` reads the element `p` points at and adds 4 to that value, which is a different thing."}, {"id": "ix-print", "type": "blanks", "q": "What does each line print?\n\n```c\nint16_t t[] = {3, 8, 13, 18, 23, 28};\nint16_t* p = &t[3];\nprintf(\"%d\\n\", p[-2]);              // line A\nprintf(\"%d\\n\", *(p + 2));           // line B\nprintf(\"%d\\n\", *p + 2);             // line C\nprintf(\"%d\\n\", *(p - 1) + p[1]);    // line D\n```", "blanks": [{"label": "line A", "mode": "num", "accept": ["8"]}, {"label": "line B", "mode": "num", "accept": ["28"]}, {"label": "line C", "mode": "num", "accept": ["20"]}, {"label": "line D", "mode": "num", "accept": ["36"]}], "why": "`p` points at index 3, the 18.\n\n- A: `p[-2]` is index 1: **8**.\n- B: `*(p + 2)` is index 5: **28**.\n- C: `*p + 2` is the value 18 plus 2: **20**.\n- D: `*(p - 1)` is index 2 (13) and `p[1]` is index 4 (23): **36**.\n\nTempting wrong answer for C: 28, from reading `*p + 2` as `*(p + 2)`."}, {"id": "ix-negaddr", "type": "short", "mode": "hex", "q": "`int32_t* p` holds `0x0000_0060_4008`. What is the address of `p[-3]`, that is, the value of `&p[-3]`?", "accept": ["0x000000603FFC"], "placeholder": "0x…", "hint": "A negative index is a subtraction, scaled by the element size.", "why": "`&p[-3]` is `p - 3`: three `int32_t` elements back = 12 bytes = `0xC`.\n\n`0x4008 − 0xC`: 8 − C needs a borrow, `0x18 − 0xC = 0xC`. The two 0 digits each borrow and become F. The 4 becomes 3. That is `0x3FFC`.\n\nAddress: `0x0000_0060_3FFC`.\n\nTempting wrong answers: `…4005` (no scaling) and `…3996` (4008 − 12 done in decimal)."}, {"id": "ix-equiv", "type": "mc", "q": "`a` is an `int32_t` array. Which expression is the **address** of `a[i]`?", "options": ["`a + i`", "`*(a + i)`", "`*a + i`", "`&a + i`"], "answer": 0, "why": "`a` decays to a pointer to element 0, and adding `i` moves `i` elements on, so `a + i` is `&a[i]`.\n\n- `*(a + i)` dereferences that address: it is the **value** `a[i]`.\n- `*a + i` is the value `a[0]` plus `i`.\n- `&a + i` is the tempting one. `&a` is a pointer to the **whole array**, so adding `i` steps `i` whole arrays forward, not `i` elements."}]}, {"id": "incdec", "title": "++ and --: move the pointer or change the value?", "read": "`p++` and `p--` mean `p = p + 1` and `p = p - 1`: the pointer moves to the **next or previous element**, so the address in it changes by `sizeof(*p)`. `p += n` moves n elements.\n\nThe trouble starts when `++` meets `*`. A postfix `++` binds tighter than `*`:\n\n| Written | Parsed as | What happens |\n|---|---|---|\n| `*p++` | `*(p++)` | use the element `p` points at **now**, then move `p` on by one |\n| `(*p)++` | as written | add 1 to the **value** `p` points at; `p` does not move |\n| `*++p` | `*(++p)` | move `p` on by one **first**, then use that element |\n| `++*p` | `++(*p)` | add 1 to the value `p` points at; `p` does not move |\n\nRule of thumb: **if the `++` touches `p` directly, the pointer moves. If parentheses or a `*` sit between them, the value changes.**\n\n**Worked example.**\n\n```c\nint32_t a[] = {10, 20, 30};\nint32_t* p = a;\nint32_t x = *p++;     // x = 10. p now points at a[1]\nint32_t y = (*p)++;   // y = 20, then a[1] becomes 21. p still at a[1]\nint32_t z = *++p;     // p moves to a[2] first. z = 30\n```\n\nAfterwards `a` is `{10, 21, 30}` and `p` points at `a[2]`.\n\nIn a loop, `total += *p++;` means \"add this element, then step to the next one\".\n\n> **Trap:** the statement `*n++;` on its own changes nothing you can see. It reads the value, throws it away, and moves the local pointer. To add 1 to the caller's variable write `(*n)++;` or `*n += 1;`.", "questions": [{"id": "id-twice", "type": "short", "mode": "hex", "q": "`int64_t* p` holds `0x0000_0060_0FF8`. The code runs `p++; p++;`. What address does `p` hold now?", "accept": ["0x000000601008"], "placeholder": "0x…", "why": "Each `p++` moves one `int64_t`, 8 bytes. Two of them is 16 bytes = `0x10`.\n\n`0x0FF8 + 0x10`: 8 stays. F + 1 = 16, write 0 carry 1. F + 1 = 16, write 0 carry 1. 0 + 1 = 1. That is `0x1008`.\n\nAddress: `0x0000_0060_1008`.\n\nTempting wrong answer: `…0FFA`, moving 1 byte per `++`."}, {"id": "id-trace", "type": "blanks", "q": "After these lines run, give each value.\n\n```c\nint16_t v[] = {5, 6, 7, 8};\nint16_t* p = v;\nint16_t a = *p++;\nint16_t b = (*p)++;\nint16_t c = *++p;\n(*p)--;\n```", "blanks": [{"label": "a", "mode": "num", "accept": ["5"]}, {"label": "b", "mode": "num", "accept": ["6"]}, {"label": "c", "mode": "num", "accept": ["7"]}, {"label": "v[1]", "mode": "num", "accept": ["7"]}, {"label": "v[2]", "mode": "num", "accept": ["6"]}, {"label": "index of the element p points at", "mode": "num", "accept": ["2"]}], "why": "- `a = *p++`: reads `v[0]`, so `a` = 5. Then `p` moves to index 1.\n- `b = (*p)++`: reads `v[1]`, so `b` = 6. Then `v[1]` becomes 7. `p` stays at index 1.\n- `c = *++p`: `p` moves to index 2 first, then reads `v[2]`, so `c` = 7.\n- `(*p)--`: `v[2]` becomes 6. `p` stays at index 2.\n\nFinal array: {5, 7, 6, 8}.\n\nTempting wrong answers: `b` = 7 (postfix gives the old value) and `c` = 8 (thinking `(*p)++` had already moved the pointer)."}, {"id": "id-addone", "type": "mc", "q": "What does this program print?\n\n```c\nvoid add_one(int* n) {\n    *n++;\n}\nint main(void) {\n    int x = 10;\n    add_one(&x);\n    printf(\"%d\\n\", x);\n}\n```", "options": ["`10`", "`11`", "Nothing: it segfaults on `*n++`", "A garbage value, because `n` ends up pointing past `x`"], "answer": 0, "why": "`*n++` is `*(n++)`. It reads `x` through the pointer, throws the value away, and moves the **local** pointer `n` one `int` on. Nothing is ever written to `x`, so it prints **10**.\n\n`(*n)++` or `*n += 1` would print 11.\n\nThere is no segfault: the read happens at the valid address `&x`, and the moved pointer is never dereferenced. `x` is not garbage either, since `main` prints its own untouched variable."}, {"id": "id-sum", "type": "self", "lines": 9, "q": "**Code writing.** Write `int32_t sum(int32_t* p, int32_t n)` that returns the sum of the `n` elements starting at `p`. Walk the array by **moving the pointer**; do not use `[]`.", "model": "```c\nint32_t sum(int32_t* p, int32_t n) {\n    int32_t total = 0;\n    for (int32_t i = 0; i < n; i++) {\n        total += *p;    // read the element p points at\n        p++;            // step to the next element\n    }\n    return total;\n}\n```\n\nThe two body lines can be merged into `total += *p++;`.", "rubric": ["`total` starts at 0 and is returned", "the loop runs exactly `n` times, so element `n` is never read", "reads with `*p` (or `*(p + i)`), no square brackets", "advances by elements (`p++` or `p + i`), never `p += 4` or `p += sizeof(int32_t)`"], "why": "`p++` already moves 4 bytes, because `p` is an `int32_t*`. Adding `sizeof(int32_t)` yourself would jump four elements at a time and run off the end of the array.\n\n`i <= n` is the other classic slip: it reads one element past the end."}]}, {"id": "diff", "title": "Subtracting two pointers counts elements", "read": "Slide: `p1 - p2` \"returns the number of elements between two pointers\". Elements, not bytes.\n\n> **Rule:** `q - p` = (address in `q` − address in `p`) ÷ `sizeof(*p)`\n\nIt is `p + n` run backwards: if `q == p + n`, then `q - p == n`. Both pointers must have the same type and point into the **same array**. Otherwise the result means nothing.\n\n- `q - p` is positive when `q` holds the higher address and **negative** when it holds the lower one.\n- `p - a`, where `a` is the array, is the **index** `p` points at.\n- For a distance in **bytes**, multiply by the element size, or cast both to `char*` first. A `char` is 1 byte, so for `char*` elements and bytes are the same thing.\n\n**Worked example.** `p` holds `0x0000_0060_5010` and `q` holds `0x0000_0060_5034`.\n\n1. Subtract in hex: `0x34 − 0x10 = 0x24`.\n2. Convert: `0x24` = 2 × 16 + 4 = 36 bytes.\n3. Divide by the element size.\n\n| If both are | `q - p` |\n|---|---|\n| `int32_t*` | 36 ÷ 4 = 9 |\n| `int16_t*` | 36 ÷ 2 = 18 |\n| `char*` | 36 |\n\nFor the `int32_t*` case, `p - q` is −9.\n\n> **Trap:** answering 36, or `0x24`, for the `int32_t*` case. Subtracting the two addresses is only step 1.", "questions": [{"id": "df-double", "type": "short", "mode": "num", "q": "`double* lo` holds `0x0000_0060_6100` and `double* hi` holds `0x0000_0060_6148`. What is `hi - lo`? Answer in decimal.", "accept": ["9"], "why": "`0x6148 − 0x6100 = 0x48` = 4 × 16 + 8 = 72 bytes.\n\nA `double` is 8 bytes: 72 ÷ 8 = **9** elements.\n\nTempting wrong answers: 72 (bytes, not elements), 48 (left in hex) and 18 (treating a `double` as 4 bytes)."}, {"id": "df-neg", "type": "short", "mode": "num", "q": "`int16_t* a` holds `0x0000_0060_7FF0` and `int16_t* b` holds `0x0000_0060_8016`. What is `a - b`? Answer in decimal.", "accept": ["-19"], "hint": "Find the distance in bytes, convert to decimal, divide by the element size, then decide the sign.", "why": "The addresses are `0x8016 − 0x7FF0 = 0x26` apart: `0x7FF0` to `0x8000` is `0x10`, plus `0x16`. `0x26` = 38 bytes.\n\n38 ÷ 2 = 19 elements. `a` holds the **lower** address, so `a - b` is **−19**.\n\nTempting wrong answers: 19 (lost the sign), −38 (bytes) and −13 (halving `0x26` but leaving it in hex)."}, {"id": "df-bytes", "type": "blanks", "q": "What does each line print?\n\n```c\nint32_t r[10];\nint32_t* p = &r[2];\nint32_t* q = &r[9];\nprintf(\"%ld\\n\", q - p);                  // line A\nprintf(\"%ld\\n\", (char*)q - (char*)p);    // line B\n```", "blanks": [{"label": "line A", "mode": "num", "accept": ["7"]}, {"label": "line B", "mode": "num", "accept": ["28"]}], "why": "A: both are `int32_t*`, so the result counts elements: 9 − 2 = **7**.\n\nB: both are cast to `char*`, whose elements are 1 byte, so the result is the distance in bytes: 7 × 4 = **28**.\n\nSame two addresses, different pointer type, different answer."}, {"id": "df-rev", "type": "short", "mode": "hex", "q": "`int32_t* p` holds `0x0000_0060_9000`, and `q - p` is 11. What address does `q` hold?", "accept": ["0x00000060902C"], "placeholder": "0x…", "why": "`q - p == 11` means `q == p + 11`: 11 × 4 = 44 bytes = 2 × 16 + 12 = `0x2C`.\n\n`0x9000 + 0x2C = 0x902C`, so `q` holds `0x0000_0060_902C`.\n\nTempting wrong answers: `…900B` (added 11 without scaling) and `…9044` (added 44 as if it were hex)."}]}, {"id": "types", "title": "Why pointers have types", "read": "Every pointer is 8 bytes and holds one address. So why does C distinguish `int32_t*` from `char*`?\n\nBecause memory has no types. Lecture: \"Main memory is simply a sequence of bytes\", and every access has to specify \"the starting address, and the size of the data to read or write\". The pointer supplies the starting address. **The pointer's type supplies the size.** It decides two things:\n\n1. **The step** for `p + n`, `p++` and `p[i]` (the previous parts).\n2. **How many bytes `*p` reads or writes**, and how to interpret them. `*p` on an `int16_t*` takes 2 bytes starting at the address, on an `int32_t*` 4, on a `double*` 8.\n\nA **cast** such as `(uint8_t*)&x` makes a pointer with the **same address** and a different type. Nothing in memory moves or changes. You are looking at the same bytes through a narrower or wider window.\n\n**Worked example.**\n\n```c\nuint32_t x = 0xA1B2C3D4;      // bytes, lowest address first: D4 C3 B2 A1\nuint8_t*  b = (uint8_t*)&x;\nuint16_t* h = (uint16_t*)&x;\n```\n\n| Expression | Byte offsets from `&x` | Value |\n|---|---|---|\n| `*b` | 0 | `0xD4` |\n| `b[1]` | 1 | `0xC3` |\n| `b[3]` | 3 | `0xA1` |\n| `*h` | 0 and 1 | `0xC3D4` |\n| `h[1]` | 2 and 3 | `0xA1B2` |\n\n`b[1]` is one byte on, but `h[1]` is two bytes on. Each multi-byte read is put together little-endian: the byte at the higher address goes on the left.\n\nA narrow pointer can **write** part of a value too. `b[3] = 0x00;` would turn `x` into `0x00B2C3D4`.\n\n> **Trap:** `*b` is `0xD4`, not `0xA1`. The first byte in memory is the least significant one.", "questions": [{"id": "ty-bytes", "type": "blanks", "q": "How many bytes does the statement `*p = 0;` write to memory when `p` is declared as each of these?\n\n```c\nchar* p;        // A\nint16_t* p;     // B\ndouble* p;      // C\nint32_t** p;    // D\n```", "blanks": [{"label": "A", "mode": "num", "accept": ["1"]}, {"label": "B", "mode": "num", "accept": ["2"]}, {"label": "C", "mode": "num", "accept": ["8"]}, {"label": "D", "mode": "num", "accept": ["8"]}], "why": "`*p = 0` writes `sizeof(*p)` bytes: the size of the thing pointed **to**.\n\n- A: a `char`, 1 byte.\n- B: an `int16_t`, 2 bytes.\n- C: a `double`, 8 bytes.\n- D: `p` points at an `int32_t*`. That is a pointer, so **8** bytes.\n\nTempting wrong answers: 4 for D (seeing `int32_t` and stopping), or 8 for all of them (that is the size of `p` itself, not of what it points to)."}, {"id": "ty-views", "type": "blanks", "q": "Little-endian machine. Give each value in hex.\n\n```c\nuint32_t x = 0x5E6F7A8B;\nuint8_t*  b = (uint8_t*)&x;\nuint16_t* h = (uint16_t*)&x;\n\n*b       // A\nb[2]     // B\n*h       // C\nh[1]     // D\n```", "blanks": [{"label": "A", "mode": "hex", "accept": ["0x8B"]}, {"label": "B", "mode": "hex", "accept": ["0x6F"]}, {"label": "C", "mode": "hex", "accept": ["0x7A8B"]}, {"label": "D", "mode": "hex", "accept": ["0x5E6F"]}], "why": "The bytes of `x` from its lowest address: `8B 7A 6F 5E`.\n\n- A: `*b` is offset 0: `0x8B`.\n- B: `b[2]` is offset 2: `0x6F`.\n- C: `*h` is offsets 0 and 1, higher address on the left: `0x7A8B`.\n- D: `h[1]` starts 2 bytes on, offsets 2 and 3: `0x5E6F`.\n\nTempting wrong answers: `0x5E` for A (the first byte as written, not as stored) and `0x6F7A` for D (stepping 1 byte instead of one `uint16_t`)."}, {"id": "ty-write", "type": "short", "mode": "hex", "q": "Little-endian machine. What value does `x` have after this runs? Answer in hex.\n\n```c\nuint32_t x = 0x11223344;\nuint8_t* b = (uint8_t*)&x;\nb[1] = 0xFF;\n```", "accept": ["0x1122FF44"], "placeholder": "0x…", "why": "The bytes of `x` from its lowest address: `44 33 22 11`.\n\n`b[1]` is offset 1, the `33`. A `uint8_t*` writes exactly one byte, so the bytes become `44 FF 22 11`.\n\nRead back as a `uint32_t`, highest address on the left: `0x1122FF44`.\n\nTempting wrong answer: `0x11FF3344`, from counting offset 1 from the left of the written number."}, {"id": "ty-arr", "type": "blanks", "q": "Little-endian machine. Give each value in hex.\n\n```c\nuint32_t arr[2] = {0xCAFE1234, 0x0055AA99};\nuint16_t* p = (uint16_t*)arr;\n```", "blanks": [{"label": "p[0]", "mode": "hex", "accept": ["0x1234"]}, {"label": "p[1]", "mode": "hex", "accept": ["0xCAFE"]}, {"label": "p[2]", "mode": "hex", "accept": ["0xAA99"]}, {"label": "p[3]", "mode": "hex", "accept": ["0x0055"]}], "hint": "Write the 8 bytes in address order first.", "why": "The array's 8 bytes in address order: `34 12 FE CA` then `99 AA 55 00`.\n\nA `uint16_t*` takes them two at a time, higher address on the left:\n\n- `p[0]`: `34 12` gives `0x1234`, and `p[1]`: `FE CA` gives `0xCAFE`\n- `p[2]`: `99 AA` gives `0xAA99`, and `p[3]`: `55 00` gives `0x0055`\n\nEach 32-bit element comes out **low half first**. The tempting wrong answer is the written order: `CAFE`, `1234`, `0055`, `AA99`."}]}, {"id": "wide-offset", "title": "Wider casts and offset reads", "read": "One recipe handles every cast-pointer question.\n\n> **Recipe:** (1) Write the bytes in address order, each element little-endian. (2) Find the byte offset where the read starts. (3) Take `sizeof` bytes from there. (4) Write the highest-address byte on the left.\n\n```c\nuint32_t arr[2] = {0x44332211, 0x88776655};\nuint8_t* b = (uint8_t*)arr;\n```\n\n| Offset | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n|---|---|---|---|---|---|---|---|---|\n| Byte | `11` | `22` | `33` | `44` | `55` | `66` | `77` | `88` |\n\n**Wider.** `*(uint64_t*)arr` reads all 8 bytes as one number: `0x8877665544332211`. The **later** element becomes the **high** half, because it sits at the higher addresses.\n\n**Offset.** A read does not have to start at the beginning of an element. Step with a byte pointer first, then cast:\n\n- `*(uint16_t*)(b + 1)` starts at offset 1: bytes `22 33`, value `0x3322`.\n- `*(uint32_t*)(b + 2)` starts at offset 2: bytes `33 44 55 66`, value `0x66554433`. It takes half of each element.\n\nReads like these are **misaligned**: the address is not a multiple of the type's size. (The homework files every cast-pointer read under \"misaligned pointers\".) C does not promise they work on every machine. On paper, memory is just bytes, so compute them.\n\n**Order matters.** The step is that of the pointer's type **at the moment you add**:\n\n- `*((uint16_t*)arr + 3)` casts first, then moves 3 × 2 = 6 bytes: offsets 6 and 7, value `0x8877`.\n- `*(uint16_t*)(b + 3)` moves 3 × 1 = 3 bytes, then casts: offsets 3 and 4, value `0x5544`.\n\n> **Trap:** gluing in address order. Offsets 2 to 5 hold `33 44 55 66`, but the value is `0x66554433`.", "questions": [{"id": "wo-wide", "type": "short", "mode": "hex", "q": "Little-endian machine. What is the value of `*w`? Answer in hex (16 digits).\n\n```c\nuint32_t arr[2] = {0xCAFE1234, 0x0055AA99};\nuint64_t* w = (uint64_t*)arr;\n```", "accept": ["0x0055AA99CAFE1234"], "placeholder": "0x…", "why": "Bytes in address order: `34 12 FE CA 99 AA 55 00`.\n\nA `uint64_t*` reads all eight. Highest address on the left: `00 55 AA 99 CA FE 12 34`, so `*w` is `0x0055AA99CAFE1234`.\n\nShortcut: the element at the higher address, `arr[1]`, becomes the high half.\n\nTempting wrong answer: `0xCAFE12340055AA99`, the elements in the order they are written."}, {"id": "wo-16to32", "type": "short", "mode": "hex", "q": "Little-endian machine. What is `q[1]`? Answer in hex.\n\n```c\nuint16_t s[4] = {0x1111, 0x2222, 0x3333, 0x4444};\nuint32_t* q = (uint32_t*)s;\n```", "accept": ["0x44443333"], "placeholder": "0x…", "why": "Bytes in address order: `11 11 22 22 33 33 44 44`.\n\n`q[1]` is one `uint32_t` on, so it starts at offset 4 and takes 4 bytes: `33 33 44 44`. Highest address on the left: `0x44443333`.\n\nTempting wrong answers: `0x33334444` (address order) and `0x22221111` (that is `q[0]`)."}, {"id": "wo-off16", "type": "short", "mode": "hex", "q": "Little-endian machine. What is the value of `*(uint16_t*)(b + 3)`? Answer in hex.\n\n```c\nuint32_t g[3] = {0xA4B3C2D1, 0x18273645, 0xF9E8D7C6};\nuint8_t* b = (uint8_t*)g;\n```", "accept": ["0x45A4"], "placeholder": "0x…", "why": "Bytes in address order: `D1 C2 B3 A4` then `45 36 27 18` then `C6 D7 E8 F9`.\n\n`b + 3` is 3 bytes in (a `uint8_t*` steps 1). Reading 2 bytes from there takes offset 3, `A4`, and offset 4, `45`.\n\nHighest address on the left: `0x45A4`. The read takes the top byte of `g[0]` and the bottom byte of `g[1]`.\n\nTempting wrong answers: `0xA445` (address order) and `0x1827` (stepping 3 `uint16_t` elements instead of 3 bytes)."}, {"id": "wo-off32", "type": "short", "mode": "hex", "q": "Little-endian machine. What is the value of `*(uint32_t*)(b + 6)`? Answer in hex.\n\n```c\nuint32_t g[3] = {0xA4B3C2D1, 0x18273645, 0xF9E8D7C6};\nuint8_t* b = (uint8_t*)g;\n```", "accept": ["0xD7C61827"], "placeholder": "0x…", "hint": "Number the 12 bytes 0 to 11 and box offsets 6 to 9.", "why": "Bytes in address order: `D1 C2 B3 A4` then `45 36 27 18` then `C6 D7 E8 F9`.\n\nStart at offset 6 and take 4 bytes: offsets 6 to 9 hold `27 18 C6 D7`.\n\nHighest address on the left: `0xD7C61827`. It is the high half of `g[1]` and the low half of `g[2]`.\n\nTempting wrong answer: `0x2718C6D7`, the bytes in address order."}]}, {"id": "decay", "title": "Arrays and pointers are not the same thing", "read": "Slide: \"When you use an array name in an expression, it decays into a pointer to the first element.\" So `int32_t* p = a;` means `p = &a[0];`, and passing an array to a function passes that address, not a copy of the elements.\n\nDecay makes arrays and pointers look interchangeable. They are not:\n\n| Compare | `int32_t a[5];` | `int32_t* p = a;` |\n|---|---|---|\n| What it is | 5 elements, 20 bytes | one address, 8 bytes |\n| `sizeof` | 20, the whole array | 8, the pointer |\n| Assign to it? | No: `a = …` and `a++` do not compile | Yes: `p = …`, `p++` |\n| Its own address | `&a` is the same number as `&a[0]` | `&p` is where the pointer variable lives, somewhere else |\n\n`sizeof` is one of the few places an array name does **not** decay. That gives the element-count idiom:\n\n```c\nint16_t s[6];\nint16_t* p = s;\nsizeof(s)                 // 12  (6 elements x 2 bytes)\nsizeof(s) / sizeof(s[0])  // 6   (number of elements)\nsizeof(p)                 // 8   (a pointer)\nsizeof(*p)                // 2   (one int16_t)\n```\n\n**Inside a function the array is gone.** A parameter written `int16_t arr[]` is really `int16_t* arr`, so `sizeof(arr)` there is 8 however long the caller's array is. That is why array functions take a separate `length` parameter.\n\nStrings follow the same rules. `char word[] = \"cat\";` is an array of **4** bytes (three letters and the `\\0`), so `sizeof(word)` is 4, while `sizeof` of a `char*` pointing at it is 8.\n\n> **Trap:** `sizeof(p) / sizeof(p[0])` on a pointer gives 8 ÷ the element size, not the array's length.", "questions": [{"id": "dc-sizes", "type": "blanks", "q": "Give each value (in decimal).\n\n```c\ndouble d[10];\ndouble* q = d;\n\nsizeof(d)                  // A\nsizeof(q)                  // B\nsizeof(*q)                 // C\nsizeof(d) / sizeof(d[0])   // D\n```", "blanks": [{"label": "A", "mode": "num", "accept": ["80"]}, {"label": "B", "mode": "num", "accept": ["8"]}, {"label": "C", "mode": "num", "accept": ["8"]}, {"label": "D", "mode": "num", "accept": ["10"]}], "why": "- A: `d` is an array, so `sizeof` gives the whole thing: 10 × 8 = **80**.\n- B: `q` is a pointer: **8**.\n- C: `*q` is one `double`: **8**.\n- D: 80 ÷ 8 = **10**, the number of elements.\n\nB and C are both 8 for different reasons: one is a pointer, the other is a `double`. Tempting wrong answer for B: 80, from assuming the pointer \"is\" the array."}, {"id": "dc-param", "type": "short", "mode": "num", "q": "What does this program print?\n\n```c\nvoid show(int32_t arr[]) {\n    printf(\"%zu\\n\", sizeof(arr));\n}\nint main(void) {\n    int32_t nums[12];\n    show(nums);\n}\n```", "accept": ["8"], "why": "A parameter written `int32_t arr[]` is really `int32_t* arr`. Inside `show` there is only a pointer, so `sizeof(arr)` is **8**.\n\nTempting wrong answers: 48 (12 × 4, which is `sizeof(nums)` back in `main`) and 4 (the size of one element)."}, {"id": "dc-compile", "type": "mc", "q": "Given `int a[3] = {1, 2, 3};` and `int* p = a;`, which statement does **not** compile?", "options": ["`a = a + 1;`", "`p = p + 1;`", "`p = &a[2];`", "`*a = 7;`"], "answer": 0, "why": "An array name is not a variable you can assign to. The compiler rejects `a = a + 1;` (clang: \"array type 'int[3]' is not assignable\"). `a++` fails for the same reason.\n\nThe others are fine. `p` is a pointer variable, so it can be moved or re-pointed. `*a = 7;` works because `a` decays to `&a[0]`, so it sets `a[0]` to 7."}, {"id": "dc-str", "type": "short", "mode": "num", "q": "`char name[] = \"quiz\";` What is `sizeof(name)`?", "accept": ["5"], "why": "`name` is an array sized to fit its initializer: the four letters plus the terminating `\\0`. That is **5** bytes.\n\nTempting wrong answers: 4 (forgot the `\\0`) and 8 (the size of a pointer, but `name` is an array, not a `char*`)."}]}, {"id": "bugs", "title": "Pointer arithmetic bugs", "read": "C never checks that an address you compute is inside the array. `a[i]` and `*(p + i)` just calculate base + i × size and read or write whatever is there. Slide: pointer arithmetic is \"only valid within the same array (undefined outside)\".\n\nAn **out-of-bounds access** uses an index below 0, or at or above the length. What happens next is undefined. It may read garbage, silently overwrite a neighbouring variable (on the stack, the rows just above or below the array in the diagram), corrupt the heap, or segfault if the address is far enough away. Writing past the end of a buffer is a **buffer overflow**.\n\nThe usual ways to get there:\n\n| Bug | Example | What goes wrong |\n|---|---|---|\n| Off by one | `for (i = 0; i <= n; i++) a[i] = 0;` | writes `a[n]`, one element past the end |\n| Scaling twice | `p + i * sizeof(int32_t)` | the compiler already multiplies by 4, so this lands on element 4i |\n| Bytes for elements | `malloc(n)` for `n` ints | the block is n bytes; the code needs 4n |\n| Walking off an end | `p[-1]` when `p == a`, or `*(a + n)` | element −1 and element n do not exist |\n| Wrong pointer type | `(char*)p + 1` meant as \"the next int\" | moves 1 byte, into the middle of an element |\n| `*p++` for `(*p)++` | `*n++;` in an add-one function | moves the pointer instead of changing the value |\n\n**Worked example.** `int32_t a[4]` is at `0x0000_0060_7FF0`. Valid indexes are 0 to 3, and the array's last byte is `…7FFF`.\n\n```c\nint32_t* p = a;\n*(p + 4) = 9;\n```\n\n`p + 4` is `0x7FF0 + 0x10 = 0x8000`: the first byte **after** the array. The write lands on whatever lives there.\n\n> **On paper:** for a \"what is the bug\" question, name it (out-of-bounds write, buffer overflow, improper pointer arithmetic), say which index or address gets touched, and give the fix.", "questions": [{"id": "bg-past", "type": "short", "mode": "hex", "q": "`int16_t buf[8]` is at `0x0000_0060_4FF4`. This loop runs:\n\n```c\nfor (int i = 0; i <= 8; i++) buf[i] = 0;\n```\n\nWhat is the address of the first byte it writes that is **not** part of `buf`?", "accept": ["0x000000605004"], "placeholder": "0x…", "why": "The loop condition `i <= 8` lets `i` reach 8, but valid indexes are 0 to 7. So it writes `buf[8]`.\n\n`&buf[8]` = base + 8 × 2 = base + 16 = base + `0x10`. `0x4FF4 + 0x10 = 0x5004`.\n\nAddress: `0x0000_0060_5004`. The array's own last byte is `…5003`.\n\nTempting wrong answers: `…5003` (that byte still belongs to `buf`) and `…4FFC` (adding 8 without scaling)."}, {"id": "bg-double", "type": "short", "mode": "num", "q": "The author wanted `q` to point at `a[3]`. Which element does `q` actually point at? Give its index.\n\n```c\nint32_t a[40];\nint32_t* p = a;\nint32_t* q = p + 3 * sizeof(int32_t);\n```", "accept": ["12"], "why": "`3 * sizeof(int32_t)` is 12, so the line is `q = p + 12`. Pointer arithmetic then scales by the element size **again**, so `q` points at element **12** (48 bytes on).\n\nThe fix is `q = p + 3;`. The compiler does the multiplying.\n\nTempting wrong answer: 3, the element the author meant."}, {"id": "bg-malloc", "type": "mc", "q": "What is the bug?\n\n```c\nint32_t* nums = malloc(5);\nfor (int i = 0; i < 5; i++) {\n    nums[i] = i * i;\n}\n```", "options": ["Heap buffer overflow: the block is 5 bytes, but the loop writes 20", "Off by one: the loop should stop at `i < 4`", "Dangling pointer: `nums` is used after its block has been freed", "Improper pointer arithmetic: `nums[i]` steps 1 byte at a time, so the ints overlap"], "answer": 0, "why": "`malloc` counts **bytes**. Five `int32_t` values need `5 * sizeof(int32_t)` = 20 bytes, but only 5 were requested. `nums[1]` (bytes 4 to 7) already runs past the end of the block: an out-of-bounds write on the heap.\n\nThe indexing is correct: `nums[i]` steps 4 bytes, as it should. That is exactly why the block is too small.\n\nFix: `malloc(5 * sizeof(int32_t))`. Nothing has been freed, so it is not a dangling pointer, and `i < 5` is the right bound for 5 elements."}, {"id": "bg-bounds", "type": "mc", "q": "Given `int32_t a[6];` and `int32_t* p = a + 4;`, select **all** the expressions that are out of bounds.", "options": ["`p[1]`", "`p[2]`", "`p[-4]`", "`p[-5]`", "`*(p - 2)`"], "answer": [1, 3], "shuffle": false, "why": "`p` points at index 4. Valid indexes are 0 to 5.\n\n- `p[1]` is index 5, `p[-4]` is index 0 and `*(p - 2)` is index 2: all fine.\n- `p[2]` is index 6, one past the end: **out of bounds**.\n- `p[-5]` is index −1, before the start: **out of bounds**.\n\nA negative index is not automatically a bug. What matters is the index it lands on in the real array."}]}], "checkpoint": [{"id": "cp-types", "type": "blanks", "q": "Five pointers of different types all hold `0x0000_0080_0FF0`. For each one, give the address `p + 6`.\n\n```c\nchar*  p;    // A\nshort* p;    // B\nint*   p;    // C\nlong*  p;    // D\nint**  p;    // E\n```", "blanks": [{"label": "A", "mode": "hex", "accept": ["0x000000800FF6"]}, {"label": "B", "mode": "hex", "accept": ["0x000000800FFC"]}, {"label": "C", "mode": "hex", "accept": ["0x000000801008"]}, {"label": "D", "mode": "hex", "accept": ["0x000000801020"]}, {"label": "E", "mode": "hex", "accept": ["0x000000801020"]}], "why": "Bytes moved = 6 × the size of what `p` points to.\n\n- A: `char`, 6 × 1 = 6. `0xFF0 + 6 = 0xFF6`.\n- B: `short`, 6 × 2 = 12 = `0xC`. `0xFF0 + 0xC = 0xFFC`.\n- C: `int`, 6 × 4 = 24 = `0x18`. `0xFF0 + 0x18 = 0x1008`.\n- D and E: a `long` is 8 bytes, and `int**` points at pointers, also 8 bytes each. 6 × 8 = 48 = `0x30`. `0xFF0 + 0x30 = 0x1020`.\n\nTempting wrong answer for E: `…1008`, from seeing `int` and using 4."}, {"id": "cp-dump", "type": "blanks", "q": "Little-endian machine, 4 bytes per row. `uint32_t* r` holds `0x0000_0080_4000`. Give each value in hex.\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0080_400C` | `0x0D0C0B0A` |\n| `0x0000_0080_4008` | `0xFFFF8001` |\n| `0x0000_0080_4004` | `0x7B3C9D5E` |\n| `0x0000_0080_4000` | `0x000000C8` |\n\n```c\nr[1]                                // A\n*((uint8_t*)r + 9)                  // B\n*(uint16_t*)((uint8_t*)r + 6)       // C\n*(uint32_t*)((uint8_t*)r + 10)      // D\n```", "blanks": [{"label": "A", "mode": "hex", "accept": ["0x7B3C9D5E"]}, {"label": "B", "mode": "hex", "accept": ["0x80"]}, {"label": "C", "mode": "hex", "accept": ["0x7B3C"]}, {"label": "D", "mode": "hex", "accept": ["0x0B0AFFFF"]}], "hint": "Turn each expression into a starting address and a byte count first.", "why": "- A: `r[1]` is one `uint32_t` on, address `…4004`: the whole row, `0x7B3C9D5E`.\n- B: 9 bytes on is `…4009`: row `…4008` (`FF FF 80 01`), offset 1 from the right: `0x80`.\n- C: 6 bytes on is `…4006`. Row `…4004` is `7B 3C 9D 5E`; offsets 2 and 3 are `3C` and `7B`. Higher address on the left: `0x7B3C`.\n- D: 10 bytes on is `…400A`. Bytes at `…400A`, `…400B` are `FF`, `FF` (row `…4008`); at `…400C`, `…400D` they are `0A`, `0B` (row `…400C`). Highest first: `0x0B0AFFFF`.\n\nTempting wrong answer for D: `0xFFFF0B0A`, with the lower row's bytes on the left."}, {"id": "cp-trace", "type": "blanks", "q": "Give the five numbers this prints, in order.\n\n```c\nint32_t a[] = {2, 4, 6, 8, 10, 12};\nint32_t* p = a + 1;\nint32_t* q = &a[4];\n*p++ = *q + 1;\nq[-1] = *p * 2;\n(*q)--;\np += q - p;\nprintf(\"%d %d %d %d %ld\\n\", a[1], a[3], a[4], *p, p - a);\n```", "blanks": [{"label": "1st number, a[1]", "mode": "num", "accept": ["11"]}, {"label": "2nd number, a[3]", "mode": "num", "accept": ["12"]}, {"label": "3rd number, a[4]", "mode": "num", "accept": ["9"]}, {"label": "4th number", "mode": "num", "accept": ["9"]}, {"label": "5th number", "mode": "num", "accept": ["4"]}], "why": "`p` starts at index 1 and `q` at index 4.\n\n- `*p++ = *q + 1;` writes 10 + 1 = 11 into `a[1]`, then `p` moves to index 2.\n- `q[-1] = *p * 2;` `q[-1]` is `a[3]`, and `*p` is `a[2]` = 6, so `a[3]` = 12.\n- `(*q)--;` takes `a[4]` from 10 to 9, and `q` does not move. Then `p += q - p;` adds 4 − 2 = 2 elements, so `p` moves to index 4.\n\nPrinted: `11 12 9 9 4`. The fourth number is `*p` = `a[4]` = 9 and the fifth is the index, 4. Moving `p` before the write on the first line would wrongly leave `a[1]` at 4."}, {"id": "cp-diff", "type": "short", "mode": "num", "q": "`int64_t* s` holds `0x0000_0080_2F98` and `int64_t* e` holds `0x0000_0080_3010`. What is `e - s`? Answer in decimal.", "accept": ["15"], "why": "`0x3010 − 0x2F98`: from `0x2F98` to `0x3000` is `0x68`, plus `0x10` is `0x78`.\n\n`0x78` = 7 × 16 + 8 = 120 bytes. 120 ÷ 8 = **15** elements.\n\nTempting wrong answers: 120 (bytes) and 30 (dividing by 4)."}, {"id": "cp-views", "type": "blanks", "q": "Little-endian machine. Give each value in hex.\n\n```c\nuint32_t g[3] = {0x00C0FFEE, 0x8BADF00D, 0x12345678};\nuint16_t* h = (uint16_t*)g;\nuint8_t*  b = (uint8_t*)g;\nuint64_t* w = (uint64_t*)g;\n\nh[3]                    // A\nb[9]                    // B\nw[0]                    // C\n*(uint32_t*)(b + 5)     // D\n```", "blanks": [{"label": "A", "mode": "hex", "accept": ["0x8BAD"]}, {"label": "B", "mode": "hex", "accept": ["0x56"]}, {"label": "C", "mode": "hex", "accept": ["0x8BADF00D00C0FFEE"]}, {"label": "D", "mode": "hex", "accept": ["0x788BADF0"]}], "why": "Bytes in address order (offsets 0 to 11): `EE FF C0 00`, `0D F0 AD 8B`, `78 56 34 12`.\n\n- A: `h[3]` starts at offset 6: `AD 8B`, value `0x8BAD`.\n- B: `b[9]` is offset 9: `0x56`.\n- C: `w[0]` is offsets 0 to 7, highest first: `0x8BADF00D00C0FFEE`.\n- D: offsets 5 to 8: `F0 AD 8B 78`, highest first: `0x788BADF0`.\n\nTempting wrong answers: `0xF00D` for A (that is `h[2]`) and `0x00C0FFEE8BADF00D` for C (elements in written order)."}, {"id": "cp-writes", "type": "blanks", "q": "Little-endian machine. Give the final value of each element in hex.\n\n```c\nuint32_t k[2] = {0x11111111, 0x22222222};\nuint16_t* h = (uint16_t*)k;\nh[1] = 0xABCD;\n*((uint8_t*)k + 4) = 0x7F;\n```", "blanks": [{"label": "k[0]", "mode": "hex", "accept": ["0xABCD1111"]}, {"label": "k[1]", "mode": "hex", "accept": ["0x2222227F"]}], "why": "`h[1]` covers byte offsets 2 and 3, which are the two **most** significant bytes of `k[0]`. Writing `0xABCD` there makes `k[0]` = `0xABCD1111`.\n\n`(uint8_t*)k + 4` is byte offset 4: the lowest address of `k[1]`, so its **least** significant byte. `k[1]` = `0x2222227F`.\n\nTempting wrong answers: `0x1111ABCD` and `0x7F222222`, both from treating the lowest address as the left-hand end of the number."}, {"id": "cp-mixed", "type": "blanks", "q": "`int64_t* base` holds `0x0000_0080_6000`. Give the address each expression produces.\n\n```c\n(int16_t*)(base + 2) + 3            // A\n(int64_t*)((char*)base + 2) + 3     // B\n```", "blanks": [{"label": "A", "mode": "hex", "accept": ["0x000000806016"]}, {"label": "B", "mode": "hex", "accept": ["0x00000080601A"]}], "why": "Each `+` uses the step of the pointer type it is applied to.\n\n- A: `base + 2` is 2 × 8 = 16 = `0x10` bytes: `0x6010`. After the cast, `+ 3` is 3 × 2 = 6 bytes: `0x6016`.\n- B: `(char*)base + 2` is 2 bytes: `0x6002`. After the cast, `+ 3` is 3 × 8 = 24 = `0x18` bytes: `0x601A`.\n\nTempting wrong answer: `0x6028` for either one, from scaling both additions by 8."}, {"id": "cp-sizeof", "type": "blanks", "q": "Give each value (in decimal).\n\n```c\nint64_t m[7];\nint64_t* p = m;\nchar c[] = \"hi\";\n\nsizeof(m)                  // A\nsizeof(p)                  // B\nsizeof(m) / sizeof(m[0])   // C\nsizeof(c)                  // D\n```", "blanks": [{"label": "A", "mode": "num", "accept": ["56"]}, {"label": "B", "mode": "num", "accept": ["8"]}, {"label": "C", "mode": "num", "accept": ["7"]}, {"label": "D", "mode": "num", "accept": ["3"]}], "why": "- A: an array of 7 `int64_t`: 7 × 8 = **56**.\n- B: a pointer: **8**.\n- C: 56 ÷ 8 = **7** elements.\n- D: `'h'`, `'i'` and the `\\0`: **3**.\n\nTempting wrong answers: 56 for B (a pointer does not know how big the array is) and 2 for D (forgot the terminator)."}, {"id": "cp-bug", "type": "mc", "q": "`clear(nums, 10)` is called on a 10-element `int32_t` array. What is the bug?\n\n```c\nvoid clear(int32_t* a, int32_t n) {\n    int32_t* end = a + n * sizeof(int32_t);\n    for (int32_t* p = a; p < end; p++) {\n        *p = 0;\n    }\n}\n```", "options": ["`end` is scaled twice, so the loop zeroes 40 ints: 30 elements past the array's end", "`p++` advances one byte at a time, so each `*p = 0` overlaps the one before", "Off by one: the test should be `p <= end` so the last element is cleared", "`*p = 0` only changes the local pointer, so the caller's array is never cleared"], "answer": 0, "why": "`n * sizeof(int32_t)` is 40, and `a + 40` on an `int32_t*` is 40 **elements** on, not 40 bytes. The loop zeroes elements 0 to 39 of a 10-element array: an out-of-bounds write (buffer overflow).\n\nFix: `int32_t* end = a + n;`.\n\n`p++` is correct (it steps one `int32_t`), `p < end` is the right test for a one-past-the-end pointer, and `*p = 0` does write through to the caller's array."}, {"id": "cp-neighbor", "type": "blanks", "q": "`int32_t total`, `int32_t w[3]` and `int32_t i` are laid out on the stack like this (4 bytes per row):\n\n| Byte address | What |\n|---|---|\n| `0xFFFF_7A00_0C3C` | RA (4–7) |\n| `0xFFFF_7A00_0C38` | RA (0–3) |\n| `0xFFFF_7A00_0C34` | total |\n| `0xFFFF_7A00_0C30` | w[2] |\n| `0xFFFF_7A00_0C2C` | w[1] |\n| `0xFFFF_7A00_0C28` | w[0] |\n| `0xFFFF_7A00_0C24` | i |\n\nEach statement below is an out-of-bounds write. Which variable does it overwrite? Type the variable's name.\n\n```c\nw[3] = 99;       // A\n*(w - 1) = 5;    // B\n```", "blanks": [{"label": "A", "mode": "text", "accept": ["total"]}, {"label": "B", "mode": "text", "accept": ["i"]}], "why": "The base of `w` is `…0C28`.\n\n- A: `&w[3]` = base + 3 × 4 = `0xC28 + 0xC = 0xC34`. That row is **total**.\n- B: `w - 1` = base − 4 = `0xC24`. That row is **i**.\n\nNeither write crashes. They silently change a neighbouring variable, which is what makes out-of-bounds bugs hard to find.\n\nTempting wrong answer: swapping the two, from picturing `w[0]` at the top of the array."}, {"id": "cp-why", "type": "self", "lines": 7, "q": "**Short answer, on paper.** Every pointer is 8 bytes and holds an address. Explain the purpose of pointer types such as `int*`, `char*` and `double*`: say what the type controls, and give one concrete example.", "model": "Memory itself has no types. It is just bytes, and every access needs a starting address and a size. The pointer holds the address; its **type** supplies the size.\n\nThe type controls two things:\n\n1. **Pointer arithmetic.** `p + 1` adds `sizeof(*p)` bytes, so indexing and `p++` land on whole elements.\n2. **Dereferencing.** `*p` reads or writes `sizeof(*p)` bytes and interprets them as that type.\n\nExample: with the same address in both, an `int*` steps 4 bytes and `*p` reads 4 bytes, while a `char*` steps 1 byte and reads 1 byte.", "rubric": ["memory has no types / an access needs a starting address and a size", "the type sets the step of pointer arithmetic (`p + 1` adds `sizeof(*p)` bytes)", "the type sets how many bytes `*p` reads or writes (and how they are interpreted)", "a concrete example comparing two types, e.g. `int*` moves 4 and reads 4, `char*` moves 1 and reads 1"], "why": "The weak answer is \"so the compiler knows what it points to\". Push it one step further: knowing the type is what lets the compiler pick the step size and the number of bytes to read or write.\n\n\"Because pointers to bigger types are bigger\" is wrong: every pointer is 8 bytes."}, {"id": "cp-scale", "type": "self", "lines": 10, "q": "**Code writing.** Write `void scale(int32_t* p, int32_t n, int32_t k)` that multiplies each of the `n` elements starting at `p` by `k`, so that the caller's array changes. Use pointer arithmetic only, no `[]`. Then write the call that triples every element of `int32_t nums[4]`.", "model": "```c\nvoid scale(int32_t* p, int32_t n, int32_t k) {\n    int32_t* end = p + n;        // one past the last element\n    while (p < end) {\n        *p = *p * k;             // read, multiply, write back\n        p++;                     // next element\n    }\n}\n\nscale(nums, 4, 3);               // the array name decays to &nums[0]\n```", "rubric": ["writes through the pointer (`*p = …` or `*(p + i) = …`), so the caller's array changes", "visits exactly `n` elements: `end` is `p + n`, not `p + n * sizeof(int32_t)`", "moves by elements (`p++` or `p + i`), never `p += 4`", "the call passes `nums` (or `&nums[0]`) and the length 4, not `&nums` or `*nums`"], "why": "A counting loop is just as good: `for (int32_t i = 0; i < n; i++) *(p + i) = *(p + i) * k;`.\n\nTwo slips to check for: `*p++ * k;` style lines that move the pointer without storing anything, and scaling the end pointer by `sizeof` (the compiler already does that)."}]}, {"id": "dynamic-memory", "title": "Dynamic memory: lifetime, malloc, free, realloc", "blurb": "Say how long any variable lives, use malloc / free / realloc correctly on paper, draw the heap the way lecture does, and name the bug in a broken snippet.", "objective": "Objective 4: Program memory layout (the heap) · Objective 5: Dangling pointers", "sources": "CL18 · RD16 · HW7 Q4–Q6 · DIS §2.4", "minutes": 70, "cheats": ["**Scope** = where the name is valid (compile time). **Lifetime** = when the memory exists (run time).", "Lifetimes: **automatic** (locals, parameters: stack, `{` to `}`), **static** (globals and `static`: data segment, whole run), **dynamic** (heap: `malloc` until `free`).", "`T* p = malloc(n * sizeof(T));` takes **bytes**, returns the block's start address or `NULL`, and the contents are garbage. Check `p == NULL` before using it.", "`free(p); p = NULL;`. One `free` per `malloc`, heap addresses only, no size argument (the heap keeps metadata).", "`T* temp = realloc(p, newCount * sizeof(T)); if (temp != NULL) p = temp;`. New **total** size. Never `p = realloc(p, …)`.", "Leak = never freed and no pointer left. Double free = two `free`s on one block. Use-after-free = using `*p` after `free(p)`. Dangling = the pointer outlives its data (after `free`, or `return &local;`).", "Diagram: the caller gets an `RV (8)` slot. `malloc`'s frame is `arg0 (8): bytes`, `RA (8): calling line`, `…`. A heap block is `(bytes) contents`, with `?` until something is stored.", "`a[i]` is at base + i × `sizeof(T)` for stack arrays and heap arrays alike."], "chunks": [{"id": "scope-lifetime", "title": "Scope vs lifetime", "read": "Ask two separate questions about any variable.\n\n- **Scope**: *where in the code can I use this name?* Scope is a **compile-time** concept: the region of code where the variable's name is valid, set by the curly braces `{ }`.\n- **Lifetime**: *when does its memory actually exist?* Lifetime is a **run-time** concept: the period between when the memory is allocated and when it is deallocated. It is set by **where the variable is stored**.\n\nC has three lifetimes:\n\n| Lifetime | What has it | Stored in | Begins | Ends |\n|---|---|---|---|---|\n| **Automatic** | local variables, parameters | stack (that function's frame) | the function is called (`{`) | the function returns (`}`) |\n| **Static** | globals, and anything declared `static` | data segment | the program starts | the program ends |\n| **Dynamic** | blocks from `malloc` (also `calloc`, `realloc`) | heap | you call `malloc` | you call `free` |\n\nBecause they are different ideas, a variable can be **in its lifetime but out of scope**:\n\n```c\nint total = 0;                 // global: static lifetime\n\nint next_id(void) {\n    static int count = 0;      // static lifetime, but the NAME only works inside next_id\n    int step = 1;              // automatic: a brand-new step on every call\n    count += step;\n    return count;\n}\n\nint main(void) {\n    int a = next_id();         // 1\n    int b = next_id();         // 2: count kept its value between the calls\n    total = a + b;             // 3\n    return 0;\n}\n```\n\n- `count` is created once and lives for the whole run. `main` still can't write `count = 5;` because the name is out of scope there.\n- `step` is created and destroyed on every call.\n- While `next_id` runs, `a` and `b` still exist in main's frame, but `next_id` can't name them.\n\n> **Trap:** a pointer and the thing it points to have **separate** lifetimes. In `int *p = malloc(4);` inside a function, `p` is an automatic 8-byte local on the stack. The 4-byte block is dynamic, on the heap. When the function returns, `p` is destroyed. The block is not.", "questions": [{"id": "scope-vs-lifetime", "type": "mc", "q": "Which statement matches lecture's definitions?", "options": ["Scope is a compile-time concept (where a name is valid). Lifetime is a run-time concept (when the memory exists).", "Scope is a run-time concept (when the memory exists). Lifetime is a compile-time concept (where a name is valid).", "Scope and lifetime are the same thing: both end at the closing `}` for every variable.", "Scope is how many bytes a variable takes. Lifetime is how long its name stays valid."], "answer": 0, "why": "Scope = the region of code where the **name** is valid, decided by `{ }` when the code is compiled. Lifetime = the span of time the variable **occupies memory** while the program runs, decided by where it is stored.\nThe swapped version is the classic mix-up. \"Both end at `}`\" is only true for ordinary locals: a `static` local and a heap block both outlive the `}`."}, {"id": "lifetime-classify", "type": "blanks", "q": "Type the lifetime of each item: `automatic`, `static` or `dynamic`.\n\n```c\nint hits = 0;\n\ndouble* scale(double* src, int n) {\n    static int calls = 0;\n    double factor = 1.5;\n    double* out = malloc(n * sizeof(double));\n    if (out == NULL) return NULL;\n    for (int i = 0; i < n; i++) out[i] = src[i] * factor;\n    calls++;\n    hits += n;\n    return out;\n}\n```", "blanks": [{"label": "hits", "mode": "text", "accept": ["static", "static lifetime"], "acceptRe": ["^static( lifetime)?$"]}, {"label": "n (the parameter)", "mode": "text", "accept": ["automatic", "auto", "automatic lifetime"], "acceptRe": ["^auto(matic)?( lifetime)?$"]}, {"label": "calls", "mode": "text", "accept": ["static", "static lifetime"], "acceptRe": ["^static( lifetime)?$"]}, {"label": "factor", "mode": "text", "accept": ["automatic", "auto", "automatic lifetime"], "acceptRe": ["^auto(matic)?( lifetime)?$"]}, {"label": "out (the pointer variable itself)", "mode": "text", "accept": ["automatic", "auto", "automatic lifetime"], "acceptRe": ["^auto(matic)?( lifetime)?$"]}, {"label": "the block that out points to", "mode": "text", "accept": ["dynamic", "dynamic lifetime"], "acceptRe": ["^dynamic( lifetime)?$"]}], "why": "- `hits` is a global and `calls` is declared `static`: both **static**, alive for the whole run.\n- `n`, `factor` and `out` are a parameter and two locals: **automatic**, they live in `scale`'s frame.\n- The block came from `malloc`: **dynamic**, alive until someone calls `free` on it.\n\nThe tempting mistake is calling `out` dynamic. `out` is just an 8-byte local that *holds the address* of the dynamic block."}, {"id": "where-stored", "type": "blanks", "q": "Same code. Type the region of memory that holds each item: `stack`, `heap` or `data`.\n\n```c\nint hits = 0;\n\ndouble* scale(double* src, int n) {\n    static int calls = 0;\n    double factor = 1.5;\n    double* out = malloc(n * sizeof(double));\n    if (out == NULL) return NULL;\n    for (int i = 0; i < n; i++) out[i] = src[i] * factor;\n    calls++;\n    hits += n;\n    return out;\n}\n```", "blanks": [{"label": "hits", "mode": "text", "accept": ["data", "data segment", "the data segment"], "acceptRe": ["^(the )?data( segment| region)?$"]}, {"label": "calls", "mode": "text", "accept": ["data", "data segment", "the data segment"], "acceptRe": ["^(the )?data( segment| region)?$"]}, {"label": "factor", "mode": "text", "accept": ["stack", "the stack"], "acceptRe": ["^(the )?stack( segment)?$"]}, {"label": "out (the pointer variable itself)", "mode": "text", "accept": ["stack", "the stack"], "acceptRe": ["^(the )?stack( segment)?$"]}, {"label": "the n doubles that out points to", "mode": "text", "accept": ["heap", "the heap"], "acceptRe": ["^(the )?heap( segment)?$"]}], "why": "Lifetime tells you the region: static → **data segment**, automatic → **stack**, dynamic → **heap**.\n`calls` is the one people miss. It is declared inside a function, but `static` moves it out of the frame and into the data segment, which is how it keeps its value between calls.", "hint": "Work out each item's lifetime first. Each lifetime has exactly one home."}, {"id": "static-trace", "type": "short", "mode": "num", "q": "What does this program print?\n\n```c\n#include <stdio.h>\n\nint bump(void) {\n    static int kept = 10;\n    int fresh = 10;\n    kept += 5;\n    fresh += 5;\n    return kept + fresh;\n}\n\nint main(void) {\n    bump();\n    bump();\n    printf(\"%d\\n\", bump());\n    return 0;\n}\n```", "accept": ["40"], "why": "`kept` has static lifetime: it is initialised once and keeps its value, so it goes 15, 20, **25**. `fresh` is automatic: every call makes a new one starting at 10, so it is **15** each time.\nThird call returns 25 + 15 = **40**.\n30 treats `kept` as an ordinary local (15 + 15). 50 treats `fresh` as static too (25 + 25).", "placeholder": "a number"}]}, {"id": "why-heap", "title": "Why the heap exists", "read": "Everything on the stack has two limits.\n\n1. **Its size is fixed at compile time.** `int grades[10];` is stuck at 10. But \"sometimes the amount of memory needed for a program is not known in advance\". Lecture's example: the program asks the user how many students are in the class. Nobody knows the answer until the program is running.\n2. **It dies when its function returns.** A function can't build something in its own frame and hand it back. (Part 6 shows the bug you get when you try.)\n\n**Dynamic memory allocation** \"lets programs request and release memory while it is running\". That memory comes from the **heap**.\n\n| | Stack | Heap |\n|---|---|---|\n| Managed | automatically (you w
