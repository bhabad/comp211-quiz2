 exist.** make looks for a rule whose target has that name. If there is one, it runs it; that is how `.o` files get made. If there is **no rule** (a source file that was deleted, never created, or misspelled in the Makefile), make cannot continue:\n\n```\nmake: *** No rule to make target 'wax.c', needed by 'wax.o'.  Stop.\n```\n\nRead it as: \"`wax.o` needs `wax.c`; that file is not here and no rule creates it.\" make **stops right there**. Recipes that already ran stay done; nothing after the error runs, so the final target is not built. The error appears even if an old `wax.o` is still sitting in the directory.\n\n**A file that already exists.** make trusts existence and timestamps, nothing else. If a file with the target's name exists and no dependency is newer, the target is up to date, however the file got there.\n\n### Worked example\n\n```make\ntorch: wick.o wax.o\n\tgcc -o torch wick.o wax.o\n\nwick.o: wick.c\n\tgcc -c wick.c\n\nwax.o: wax.c\n\tgcc -c wax.c\n```\n\n- Directory has `wick.c` but no `wax.c`: make runs `gcc -c wick.c`, reaches `wax.o`, prints the error above and stops. `torch` is never linked.\n- Directory has `wax.c` but no `wick.c`: `wick.o` is checked first, so make stops immediately. Nothing is built.\n- After a full build, `touch torch`, then `make`: `torch` exists and is newer than both `.o` files, so make prints `make: 'torch' is up to date.` and runs nothing.\n- After a full build, `touch wick.o`, then `make`: `wick.o` is newer than `wick.c`, so it is **not** recompiled. It is now newer than `torch`, so `torch` **is** relinked.\n\n(`touch f` sets `f`'s timestamp to now, creating the file if needed.)", "questions": [{"id": "missing-dust", "type": "mc", "q": "```make\ncomet: tail.o core.o\n\tgcc -o comet tail.o core.o\n\ntail.o: tail.c dust.h\n\tgcc -c tail.c\n\ncore.o: core.c\n\tgcc -c core.c\n```\n\nThe directory holds `tail.c` and `core.c`, but there is no `dust.h`. You run `make`. What happens?", "options": ["make stops with an error about `dust.h` before building anything", "make builds `core.o`, then stops with an error about `dust.h`", "make compiles `tail.c` without the header, then links `comet`", "make creates an empty `dust.h`, then builds all three targets"], "answer": 0, "why": "`comet` depends on `tail.o core.o`, checked left to right. `tail.o` comes first, and its dependency `dust.h` neither exists nor has a rule, so make stops at once: `make: *** No rule to make target 'dust.h', needed by 'tail.o'.  Stop.`\n\nNothing was built before that point, so `core.o` never gets its turn. make never invents missing files, and it does not skip a dependency just because the recipe might work without it."}, {"id": "missing-fill", "type": "blanks", "q": "```make\ntorch: wick.o wax.o\n\tgcc -o torch wick.o wax.o\n\nwick.o: wick.c\n\tgcc -c wick.c\n\nwax.o: wxa.c\n\tgcc -c wax.c\n```\n\nThe directory holds `wick.c` and `wax.c`. Look closely at the `wax.o` rule, then predict what `make` does.", "blanks": [{"label": "targets built before make stops, in order", "mode": "list", "accept": ["wick.o"]}, {"label": "`No rule to make target '____'`", "mode": "text", "accept": ["wxa.c"]}, {"label": "`needed by '____'`", "mode": "text", "accept": ["wax.o"]}], "why": "The rule says `wax.o: wxa.c` (letters swapped). make believes the Makefile: `wax.o` needs a file called `wxa.c`. No such file, no rule for it.\n\nOrder: `wick.o` is the first dependency of `torch` and builds fine. Then make reaches `wax.o` and stops: `make: *** No rule to make target 'wxa.c', needed by 'wax.o'.  Stop.`\n\nThe file `wax.c` existing does not help; the name in the dependency list is what counts."}, {"id": "exists-cases", "type": "blanks", "q": "```make\ncomet: tail.o core.o\n\tgcc -o comet tail.o core.o\n\ntail.o: tail.c dust.h\n\tgcc -c tail.c\n\ncore.o: core.c\n\tgcc -c core.c\n```\n\nAll source files exist (`tail.c`, `core.c`, `dust.h`) and everything has been built. Consider three separate experiments, each starting again from that fully built state.", "blanks": [{"label": "`rm core.o`, then `make`: targets built, in order", "mode": "list", "accept": ["core.o comet"]}, {"label": "`touch core.o`, then `make`: targets built, in order", "mode": "list", "accept": ["comet"]}, {"label": "`touch comet`, then `make`: how many recipes run?", "mode": "num", "accept": ["0"]}], "why": "`rm core.o`: `core.o` is missing → rebuilt. It is then newer than `comet` → `comet` is relinked. `tail.o` is untouched.\n\n`touch core.o`: `core.o` exists and is newer than `core.c`, so it is **not** recompiled. But it is now newer than `comet` → only `comet` is rebuilt.\n\n`touch comet`: `comet` exists and is now newer than everything it depends on → `make: 'comet' is up to date.` 0 recipes.\n\nA newer file makes the things that depend on it stale (upward), never the things it depends on."}, {"id": "missing-after-build", "type": "mc", "q": "```make\ncomet: tail.o core.o\n\tgcc -o comet tail.o core.o\n\ntail.o: tail.c dust.h\n\tgcc -c tail.c\n\ncore.o: core.c\n\tgcc -c core.c\n```\n\nEverything was built successfully. Then someone deletes `dust.h`. The files `tail.o`, `core.o` and `comet` are all still there. You run `make`. What happens?", "options": ["make stops with an error about `dust.h` and rebuilds nothing", "make prints `'comet' is up to date`, since every target exists", "make recompiles `tail.o` and then relinks `comet`", "make recreates `dust.h` from `tail.c`, then rebuilds `tail.o`"], "answer": 0, "why": "To decide whether `tail.o` is up to date, make needs the timestamps of all its dependencies. `dust.h` does not exist and has no rule, so make cannot go on: `make: *** No rule to make target 'dust.h', needed by 'tail.o'.  Stop.`\n\nThe tempting answer is \"up to date\" because the built files are all present. An existing target does not excuse a missing dependency."}]}], "checkpoint": [{"id": "cp-fresh", "type": "blanks", "q": "Questions in this checkpoint use this Makefile unless they say otherwise.\n\n```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nThe directory holds only the source files: `hull.c`, `mast.c`, `keel.c`, `dock.c`, `knots.h`. You run `make`.", "blanks": [{"label": "default target", "mode": "text", "accept": ["rig"]}, {"label": "targets built, in order", "mode": "list", "accept": ["hull.o mast.o keel.o rig"]}], "why": "`CC = gcc` is a variable. The first rule is `rig: hull.o mast.o keel.o`, so the default target is `rig`.\n\nIts dependencies are built left to right, then `rig`: `hull.o mast.o keel.o rig`. `dock` and `dock.o` are not built (`rig` does not depend on them), and `clean` does not run."}, {"id": "cp-two-goals", "type": "short", "mode": "list", "q": "```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nFresh directory (source files only). You run `make dock rig`. List the targets in the order their recipes run.", "accept": ["dock.o keel.o dock hull.o mast.o rig"], "placeholder": "names in order", "why": "Goals in the order typed.\n\n1. `dock` depends on `dock.o keel.o`: build `dock.o`, `keel.o`, then `dock`.\n2. `rig` depends on `hull.o mast.o keel.o`: build `hull.o`, `mast.o`; `keel.o` already exists and is newer than `keel.c` → skipped; then `rig`.\n\n`dock.o keel.o dock hull.o mast.o rig`. Two traps: building `rig` first because it is the default, and compiling `keel.o` twice."}, {"id": "cp-header", "type": "short", "mode": "list", "q": "```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nBoth programs have been built with `make rig dock`, and nothing has changed since. You edit `knots.h` and run plain `make`. List the targets whose recipes run, in order.", "accept": ["hull.o mast.o rig"], "placeholder": "names in order", "why": "`knots.h` is listed by `hull.o` and `mast.o`. Both are now older than it → rebuilt, in the order `rig` lists them. `keel.o` does not depend on the header → skipped. `rig` is older than the two new `.o` files → relinked.\n\nAnswer: `hull.o mast.o rig`. `dock` is not considered at all: plain `make` builds only the default target, and `dock` does not depend on `knots.h` anyway."}, {"id": "cp-keel", "type": "blanks", "q": "```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nBoth programs have been built with `make rig dock`, and nothing has changed since. You edit `keel.c`, then run two commands one after the other. List the targets whose recipes run, in order, for each.", "blanks": [{"label": "first: `make`", "mode": "list", "accept": ["keel.o rig"]}, {"label": "second: `make dock`", "mode": "list", "accept": ["dock"]}], "why": "`make` (goal `rig`): `keel.o` is older than `keel.c` → rebuilt; `rig` is older than the new `keel.o` → relinked. `hull.o` and `mast.o` are untouched.\n\n`make dock`: `dock.o` is still newer than `dock.c` → skipped. `keel.o` was rebuilt a moment ago and is newer than `keel.c` → skipped. But `dock` is older than the new `keel.o` → relinked. Only `dock` runs.\n\nWriting `keel.o dock` for the second command forgets that the first command already rebuilt `keel.o`."}, {"id": "cp-why", "type": "mc", "q": "```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nBoth programs have been built with `make rig dock`, and nothing has changed since. You run `touch keel.o` (which only gives that file a new timestamp) and then `make dock`. make relinks `dock`, although no source file changed and nothing was recompiled. Why is `dock` rebuilt?", "options": ["`dock` lists `keel.o` as a dependency, and `keel.o` is now newer than `dock`", "A target named on the command line is always rebuilt", "`keel.c` is now older than `keel.o`, which makes `keel.o` out of date", "The `dock` rule comes after the `rig` rule, so `dock` has to be redone"], "answer": 0, "why": "`dock: dock.o keel.o` lists `keel.o`. After the `touch`, `keel.o` has a later timestamp than `dock`, so by the ordinary rule (a dependency is newer) only `dock` is rebuilt.\n\nNaming a target does not force a rebuild: type `make dock` again and it reports `make: 'dock' is up to date.` The third option has the direction backwards: a dependency being *older* than its target is the normal, up-to-date state, which is exactly why `keel.o` was not recompiled. Rule position never triggers a rebuild."}, {"id": "cp-dockc", "type": "blanks", "q": "```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nBoth programs have been built with `make rig dock`, and nothing has changed since. You edit `dock.c`, then run two commands one after the other.", "blanks": [{"label": "`make`: how many recipes run?", "mode": "num", "accept": ["0"]}, {"label": "then `make dock`: targets built, in order", "mode": "list", "accept": ["dock.o dock"]}], "why": "Plain `make` builds the default target `rig`. Nothing in `rig`'s dependency graph mentions `dock.c`, so make prints `make: 'rig' is up to date.` and runs 0 recipes, even though a source file was just edited.\n\n`make dock`: `dock.o` is older than `dock.c` → rebuilt; `dock` is older than the new `dock.o` → relinked; `keel.o` is fine. Answer `dock.o dock`."}, {"id": "cp-clean-dock", "type": "blanks", "q": "```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nBoth programs have been built with `make rig dock`, and nothing has changed since. You run `make clean` and then `make dock`.", "blanks": [{"label": "targets built by `make dock`, in order", "mode": "list", "accept": ["dock.o keel.o dock"]}, {"label": "does the file `rig` exist afterwards? (yes/no)", "mode": "text", "accept": ["no", "n"]}, {"label": "does the file `hull.c` exist afterwards? (yes/no)", "mode": "text", "accept": ["yes", "y"]}], "why": "`make clean` runs `rm -f rig dock hull.o mast.o keel.o dock.o`: every build product is gone, every source file stays.\n\n`make dock` then rebuilds only `dock`'s chain: `dock.o`, `keel.o`, `dock`. `rig`, `hull.o` and `mast.o` stay deleted because nothing asked for them. `clean` never removes source files such as `hull.c`; its `rm` line lists products only."}, {"id": "cp-missing", "type": "blanks", "q": "```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nFresh directory, but `mast.c` was never created: it holds only `hull.c`, `keel.c`, `dock.c` and `knots.h`. You run `make`.", "blanks": [{"label": "targets built before make stops, in order", "mode": "list", "accept": ["hull.o"]}, {"label": "`No rule to make target '____'`", "mode": "text", "accept": ["mast.c"]}, {"label": "`needed by '____'`", "mode": "text", "accept": ["mast.o"]}], "why": "`rig` depends on `hull.o mast.o keel.o`, left to right. `hull.o` builds normally. For `mast.o`, the dependency `mast.c` does not exist and no rule makes it, so make stops: `make: *** No rule to make target 'mast.c', needed by 'mast.o'.  Stop.`\n\n`keel.o` comes after the failure and is never built; neither is `rig`. Listing `hull.o keel.o` assumes make skips the broken target and carries on. It does not."}, {"id": "cp-times", "type": "blanks", "q": "```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o keel.o dock.o\n```\n\nThe directory contains exactly these files (there is no `dock.o` and no `dock`):\n\n| file | last modified |\n|---|---|\n| `knots.h` | 08:00 |\n| `keel.c` | 09:00 |\n| `hull.c` | 09:01 |\n| `mast.c` | 09:02 |\n| `dock.c` | 09:03 |\n| `rig` | 09:04 |\n| `keel.o` | 09:05 |\n| `hull.o` | 09:06 |\n| `mast.o` | 09:07 |\n\nYou run `make`.", "blanks": [{"label": "targets built, in order", "mode": "list", "accept": ["rig"]}, {"label": "if `rig` showed 09:30 instead of 09:04: how many recipes would run?", "mode": "num", "accept": ["0"]}], "why": "Goal `rig`. Check its dependencies first:\n\n- `hull.o` (09:06) vs `hull.c` (09:01), `knots.h` (08:00) → up to date.\n- `mast.o` (09:07) vs `mast.c` (09:02), `knots.h` → up to date.\n- `keel.o` (09:05) vs `keel.c` (09:00) → up to date.\n\nNow `rig` itself: it is from 09:04, **older** than all three `.o` files → relink. Only `rig` runs. \"Nothing, the `.o` files are fine\" stops one level too early.\n\nWith `rig` at 09:30 it would be newer than every dependency: `make: 'rig' is up to date.` and 0 recipes. The missing `dock.o` never matters: plain `make` does not look at `dock`."}, {"id": "cp-badclean", "type": "short", "mode": "list", "q": "This is the same Makefile, except that the last line was written carelessly:\n\n```make\nCC = gcc\n\nrig: hull.o mast.o keel.o\n\t$(CC) -o rig hull.o mast.o keel.o\n\ndock: dock.o keel.o\n\t$(CC) -o dock dock.o keel.o\n\nhull.o: hull.c knots.h\n\t$(CC) -c hull.c\n\nmast.o: mast.c knots.h\n\t$(CC) -c mast.c\n\nkeel.o: keel.c\n\t$(CC) -c keel.c\n\ndock.o: dock.c\n\t$(CC) -c dock.c\n\nclean:\n\trm -f rig dock hull.o mast.o\n```\n\nBoth programs have been built with `make rig dock`, and nothing has changed since. You run `make clean` and then `make`. List the targets whose recipes run during that last `make`, in order.", "accept": ["hull.o mast.o rig"], "placeholder": "names in order", "why": "This `clean` removes only `rig`, `dock`, `hull.o` and `mast.o`. `keel.o` and `dock.o` survive (the directory after the clean: `dock.c dock.o hull.c keel.c keel.o knots.h mast.c`).\n\n`make` then finds `hull.o` and `mast.o` missing → built; `keel.o` exists and is newer than `keel.c` → skipped; `rig` is missing → built. Answer `hull.o mast.o rig`.\n\n`make clean` does only what its recipe says. \"clean then make rebuilds everything\" is true only when the `rm` line really lists everything."}, {"id": "cp-write", "type": "self", "lines": 14, "q": "Write a complete Makefile for a program `chat` built from two source files, `chat.c` and `net.c`. Both of them `#include \"net.h\"`.\n\nRequirements: each `.c` file is compiled to its own `.o` with `gcc -c`; the `.o` files are linked into `chat`; plain `make` builds `chat`; `make clean` deletes everything the Makefile builds.", "model": "```make\nchat: chat.o net.o\n\tgcc -o chat chat.o net.o\n\nchat.o: chat.c net.h\n\tgcc -c chat.c\n\nnet.o: net.c net.h\n\tgcc -c net.c\n\nclean:\n\trm -f chat chat.o net.o\n```\n\nEvery indented line starts with a tab. Variables (`CC = gcc`, then `$(CC)`) are fine too, but not required.", "rubric": ["the `chat` rule comes **first**, so plain `make` builds it", "`chat: chat.o net.o` with a link recipe such as `gcc -o chat chat.o net.o`", "one rule per `.o` file, each listing its `.c` file **and** `net.h` as dependencies", "recipes are `gcc -c chat.c` and `gcc -c net.c`, each on a tab-indented line", "`clean:` has no dependencies and runs `rm -f chat chat.o net.o` (products only, no source files)"], "why": "Work backwards from the program: `chat` is linked from two `.o` files; each `.o` comes from its `.c` plus the header it includes. Put the rule for `chat` first so it is the default.\n\nThe classic bug is leaving `net.h` out of the `.o` rules: editing the header would then rebuild nothing. With the model answer, editing `net.h` rebuilds `chat.o net.o chat`, and editing only `net.c` rebuilds `net.o chat`."}, {"id": "cp-explain", "type": "self", "lines": 6, "q": "In three or four sentences: how does `make` decide whether to rebuild a target, and why does that make rebuilding faster after you edit one file of a large program?", "model": "make rebuilds a target only if its file does not exist, or if at least one of its dependencies has a later modification time (timestamp) than the target. Before judging a target it applies the same test to each of that target's dependencies, so a change works its way up the dependency graph. After you edit one source file, only the targets that depend on it are out of date: its `.o` file, then the program linked from that `.o`. Every other `.o` is still newer than its own sources, so its recipe is skipped. The build is *incremental*: the work done matches what changed, not the size of the program.", "rubric": ["a target is rebuilt if its file is **missing**", "or if a **dependency is newer** than the target (compares timestamps / modification times)", "dependencies are checked and rebuilt first, so a change carries upward to whatever depends on it", "targets that do not depend on the edited file are skipped because they are still newer than their dependencies"], "why": "The objective's wording is \"describe how make uses dependencies and timestamps to control incremental builds\", so a full answer names both: the dependency lists say *what to compare*, the timestamps say *whether to rebuild*. An answer that says make \"checks which files changed\" without mentioning timestamps or modification times is too vague."}]}, {"id": "bash", "title": "Bash scripts: shebang, permissions, if, for", "blurb": "Read a short Bash script and say who runs it, whether it is allowed to run, what it prints, which branch is taken, and how many times each loop goes round.", "objective": "Objective 2: Bash scripts (Lab 1)", "sources": "Lab 1 Part 0 (test scripts) · Lab 1 Part 0–1 questions · DIS §17.15", "minutes": 50, "cheats": ["A shell script is an executable **text file** containing a sequence of shell commands, run top to bottom. Scripts automate tasks and group commands.", "`#!/bin/bash` on line 1 names the interpreter: `./script.sh` makes the OS start `/bin/bash` to run the file. The file name does not decide.", "`-rwxr-xr--` = type, then owner / group / others, each `rwx`. `./script.sh` needs `x`: `chmod u+x script.sh`. `bash script.sh` only needs `r`.", "`x=5` (no spaces) assigns, `$x` reads, `$1` is the first argument, `$#` the number of arguments, `$(( ))` does integer arithmetic.", "Numbers: `-eq -ne -gt -ge -lt -le`. Strings: `=` and `!=`. Files: `-e` exists, `-f` regular file, `-d` directory. Spaces inside `[ ]` are required.", "`if … elif … else … fi` runs **one** branch: the first whose test is true. Separate `if` blocks are decided separately.", "`for x in LIST; do … done` runs once per item. A glob list is the matching file names: `?` is exactly one character, `*` any number, and hidden files (leading `.`) are left out.", "`for (( init; condition; update ))`: init once, condition before every pass, update after every pass. Count by listing the values that pass the condition."], "chunks": [{"id": "script-shebang", "title": "What a script is, and who runs it", "read": "A **shell script** is an executable **text file** containing a sequence of shell commands: the same commands you could type at the prompt, saved in a file. When the script runs, the shell reads it from the top and executes the commands **one at a time, in order**. Each command finishes before the next one starts.\n\nScripts exist to **automate** and to **group**. A job that takes several commands (make a folder and copy files into it; run every test and compare the results, as Lab 1's test script did) becomes a single command you can repeat exactly, any time. By convention script names end in `.sh`, but the name is only a label.\n\n```bash\n#!/bin/bash\n# setup.sh: make a folder for a new lab\nmkdir lab2\ncp starter.c lab2/main.c\necho \"lab2 ready\"\n```\n\n**The shebang.** Line 1 starts with `#!` followed by the path of a program. It tells the operating system **which interpreter runs this file**. When you start the script with `./setup.sh`, the OS reads that line, starts `/bin/bash`, and hands it the file. `/bin/bash` then executes the commands. Had line 1 been `#!/usr/bin/python3`, the same file would be handed to Python instead.\n\nThe shebang only counts on **line 1**. Anywhere else, `#` starts a **comment**: the shell ignores everything from the `#` to the end of that line.\n\n### Worked example\n\nIn the script above, line 1 picks the interpreter and line 2 is a comment. That leaves three commands, run in this order: `mkdir lab2`, then `cp starter.c lab2/main.c`, then `echo \"lab2 ready\"`. The only output is `lab2 ready`; `mkdir` and `cp` do their work silently.\n\n> **On paper:** \"Which program runs this script?\" Copy the path after `#!`. Here: `/bin/bash`.", "questions": [{"id": "def-blanks", "type": "blanks", "q": "Complete the course's definition.\n\nA shell script is an executable ____ file containing a sequence of shell ____.", "blanks": [{"label": "first blank", "mode": "text", "accept": ["text", "plain text", "plain-text", "ascii text"]}, {"label": "second blank", "mode": "text", "accept": ["commands", "command"]}], "why": "The objective's wording is *an executable text file containing a sequence of shell commands*.\n\n\"Text\" matters: a script is not compiled; the shell reads the characters and runs them. \"Sequence\" matters too: the commands run in order, top to bottom. The tempting wrong word for the first blank is \"binary\", which describes a compiled C program."}, {"id": "who-runs", "type": "short", "mode": "text", "q": "```bash\n#!/bin/bash\necho \"backing up\"\ncp notes.txt notes.bak\n```\n\nThis file is saved as `backup.sh`, given execute permission, and started with `./backup.sh`. Type the full path of the program that reads the file and executes its commands.", "accept": ["/bin/bash", "bash"], "placeholder": "/…", "why": "The shebang on line 1 names the interpreter. `#!/bin/bash` → the OS starts `/bin/bash` and hands it the script; `/bin/bash` then runs `echo` and `cp` in order.\n\nNot `backup.sh` \"itself\": a text file cannot execute anything. And not `echo` or `cp`: those are the commands being run, not the program reading the script."}, {"id": "count-commands", "type": "short", "mode": "num", "q": "```bash\n#!/bin/bash\n# nightly cleanup\n\necho \"start\"\n# rm old.log\nmkdir -p archive\nmv run.log archive/\necho \"done\"   # all finished\n```\n\nHow many commands does bash execute when this script runs?", "accept": ["4"], "why": "Line 1 is the shebang. `# nightly cleanup` and `# rm old.log` are comments, and the blank line does nothing. That leaves `echo \"start\"`, `mkdir -p archive`, `mv run.log archive/` and `echo \"done\"`: 4 commands, in that order.\n\nThe `# all finished` at the end of the last line is a comment too, but the `echo` before it still runs. Counting 5 means you ran the commented-out `rm`."}, {"id": "no-extension", "type": "mc", "q": "A file named `greet` (no `.sh` ending) has execute permission and contains:\n\n```bash\n#!/bin/bash\necho hi\n```\n\nWhat happens when you type `./greet`?", "options": ["It runs under `/bin/bash` and prints `hi`", "It fails: a script's name must end in `.sh`", "Its two lines are shown on screen, not run"], "answer": 0, "why": "The OS looks at the execute permission and the shebang, never at the file name. `/bin/bash` is started, runs `echo hi`, and `hi` appears.\n\n`.sh` is a convention that tells *people* the file is a script. Displaying the lines is what `cat greet` would do."}]}, {"id": "permissions", "title": "Permission to run: ls -l and chmod", "read": "A script is just a text file until it has **execute permission**. `ls -l` shows a file's permissions as ten characters:\n\n```\n-rw-r--r-- 1 student student 23 Oct  5 10:12 greet.sh\n```\n\n| characters | meaning |\n|---|---|\n| 1 | file type: `-` regular file, `d` directory |\n| 2 to 4 | what the **owner** (user) may do |\n| 5 to 7 | what the **group** may do |\n| 8 to 10 | what **others** may do |\n\nEach group of three is read, write, execute, in that order. A letter (`r`, `w`, `x`) means allowed; a `-` means not allowed. Here the owner has `rw-`: read and write, but **no execute**.\n\n### Worked example\n\n```\n$ ./greet.sh\nbash: ./greet.sh: Permission denied\n$ chmod u+x greet.sh\n$ ls -l greet.sh\n-rwxr--r-- 1 student student 23 Oct  5 10:12 greet.sh\n$ ./greet.sh\nhello\n```\n\n`chmod u+x file` **adds** (`+`) e**x**ecute for the **u**ser who owns the file. One character of the string changes; the rest stay as they were. (`chmod +x file` adds execute for owner, group and others at once.)\n\n### Two ways to start a script\n\n- `./greet.sh` asks the OS to execute the file itself. That needs the `x` bit, and the shebang chooses the interpreter. The `./` is needed because the current directory is not in `$PATH`.\n- `bash greet.sh` runs the program `bash` and gives it the file to **read**. No `x` bit is needed, and the shebang is ignored (to bash it is only a comment).\n\n> **Trap:** the check uses *your* column. If you are the owner, only characters 2 to 4 matter, even when the group or others have an `x`.", "questions": [{"id": "perm-read", "type": "blanks", "q": "```\n-rwxr-x--- 1 student student 212 Oct  2 14:07 deploy.sh\n```\n\nAnswer yes or no for each.", "blanks": [{"label": "may the owner execute it?", "mode": "text", "accept": ["yes", "y"]}, {"label": "may the group write to it?", "mode": "text", "accept": ["no", "n"]}, {"label": "may the group execute it?", "mode": "text", "accept": ["yes", "y"]}, {"label": "may others read it?", "mode": "text", "accept": ["no", "n"]}], "why": "Split the string after the type character: `-` then `rwx` then `r-x` then `---`.\n\n- Owner `rwx`: read, write, execute.\n- Group `r-x`: read and execute, no write.\n- Others `---`: nothing at all.\n\nThe usual slip is treating the leading `-` as the owner's first permission, which shifts every answer by one place."}, {"id": "chmod-fix", "type": "short", "mode": "cmd", "q": "```\n-rw-r----- 1 student student 96 Oct  8 11:30 report.sh\n```\n\nType the command that adds execute permission for the file's owner and changes nothing else.", "accept": ["chmod u+x report.sh", "chmod u+x ./report.sh", "chmod 740 report.sh", "chmod 0740 report.sh", "chmod u=rwx report.sh"], "placeholder": "chmod …", "why": "`chmod u+x report.sh`: **u** is the user who owns the file, **+** adds, **x** is execute. The string becomes `-rwxr-----`. (The octal form `chmod 740 report.sh` gives the same result.)\n\n`chmod +x report.sh` would also make it runnable, but it adds `x` for the group and others as well, which the question ruled out."}, {"id": "chmod-result", "type": "short", "mode": "cmd", "q": "`ls -l` shows `notes.sh` with the permissions `-rw-rw-r--`. You run `chmod u+x notes.sh`. Type the ten-character permission string that `ls -l` shows now.", "accept": ["-rwxrw-r--"], "placeholder": "-rw…", "why": "`u+x` changes exactly one character: the owner's third slot goes from `-` to `x`. Owner `rw-` → `rwx`; group `rw-` and others `r--` are untouched. Result: `-rwxrw-r--`.\n\n`-rwxrwxr-x` is what `chmod +x` (everyone) would give."}, {"id": "run-without-x", "type": "mc", "q": "```\n-rw-r--r-- 1 student student 41 Oct  8 11:02 notes.sh\n```\n\n`notes.sh` begins with `#!/bin/bash`. You are its owner and you are in the directory that contains it. Which command runs the script successfully **right now**, without changing any permissions?", "options": ["`bash notes.sh`", "`./notes.sh`", "`notes.sh`"], "answer": 0, "why": "`bash notes.sh` starts the program `bash` and tells it to read `notes.sh`. Reading needs only `r`, which the owner has.\n\n`./notes.sh` asks the OS to execute the file itself: `Permission denied`, because the owner has no `x`. `notes.sh` on its own fails with `command not found`: a bare name is looked up in `$PATH`, and the current directory is not in it."}]}, {"id": "vars-order", "title": "Variables, arguments, arithmetic, and order", "read": "**Variables.** `name=value` creates or overwrites a variable. There must be **no spaces** around the `=`. Put `$` in front of the name to use the value. Inside double quotes, `$name` is still replaced by the value.\n\n**Arguments.** Words typed after the script's name are available inside it as `$1`, `$2`, `$3`, and so on. `$#` is **how many** arguments were given.\n\n**Arithmetic.** To calculate, wrap the expression in `$(( ))`. It does **integer** math: `/` throws away the remainder, `%` gives the remainder, and `*` `/` `%` are done before `+` `-`.\n\n**Order.** Lines run top to bottom. When a line uses a variable, it gets whatever was assigned **most recently**.\n\n### Worked example: `./hi.sh Ada Bo`\n\n```bash\n#!/bin/bash\nname=$1\ncount=3\necho \"Hi $name\"\ncount=$(( count + 2 ))\necho \"count is $count\"\necho \"you gave $# arguments\"\n```\n\n| line | effect |\n|---|---|\n| `name=$1` | `name` is `Ada`, the first argument |\n| `count=3` | `count` is 3 |\n| `echo \"Hi $name\"` | prints `Hi Ada` |\n| `count=$(( count + 2 ))` | `count` becomes 5 |\n| `echo \"count is $count\"` | prints `count is 5` |\n| `echo \"you gave $# arguments\"` | prints `you gave 2 arguments` |\n\n> **On paper:** keep a small table of variable values and update it line by line. Write a line of output each time you reach an `echo`.\n\n> **Trap:** `count = 3` with spaces is not an assignment. Bash looks for a command named `count` and reports `command not found`.", "questions": [{"id": "assign-form", "type": "mc", "q": "Which line stores the value 9 in a variable called `n`?", "options": ["`n=9`", "`n = 9`", "`$n=9`"], "answer": 0, "why": "Assignment is `name=value`: no spaces, no `$`.\n\n`n = 9` makes bash look for a command called `n` (`n: command not found`). `$n=9` puts a `$` on the left; `$` is for *reading* a variable, so bash substitutes the current value first and then tries to run the result as a command."}, {"id": "arith", "type": "blanks", "q": "What does each line print?", "blanks": [{"label": "`echo $(( 17 / 5 ))`", "mode": "num", "accept": ["3"]}, {"label": "`echo $(( 20 % 6 ))`", "mode": "num", "accept": ["2"]}, {"label": "`echo $(( 2 + 3 * 4 ))`", "mode": "num", "accept": ["14"]}], "why": "Integer arithmetic.\n\n- 17 / 5 is 3 remainder 2, and `/` keeps only the **3** (not 3.4).\n- 20 % 6 is the remainder: 20 = 3 × 6 + 2 → **2**.\n- `*` comes before `+`: 3 * 4 = 12, plus 2 → **14**. Working left to right would give 20."}, {"id": "args-tag", "type": "blanks", "q": "```bash\n#!/bin/bash\necho \"$2\"\necho \"$#\"\necho \"$1-$3\"\n```\n\nThe script is run as `./tag.sh red green blue`. What does each line print?", "blanks": [{"label": "line 1", "mode": "text", "accept": ["green"]}, {"label": "line 2", "mode": "num", "accept": ["3"]}, {"label": "line 3", "mode": "text", "accept": ["red-blue"]}], "why": "`$1` = red, `$2` = green, `$3` = blue.\n\n- `echo \"$2\"` → `green`.\n- `$#` counts the arguments → `3`.\n- `\"$1-$3\"` → `red-blue` (the `-` is ordinary text between the two values).\n\nStarting the count at the script name (so that `$1` would be `./tag.sh`) is the common slip; the arguments start at `$1`."}, {"id": "trace-calc", "type": "blanks", "q": "```bash\n#!/bin/bash\na=4\nb=$1\necho \"start\"\na=$(( a * b ))\necho \"$a\"\nb=$(( a - 5 ))\necho \"$b $a\"\n```\n\nThe script is run as `./calc.sh 3`. Its first line of output is `start`. What are the other two lines?", "blanks": [{"label": "line 2", "mode": "num", "accept": ["12"]}, {"label": "line 3", "mode": "list", "accept": ["7 12"]}], "why": "Track the variables: `a` = 4, `b` = 3 (from `$1`).\n\n- `a=$(( a * b ))` → a = 12, so the second line is `12`.\n- `b=$(( a - 5 ))` uses the **new** a: 12 − 5 = 7.\n- `echo \"$b $a\"` → `7 12`.\n\nUsing the old value a = 4 in the subtraction gives `-1 12`. Variables hold their latest value."}]}, {"id": "if-numbers", "title": "if with numbers", "read": "```bash\nif [ CONDITION ]; then\n    commands\nelif [ ANOTHER ]; then\n    commands\nelse\n    commands\nfi\n```\n\nBash checks the tests from the top and runs the commands under the **first one that is true**, then jumps to `fi`. If none is true it runs the `else` part, when there is one. **At most one branch runs.** `elif` and `else` are optional; the closing `fi` is not.\n\nInside `[ ]`, whole numbers are compared with letter operators:\n\n| operator | true when the left number is |\n|---|---|\n| `-eq` | equal to the right |\n| `-ne` | not equal |\n| `-gt` | greater than |\n| `-ge` | greater than or equal |\n| `-lt` | less than |\n| `-le` | less than or equal |\n\nThe spaces just inside the brackets are required. Lab 1's reading writes tests with double brackets, `[[ $x -gt 5 ]]`; these operators mean the same thing in both forms.\n\n> **Trap:** `[ $x > 5 ]` is not a comparison. `>` is output redirection, so it creates a file named `5`. That is why \"greater than\" is spelled `-gt`.\n\n### Worked example: `./weather.sh 85`\n\n```bash\n#!/bin/bash\ntemp=$1\nif [ $temp -gt 85 ]; then\n    echo \"hot\"\nelif [ $temp -ge 60 ]; then\n    echo \"mild\"\nelse\n    echo \"cold\"\nfi\necho \"done\"\n```\n\n`temp` is 85. Is 85 `-gt` 85? No. Is 85 `-ge` 60? Yes → print `mild`, skip the `else`, continue after `fi` → print `done`.\n\n| run | output |\n|---|---|\n| `./weather.sh 86` | `hot`, then `done` |\n| `./weather.sh 85` | `mild`, then `done` |\n| `./weather.sh 59` | `cold`, then `done` |\n\nBoundary values (85 and 60 here) are where questions are aimed: check whether the operator includes \"equal\".", "questions": [{"id": "ops-name", "type": "blanks", "q": "Type the test operator, with its dash, for each comparison.", "blanks": [{"label": "less than", "mode": "text", "accept": ["-lt", "lt"]}, {"label": "greater than or equal to", "mode": "text", "accept": ["-ge", "ge"]}, {"label": "not equal to", "mode": "text", "accept": ["-ne", "ne"]}], "why": "The letters abbreviate the English: **l**ess **t**han, **g**reater or **e**qual, **n**ot **e**qual. The full set is `-eq -ne -gt -ge -lt -le`.\n\nSwapping `-gt` with `-ge` (or `-lt` with `-le`) is exactly what boundary-value questions catch."}, {"id": "medal", "type": "blanks", "q": "```bash\n#!/bin/bash\nscore=$1\nif [ $score -ge 90 ]; then\n    echo \"gold\"\nelif [ $score -ge 70 ]; then\n    echo \"silver\"\nelif [ $score -lt 40 ]; then\n    echo \"retry\"\nelse\n    echo \"bronze\"\nfi\n```\n\nWhat does the script print for each run?", "blanks": [{"label": "`./medal.sh 90`", "mode": "text", "accept": ["gold"]}, {"label": "`./medal.sh 70`", "mode": "text", "accept": ["silver"]}, {"label": "`./medal.sh 40`", "mode": "text", "accept": ["bronze"]}, {"label": "`./medal.sh 12`", "mode": "text", "accept": ["retry"]}], "why": "- 90: `-ge 90` is true at exactly 90 → `gold`.\n- 70: not ≥ 90; `-ge 70` is true → `silver`.\n- 40: not ≥ 90, not ≥ 70; `-lt 40` is **false** at exactly 40 → falls through to `else` → `bronze`.\n- 12: not ≥ 90, not ≥ 70; `-lt 40` is true → `retry`.\n\n`-ge` includes the boundary, `-lt` does not. Answering `retry` for 40 is the trap."}, {"id": "letters", "type": "short", "mode": "list", "q": "```bash\n#!/bin/bash\nn=12\nif [ $n -gt 5 ]; then\n    echo \"A\"\nfi\nif [ $n -gt 10 ]; then\n    echo \"B\"\nelif [ $n -gt 8 ]; then\n    echo \"C\"\nelse\n    echo \"D\"\nfi\necho \"E\"\n```\n\nList the letters this script prints, in order.", "accept": ["A B E"], "placeholder": "letters in order", "why": "`n` is 12.\n\n- First `if`: 12 > 5 → `A`.\n- The second `if` is a separate statement, so it is tested as well: 12 > 10 → `B`. Its `elif` and `else` are skipped, even though 12 > 8 is also true.\n- `echo \"E\"` is outside both and always runs.\n\n`A B C E` is the trap: inside one if/elif/else chain only the first true branch runs."}, {"id": "ten", "type": "short", "mode": "text", "q": "```bash\n#!/bin/bash\nx=7\ny=$(( x * 2 - 4 ))\nif [ $y -eq 10 ]; then\n    echo \"ten\"\nelif [ $y -lt 10 ]; then\n    echo \"under\"\nelse\n    echo \"over\"\nfi\n```\n\nWhat does this script print?", "accept": ["ten"], "why": "`y` = 7 * 2 − 4. Multiplication first: 14 − 4 = 10. Then `10 -eq 10` is true → `ten`, and the other branches are skipped.\n\nDoing the subtraction first (7 × −2 = −14) leads to `under`."}]}, {"id": "if-strings-files", "title": "if with strings and files", "read": "**Strings** are compared with `=` (same text) and `!=` (different text). Put the values in double quotes and keep the spaces around the operator:\n\n```bash\nif [ \"$1\" = \"start\" ]; then\n```\n\nThe comparison is exact and **case-sensitive**: `Start` is not `start`. Use `-eq` for numbers and `=` for text.\n\n**File tests** ask a question about one path instead of comparing two values:\n\n| test | true when |\n|---|---|\n| `[ -e path ]` | `path` **e**xists (file or directory) |\n| `[ -f path ]` | `path` exists and is a regular **f**ile |\n| `[ -d path ]` | `path` exists and is a **d**irectory |\n\nA path that does not exist fails all three. In `ls -l`, a directory's line starts with `d` and a regular file's with `-`.\n\n### Worked example: `./mode.sh Start`, in a directory that contains a folder named `logs`\n\n```bash\n#!/bin/bash\nif [ \"$1\" = \"start\" ]; then\n    echo \"starting\"\nelif [ \"$1\" != \"stop\" ]; then\n    echo \"unknown: $1\"\nelse\n    echo \"stopping\"\nfi\nif [ -d logs ]; then\n    echo \"logs is a directory\"\nfi\nif [ -f logs ]; then\n    echo \"logs is a regular file\"\nfi\n```\n\n- First block: is `Start` = `start`? No (capital S). Is `Start` != `stop`? Yes → prints `unknown: Start`.\n- The second `if` is a new statement, so it is tested no matter what happened above. `logs` is a directory → prints `logs is a directory`.\n- Third `if`: `-f` is false for a directory → prints nothing.\n\nTwo lines of output. Three `if … fi` blocks in a row are three independent decisions. The branches *inside* one block are not: only the first true one runs.", "questions": [{"id": "file-tests", "type": "blanks", "q": "```\n$ ls -l\n-rw-r--r-- 1 student student  310 Oct  6 09:02 data.csv\ndrwxr-xr-x 2 student student 4096 Oct  6 09:05 out\n-rwxr-xr-x 1 student student   95 Oct  6 09:01 run.sh\n```\n\nThat is everything in the current directory. Is each test true or false?", "blanks": [{"label": "`[ -e out ]`", "mode": "text", "accept": ["true", "t"]}, {"label": "`[ -f out ]`", "mode": "text", "accept": ["false", "f"]}, {"label": "`[ -d data.csv ]`", "mode": "text", "accept": ["false", "f"]}, {"label": "`[ -f run.sh ]`", "mode": "text", "accept": ["true", "t"]}, {"label": "`[ -e tmp ]`", "mode": "text", "accept": ["false", "f"]}], "why": "- `out` has a `d` at the start of its line: a directory. It exists, so `-e` is **true**, but it is not a regular file, so `-f` is **false**.\n- `data.csv` is a regular file, so `-d` is **false**.\n- `run.sh` is a regular file (being executable does not change that): `-f` is **true**.\n- `tmp` is not in the listing, so every test on it is **false**.\n\nThe slip to avoid: reading `-f` as \"exists\". A directory exists and still fails `-f`."}, {"id": "who", "type": "blanks", "q": "```bash\n#!/bin/bash\nif [ \"$1\" = \"$2\" ]; then\n    echo \"match\"\nelif [ \"$1\" != \"admin\" ]; then\n    echo \"guest\"\nelse\n    echo \"admin\"\nfi\n```\n\nWhat does the script print for each run?", "blanks": [{"label": "`./who.sh admin admin`", "mode": "text", "accept": ["match"]}, {"label": "`./who.sh admin root`", "mode": "text", "accept": ["admin"]}, {"label": "`./who.sh sam Sam`", "mode": "text", "accept": ["guest"]}], "why": "- `admin admin`: `$1` = `$2` → `match`. The later tests are never looked at.\n- `admin root`: not equal. Is `$1` != `admin`? `$1` *is* admin, so that is false → `else` → `admin`.\n- `sam Sam`: `sam` and `Sam` differ (case-sensitive). Is `sam` != `admin`? Yes → `guest`.\n\nAnswering `match` for `sam Sam` ignores case; answering `guest` for `admin root` misreads `!=`."}, {"id": "str-cond", "type": "mc", "q": "The variable `mode` holds some text. Which test is true exactly when that text is `fast`?", "options": ["`[ \"$mode\" = \"fast\" ]`", "`[ \"$mode\" -eq \"fast\" ]`", "`[ \"$mode\"=\"fast\" ]`", "`[ mode = fast ]`"], "answer": 0, "why": "`=` with a space on each side compares two strings.\n\n- `-eq` compares integers; given words, bash reports `integer expression expected` and the test fails.\n- Without the spaces, `\"$mode\"=\"fast\"` is one single word, and a test containing one non-empty word is true whatever `mode` holds.\n- `mode` without `$` is the literal letters m-o-d-e, which never equal `fast`."}, {"id": "numbered", "type": "short", "mode": "list", "q": "```\n$ ls -l\n-rw-r--r-- 1 student student  310 Oct  6 09:02 data.csv\ndrwxr-xr-x 2 student student 4096 Oct  6 09:05 out\n-rwxr-xr-x 1 student student   95 Oct  6 09:01 run.sh\n```\n\n```bash\n#!/bin/bash\nif [ -f data.csv ]; then\n    echo \"one\"\nfi\nif [ -d data.csv ]; then\n    echo \"two\"\nelif [ -e out ]; then\n    echo \"three\"\nelse\n    echo \"four\"\nfi\nif [ -e report.txt ]; then\n    echo \"five\"\nfi\necho \"six\"\n```\n\nThe script is run in the directory listed above. List the words it prints, in order.", "accept": ["one three six"], "placeholder": "words in order", "why": "- `-f data.csv`: a regular file → `one`.\n- Second block: `-d data.csv` is false (it is a file, not a directory). `-e out` is true → `three`; the `else` is skipped.\n- `-e report.txt`: no such path → nothing.\n- `echo \"six\"` always runs.\n\nOutput: `one three six`. Each `if … fi` block is decided separately; inside the middle block exactly one branch runs."}]}, {"id": "for-in", "title": "for loops over a list", "read": "```bash\nfor VAR in LIST; do\n    commands\ndone\n```\n\nThe body between `do` and `done` runs **once for each item** in the list. Before each pass, the next item is stored in `VAR`. Number of passes = number of items. The list can be written three ways:\n\n1. **Words:** `for color in red green blue` → 3 passes.\n2. **Brace range:** `for n in {1..4}` → bash expands it to `1 2 3 4` → 4 passes. Both ends are included.\n3. **Glob (file pattern):** `for f in *.c` → the shell replaces the pattern with the names of the matching files in the current directory, then loops over those names.\n\nThe glob rules from the command-line unit still apply: `*` matches any number of characters (including none) and `?` matches **exactly one** character. Hidden files (names starting with `.`) are left out unless the pattern itself starts with a dot.\n\n### Worked example\n\n```\n$ ls -a\n.  ..  .hidden.c  day.txt  day1.txt  day10.txt  day2.txt  main.c  notes.txt  util.c\n```\n\n```bash\nfor f in *.c; do\n    echo \"C $f\"\ndone\nfor f in day?.txt; do\n    echo \"D $f\"\ndone\n```\n\n- `*.c` matches `main.c` and `util.c`. Not `.hidden.c`, which is hidden. **2 passes.**\n- `day?.txt` needs exactly one character between `day` and `.txt`: `day1.txt` and `day2.txt`. Not `day.txt` (no character there) and not `day10.txt` (two). **2 passes.**\n\nOutput: `C main.c`, `C util.c`, `D day1.txt`, `D day2.txt`.\n\n> **On paper:** for \"how many times does this loop run?\", write out the list first, then count it.", "questions": [{"id": "for-days", "type": "blanks", "q": "```bash\n#!/bin/bash\nfor day in mon tue wed thu; do\n    echo \"check $day\"\ndone\necho \"finished\"\n```\n\nCount for this script.", "blanks": [{"label": "times the loop body runs", "mode": "num", "accept": ["4"]}, {"label": "lines of output in total", "mode": "num", "accept": ["5"]}], "why": "The list has four words (`mon tue wed thu`), so the body runs 4 times, printing `check mon` … `check thu`. Then the loop ends and `echo \"finished\"` runs **once**: 5 lines in total.\n\n`finished` is after `done`, so it is not part of the loop. Counting 8 lines puts it inside."}, {"id": "for-range", "type": "blanks", "q": "```bash\n#!/bin/bash\nfor i in {3..9}; do\n    echo $(( i * 2 ))\ndone\n```\n\nTrace this script.", "blanks": [{"label": "times the loop body runs", "mode": "num", "accept": ["7"]}, {"label": "first line printed", "mode": "num", "accept": ["6"]}, {"label": "last line printed", "mode": "num", "accept": ["18"]}], "why": "`{3..9}` expands to `3 4 5 6 7 8 9`. Both ends are included: 9 − 3 + 1 = 7 items, so 7 passes. First pass i = 3 → 3 × 2 = 6. Last pass i = 9 → 18.\n\nAnswering 6 passes (9 − 3) is the off-by-one to watch for."}, {"id": "for-glob", "type": "blanks", "q": "```\n$ ls -a\n.  ..  .run3.log  notes.txt  run.log  run1.log  run10.log  run2.log  runA.txt\n```\n\nHow many times does the body of each loop run in this directory?", "blanks": [{"label": "`for f in run?.log; do … done`", "mode": "num", "accept": ["2"]}, {"label": "`for f in *.log; do … done`", "mode": "num", "accept": ["4"]}, {"label": "`for f in run*; do … done`", "mode": "num", "accept": ["5"]}], "why": "Write out each list.\n\n- `run?.log`: exactly one character between `run` and `.log` → `run1.log`, `run2.log`. Not `run.log` (none) or `run10.log` (two). **2**\n- `*.log`: every visible name ending in `.log` → `run.log`, `run1.log`, `run10.log`, `run2.log`. `.run3.log` is hidden. **4**\n- `run*`: every visible name starting with `run` → those four plus `runA.txt`. **5**\n\nCounting `.run3.log`, or letting `?` match zero or two characters, are the two mistakes this is built to catch."}, {"id": "for-total", "type": "blanks", "q": "```bash\n#!/bin/bash\ntotal=0\nfor n in 4 9 2; do\n    total=$(( total + n ))\n    echo \"$total\"\ndone\necho \"sum $total\"\n```\n\nTrace this script.", "blanks": [{"label": "lines of output in total", "mode": "num", "accept": ["4"]}, {"label": "second line", "mode": "num", "accept": ["13"]}, {"label": "last line", "mode": "text", "accept": ["sum 15"]}], "why": "Three items, so three passes, and the `echo` inside the loop prints the running total each time.\n\n| n | total after the line | printed |\n|---|---|---|\n| 4 | 4 | `4` |\n| 9 | 13 | `13` |\n| 2 | 15 | `15` |\n\nAfter `done`: `sum 15`. Four lines in all. Printing `9` as the second line confuses the item with the running total."}]}, {"id": "c-style-for", "title": "C-style for: init, condition, update", "read": "Bash also has a counting loop written like C's, inside **double parentheses**:\n\n```bash\nfor (( init; condition; update )); do\n    commands\ndone\n```\n\n- **Initialization** (for example `i = 0`): runs **once**, before anything else.\n- **Condition** (`i < 4`): tested **before every pass**, including the first. True → run the body. False → the loop is over.\n- **Update** (`i++`): runs **after every pass**; then the condition is tested again.\n\nInside `(( ))` variables are written without `$`, and the comparisons use the ordinary symbols `<`, `<=`, `>`, `>=`, `==`, `!=`. Common updates: `i++` (add 1), `i--` (subtract 1), `i += 3`, `i *= 2`.\n\n### Worked example\n\n```bash\n#!/bin/bash\nfor (( i = 0; i < 4; i++ )); do\n    echo \"i is $i\"\ndone\necho \"after: $i\"\n```\n\n| i | `i < 4`? | what happens |\n|---|---|---|\n| 0 | yes | prints `i is 0`, then i becomes 1 |\n| 1 | yes | prints `i is 1`, then i becomes 2 |\n| 2 | yes | prints `i is 2`, then i becomes 3 |\n| 3 | yes | prints `i is 3`, then i becomes 4 |\n| 4 | no | the loop ends |\n\nThe body ran **4 times** (i = 0, 1, 2, 3). The variable keeps the value that made the condition false, so the last line is `after: 4`.\n\nIf the condition is false the very first time it is tested, the body runs **zero** times.\n\n> **On paper:** list the values that pass the condition, then count them. Be careful at the edge: `i < 4` stops before 4, `i <= 4` includes it.", "questions": [{"id": "cfor-parts", "type": "blanks", "q": "```bash\nfor (( k = 2; k <= 11; k += 3 )); do\n    echo \"$k\"\ndone\n```\n\nName the three parts of the loop header, then count.", "blanks": [{"label": "initialization", "mode": "code", "accept": ["k = 2"]}, {"label": "condition", "mode": "code", "accept": ["k <= 11"]}, {"label": "update", "mode": "code", "accept": ["k += 3", "k = k + 3"]}, {"label": "times the body runs", "mode": "num", "accept": ["4"]}], "why": "The header is always *init; condition; update*, in that order: `k = 2`, `k <= 11`, `k += 3`.\n\nValues of k: 2, 5, 8, 11. 11 <= 11 is true, so 11 is included; the next value, 14, fails. **4** passes.\n\nWith `k < 11` the answer would be 3. The `<=` is the whole question."}, {"id": "cfor-down", "type": "blanks", "q": "```bash\n#!/bin/bash\nfor (( i = 10; i > 0; i -= 3 )); do\n    echo \"$i\"\ndone\necho \"end $i\"\n```\n\nTrace this script.", "blanks": [{"label": "numbers printed by the loop, in order", "mode": "list", "accept": ["10 7 4 1"]}, {"label": "the last line of output", "mode": "text", "accept": ["end -2"]}], "why": "i starts at 10 and drops by 3 for as long as `i > 0`: 10, 7, 4, 1. After the pass with 1, the update makes i = −2; −2 > 0 is false, so the loop stops.\n\ni keeps that value, so the last line is `end -2`.\n\nTwo traps: stopping the list at 4 (1 is still greater than 0), and writing `end 1` (the update runs once more after the final pass)."}, {"id": "cfor-double", "type": "blanks", "q": "```bash\n#!/bin/bash\nfor (( j = 1; j < 20; j *= 2 )); do\n    echo \"$j\"\ndone\n```\n\nTrace this script.", "blanks": [{"label": "numbers printed, in order", "mode": "list", "accept": ["1 2 4 8 16"]}, {"label": "times the body runs", "mode": "num", "accept": ["5"]}], "why": "The update is `j *= 2`, so j doubles after every pass: 1, 2, 4, 8, 16. The next value is 32, and 32 < 20 is false. **5** passes.\n\nCounting 19 or 20 passes assumes the update is `j++`. Always read the update before counting."}, {"id": "cfor-zero", "type": "short", "mode": "text", "q": "```bash\n#!/bin/bash\nfor (( i = 5; i < 5; i++ )); do\n    echo \"loop $i\"\ndone\necho \"end $i\"\n```\n\nWhat is the complete output of this script?", "accept": ["end 5"], "why": "Init: i = 5. The condition is tested **before** the first pass: 5 < 5 is false. The body never runs, and neither does the update.\n\nThe script carries on after `done` and prints `end 5`.\n\nAnswering `loop 5` followed by `end 6` assumes the body always runs at least once. It does not."}]}], "checkpoint": [{"id": "cp-define", "type": "self", "lines": 5, "q": "Without looking back: what is a shell script, and what are scripts used for? Answer in two or three sentences.", "model": "A shell script is an executable text file containing a sequence of shell commands. When it is run, the interpreter named on its shebang line executes those commands in order, top to bottom. Scripts automate tasks that would otherwise be typed by hand every time, and they group several commands into one command that can be rerun exactly (for example a test script that runs a program on every input file and compares each output with `diff`).", "rubric": ["a **text file** (not a compiled program)", "containing a **sequence of shell commands**, run in order", "it is **executable** / run by a shell interpreter such as bash", "purpose: **automate** repeated work and **group** several commands into one"], "why": "This is the first bullet of the objective almost word for word, so the definition is worth knowing by heart: *an executable text file containing a sequence of shell commands*; scripts *automate tasks and group commands*."}, {"id": "cp-python", "type": "short", "mode": "text", "q": "```\n#!/usr/bin/python3\nprint(\"generated by python\")\n```\n\nThis file is named `report.sh`. It has execute permission and is started with `./report.sh`. Type the full path of the program that runs it.", "accept": ["/usr/bin/python3", "python3"], "placeholder": "/…", "why": "The shebang decides, not the file name. `#!/usr/bin/python3` → the OS starts `/usr/bin/python3`, and the output is `generated by python`.\n\n`/bin/bash` is the trap, because of the `.sh` ending. (Start the same file with `bash report.sh` and bash really does read it: the shebang is then only a comment, and bash stops with a syntax error at the `print` line.)"}, {"id": "cp-perm", "type": "blanks", "q": "```\n-rw-r-xr-- 1 student student 164 Oct  9 16:40 deploy.sh\n```\n\nYou are `student`, the owner of this file.", "blanks": [{"label": "does `./deploy.sh` run for you right now? (yes/no)", "mode": "text", "accept": ["no", "n"]}, {"label": "command that adds execute permission for the owner only", "mode": "cmd", "accept": ["chmod u+x deploy.sh", "chmod u+x ./deploy.sh", "chmod 754 deploy.sh", "chmod 0754 deploy.sh", "chmod u=rwx deploy.sh"]}, {"label": "the permission string afterwards", "mode": "cmd", "accept": ["-rwxr-xr--"]}], "why": "The owner's three characters are `rw-`: no execute, so `./deploy.sh` fails with `Permission denied`. The `x` in `r-x` is in the **group** column and does nothing for the owner.\n\n`chmod u+x deploy.sh` turns the owner's third slot into `x` and leaves the rest alone: `-rwxr-xr--`."}, {"id": "cp-order", "type": "blanks", "q": "```bash\n#!/bin/bash\nmsg=\"one\"\necho \"$msg\"\nmsg=\"two\"\nx=5\necho \"$msg $x\"\nx=$(( x + x ))\nmsg=\"$msg-$x\"\necho \"$msg\"\n```\n\nWhat are the three lines of output?", "blanks": [{"label": "line 1", "mode": "text", "accept": ["one"]}, {"label": "line 2", "mode": "text", "accept": ["two 5"]}, {"label": "line 3", "mode": "text", "accept": ["two-10"]}], "why": "Go line by line, updating the variables.\n\n- `msg` = one → prints `one`.\n- `msg` = two, `x` = 5 → prints `two 5`.\n- `x=$(( x + x ))` → x = 10.\n- `msg=\"$msg-$x\"` builds new text from the current values: `two-10` → prints `two-10`.\n\nWriting `one-10` forgets that `msg` was reassigned; writing `two-5` uses x before the arithmetic line."}, {"id": "cp-forif", "type": "blanks", "q": "```bash\n#!/bin/bash\nfor n in 3 8 5 12; do\n    if [ $n -gt 7 ]; then\n        echo \"$n big\"\n    elif [ $n -eq 5 ]; then\n        echo \"$n five\"\n    fi\ndone\necho \"end\"\n```\n\nTrace this script.", "blanks": [{"label": "lines of output in total", "mode": "num", "accept": ["4"]}, {"label": "first line", "mode": "text", "accept": ["8 big"]}, {"label": "second line", "mode": "text", "accept": ["5 five"]}], "why": "Four passes, one per item.\n\n- n = 3: not > 7, not = 5, and there is no `else` → prints nothing.\n- n = 8: 8 > 7 → `8 big`.\n- n = 5: not > 7; equals 5 → `5 five`.\n- n = 12: `12   ];
  const WIDE = TYPES.filter(T => T.n > 1);
  const decl = (T, name) => T.t + (T.ptr ? '' : ' ') + name;
  const sizeNote = T => `\`sizeof(${T.t})\` = ${T.n}`;

  function base() {
    const low = ri(0, 0x1FF) * 8;
    if (Math.random() < 0.55) return ri(1, 0xE) * 0x1000 + low;
    return 0x7FFE00000000 + ri(0, 0xFFFF) * 0x10000 + ri(0, 0xF) * 0x1000 + low;
  }

  // ---------- element addresses ----------
  function elemAddr() {
    const T = pick(WIDE), len = ri(8, 40), b = base(), v = ri(0, 3);
    const d = `\`${decl(T, `a[${len}]`)}\``;
    if (v === 0) {
      const i = ri(2, len - 1), off = i * T.n;
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}). What is the address of \`a[${i}]\`?`,
        accept: [hx(b + off)],
        why: `\`&a[i] = base + i × size\`. ${i} × ${T.n} = ${off} = \`${hx(off)}\`. \`${addr(b)} + ${hx(off)} = ${addr(b + off)}\`. Convert the offset to hex **before** adding.` };
    }
    if (v === 1) {
      const k = ri(3, len - 1); let j = ri(0, len - 1); if (j === k) j = k - 2;
      const ak = b + k * T.n, diff = (j - k) * T.n;
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${d}: the address of \`a[${k}]\` is \`${addr(ak)}\` (${sizeNote(T)}). What is the address of \`a[${j}]\`?`,
        accept: [hx(ak + diff)],
        why: `\`a[${j}]\` is ${Math.abs(j - k)} element${Math.abs(j - k) === 1 ? '' : 's'} ${j > k ? 'after' : 'before'} \`a[${k}]\`: ${Math.abs(j - k)} × ${T.n} = ${Math.abs(diff)} = \`${hx(Math.abs(diff))}\` bytes. \`${addr(ak)} ${diff < 0 ? '−' : '+'} ${hx(Math.abs(diff))} = ${addr(ak + diff)}\`.` };
    }
    if (v === 2) {
      const i = ri(1, len - 1), s = b + i * T.n;
      return { type: 'blanks',
        q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}). Which addresses does \`a[${i}]\` occupy?`,
        blanks: [{ label: 'first (lowest) address', mode: 'hex', accept: [hx(s)] }, { label: 'last (highest) address', mode: 'hex', accept: [hx(s + T.n - 1)] }],
        why: `Start: ${i} × ${T.n} = \`${hx(i * T.n)}\`, so \`${addr(s)}\`. It is ${T.n} bytes long, so it ends ${T.n - 1} later at \`${addr(s + T.n - 1)}\` (not ${T.n} later: that is the next element).` };
    }
    const i = ri(1, len - 1), x = b + i * T.n + ri(0, T.n - 1);
    return { type: 'short', mode: 'num', placeholder: 'index',
      q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}). Which element (index) contains the byte at address \`${addr(x)}\`?`,
      accept: [String(i)],
      why: `Offset = \`${addr(x)} − ${addr(b)}\` = \`${hx(x - b)}\` = ${x - b} bytes. ${x - b} ÷ ${T.n} = ${i} remainder ${(x - b) % T.n}, so it is inside \`a[${i}]\`.` };
  }

  // ---------- hex warm-up ----------
  function hexWarm() {
    const v = ri(0, 3);
    if (v === 0) {
      const a = ri(0x100, 0xFFF) * 4, d = pick([4, 8, 0xC, 0x10, 0x14, 0x18, 0x1C, 0x20, 0x24, 0x28, 0x30, 0x38, 0x40, 0x48, 0x50, 0x64]);
      return { type: 'short', mode: 'hex', placeholder: '0x…', q: `\`${hx(a)} + ${hx(d)}\` = ?`, accept: [hx(a + d)],
        why: `Add digit by digit in base 16, carrying at 16: \`${hx(a)} + ${hx(d)} = ${hx(a + d)}\` (decimal check: ${a} + ${d} = ${a + d}).` };
    }
    if (v === 1) {
      const d = pick([4, 8, 0xC, 0x10, 0x14, 0x18, 0x1C, 0x20, 0x28, 0x30]), a = ri(0x100, 0xFFF) * 4 + d;
      return { type: 'short', mode: 'hex', placeholder: '0x…', q: `\`${hx(a)} − ${hx(d)}\` = ?`, accept: [hx(a - d)],
        why: `Borrow 16 when a digit goes negative: \`${hx(a)} − ${hx(d)} = ${hx(a - d)}\` (decimal check: ${a} − ${d} = ${a - d}).` };
    }
    if (v === 2) {
      const n = ri(3, 31), s = pick([2, 4, 8]);
      return { type: 'short', mode: 'hex', placeholder: '0x…', q: `An index of ${n} into an array of ${s}-byte elements is an offset of how many bytes? Answer **in hex**.`, accept: [hx(n * s)],
        why: `${n} × ${s} = ${n * s} decimal = \`${hx(n * s)}\` (${Math.floor(n * s / 16)} sixteens and ${(n * s) % 16} ones).` };
    }
    const a = ri(0x100, 0xFFF) * 4, n = ri(2, 30), s = pick([2, 4, 8]);
    return { type: 'short', mode: 'num', placeholder: 'count', q: `Two elements of an array of ${s}-byte values are at \`${hx(a)}\` and \`${hx(a + n * s)}\`. How many elements apart are they?`, accept: [String(n)],
      why: `\`${hx(a + n * s)} − ${hx(a)} = ${hx(n * s)}\` = ${n * s} bytes. ${n * s} ÷ ${s} = ${n} elements.` };
  }

  // ---------- little-endian ----------
  function distinctBytes(n) {
    const out = [];
    while (out.length < n) { const b = ri(0x01, 0xFE); if (!out.includes(b)) out.push(b); }
    return out;
  }
  const b2 = n => n.toString(16).toUpperCase().padStart(2, '0');
  function dumpTable(a, bytes) {
    return '| address | byte |\n|---|---|\n' + bytes.map((x, i) => `| \`${addr(a + i)}\` | \`${b2(x)}\` |`).join('\n');
  }
  function littleEndian() {
    const v = ri(0, 2), a = base();
    if (v === 0) {
      const n = pick([4, 4, 8]), bytes = distinctBytes(n), k = ri(0, n - 1);
      const val = '0x' + bytes.slice().reverse().map(b2).join('');
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `A ${n}-byte value \`${val}\` is stored at address \`${addr(a)}\` on a little-endian machine. Which byte is at address \`${addr(a + k)}\`?`,
        accept: ['0x' + b2(bytes[k])],
        why: `Little-endian: the **least significant byte goes at the lowest address**. From \`${addr(a)}\` upward the bytes are ${bytes.map(b => '`' + b2(b) + '`').join(', ')}. \`${addr(a + k)}\` is byte ${k}, so \`0x${b2(bytes[k])}\`.` };
    }
    if (v === 1) {
      const bytes = distinctBytes(8), n = pick([2, 4, 4, 8]), off = n === 8 ? 0 : ri(0, 8 - n);
      const got = bytes.slice(off, off + n);
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `Memory on a little-endian machine:\n\n${dumpTable(a, bytes)}\n\nWhat value does a \`uint${n * 8}_t\` read from address \`${addr(a + off)}\` have? Answer in hex.`,
        accept: ['0x' + got.slice().reverse().map(b2).join('')],
        why: `Take ${n} bytes starting at \`${addr(a + off)}\`: ${got.map(b => '`' + b2(b) + '`').join(' ')}. The lowest address holds the least significant byte, so write them in **reverse**: \`0x${got.slice().reverse().map(b2).join('')}\`.` };
    }
    const n = pick([2, 4]), bytes = distinctBytes(n);
    const val = '0x' + bytes.slice().reverse().map(b2).join('');
    return { type: 'blanks',
      q: `On a little-endian machine, a \`uint${n * 8}_t\` at address \`${addr(a)}\` is set to \`${val}\`. What is in each byte?`,
      blanks: bytes.map((b, i) => ({ label: `byte at ${addr(a + i)}`, mode: 'hex', accept: ['0x' + b2(b)] })),
      why: `Least significant byte first: ${bytes.map((b, i) => `\`${addr(a + i)}\` = \`${b2(b)}\``).join(', ')}. Only the order of whole **bytes** flips, never the two hex digits inside a byte.` };
  }

  // ---------- pointer arithmetic ----------
  function ptrArith() {
    const T = pick(TYPES.filter(x => !x.ptr)), v = ri(0, 4);
    const p = Math.floor(base() / 8) * 8, n = ri(2, 12);
    const d = `\`${T.t} *p = (${T.t} *)${addr(p)};\``;
    if (v === 0 || v === 1) {
      const expr = v === 0 ? pick([`p + ${n}`, `&p[${n}]`]) : `p - ${n}`;
      const r = v === 0 ? p + n * T.n : p - n * T.n;
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${d} (${sizeNote(T)})\n\nWhat address is \`${expr}\`?`,
        accept: [hx(r)],
        why: `Pointer arithmetic moves in **elements**, not bytes: ${n} × ${T.n} = ${n * T.n} = \`${hx(n * T.n)}\` bytes. \`${addr(p)} ${v === 0 ? '+' : '−'} ${hx(n * T.n)} = ${addr(r)}\`.${T.n > 1 ? ` Adding a raw ${n} gives \`${addr(v === 0 ? p + n : p - n)}\`, which is wrong.` : ''}` };
    }
    if (v === 2) {
      const W = pick(WIDE.filter(x => !x.ptr));
      const dd = `\`${W.t} *p = (${W.t} *)${addr(p)};\``;
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${dd} (${sizeNote(W)})\n\nWhat address is \`(char *)p + ${n}\`?`,
        accept: [hx(p + n)],
        why: `The cast happens first, so the arithmetic is on a \`char *\` and each step is 1 byte: \`${addr(p)} + ${hx(n)} = ${addr(p + n)}\`. Without the cast it would be ${n} × ${W.n} = \`${hx(n * W.n)}\` bytes.` };
    }
    if (v === 3) {
      const W = pick(WIDE.filter(x => !x.ptr)), q = p + n * W.n;
      return { type: 'short', mode: 'num', placeholder: 'number',
        q: `\`${W.t} *p\` holds \`${addr(p)}\` and \`${W.t} *q\` holds \`${addr(q)}\` (${sizeNote(W)}). What is the value of \`q - p\`?`,
        accept: [String(n)],
        why: `Subtracting pointers gives a count of **elements**: \`${addr(q)} − ${addr(p)} = ${hx(n * W.n)}\` = ${n * W.n} bytes, and ${n * W.n} ÷ ${W.n} = ${n}.` };
    }
    const W = pick(WIDE.filter(x => !x.ptr)), times = ri(2, 6);
    return { type: 'short', mode: 'hex', placeholder: '0x…',
      q: `\`${W.t} *p = (${W.t} *)${addr(p)};\` (${sizeNote(W)})\n\nAfter \`p++;\` runs ${times} times, what address does \`p\` hold?`,
      accept: [hx(p + times * W.n)],
      why: `Each \`p++\` advances one element = ${W.n} bytes. ${times} × ${W.n} = \`${hx(times * W.n)}\`. \`${addr(p)} + ${hx(times * W.n)} = ${addr(p + times * W.n)}\`.` };
  }

  // ---------- floating point ----------
  function fpFormat() {
    const k = pick([2, 3, 3, 4]), f = pick([2, 3, 4, 4, 5]);
    return { k, f, bias: (1 << (k - 1)) - 1, maxE: (1 << k) - 1 };
  }
  const fmtText = F => `1 sign bit, ${F.k} exponent bits, ${F.f} fraction bits (${1 + F.k + F.f} bits total, bias = 2^{k−1} − 1)`;
  const bin = (n, w) => n.toString(2).padStart(w, '0');
  const pattern = (F, s, e, m) => `${s} ${bin(e, F.k)} ${bin(m, F.f)}`;
  function fpValue(F, s, e, m) {
    const sg = s ? -1 : 1;
    if (e === 0) return m === 0 ? { cls: 'zero', v: sg * 0 } : { cls: 'denormalized', v: sg * (m / (1 << F.f)) * Math.pow(2, 1 - F.bias) };
    if (e === F.maxE) return m === 0 ? { cls: 'infinity', v: sg * Infinity } : { cls: 'NaN', v: NaN };
    return { cls: 'normalized', v: sg * (1 + m / (1 << F.f)) * Math.pow(2, e - F.bias) };
  }
  const CLS = {
    normalized: ['normalized', 'normal', 'norm'],
    denormalized: ['denormalized', 'denormal', 'denorm', 'subnormal', 'denormalised'],
    zero: ['zero', '0', '+0', '-0'],
    infinity: ['infinity', 'inf', '+infinity', '-infinity', '+inf', '-inf', '∞', '+∞', '-∞'],
    NaN: ['nan', 'not a number'],
  };
  const signed = v => (Object.is(v, -0) ? '−0' : v === 0 ? '+0' : v === Infinity ? '+∞' : v === -Infinity ? '−∞' : (v > 0 ? '+' : '−') + Math.abs(v));
  const numAccept = v => (Number.isNaN(v) ? ['nan'] : v === Infinity ? ['inf'] : v === -Infinity ? ['-inf'] : [String(v)]);

  function fpWhy(F, s, e, m) {
    const r = fpValue(F, s, e, m), frac = bin(m, F.f), sg = s ? 'negative' : 'positive';
    const head = `Bias = 2^{${F.k}−1} − 1 = ${F.bias}. Sign bit ${s} → ${sg}. Exponent field \`${bin(e, F.k)}\` = ${e}. `;
    if (r.cls === 'zero') return head + `All-zero exponent **and** all-zero fraction → **${s ? '−0' : '+0'}**.`;
    if (r.cls === 'infinity') return head + `All-ones exponent with a zero fraction → **${s ? '−∞' : '+∞'}**.`;
    if (r.cls === 'NaN') return head + `All-ones exponent with a non-zero fraction → **NaN** (the sign doesn't matter).`;
    if (r.cls === 'denormalized')
      return head + `All-zero exponent with a non-zero fraction → **denormalized**: no implicit 1, and the exponent is fixed at 1 − bias = ${1 - F.bias}. Value = 0.${frac}₂ × 2^{${1 - F.bias}} = ${m / (1 << F.f)} × ${Math.pow(2, 1 - F.bias)} = **${signed(r.v)}**.`;
    return head + `Neither all zeros nor all ones → **normalized**. True exponent = ${e} − ${F.bias} = ${e - F.bias}. Value = 1.${frac}₂ × 2^{${e - F.bias}} = ${1 + m / (1 << F.f)} × ${Math.pow(2, e - F.bias)} = **${signed(r.v)}**.`;
  }

  function randomPattern(F, allowSpecial) {
    const s = ri(0, 1), r = Math.random();
    if (allowSpecial && r < 0.08) return [s, F.maxE, 0];
    if (allowSpecial && r < 0.16) return [s, F.maxE, ri(1, (1 << F.f) - 1)];
    if (allowSpecial && r < 0.2) return [s, 0, 0];
    if (r < 0.5) return [s, 0, ri(1, (1 << F.f) - 1)];
    return [s, ri(1, F.maxE - 1), ri(0, (1 << F.f) - 1)];
  }

  function fpDecode() {
    const F = fpFormat(), [s, e, m] = randomPattern(F, true), r = fpValue(F, s, e, m);
    return { type: 'blanks',
      q: `Format: ${fmtText(F)}.\n\nDecode \`${pattern(F, s, e, m)}\`.`,
      blanks: [
        { label: 'bias', mode: 'num', accept: [String(F.bias)] },
        { label: 'kind (normalized / denormalized / zero / infinity / NaN)', mode: 'text', accept: CLS[r.cls] },
        { label: 'value (decimal, with its sign; inf or nan if special)', mode: 'num', accept: numAccept(r.v) },
      ],
      why: fpWhy(F, s, e, m) };
  }

  function fpEncode() {
    const F = fpFormat(), [s, e, m] = randomPattern(F, false), r = fpValue(F, s, e, m);
    return { type: 'short', mode: 'bits', placeholder: `${1 + F.k + F.f} bits`,
      q: `Format: ${fmtText(F)}.\n\nEncode **${signed(r.v)}**. Give all ${1 + F.k + F.f} bits.`,
      accept: [pattern(F, s, e, m)],
      why: (r.cls === 'denormalized'
        ? `Bias = ${F.bias}. Try normalized first: |value| = ${Math.abs(r.v)} would need a stored exponent of ${Math.floor(Math.log2(Math.abs(r.v))) + F.bias}, which is ≤ 0, so it has to be **denormalized**: exponent field all zeros, value = 0.f × 2^{${1 - F.bias}}. 0.f = ${Math.abs(r.v)} ÷ ${Math.pow(2, 1 - F.bias)} = ${m / (1 << F.f)} = 0.${bin(m, F.f)}₂. `
        : `Bias = ${F.bias}. |value| = ${Math.abs(r.v)} = 1.${bin(m, F.f)}₂ × 2^{${e - F.bias}}. Stored exponent = ${e - F.bias} + ${F.bias} = ${e} = \`${bin(e, F.k)}\`. Fraction = the bits after the leading 1, padded to ${F.f}: \`${bin(m, F.f)}\`. `)
        + `Sign bit ${s}. Pattern: \`${pattern(F, s, e, m)}\`.` };
  }

  function fpExtremes() {
    const F = fpFormat(), ones = (1 << F.f) - 1;
    const cases = [
      ['largest positive **normalized**', 0, F.maxE - 1, ones, 'largest exponent that is not all ones, fraction all ones'],
      ['smallest positive **normalized**', 0, 1, 0, 'exponent field 1 (the smallest that is not all zeros), fraction all zeros'],
      ['largest positive **denormalized**', 0, 0, ones, 'exponent all zeros, fraction all ones'],
      ['smallest positive **denormalized** (the smallest positive value at all)', 0, 0, 1, 'exponent all zeros, fraction 0…01'],
    ];
    const [name, s, e, m, how] = pick(cases), r = fpValue(F, s, e, m);
    return { type: 'blanks',
      q: `Format: ${fmtText(F)}.\n\nWhat is the ${name} value?`,
      blanks: [
        { label: `bit pattern (${1 + F.k + F.f} bits)`, mode: 'bits', accept: [pattern(F, s, e, m)] },
        { label: 'value (decimal, a fraction, or like 1.75*2^3)', mode: 'num', accept: [String(r.v)] },
      ],
      why: `Pattern: ${how} → \`${pattern(F, s, e, m)}\`. ` + fpWhy(F, s, e, m) };
  }

  // ---------- 2D arrays ----------
  function arr2d() {
    const T = pick(WIDE.filter(x => !x.ptr)), R = ri(3, 9), C = ri(3, 9), b = base(), v = ri(0, 3);
    const i = ri(1, R - 1), j = ri(0, C - 1), lin = i * C + j;
    const d = `\`${T.t} a[${R}][${C}]\``;
    if (v === 0)
      return { type: 'short', mode: 'num', placeholder: 'index',
        q: `${d} is stored in row-major order. What is the linear index (0-based position in the flat block) of \`a[${i}][${j}]\`?`,
        accept: [String(lin)],
        why: `linear index = i × C + j = ${i} × ${C} + ${j} = **${lin}**. Multiply by the number of **columns** (${C}), not rows (${R})${R !== C ? `: ${i} × ${R} + ${j} = ${i * R + j} is the classic slip` : ''}.` };
    if (v === 1)
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}), row-major. What is the address of \`a[${i}][${j}]\`?`,
        accept: [hx(b + lin * T.n)],
        why: `Linear index = ${i} × ${C} + ${j} = ${lin}. Byte offset = ${lin} × ${T.n} = ${lin * T.n} = \`${hx(lin * T.n)}\`. \`${addr(b)} + ${hx(lin * T.n)} = ${addr(b + lin * T.n)}\`.` };
    if (v === 2)
      return { type: 'blanks',
        q: `${d} is row-major. Which element is at linear index ${lin}?`,
        blanks: [{ label: 'row i', mode: 'num', accept: [String(i)] }, { label: 'column j', mode: 'num', accept: [String(j)] }],
        why: `i = ${lin} ÷ ${C} = ${i} (integer division by the column count), j = ${lin} mod ${C} = ${j}. So \`a[${i}][${j}]\`.` };
    return { type: 'blanks',
      q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}), row-major. Which element is stored at address \`${addr(b + lin * T.n)}\`?`,
      blanks: [{ label: 'row i', mode: 'num', accept: [String(i)] }, { label: 'column j', mode: 'num', accept: [String(j)] }],
      why: `Offset = \`${hx(lin * T.n)}\` = ${lin * T.n} bytes → ${lin * T.n} ÷ ${T.n} = linear index ${lin}. i = ${lin} ÷ ${C} = ${i}, j = ${lin} mod ${C} = ${j}.` };
  }

  // ---------- first-fit heap ----------
  // free list = sorted [start, size] blocks; first fit, split, coalesce; no headers
  function heapSim(size, ops) {
    let free = [[0, size]];
    const live = {}, log = [];
    const show = () => (free.length ? free.map(([s, n]) => `${s}-${s + n - 1}`).join(', ') : 'empty');
    for (const op of ops) {
      if (op.malloc) {
        const idx = free.findIndex(([, n]) => n >= op.malloc);
        if (idx < 0) { live[op.p] = null; log.push([`${op.p} = malloc(${op.malloc})`, 'NULL (no single free block is big enough)', show()]); continue; }
        const [s, n] = free[idx];
        live[op.p] = [s, op.malloc];
        if (n === op.malloc) free.splice(idx, 1); else free[idx] = [s + op.malloc, n - op.malloc];
        log.push([`${op.p} = malloc(${op.malloc})`, `${s}-${s + op.malloc - 1}`, show()]);
      } else {
        if (!live[op.free]) { log.push([`free(${op.free})`, 'free(NULL) does nothing', show()]); continue; }
        const [s, n] = live[op.free];
        delete live[op.free];
        free.push([s, n]);
        free.sort((a, b) => a[0] - b[0]);
        const merged = [];
        for (const blk of free) {
          const last = merged[merged.length - 1];
          if (last && last[0] + last[1] === blk[0]) last[1] += blk[1]; else merged.push(blk.slice());
        }
        free = merged;
        log.push([`free(${op.free})`, `${s}-${s + n - 1} returned`, show()]);
      }
    }
    return { free, live, log, show: show() };
  }

  function firstFit() {
    for (let attempt = 0; attempt < 200; attempt++) {
      const size = pick([800, 1000, 1000, 1200]), ops = [], live = [];
      let np = 0, frees = 0;
      const count = ri(6, 8);
      for (let k = 0; k < count; k++) {
        const last = k === count - 1;
        if (!last && live.length >= 2 && Math.random() < 0.45) { ops.push({ free: live.splice(ri(0, live.length - 1), 1)[0] }); frees++; }
        else { np++; ops.push({ p: 'p' + np, malloc: ri(1, 8) * 50 }); live.push('p' + np); }
      }
      if (frees < 2) continue;
      const sim = heapSim(size, ops);
      const nulls = Object.entries(sim.live).filter(([, v]) => v === null).map(([k]) => k);
      const lastP = 'p' + np;
      if (nulls.some(p => p !== lastP)) continue;
      if (nulls.length && Math.random() < 0.6) continue;
      const code = ops.map(o => (o.malloc ? `char *${o.p} = malloc(${o.malloc});` : `free(${o.free});`)).join('\n');
      const liveNames = Object.keys(sim.live).filter(p => sim.live[p]).sort((a, b) => +a.slice(1) - +b.slice(1));
      const blanks = liveNames.filter(p => p !== lastP).slice(-2).map(p => ({ label: `${p} starts at byte`, mode: 'num', accept: [String(sim.live[p][0])] }));
      blanks.push(sim.live[lastP]
