the data it points to. That is a **dangling pointer**, and dereferencing it is undefined behaviour: the next function call reuses those bytes for its own frame.\n\n> **Rule:** never return the address of a local variable. Return the value itself, or put the data somewhere that outlives the call (the heap, next part).\n\nBoth errors come from the same fact: stack memory belongs to a call, and it is limited in size and in lifetime.", "questions": [{"id": "overflow-id", "type": "mc", "q": "Which program is most likely to end in a **stack overflow**?", "options": ["One whose function calls itself and has no base case", "One that calls `malloc` inside a loop and never calls `free`", "One that dereferences a pointer whose value is `NULL`", "One that returns the address of a local variable and never uses it"], "answer": 0, "why": "Unbounded recursion pushes a frame per call until the stack has no room left. The `malloc` loop is a memory **leak** on the heap, not a stack problem. Dereferencing NULL is a segmentation fault that has nothing to do with stack size. Returning `&local` creates a dangling pointer."}, {"id": "dangle-name", "type": "short", "mode": "text", "q": "What is the name for a pointer that outlives the data it points to, such as the one `make_score` returns?", "accept": ["dangling pointer", "dangling", "a dangling pointer", "dangling pointers"], "acceptRe": ["^(a )?dangling( pointer)?s?$"], "placeholder": "two words", "why": "A **dangling pointer**. The address is still stored in the pointer, but the frame that held `score` was deallocated when the function returned."}, {"id": "dangle-why", "type": "mc", "q": "Why is `return &score;` in `make_score` a bug?", "options": ["`score` lives in `make_score`'s frame, and that frame is deallocated when the function returns", "`&` cannot be applied to a local variable, only to globals and heap blocks, so the address is meaningless", "The address of an `int32_t` is 4 bytes, which does not fit in the function's 8-byte return value", "Locals are stored in the data segment, which is read-only, so the caller cannot use the address"], "answer": 0, "why": "Taking the address of a local is fine while the function is running. The problem is lifetime: the frame is popped at the return, and the caller is left holding the address of dead stack memory. Every address is 8 bytes whatever it points to, and locals are on the stack, not in data."}, {"id": "rec-frames", "type": "short", "mode": "num", "q": "`main` calls `sum_to(4)`.\n\n```c\nint32_t sum_to(int32_t n) {\n    if (n == 0) return 0;\n    return n + sum_to(n - 1);\n}\n```\n\nAt the deepest point of the recursion, how many frames are on the stack, counting `main`'s?", "accept": ["6"], "why": "Calls in progress at the deepest point: `sum_to(4)`, `(3)`, `(2)`, `(1)`, `(0)` = 5 frames, plus `main` = **6**. Answering 5 forgets either `main` or the `n == 0` call, which still gets a frame even though it returns straight away. (Counted by running the program: deepest = 6, result 10.)"}]}, {"id": "heap-overview", "title": "The heap: memory you manage yourself", "read": "Sometimes a program cannot know how much memory it needs until it is running, for example when the user types how many students are in a class. Memory requested at run time comes from the **heap**.\n\n- `malloc(bytes)` finds a free block of that many bytes on the heap and returns its **address**.\n- `realloc(ptr, new_size)` grows or shrinks a block you already have.\n- `free(ptr)` gives a block back.\n\nThe heap is **manual**. Nothing is freed for you: a block stays allocated **until you explicitly free it**, even after the function that called `malloc` has returned. That is exactly what the stack cannot offer.\n\n| | Stack | Heap |\n|---|---|---|\n| Managed | automatically | manually, by the programmer |\n| Holds | function stack frames | dynamically allocated memory |\n| Allocated | when a function is called | when you call `malloc` or `realloc` |\n| Freed | when the function returns | only when you call `free` |\n| Grows | toward lower addresses | toward higher addresses, as needed |\n\nPutting the segments together, C has three **lifetimes**:\n\n| Lifetime | What has it | Segment |\n|---|---|---|\n| automatic | local variables and parameters | stack |\n| static | globals and `static` variables | data |\n| dynamic | blocks from `malloc` / `realloc` | heap |\n\n### Worked example\n\nThe dangling-pointer bug from the last part, repaired with the heap:\n\n```c\nint32_t *make_score(void) {\n    int32_t *score = malloc(sizeof(int32_t));   // 4 bytes on the heap\n    *score = 90;\n    return score;       // fine: the block is still there after the return\n}\n```\n\n`score` itself is a local, so it disappears with the frame. The value it held, the address of the heap block, was returned first, and the block lives on until the caller frees it.\n\nHow `malloc` and `free` find and recycle blocks, and the errors that go with them (leaks, double free, use-after-free), have their own section. Here you only need the overview above.", "questions": [{"id": "stack-or-heap", "type": "blanks", "q": "Type `stack` or `heap` for each description.", "blanks": [{"label": "freed automatically when a function returns", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "where a block from malloc lives", "mode": "text", "accept": ["heap", "the heap", "heap segment"]}, {"label": "grows toward higher addresses", "mode": "text", "accept": ["heap", "the heap", "heap segment"]}, {"label": "holds return addresses", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "stays allocated until the programmer frees it", "mode": "text", "accept": ["heap", "the heap", "heap segment"]}], "why": "Stack = automatic, one frame per call (parameters, return address, locals), freed on return, grows toward lower addresses. Heap = manual, `malloc`/`realloc`, lasts until `free`, grows toward higher addresses."}, {"id": "lifetime-seg", "type": "blanks", "q": "Which segment goes with each lifetime?", "blanks": [{"label": "automatic lifetime", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "static lifetime", "mode": "text", "accept": ["data", "the data segment", "data segment", "the data"]}, {"label": "dynamic lifetime", "mode": "text", "accept": ["heap", "the heap", "heap segment"]}], "why": "Automatic = locals and parameters, in a frame on the **stack**. Static = globals and `static` variables, in **data** for the whole run. Dynamic = from `malloc` until `free`, on the **heap**. \"Static → stack\" is the mix-up to avoid: the two words only look alike."}, {"id": "heap-after-return", "type": "mc", "q": "In the worked example, `make_score` uses `malloc`. Right after it returns, which statement is true?", "options": ["The local `score` is gone with the frame, but the 4-byte block still holds 90 and stays valid until it is freed", "The block was freed automatically, because the function that allocated it has returned and its frame is gone", "The block was moved into the caller's stack frame along with the return value, so it is still usable there", "Both the local `score` and the block stay in memory until the program ends, since `malloc` made them together"], "answer": 0, "why": "Only the *stack* is cleaned up on return. `score` (the 8-byte pointer variable) was in the frame and is gone; the heap block it pointed to is untouched and stays allocated until `free`. Nothing ever moves a heap block onto the stack. (Run for real: the caller still reads 90 after other functions have reused the stack.)"}]}, {"id": "grow", "title": "Which way they grow, and what an address tells you", "read": "The text and data segments have a fixed size. The heap and the stack change size while the program runs, and they are placed at opposite ends of one big gap:\n\n```\n Highest address\n   Stack     grows DOWN, toward lower addresses, on every call\n     ↓\n\n  (free space, shared)\n\n     ↑\n   Heap      grows UP, toward higher addresses, as needed\n   Data\n   Text\n   Operating System\n Lowest address\n```\n\n- The **stack** starts at the highest addresses and grows **toward lower addresses** when functions are called (and shrinks back when they return).\n- The **heap** starts just above data and grows **toward higher addresses** \"as needed\".\n- They grow toward each other and share the free space between them: \"if one ends up needing more memory than the other, they're kind of sharing this space.\"\n\nBecause the order of the segments is fixed, an address tells you what kind of thing it belongs to:\n\n> **Rule:** on lecture's map, any text address < any data address < any heap address < any stack address.\n\nAnd within the stack, a function that was called later (deeper) has its frame at a **lower** address than its caller.\n\n### Worked example\n\nA program prints four addresses with `%p`:\n\n| Printed | Smallest to largest | So it is |\n|---|---|---|\n| `0x000000411030` | 2nd | a global (data) |\n| `0xfffff3d1a8bc` | 4th (largest) | a local variable (stack) |\n| `0x0000004006b4` | 1st (smallest) | a function's code (text) |\n| `0x00000a5c82a0` | 3rd | a `malloc` block (heap) |\n\nYou do not need to subtract anything. Compare the hex digits from the left: the stack address begins `ffff…`, far above the others, and that pattern is typical of stack addresses on the slides.\n\n> **Trap:** \"the stack grows down\" describes addresses, not the page. If a diagram is drawn with the lowest address at the top, the stack grows *up the page*, and it is still growing toward lower addresses.", "questions": [{"id": "grow-dir", "type": "blanks", "q": "Type `higher` or `lower`.", "blanks": [{"label": "the heap grows toward ___ addresses", "mode": "text", "accept": ["higher", "high", "higher addresses"]}, {"label": "the stack grows toward ___ addresses", "mode": "text", "accept": ["lower", "low", "lower addresses"]}, {"label": "a push makes the stack pointer ___", "mode": "text", "accept": ["lower", "low", "smaller", "decrease", "decreases"]}], "why": "Heap: up, toward **higher** addresses. Stack: down, toward **lower** addresses, so each push leaves sp at a **lower** address. They grow toward each other through the shared free space."}, {"id": "deeper-lower", "type": "mc", "q": "`main` calls `f`. A local variable of `main` is at `0xfffff3d1a8bc`. Which of these could be the address of a local variable of `f`?", "options": ["`0xfffff3d1a88c`", "`0xfffff3d1a8ec`", "`0x000000411030`", "`0x00000a5c82a0`"], "answer": 0, "why": "`f`'s frame is pushed after `main`'s, so it is at a slightly **lower** stack address: `…a88c` < `…a8bc`. `…a8ec` is higher, which would mean the stack grew upward. The other two are far too low to be stack addresses (they look like data and heap)."}, {"id": "addr-sort", "type": "blanks", "q": "A program prints these four addresses, one each for: the code of `main`, a global variable, a block returned by `malloc`, and a local variable of `main`.\n\n```\n0x00000b20c4e0\n0x0000004009d8\n0xffffe71b3a44\n0x000000412018\n```\n\nWhich address is which?", "blanks": [{"label": "the code of main", "mode": "hex", "accept": ["0x0000004009d8"]}, {"label": "the global variable", "mode": "hex", "accept": ["0x000000412018"]}, {"label": "the malloc block", "mode": "hex", "accept": ["0x00000b20c4e0"]}, {"label": "the local variable", "mode": "hex", "accept": ["0xffffe71b3a44"]}], "why": "Sort them: `0x…4009d8` < `0x…412018` < `0x…b20c4e0` < `0xffffe71b3a44`. Segment order from low to high is text, data, heap, stack, so they are code, global, heap block, local. The mistake is to give the local the smallest address because \"the stack grows down\": it grows down *from the top* of memory.", "hint": "Sort the four addresses from smallest to largest, then match them to text, data, heap, stack in that order."}]}, {"id": "addr-bits", "title": "How many bits does an address need?", "read": "Every byte of memory needs its own address, so the size of memory decides how long an address has to be.\n\n> **Rule:** bits needed = log₂(number of bytes). Going the other way, k bits can address 2^{k} bytes.\n\nWith 8 bytes of memory the addresses are `000` to `111`: log₂ 8 = **3 bits**. With 16 bytes: **4 bits**. Each extra bit doubles what you can reach.\n\nSizes to know as powers of two:\n\n| Unit | Bytes |\n|---|---|\n| 1 KB | 2^{10} |\n| 1 MB | 2^{20} |\n| 1 GB | 2^{30} |\n| 1 TB | 2^{40} |\n\n### Worked examples\n\n- **1 GB of memory** = 2^{30} bytes → log₂(2^{30}) = **30 bits**.\n- **A 32-bit address** reaches 2^{32} bytes = 2^{2} × 2^{30} = **4 GB**. To convert bytes to GB, subtract 30 from the exponent.\n- **A 64-bit address** reaches 2^{64} bytes = 2^{34} × 2^{30} = 2^{34} GB, about 17 billion GB.\n\n### Why every pointer is 8 bytes\n\n4 GB stopped being enough, so processors moved from 32-bit to 64-bit addresses (largely complete by 2010). An address is now 64 bits = **8 bytes**, and a pointer is a variable that holds an address. Lecture's summary: \"64 bits is 8 bytes. That's why all pointers are 8 bytes.\"\n\nMost 64-bit CPUs actually use only **48 to 52** of those bits. The upper bits are reserved for future use and are 0 for now. Lecture's working number is **48 bits**, which already covers 2^{48} bytes = 2^{8} × 2^{40} = **256 TB**. That is why the addresses on the slides, such as `0xfffffdd26e5c`, show 12 hex digits: 12 × 4 = 48 bits.\n\n> **On paper:** write the size as a power of two first, then read off or subtract exponents. \"8 GB\" is 2^{3} × 2^{30} = 2^{33} bytes, so it needs 33 bits.", "questions": [{"id": "bits-64b", "type": "short", "mode": "num", "q": "A tiny memory holds 64 bytes. How many bits does an address need?", "accept": ["6"], "why": "64 = 2^{6}, so log₂ 64 = **6 bits** (addresses `000000` to `111111`). 8 would be the answer for 256 bytes; 64 is the number of bytes, not bits."}, {"id": "ptr-facts", "type": "blanks", "q": "Fill in the facts about addresses on the class's 64-bit machine.", "blanks": [{"label": "size of an address, in bits", "mode": "num", "accept": ["64"]}, {"label": "size of every pointer variable, in bytes", "mode": "num", "accept": ["8"]}, {"label": "bits of the address actually used (lecture's working number)", "mode": "num", "accept": ["48"]}, {"label": "hex digits needed to write that many bits", "mode": "num", "accept": ["12"]}], "why": "Addresses are 64 bits = 8 bytes, so every pointer is **8 bytes**. Only the lower **48** bits are in use (the range is 48 to 52; the upper bits are 0), and 48 ÷ 4 = **12** hex digits, which is how the slides print addresses."}, {"id": "bits-8gb", "type": "short", "mode": "num", "q": "How many bits are needed to address 8 GB of memory? (1 GB = 2^{30} bytes.)", "accept": ["33"], "why": "8 GB = 2^{3} × 2^{30} = 2^{33} bytes → **33 bits**. Answering 3 forgets the 30 for \"GB\"; answering 38 adds 8 instead of log₂ 8."}, {"id": "reach-36", "type": "short", "mode": "num", "q": "How many **GB** of memory can a 36-bit address reach?", "accept": ["64", "2^6"], "placeholder": "GB", "why": "2^{36} bytes ÷ 2^{30} bytes per GB = 2^{6} = **64 GB**. Subtract exponents; do not divide 36 by 30."}]}], "checkpoint": [{"id": "cp-draw", "type": "blanks", "q": "Draw the memory of a running program. On this diagram **Lowest address: 0** is printed beside the *top* box. Name the region in each box, then answer the two growth questions with `up` or `down` **as seen on this page**.", "blanks": [{"label": "box 1 (top of page, lowest address)", "mode": "text", "accept": ["operating system", "os", "the operating system", "the os"]}, {"label": "box 2", "mode": "text", "accept": ["text", "code", "text segment", "code segment", "the text segment", "the code segment", "text/code", "code/text"]}, {"label": "box 3", "mode": "text", "accept": ["data", "the data segment", "data segment", "the data"]}, {"label": "box 4", "mode": "text", "accept": ["heap", "the heap", "heap segment"]}, {"label": "box 5 (bottom of page, highest address)", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "on this page, the heap grows", "mode": "text", "accept": ["down", "downward", "downwards"]}, {"label": "on this page, the stack grows", "mode": "text", "accept": ["up", "upward", "upwards"]}], "why": "From address 0: OS, text, data, heap, stack. With low addresses at the top of the page, \"toward higher addresses\" is **down the page** for the heap, and \"toward lower addresses\" is **up the page** for the stack. They still grow toward each other. Writing \"stack grows down\" here means you memorised the picture rather than the rule."}, {"id": "cp-classify", "type": "blanks", "q": "Give the segment (`text`, `data`, `heap` or `stack`) for each item.\n\n```c\n#include <stdint.h>\n#include <stdlib.h>\n\n#define CAP 4\n\nint16_t readings[CAP];\nstatic int32_t errors = 0;\n\nint16_t *copy_readings(int32_t count) {\n    int16_t *dup = malloc(count * sizeof(int16_t));\n    for (int32_t i = 0; i < count; i++) {\n        dup[i] = readings[i];\n    }\n    return dup;\n}\n\nint main(void) {\n    int16_t *mine = copy_readings(CAP);\n    static int32_t runs = 0;\n    runs++;\n    free(mine);\n    return 0;\n}\n```", "blanks": [{"label": "readings", "mode": "text", "accept": ["data", "the data segment", "data segment", "the data"]}, {"label": "errors", "mode": "text", "accept": ["data", "the data segment", "data segment", "the data"]}, {"label": "count", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "dup (the pointer variable)", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "dup[2]", "mode": "text", "accept": ["heap", "the heap", "heap segment"]}, {"label": "i", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "mine (the pointer variable)", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "runs", "mode": "text", "accept": ["data", "the data segment", "data segment", "the data"]}], "why": "Declared outside every function (`readings`) or with `static` (`errors`, `runs`): **data**. Parameters and locals (`count`, `dup`, `i`, `mine`): **stack**. `dup[2]` is inside the block `malloc` returned: **heap**. Watch `runs` (static inside `main`, still data) and `dup` versus `dup[2]` (the pointer is on the stack, the elements are on the heap).", "hint": "Place a pointer and the thing it points at separately. `dup` and `dup[2]` are not in the same segment."}, {"id": "cp-define", "type": "mc", "q": "In the program above, where is `CAP` stored while the program runs?", "options": ["Nowhere: the preprocessor replaces `CAP` with `4` before the program is compiled", "In the data segment with the other globals, because it is written outside every function", "In `main`'s stack frame, because `main` is the function that uses it in a call", "On the heap, because its value decides how many bytes `malloc` hands back"], "answer": 0, "why": "`#define` is a preprocessor directive, not a variable declaration. Every `CAP` is replaced by `4` before the compiler runs, so it gets no storage of its own. The class's stack-frame rules say the same thing: do not put preprocessor directives in the stack."}, {"id": "cp-frame-order", "type": "short", "mode": "list", "q": "`main` calls `render`, and `render` calls `shade`. While `shade` is running, list the three functions' frames from the **highest** address to the **lowest**.", "accept": ["main render shade"], "placeholder": "three names in order", "why": "Each call pushes a frame at a lower address than the one before: `main` (highest), `render`, `shade` (lowest, where sp is). Reversing it assumes the stack grows toward higher addresses."}, {"id": "cp-rec", "type": "short", "mode": "num", "q": "`main` calls `depth(20)`.\n\n```c\nint32_t depth(int32_t n) {\n    if (n <= 1) return 1;\n    return 1 + depth(n / 2);\n}\n```\n\nAt the deepest point, how many frames are on the stack, counting `main`'s? (`n / 2` is integer division.)", "accept": ["6"], "why": "The calls are `depth(20)`, `depth(10)`, `depth(5)`, `depth(2)`, `depth(1)`: 5 frames, all still on the stack when `n` reaches 1, plus `main` = **6**. Answering 21 treats it as counting down by one; 5 forgets `main`. (Run: the function returns 5, deepest frame count 6.)", "hint": "Write down the value of `n` for each call until the base case is reached, then count the calls."}, {"id": "cp-bug-id", "type": "blanks", "q": "Name the problem in each snippet. For A and C give the error that crashes the program; for B give the name for the pointer that is returned.\n\n**A**\n```c\nint32_t count_up(int32_t n) {\n    return 1 + count_up(n + 1);\n}\n```\n\n**B**\n```c\ndouble *average(double a, double b) {\n    double avg = (a + b) / 2;\n    return &avg;\n}\n```\n\n**C**\n```c\nvoid snapshot(void) {\n    int64_t pixels[40000000];   // 320,000,000 bytes of local data\n    pixels[0] = 1;\n}\n```", "blanks": [{"label": "A", "mode": "text", "accept": ["stack overflow", "a stack overflow", "stack overflows"], "acceptRe": ["^(a )?stack[ -]?overflows?$"]}, {"label": "B", "mode": "text", "accept": ["dangling pointer", "a dangling pointer", "dangling"], "acceptRe": ["^(a )?dangling( pointer)?s?$"]}, {"label": "C", "mode": "text", "accept": ["stack overflow", "a stack overflow", "stack overflows"], "acceptRe": ["^(a )?stack[ -]?overflows?$"]}], "why": "**A** has no base case, so it pushes frames forever: stack overflow from infinite recursion. **B** returns the address of the local `avg`, whose frame is deallocated at the return: a dangling pointer. **C** asks for 320 MB of locals in one frame: the slide's other cause of stack overflow, \"very large local variables\". (A and C both crash when run.)"}, {"id": "cp-bits", "type": "blanks", "q": "Address sizes. (1 MB = 2^{20} bytes, 1 GB = 2^{30}, 1 TB = 2^{40}.)", "blanks": [{"label": "bits needed to address 256 bytes", "mode": "num", "accept": ["8"]}, {"label": "bits needed to address 16 MB", "mode": "num", "accept": ["24"]}, {"label": "bits needed to address 2 GB", "mode": "num", "accept": ["31"]}, {"label": "TB reachable with a 44-bit address", "mode": "num", "accept": ["16", "2^4"]}], "why": "256 = 2^{8} → 8 bits. 16 MB = 2^{4} × 2^{20} = 2^{24} → 24 bits. 2 GB = 2^{1} × 2^{30} = 2^{31} → 31 bits. 2^{44} ÷ 2^{40} = 2^{4} = 16 TB. The slip on the last one is dividing by 2^{30} (that gives GB, 16,384).", "hint": "Write each size as a power of two first: 16 MB = 2^{4} × 2^{20}."}, {"id": "cp-heap-true", "type": "mc", "q": "Which statements are true of the **heap**? **Select all that apply.**", "options": ["Blocks are requested at run time with `malloc` or `realloc`", "A block stays allocated until the programmer frees it", "It grows toward lower addresses as functions are called", "It holds global and `static` variables for the whole run", "Its blocks are freed automatically when the allocating function returns"], "answer": [0, 1], "why": "The heap is dynamic, manual memory: `malloc`/`realloc` at run time, valid until `free`. Growing toward lower addresses on calls and being freed on return describe the **stack**; globals and statics are in **data**."}, {"id": "cp-why-8", "type": "mc", "q": "Why is a `char *` the same size as a `double *`?", "options": ["Both hold an address, and an address on a 64-bit machine is 8 bytes whatever is stored there", "The compiler pads every variable, pointers included, up to a multiple of 8 bytes", "A `char` and a `double` both occupy 8 bytes on a 64-bit machine, so their pointers match", "Only 48 bits of an address are used, and 48 bits round up to 8 bytes"], "answer": 0, "why": "A pointer stores an address, not the thing it points to, so its size depends only on how long an address is: 64 bits = 8 bytes. A `char` is still 1 byte and a `double` 8. The 48-bit point is true but is not the reason: the full address is 64 bits wide, with the unused upper bits set to 0."}, {"id": "cp-describe", "type": "self", "lines": 9, "q": "Short answer, as on the quiz: **describe the four major segments of a running program's memory** (code/text, data, heap, stack). For each say what it holds. For the heap and the stack also say who manages it and which way it grows.", "model": "- **Text (code):** the program's machine instructions. Fixed size.\n- **Data:** global and `static` variables, which exist for the whole run. Fixed size.\n- **Heap:** dynamically allocated memory, requested at run time with `malloc`/`realloc`. Managed **manually** by the programmer; a block lasts until it is freed. Grows **up**, toward higher addresses.\n- **Stack:** one stack frame per function call in progress (parameters, return address, locals). Managed **automatically**: a frame is pushed on a call and popped on return. Grows **down**, toward lower addresses, from the highest addresses.\n\nOrder from low to high: (OS) text, data, heap, …, stack.", "rubric": ["text/code = program instructions", "data = global and `static` variables", "heap = dynamic memory from `malloc`/`realloc`, managed manually, lasts until freed", "stack = function stack frames (locals, parameters, return addresses), managed automatically on call and return", "heap grows toward higher addresses, stack toward lower"], "why": "This is Objective 4 almost word for word, so expect it. The points that get dropped are the two \"managed\" words (automatic for the stack, manual for the heap) and the growth directions."}, {"id": "cp-explain-dangle", "type": "self", "lines": 6, "q": "A classmate writes this and says \"it works on my machine\".\n\n```c\nint16_t *newest_reading(void) {\n    int16_t value = 512;\n    return &value;\n}\n```\n\nIn two or three sentences, explain what is wrong in terms of the stack, and name one way to fix it.", "model": "`value` is a local variable, so it lives in `newest_reading`'s stack frame. That frame is deallocated automatically when the function returns, so the caller gets the address of memory that is no longer valid: a **dangling pointer**. The old bytes may still be there for a moment, which is why it can appear to work, but the next function call reuses that part of the stack and overwrites them.\n\nFix: return the value itself (`int16_t`) instead of its address, or allocate the `int16_t` on the heap with `malloc` and return that pointer (heap memory persists until it is freed).", "rubric": ["says `value` is a local in the function's stack frame", "says the frame is deallocated / popped when the function returns", "names it a dangling pointer (or: the pointer outlives the data, undefined behaviour)", "gives a working fix: return the value, or use heap memory (`malloc`)"], "why": "\"It works on my machine\" is the trap. Deallocating a frame only moves sp; nothing is erased, so the old value can survive until another call overwrites it. Undefined behaviour includes appearing to work."}]}, {"id": "pointer-basics", "title": "Pointer basics: &, *, NULL, types, double pointers", "blurb": "Trace any short program that uses &, *, NULL, aliases and double pointers, draw its stack diagram, and say what it prints.", "objective": "Objective 5: Pointers", "sources": "CL16 · RD14 · HW6 · DIS §2.2", "minutes": 50, "cheats": ["A pointer is a variable that stores an **address**, not the value. Every pointer is **8 bytes**; its type says how many bytes `*p` reads or writes.", "`&x` = the address of x. `*p` = the thing at the address in p. Type in front (`int *p`) = declaration; no type (`*p = 5`) = dereference.", "`*p` on the **left** of `=` writes where p points; on the **right** it reads. One `*` = follow one arrow.", "`p = &b;` moves the arrow. `*p = 10;` changes what the arrow points at.", "`q = p;` copies the address: q points at what p points at, not at p. Two pointers to one location = **aliasing**. `*p = *q;` copies a value instead.", "`int **pp = &p;` → `pp` holds the address of p, `*pp` **is** p, `**pp` **is** the int p points at. `*pp = q;` re-points p.", "To let a function change your pointer, pass `&ptr` to an `int **pp` parameter and assign to `*pp` inside.", "NULL = points at nothing valid. Never dereference NULL (segmentation fault) or an uninitialized pointer (garbage address). Check `!= NULL` whenever a pointer might be NULL: after `malloc`/`realloc`, and on pointer parameters."], "chunks": [{"id": "what-why", "title": "What a pointer is and what it is for", "read": "A **pointer** is a variable that stores a **memory address**: the location of some other variable. Lecture's slide: \"A pointer does not store the value! It stores where the value lives.\"\n\n### The four purposes\n\nObjective 5 lists four. Learn them as a list.\n\n| Purpose | What it means |\n|---|---|\n| **Indirect access to memory** | reach a variable through its address instead of its name, for example to change a variable that belongs to another function |\n| **Efficient parameter passing** | give a function an 8-byte address instead of a copy of a large array or structure |\n| **Dynamic memory management** | a heap block has no name; `malloc` returns its address, and a pointer is the only way to hold on to it |\n| **Building complex data structures** | linked lists and trees: each node stores the address of the next one |\n\n### Declaring a pointer\n\nThe pattern is `type *name;`\n\n```c\nint32_t *p;    // p is a pointer to an int32_t: it will hold the address of an int32_t\nchar    *c;    // c is a pointer to a char\ndouble  *d;    // d is a pointer to a double\n```\n\n`int32_t* p` and `int32_t *p` mean the same thing. The star can sit next to the type or next to the name.\n\n### Size and type\n\n**Every pointer is 8 bytes**, whatever it points to, because every address is 64 bits. \"If it's pointing to a character, it's 8 bytes. If it's pointing to a double, it's 8 bytes.\"\n\nSo why does a pointer have a type? Lecture: \"It's to account for the size.\" The type says what is at the other end of the address. Following an `int16_t *` reads or writes **2 bytes**; an `int32_t *`, 4 bytes; a `double *`, 8 bytes; a `char *`, 1 byte. (It also tells C how far away the next element is. That is pointer arithmetic, a later section.)\n\n> **Rule:** do not mix pointer types and data types. An `int8_t *` points only at `int8_t` variables, a `double *` only at `double` variables.\n\n### Worked example\n\n```c\nint16_t temp = 70;\nint16_t *tp = &temp;    // &temp is \"the address of temp\" (next part)\n```\n\n`temp` is 2 bytes and holds 70. `tp` is 8 bytes and holds an address. So `sizeof(temp)` is 2, `sizeof(tp)` is 8, and `sizeof(*tp)`, the thing `tp` points at, is 2.", "questions": [{"id": "purpose-match", "type": "mc", "q": "In a linked list, every node stores the address of the node that comes after it. Which of the four purposes of pointers is this an example of?", "options": ["Building complex data structures", "Efficient parameter passing", "Dynamic memory management", "Speeding up arithmetic on integers"], "answer": 0, "why": "Linked lists and trees are the objective's own examples of **building complex data structures**: the links between nodes are pointers. Parameter passing is about function calls and dynamic memory is about `malloc`; neither is what the links are. \"Faster arithmetic\" is not one of the four."}, {"id": "declare-ptr", "type": "short", "mode": "code", "q": "Declare a variable named `rate` that is a pointer to a `double`. Do not give it a value.", "accept": ["double *rate;"], "placeholder": "one declaration", "why": "`type *name;` → `double *rate;` (or `double* rate;`, same thing). The mistake is `double rate;`, which declares a `double`, not a pointer to one, or `*double rate;`, with the star on the wrong side of the type."}, {"id": "type-purpose", "type": "mc", "q": "Every pointer is 8 bytes. So what does the `int16_t` in `int16_t *hp` tell C?", "options": ["That the thing at the address is 2 bytes, so `*hp` reads or writes 2 bytes", "That `hp` itself occupies 2 bytes of memory instead of the usual 8", "That the address stored in `hp` is a 16-bit number rather than a 64-bit one", "Nothing the program uses; it is a label for the person reading the code"], "answer": 0, "why": "The pointer's type describes the **target**, not the pointer. It is there \"to account for the size\": how many bytes a dereference reads or writes (and, later, how far `hp + 1` moves). `hp` is 8 bytes and holds a full 64-bit address like every other pointer."}, {"id": "sizeof-mix", "type": "blanks", "q": "Give the value of each `sizeof` on the class machine.\n\n```c\nchar c = 'k';\nchar *cp = &c;\ndouble d = 1.5;\ndouble *dp = &d;\nint16_t s = 3;\nint16_t *hp = &s;\n```", "blanks": [{"label": "sizeof(cp)", "mode": "num", "accept": ["8"]}, {"label": "sizeof(*cp)", "mode": "num", "accept": ["1"]}, {"label": "sizeof(dp)", "mode": "num", "accept": ["8"]}, {"label": "sizeof(*dp)", "mode": "num", "accept": ["8"]}, {"label": "sizeof(*hp)", "mode": "num", "accept": ["2"]}, {"label": "sizeof(&s)", "mode": "num", "accept": ["8"]}], "why": "Anything that *is* a pointer (`cp`, `dp`) or an address (`&s`) is **8**. A starred pointer is the thing pointed at, so it has that thing's size: `*cp` is a `char` (1), `*dp` a `double` (8), `*hp` an `int16_t` (2). The slips are `sizeof(cp)` = 1 and `sizeof(&s)` = 2: those give the size of the target, not of the address. (Compiled and run: 8 1 8 8 2 8.)"}]}, {"id": "amp-star", "title": "`&` and `*`: take an address, then follow it", "read": "Two operators do all the work.\n\n- `&`, the **address-of** operator, \"is used to get the address of a variable\": `&x` is the location where `x` is stored.\n- `*`, the **dereference** operator, \"is used to access the value stored at an address\": go to the address held in the pointer, and read or write what is there.\n\n```c\nint x = 3;\nint *p = &x;    // p's value is the address of x\n*p = 8;         // WRITE: go where p points and store 8.   x is now 8\nint v = *p;     // READ: go where p points and fetch the value.   v is 8\n```\n\nThe star has two different jobs, and lecture's rule tells them apart:\n\n> **Lecture:** \"If you see a type, that means that we are declaring p. If you don't see a type, that means that we are dereferencing.\"\n\n- `int *p = &x;` has a type in front. It is a **declaration**: the star is part of the type \"pointer to int\". Nothing is being followed, and what gets the value `&x` is `p`.\n- `*p = 8;` has no type. It is a **dereference**.\n\nFor a dereference, the side of the `=` matters:\n\n> **Rule:** `*p` on the **left** of `=` writes to the place `p` points. `*p` on the **right** reads from it.\n\nPicture the address inside `p` as an arrow from `p` to `x`. Lecture: \"you're just going to follow that arrow to the location where it points, and you will read or modify that location.\"\n\n### Worked example\n\n```c\nint32_t n = 4;\nint32_t *p = &n;\n*p = *p + 3;\n```\n\nRight side first: `*p` → follow the arrow, read 4. Then 4 + 3 = 7. Left side: `*p =` → follow the arrow, write 7. Now `n` is 7. `p` itself has not changed; it still holds the address of `n`. (`*p += 3;` does the same thing.)\n\n**Printing.** `%p` prints an address. After `p = &x`, `printf(\"%p\", &x)` and `printf(\"%p\", p)` print the same address (something like `0xfffffdd26e5c`), and `printf(\"%d\", *p)` prints the value of `x`.", "questions": [{"id": "same-addr", "type": "mc", "q": "After `int32_t x = 9;` and `int32_t *p = &x;`, what does this print?\n\n```c\nprintf(\"%p %p\\n\", &x, p);\n```", "options": ["The same address twice", "The address of `x`, then the address of `p`", "The address of `x`, then `9`", "`9` twice"], "answer": 0, "why": "`p` holds the address of `x`, so `&x` and `p` are the same value. The address of `p` would be `&p`, and the 9 would be `*p`. A pointer is \"just a number\": the address it stores."}, {"id": "deref-write", "type": "short", "mode": "num", "q": "What is the value of `n` after this code runs?\n\n```c\nint32_t n = 12;\nint32_t *p = &n;\n*p = *p - 5;\n```", "accept": ["7"], "why": "Right side: `*p` reads `n` (12), and 12 − 5 = 7. Left side: `*p =` writes 7 into `n`. Answering 12 means you treated `*p` as a separate copy; `p` holds the address of `n`, so writing through it changes `n` itself."}, {"id": "star-role", "type": "blanks", "q": "For each starred use of `t`, type `declare`, `read` or `write`.\n\n```c\nint16_t h = 20;\nint16_t *t = &h;      // line 2\n*t = 60;              // line 3\nint16_t k = *t;       // line 4\n*t = *t + k;          // line 5\n```", "blanks": [{"label": "line 2: int16_t *t", "mode": "text", "accept": ["declare", "declaration", "declaring", "declares"]}, {"label": "line 3: *t", "mode": "text", "accept": ["write", "writes", "writing"]}, {"label": "line 4: *t", "mode": "text", "accept": ["read", "reads", "reading"]}, {"label": "line 5: the *t on the left of =", "mode": "text", "accept": ["write", "writes", "writing"]}, {"label": "line 5: the *t on the right of =", "mode": "text", "accept": ["read", "reads", "reading"]}, {"label": "final value of h", "mode": "num", "accept": ["120"]}], "why": "Line 2 has a type in front, so it declares `t` (and gives `t` the address of `h`). Everywhere else there is no type, so it is a dereference: left of `=` writes, right of `=` reads. Trace: `h` = 60, `k` = 60, then `h` = 60 + 60 = **120**. Line 4 has a type too, but the type belongs to `k`; the `*t` on its right side is a read.", "hint": "Is there a type directly in front of the star? If not, which side of the `=` is it on?"}, {"id": "deref-read", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\nint32_t a = 4;\nint32_t *p = &a;\nint32_t b = *p * 3;\n*p = b + 1;\nprintf(\"%d %d\\n\", a, b);\n```", "accept": ["13 12"], "placeholder": "two numbers", "why": "`b = *p * 3` reads `a` through `p`: 4 × 3 = **12** (the first star dereferences, the second multiplies). `*p = b + 1` writes 13 into `a`. `b` was already computed and does not change, so it prints `13 12`. Writing `13 39` means you recomputed `b` after `a` changed."}]}, {"id": "diagram", "title": "Drawing pointers on the stack diagram", "read": "Lecture: \"memory diagrams are super helpful when working with pointers.\" The quiz asks for one, so learn the notation exactly.\n\n- Every variable gets a slot written **`name(size): value`**, with the size in bytes: `low(2): 2`.\n- `main`'s frame starts with its return address, written `RA(8): 0`, then its locals in the order they are declared, going down the page.\n- A pointer's slot is written **`cur(8): pointer to stack`**, and you **draw an arrow** from it to the slot it points at. The arrow is the pointer's value.\n- Mark **sp** beside the bottom slot of the frame. Lecture: \"don't forget about your stack pointer, pointing to the bottom of your current frame.\"\n- When a value changes, cross out the old one and write the new one next to it.\n\nA correct diagram has exactly one arrow per pointer.\n\n### Worked example\n\n```c\nint16_t low = 2;\nint16_t high = 9;\nint16_t *cur = &low;\n*cur = 4;        // writes into low\ncur = &high;     // moves the arrow: cur now points at high\n*cur = 11;       // writes into high\nprintf(\"%d %d\\n\", low, high);\n```\n\nJust before `printf`:\n\n```\n          Stack\n          main\n RA(8): 0\n low(2): 4                   (2 crossed out)\n high(2): 11                 (9 crossed out)   ◄──┐\n cur(8): pointer to stack  ───────────────────────┘     ← sp\n```\n\nIt prints `4 11`. The arrow first went to `low`; `cur = &high` moved it.\n\nTwo statements that look alike and do opposite things:\n\n| Statement | What changes | The arrow |\n|---|---|---|\n| `cur = &high;` (no star) | `cur` itself | moves to `high` |\n| `*cur = 11;` (star) | the int that `cur` points at | stays where it is |\n\n> **On paper:** the sizes are part of the answer. In class every slot size was asked for out loud: an `int16_t` is 2, an `int8_t` is 1, an `int32_t` is 4, and a pointer is 8 \"because all pointers are 8 bytes\".\n\n> **Trap:** printed output follows the format string exactly. `\"%d %d\\n\"` prints `4 11`, with a space and no comma.", "questions": [{"id": "repoint-vs-write", "type": "mc", "q": "`int32_t a = 1, b = 2;` and `int32_t *p = &b;` are already in place. Which statement moves `p`'s arrow to `a` **without changing any int**?", "options": ["`p = &a;`", "`*p = a;`", "`*p = &a;`", "`&p = a;`"], "answer": 0, "why": "No star on the left means \"assign to `p` itself\", and `&a` is the address to store: the arrow moves, `a` and `b` are untouched. `*p = a;` follows the arrow and copies 1 into `b`. `*p = &a;` tries to store an address in an int. `&p = a;` is not valid: you cannot assign to an address."}, {"id": "repoint-out", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\nint8_t a = 6;\nint8_t b = 1;\nint8_t *p = &b;\n*p = a + 2;\np = &a;\n*p = b - 5;\nprintf(\"%d %d\\n\", a, b);\n```", "accept": ["3 8"], "placeholder": "two numbers", "why": "`p` starts at `b`. `*p = a + 2` → `b` = 8. `p = &a` moves the arrow to `a` and changes no number. `*p = b - 5` → `a` = 8 − 5 = 3. Output `3 8`. If you got `6 3`, you kept writing into `b` after the arrow had moved."}, {"id": "diag-fill", "type": "blanks", "q": "Fill in the stack diagram for the moment just before `printf` is called.\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nint main(void) {\n    int8_t lives = 3;\n    int32_t score = 250;\n    int32_t *best = &score;\n    *best = *best + lives;\n    printf(\"%d %d\\n\", lives, score);\n}\n```", "blanks": [{"label": "value in main's RA slot", "mode": "num", "accept": ["0"]}, {"label": "size of the lives slot (bytes)", "mode": "num", "accept": ["1"]}, {"label": "size of the score slot (bytes)", "mode": "num", "accept": ["4"]}, {"label": "size of the best slot (bytes)", "mode": "num", "accept": ["8"]}, {"label": "value in the score slot", "mode": "num", "accept": ["253"]}, {"label": "the arrow from best points at which variable?", "mode": "code", "accept": ["score"]}, {"label": "sp is marked beside which slot? (variable name)", "mode": "code", "accept": ["best"]}], "why": "`main` = `RA(8): 0` · `lives(1): 3` · `score(4): 253` (250 crossed out) · `best(8): pointer to stack` ← sp, with one arrow from `best` to `score`. Line `*best = *best + lives` reads 250, adds 3, writes 253 into `score`. `best` is 8 bytes even though the `int32_t` it points at is 4: the mistake is to write `best(4)`."}]}, {"id": "null-uninit", "title": "NULL and uninitialized pointers", "read": "### NULL\n\n`NULL` is a special pointer value that means **\"this pointer does not point to any valid memory location.\"** Lecture's slide: NULL \"is used to indicate an invalid or uninitialized pointer.\"\n\n```c\nint *p = NULL;    // \"I haven't assigned this to anyone yet\"\n```\n\n**Why it is used**\n\n- As a safe starting value for a pointer that has nothing to point at yet.\n- As a signal from a function that it has nothing to give you. `malloc` and `realloc` return NULL when they cannot provide the memory.\n- After `free(p)`, you set `p = NULL` so the pointer is not left dangling.\n\n**The one rule:** \"Never dereference a NULL pointer!!!\" Doing so is a **segmentation fault**: the program tried to access memory it is not allowed to use, and it crashes on that line.\n\n**When a NULL check is necessary:** whenever a pointer *might* be NULL and you are about to dereference it.\n\n```c\nif (p != NULL) {\n    *p = 5;         // only runs when p points at something\n}\n```\n\nYou need the check right after `malloc` or `realloc`, on a pointer parameter that a caller could have passed as NULL, and on the result of any function that can return NULL. You do not need it right after `p = &x`: the address of a real variable is never NULL.\n\n### Uninitialized pointers\n\n```c\nint *q;       // a local with no initial value\n*q = 5;       // BUG\n```\n\nA local variable that is never given a value holds **garbage**: whatever bytes were in that stack slot before. So `q` is not NULL. It is some random address, and `*q = 5` writes 5 to an unknown place. The program may crash, or it may silently damage other data. That is undefined behaviour.\n\n> **Trap:** a NULL check cannot catch an uninitialized pointer, because garbage is almost never equal to NULL. The fix is to give every pointer a value when you declare it: a real address, or NULL.\n\n### Worked example\n\n`int32_t *slot = NULL; *slot = 9;` compiles, and crashes with `Segmentation fault` when the second statement runs. Nothing after it is executed.", "questions": [{"id": "null-deref", "type": "short", "mode": "text", "q": "What is the name of the run-time error this code produces?\n\n```c\nint32_t *slot = NULL;\n*slot = 9;\n```", "accept": ["segmentation fault", "segfault", "seg fault", "a segmentation fault", "a segfault"], "acceptRe": ["seg(mentation)?[ -]?fault"], "placeholder": "name of the error", "why": "`*slot = 9` dereferences NULL, which is never a valid location, so the program is stopped with a **segmentation fault** (segfault): it tried to access memory it is not allowed to use. It does not \"set `slot` to 9\"; that would be `slot = 9` with no star. (Run: the program is killed at that line.)"}, {"id": "uninit-id", "type": "mc", "q": "What is wrong with this code?\n\n```c\nint32_t *goal;\n*goal = 3;\n```", "options": ["Uninitialized pointer: `goal` was never given an address, so the write goes to an unknown location", "NULL pointer dereference: a local pointer starts out as `NULL` until it is assigned", "Dangling pointer: `goal` points at a variable whose stack frame has been deallocated", "Nothing is wrong: declaring `goal` also allocates the `int32_t` that it points at"], "answer": 0, "why": "Declaring a pointer reserves 8 bytes for an address and nothing else. With no initial value those 8 bytes are garbage, not NULL, so `*goal = 3` writes to a random place: undefined behaviour. A dangling pointer *used to* point at something valid; this one never did."}, {"id": "null-when", "type": "mc", "q": "In which of these is a NULL check needed before the dereference? **Select all that apply.**", "options": ["`int32_t *a = malloc(sizeof(int32_t));` then `*a = 1;`", "`int32_t x = 0; int32_t *b = &x;` then `*b = 1;`", "inside `void set(int32_t *c)`, where some callers may pass `NULL`: `*c = 1;`", "`int32_t *d = realloc(old, 80);` then `d[0] = 1;`"], "answer": [0, 2, 3], "why": "Check whenever the pointer **might** be NULL. `malloc` and `realloc` return NULL on failure, and a pointer parameter is whatever the caller passed. `b = &x` is the address of a real variable, which is never NULL, so a check there does nothing."}, {"id": "null-cond", "type": "short", "mode": "code", "q": "Fill in the condition so the assignment runs only when it is safe.\n\n```c\nvoid store(int32_t *out) {\n    if ( ________ ) {\n        *out = 5;\n    }\n}\n```", "accept": ["out != NULL", "out", "NULL != out", "out != 0", "!(out == NULL)", "0 != out"], "placeholder": "condition only", "why": "`out != NULL`. The caller could pass NULL, so the function checks before it dereferences. Writing `*out != NULL` is the classic slip: that dereferences first, which is the very crash the check is there to prevent. `out == NULL` is the opposite condition."}]}, {"id": "aliasing", "title": "Two pointers, one variable: aliasing", "read": "What does `q = p` do when both are pointers? It copies **the value of `p`**, and the value of `p` is an address.\n\n```c\nint32_t x = 6;\nint32_t *p = &x;\nint32_t *q = p;\n```\n\nUse lecture's numbers: say `x` lives at address 1000. Then `p` holds 1000, and after `q = p`, `q` holds 1000 too. Both arrows point at `x`.\n\n> **Lecture:** \"It doesn't hold the address of p. It holds the same value as p, so it's holding the address of x.\" This is the question the room got wrong.\n\n**Aliasing** \"occurs when two or more pointers point to the same location.\" Here `p` and `q` are aliases of `x`: a write through either one changes `x`, and a read through the other sees it.\n\nFour statements that look alike:\n\n| Statement | What it copies | Result |\n|---|---|---|\n| `q = p;` | an address | `q` points where `p` points |\n| `*q = *p;` | a value | the int `q` points at gets the value of the int `p` points at; no arrow moves |\n| `q = &p;` | the address of a pointer | not allowed for an `int32_t *`; that needs a double pointer (next part) |\n| `q = *p;` | an int into a pointer | wrong: a value is \"not an address\" |\n\n### Worked example\n\n```c\nint16_t x = 3;\nint16_t y = 8;\nint16_t *p = &x;\nint16_t *q = p;      // q points at x too: p and q are aliases\n*q = 15;             // x = 15\nq = &y;              // q now points at y; p still points at x\n*p = *q + 1;         // x = 8 + 1 = 9\nprintf(\"%d %d %d %d\\n\", x, y, *p, *q);\n```\n\nIt prints `9 8 9 8`. Follow the arrows line by line: after line 4 both point at `x`; line 6 moves only `q`; line 7 reads `y` through `q` and writes `x` through `p`.\n\n> **On paper:** in the diagram, aliases are two pointer slots whose arrows end on the same slot. Redraw an arrow only when a statement assigns to the pointer itself (no star on the left).", "questions": [{"id": "alias-name", "type": "short", "mode": "text", "q": "What is it called when two or more pointers point to the same location?", "accept": ["aliasing", "alias", "aliases", "pointer aliasing"], "placeholder": "one word", "why": "**Aliasing.** The pointers are aliases of the variable they share."}, {"id": "alias-holds", "type": "short", "mode": "num", "q": "Simplified addresses: `x` is stored at 2000, `p` at 2008 and `q` at 2016.\n\n```c\nint32_t x = 5;\nint32_t *p = &x;\nint32_t *q = p;\n```\n\nWhat number is stored in `q`?", "accept": ["2000"], "why": "`q = p` copies the value of `p`, which is the address of `x`: **2000**. The wrong answer from class is 2008, the address *of* `p`; that would be `&p`. 2016 is where `q` itself lives, and 5 is `*q`."}, {"id": "alias-trace", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\nint32_t x = 6;\nint32_t y = 2;\nint32_t *p = &x;\nint32_t *q = p;\n*q = *q + y;\ny = *p * 2;\nprintf(\"%d, %d, %d, %d\\n\", x, y, *p, *q);\n```", "accept": ["8 16 8 8"], "placeholder": "four numbers", "why": "`p` and `q` both point at `x`. `*q = *q + y` → `x` = 6 + 2 = 8. `y = *p * 2` reads `x` through `p` → `y` = 16. Then `x`, `y`, `*p`, `*q` are `8, 16, 8, 8`. If your last number is 16, you sent `q` to `y`; `q = p` made it point at `x`."}, {"id": "val-vs-addr", "type": "blanks", "q": "Two versions of the same program differ only in the marked line. Give `x` and `y` at the end of each.\n\n```c\nint64_t x = 1;\nint64_t y = 2;\nint64_t *p = &x;\nint64_t *q = &y;\n/* marked line */\n*p = 50;\n```\n\nVersion A's marked line is `*p = *q;` and version B's is `p = q;`", "blanks": [{"label": "version A: x", "mode": "num", "accept": ["50"]}, {"label": "version A: y", "mode": "num", "accept": ["2"]}, {"label": "version B: x", "mode": "num", "accept": ["1"]}, {"label": "version B: y", "mode": "num", "accept": ["50"]}], "why": "**A:** `*p = *q` copies a value: `x` becomes 2, and `p` still points at `x`. Then `*p = 50` → `x` = 50, `y` = 2. **B:** `p = q` copies an address: `p` now points at `y`, and `x` is never touched. Then `*p = 50` → `y` = 50, `x` = 1. Stars on both sides move a value; no stars move an arrow.", "hint": "Stars on both sides copy a value. No stars copy an address."}]}, {"id": "double-1", "title": "Double pointers 1: a pointer to a pointer", "read": "A pointer is a variable, so it is stored somewhere and has an address of its own. A variable that holds *that* address is a **double pointer**: \"a pointer to a pointer\".\n\n```c\nint32_t x = 8;\nint32_t *p = &x;       // p holds the address of x\nint32_t **pp = &p;     // pp holds the address of p\n```\n\nGive them simple addresses, as lecture does: `x` at 1000, `p` at 1008, `pp` at 1016.\n\n```\n x(4): 8                        at 1000   ◄──┐\n p(8): pointer to stack         at 1008   ───┘  ◄──┐     p holds 1000\n pp(8): pointer to stack        at 1016   ─────────┘     pp holds 1008    ← sp\n```\n\nNow read each expression by counting stars. **One star = follow one arrow.**\n\n| Expression | Arrows followed | What you land on | Type | Value here |\n|---|---|---|---|---|\n| `pp` | 0 | `pp` itself | `int32_t **` | 1008 (the address of `p`) |\n| `*pp` | 1 | `p` | `int32_t *` | 1000 (the address of `x`) |\n| `**pp` | 2 | `x` | `int32_t` | 8 |\n\nSo `*pp` is not a new thing: it **is** `p`. And `**pp` **is** `x`.\n\n`**pp = 25;` is read the way the slide says: \"Follow the arrow twice, then write to that location.\" `pp` → `p` → `x`, so `x` becomes 25, and `x`, `*p` and `**pp` all read 25 afterwards.\n\n**Types.** `&` adds a star to the type and `*` removes one. `x` is an `int32_t`, so `&x` is an `int32_t *`. `p` is an `int32_t *`, so `&p` is an `int32_t **`. That makes `int32_t **pp = &x;` a type mismatch: `&x` has only one star.\n\n> **On paper:** every pointer slot is 8 bytes, the double pointer included. Write `pp(8): pointer to stack` and draw its arrow to `p`'s slot, not to `x`.", "questions": [{"id": "dp-values", "type": "blanks", "q": "Simplified addresses: `x` is stored at 3000, `p` at 3008 and `pp` at 3016.\n\n```c\nint32_t x = 12;\nint32_t *p = &x;\nint32_t **pp = &p;\n```\n\nGive the value of each expression.", "blanks": [{"label": "p", "mode": "num", "accept": ["3000"]}, {"label": "pp", "mode": "num", "accept": ["3008"]}, {"label": "*pp", "mode": "num", "accept": ["3000"]}, {"label": "**pp", "mode": "num", "accept": ["12"]}, {"label": "*p", "mode": "num", "accept": ["12"]}, {"label": "&pp", "mode": "num", "accept": ["3016"]}], "why": "`p` holds the address of `x` (3000). `pp` holds the address of `p` (3008). `*pp` follows one arrow and lands on `p`, so it is `p`'s value, 3000. `**pp` follows two and lands on `x`: 12, the same as `*p`. `&pp` is where `pp` itself is stored, 3016. The common slip is `*pp` = 12: one star gets you only as far as `p`.", "hint": "`*pp` means: take the number in `pp`, go to that address, and report what is stored there."}, {"id": "dp-types", "type": "blanks", "q": "`int16_t **pp;` has been declared and set up. Give the **type** of each expression.", "blanks": [{"label": "pp", "mode": "code", "accept": ["int16_t **"]}, {"label": "*pp", "mode": "code", "accept": ["int16_t *"]}, {"label": "**pp", "mode": "code", "accept": ["int16_t"]}], "why": "Each dereference removes one star from the type: `pp` is an `int16_t **` (it stores the address of an `int16_t *`), `*pp` is an `int16_t *` (a pointer to an int), and `**pp` is an `int16_t`."}, {"id": "dp-type", "type": "mc", "q": "Given `int32_t x = 1;` and `int32_t *p = &x;`, which declaration is a **type mismatch**?", "options": ["`int32_t **a = &x;`", "`int32_t **b = &p;`", "`int32_t *c = &x;`", "`int32_t *d = p;`"], "answer": 0, "why": "`&x` is the address of an `int32_t`, so its type is `int32_t *`, one star. A double pointer needs the address of a *pointer*: `&p`. The other three match star for star: `&p` is `int32_t **`, `&x` is `int32_t *`, and `p` is `int32_t *`."}, {"id": "dp-write", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\nint16_t x = 4;\nint16_t *p = &x;\nint16_t **pp = &p;\n**pp = **pp + 6;\n*p = *p * 2;\nprintf(\"%d %d %d\\n\", x, *p, **pp);\n```", "accept": ["20 20 20"], "placeholder": "three numbers", "why": "`**pp` and `*p` are both `x`. `**pp = **pp + 6` → `x` = 4 + 6 = 10. `*p = *p * 2` → `x` = 20. There is only one int in this program, so all three expressions print it: `20 20 20`."}]}, {"id": "double-2", "title": "Double pointers 2: moving a pointer through `*pp`", "read": "The idea that unlocks every double-pointer trace: `*pp` **is** `p`. Whatever you could do to `p` by name, you can do through `*pp`.\n\n- `*pp = something;` assigns to **`p`**. It changes where `p` points. No int changes.\n- `**pp = something;` assigns to **whatever `p` points at right now**.\n\n### Worked example\n\n```c\nint32_t a = 1;\nint32_t b = 2;\nint32_t *p = &a;\nint32_t **pp = &p;\n\n**pp = 7;     // pp -> p -> a      a = 7\n*pp = &b;     // *pp is p          p now points at b\n**pp = 9;     // pp -> p -> b      b = 9\nprintf(\"%d %d %d\\n\", a, b, *p);\n```\n\nKeep a small table of where each arrow goes and update it after every line.\n\n| After line | `pp` points at | `p` points at | `a` | `b` |\n|---|---|---|---|---|\n| declarations | `p` | `a` | 1 | 2 |\n| `**pp = 7;` | `p` | `a` | **7** | 2 |\n| `*pp = &b;` | `p` | **`b`** | 7 | 2 |\n| `**pp = 9;` | `p` | `b` | 7 | **9** |\n\nIt prints `7 9 9`. The first and third statements are the same text, `**pp = …`, yet they write to different variables, because the statement between them moved `p`.\n\n> **Trap:** after `*pp = &b`, everything that goes through `p` lands on `b`: `*p`, and `**pp` as well. Before you evaluate any `*p` or `**pp`, look at your table for where `p` points *now*, not where it pointed when it was declared.\n\n### How to read one statement\n\nTake a statement such as `**pp = *p - a;`\n\n1. Right side first. `*p`: follow `p`'s arrow once and read. `a`: read `a` directly. Subtract.\n2. Left side. `**pp =`: follow two arrows, `pp` then `p`, and write the result there.\n\nThe slide's wording for the two halves: \"Follow the arrow once, then read the value at that location\" and \"Follow the arrow twice, then write to that location.\"\n\n`pp` never moved in this example. It can: `pp = &q;` (no stars on the left) would point it at a different pointer, and from then on `*pp` would be `q`.", "questions": [{"id": "dp-repoint", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\nint32_t a = 10;\nint32_t b = 20;\nint32_t *p = &a;\nint32_t *q = &b;\nint32_t **pp = &q;\n\n*pp = p;\n**pp = 5;\n*q = *q + b;\nprintf(\"%d %d %d %d\\n\", a, b, *p, *q);\n```", "accept": ["25 20 25 25"], "placeholder": "four numbers", "why": "`pp` points at **`q`**, so `*pp` is `q`. `*pp = p` copies `p`'s address into `q`: now `q` points at `a` too. `**pp = 5` → `pp` → `q` → `a`, so `a` = 5. `*q = *q + b` → `a` = 5 + 20 = 25. `b` is never written. Output `25 20 25 25`. If you changed `b`, you still had `q` pointing at `b`.", "hint": "`pp` was set to `&q`, so `*pp` is `q`."}, {"id": "dp-after", "type": "short", "mode": "code", "q": "In the program above, right after `*pp = p;` runs, which variable does `q` point at?", "accept": ["a"], "placeholder": "variable name", "why": "`*pp` is `q` (because `pp = &q`). Assigning `p` to it copies the address in `p`, the address of `a`, into `q`. So `q` points at **`a`**, and `p` and `q` are now aliases. It does not point at `p`: that would need `&p`, and `q` is only a single pointer."}, {"id": "dp-which", "type": "blanks", "q": "These four statements run in order. For each one, name the variable whose stored value changes.\n\n```c\nint32_t x = 1;\nint32_t y = 2;\nint32_t *p = &x;\nint32_t **pp = &p;\n\n**pp = 3;     // statement 1\n*pp = &y;     // statement 2\n**pp = 4;     // statement 3\n*p = 5;       // statement 4\n```", "blanks": [{"label": "statement 1 changes", "mode": "code", "accept": ["x"]}, {"label": "statement 2 changes", "mode": "code", "accept": ["p"]}, {"label": "statement 3 changes", "mode": "code", "accept": ["y"]}, {"label": "statement 4 changes", "mode": "code", "accept": ["y"]}, {"label": "final value of x", "mode": "num", "accept": ["3"]}, {"label": "final value of y", "mode": "num", "accept": ["5"]}], "why": "1: two arrows, `pp` → `p` → `x`, so **`x`** = 3. 2: one arrow lands on `p`, so **`p`** changes and now points at `y`. 3: two arrows again, but `p` now leads to **`y`** = 4. 4: `*p` is also **`y`** = 5. Final `x` = 3, `y` = 5. Statement 3 is the trap: same text as statement 1, different target.", "hint": "Count the stars on the left of `=`, and check where `p` points at that moment."}]}, {"id": "double-fn", "title": "Double pointers 3: letting a function change your pointer", "read": "Here is where double pointers earn their place. A function receives **copies** of its arguments. That gives a simple ladder:\n\n| You want the function to change the caller's… | Parameter type | The caller passes | Inside, write to |\n|---|---|---|---|\n| `int32_t` variable `x` | `int32_t *p` | `&x` | `*p` |\n| pointer variable `ptr` (an `int32_t *`) | `int32_t **pp` | `&ptr` | `*pp` |\n\nIt is one rule used twice: **to let a function change a variable of yours, pass that variable's address.** When the variable is itself a pointer, its address is a double pointer.\n\n### Worked example\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid pick_larger(int32_t **choice, int32_t *other) {\n    if (*other > **choice) {\n        *choice = other;       // re-point the CALLER's pointer\n    }\n}\n\nint main(void) {\n    int32_t a = 4;\n    int32_t b = 9;\n    int32_t *best = &a;\n    pick_larger(&best, &b);    // pass the ADDRESS of best\n    printf(\"%d\\n\", *best);     // 9\n    *best = 0;\n    printf(\"%d %d\\n\", a, b);   // 4 0\n}\n```\n\nInside `pick_larger`, during the call:\n\n- `choice` holds the address of `main`'s `best`, so `*choice` **is** `best`, and `**choice` is the int `best` points at (`a`, which is 4).\n- `other` holds the address of `b`, so `*other` is 9.\n- 9 > 4, so `*choice = other;` stores the address of `b` into `main`'s `best`.\n\nBack in `main`, `best` points at `b`. It prints `9`. Then `*best = 0` clears `b`, and the last line prints `4 0`.\n\n### The version that does not work\n\n```c\nvoid pick_larger(int32_t *choice, int32_t *other) {\n    if (*other > *choice) {\n        choice = other;        // changes only this function's copy\n    }\n}\n```\n\nCalled as `pick_larger(best, &b)`, this gets a *copy* of the address in `best`. Re-pointing the copy does nothing to `main`'s `best`, which still points at `a`. There is no error and no crash, only the wrong answer: the same program prints `4`, then `0 9`.\n\n> **Rule:** inside the function, count stars on the left of `=`. `*pp = …` changes the caller's pointer. `**pp = …` changes the int that pointer points at. `pp = …` changes only the function's own copy.", "questions": [{"id": "dpf-call", "type": "short", "mode": "code", "q": "`void reset(int32_t **pp)` sets the caller's pointer to NULL. In `main` you have `int32_t *head = &v;`. Write the call that lets `reset` change `head`.", "accept": ["reset(&head);"], "placeholder": "one statement", "why": "`reset(&head);`. The parameter is an `int32_t **`, so the argument must be the address of an `int32_t *`: `&head`. Passing `head` gives the function the address of `v` (one star, wrong type), and `*head` gives it an int."}, {"id": "dpf-body", "type": "short", "mode": "code", "q": "Write the one statement that goes inside `reset` to make the caller's pointer NULL.\n\n```c\nvoid reset(int32_t **pp) {\n    ________\n}\n```", "accept": ["*pp = NULL;", "*pp = 0;"], "placeholder": "one statement", "why": "`*pp = NULL;`. One star lands on the caller's pointer, which is the thing to change. `pp = NULL;` changes only `reset`'s own copy and the caller sees nothing. `**pp = NULL;` goes one arrow too far and tries to write into the int."}, {"id": "dpf-trace", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid retarget(int16_t **pp, int16_t *to) {\n    **pp = 1;\n    *pp = to;\n    **pp = 2;\n}\n\nint main(void) {\n    int16_t m = 7;\n    int16_t n = 8;\n    int16_t *cur = &m;\n    retarget(&cur, &n);\n    *cur = *cur + 10;\n    printf(\"%d %d\\n\", m, n);\n}\n```", "accept": ["1 12"], "placeholder": "two numbers", "why": "`pp` holds the address of `cur`, so `*pp` is `cur`. `**pp = 1` → `cur` points at `m`, so `m` = 1. `*pp = to` → `main`'s `cur` now points at `n`. `**pp = 2` → `n` = 2. Back in `main`, `*cur = *cur + 10` → `n` = 12. Output `1 12`. Getting `11 2` means you left `cur` pointing at `m`.", "hint": "`pp` holds the address of `cur`, so `*pp` is `main`'s `cur`."}, {"id": "dpf-single", "type": "short", "mode": "list", "q": "Same program, but the function takes a single pointer. What does it print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid retarget(int16_t *p, int16_t *to) {\n    p = to;\n    *p = 2;\n}\n\nint main(void) {\n    int16_t m = 7;\n    int16_t n = 8;\n    int16_t *cur = &m;\n    retarget(cur, &n);\n    *cur = *cur + 10;\n    printf(\"%d %d\\n\", m, n);\n}\n```", "accept": ["17 2"], "placeholder": "two numbers", "why": "`p` is a copy of the address in `cur`. `p = to` re-points only that copy; `main`'s `cur` still points at `m`. `*p = 2` → `n` = 2 (the copy now points at `n`). Back in `main`, `*cur = *cur + 10` → `m` = 7 + 10 = 17. Output `17 2`. Compare with the last question: only the `int16_t **` version could move `cur`."}]}], "checkpoint": [{"id": "cp-alias-trace", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\nint32_t a = 2;\nint32_t b = 9;\nint32_t *p = &a;\nint32_t *q = &b;\n*p = *q - 4;\nq = p;\n*q = *q * 2;\np = &b;\n*p = *q + 1;\nprintf(\"%d %d %d %d\\n\", a, b, *p, *q);\n```", "accept": ["10 11 11 10"], "placeholder": "four numbers", "why": "`*p = *q - 4` → `a` = 9 − 4 = 5. `q = p` → `q` points at `a`. `*q = *q * 2` → `a` = 10. `p = &b` → `p` points at `b`. `*p = *q + 1` → `b` = 10 + 1 = 11. At the end `p` → `b` and `q` → `a`, so `a`, `b`, `*p`, `*q` are `10 11 11 10`. The two pointers have swapped targets by the last line, which is what the question is checking.", "hint": "Only two of the five statements move an arrow. Find them first."}, {"id": "cp-diagram", "type": "blanks", "q": "Draw the stack diagram for the moment just before `printf` is called, then fill in these parts of it.\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nint main(void) {\n    int16_t hi = 40;\n    int8_t lo = 7;\n    int16_t *hp = &hi;\n    int16_t **hpp = &hp;\n    **hpp = **hpp - lo;\n    *hp = *hp + 1;\n    printf(\"%d %d\\n\", hi, lo);\n}\n```", "blanks": [{"label": "size of the hi slot (bytes)", "mode": "num", "accept": ["2"]}, {"label": "size of the lo slot (bytes)", "mode": "num", "accept": ["1"]}, {"label": "size of the hp slot (bytes)", "mode": "num", "accept": ["8"]}, {"label": "size of the hpp slot (bytes)", "mode": "num", "accept": ["8"]}, {"label": "value in the hi slot", "mode": "num", "accept": ["34"]}, {"label": "hp's arrow points at which variable?", "mode": "code", "accept": ["hi"]}, {"label": "hpp's arrow points at which variable?", "mode": "code", "accept": ["hp"]}, {"label": "sp is marked beside which slot? (variable name)", "mode": "code", "accept": ["hpp"]}], "why": "`main` = `RA(8): 0` · `hi(2): 34` · `lo(1): 7` · `hp(8): pointer to stack` (arrow to `hi`) · `hpp(8): pointer to stack` (arrow to `hp`) ← sp. `**hpp = **hpp - lo` → `hi` = 40 − 7 = 33; `*hp = *hp + 1` → 34. Two checks: the double pointer is still 8 bytes, and its arrow goes to `hp`'s slot, not to `hi`. It prints `34 7`."}, {"id": "cp-dp-lines", "type": "blanks", "q": "Trace the program and give the number each `printf` prints.\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nint main(void) {\n    int32_t a = 3;\n    int32_t b = 4;\n    int32_t *p = &a;\n    int32_t *q = &b;\n    int32_t **pp = &q;\n\n    **pp = *p + 10;\n    *pp = p;\n    *q = b - *p;\n    pp = &p;\n    **pp = **pp + 1;\n\n    printf(\"a = %d\\n\", a);\n    printf(\"b = %d\\n\", b);\n    printf(\"*p = %d\\n\", *p);\n    printf(\"*q = %d\\n\", *q);\n    return 0;\n}\n```", "blanks": [{"label": "a", "mode": "num", "accept": ["11"]}, {"label": "b", "mode": "num", "accept": ["13"]}, {"label": "*p", "mode": "num", "accept": ["11"]}, {"label": "*q", "mode": "num", "accept": ["11"]}], "why": "Start: `p` → `a`, `q` → `b`, `pp` → `q`. (1) `**pp = *p + 10` → `pp` → `q` → `b`, so `b` = 3 + 10 = 13. (2) `*pp = p` → `q` now points at `a`. (3) `*q = b - *p` → `a` = 13 − 3 = 10. (4) `pp = &p` → `pp` now points at `p`. (5) `**pp = **pp + 1` → `a` = 11. Both `p` and `q` end on `a`: `a = 11`, `b = 13`, `*p = 11`, `*q = 11`. Step 2 is the one that gets skipped; without it you would write into `b` in step 3.", "hint": "Keep a small table of where `p`, `q` and `pp` point, and update it after every line before you read or write through them."}, {"id": "cp-null-why", "type": "mc", "q": "A pointer is declared before the program knows what it should point at. Why give it the value `NULL` instead of leaving it uninitialized?", "options": ["NULL is a known value the code can test for; an uninitialized pointer holds garbage that looks like a real address", "A pointer that is NULL can be dereferenced safely, and reading through it gives 0 instead of crashing", "A NULL pointer takes up no memory until it is assigned, so the stack frame is smaller in the meantime", "The compiler refuses to compile a pointer declaration with no initial value, so some value is required"], "answer": 0, "why": "NULL is something you can check (`if (p != NULL)`). Garbage is not: it looks like any other address, and using it is undefined behaviour. Dereferencing NULL is never safe; it is a segmentation fault. The pointer is 8 bytes either way, and C happily compiles an uninitialized pointer."}, {"id": "cp-bug-words", "type": "blanks", "q": "Name the pointer error in each snippet with one word: type `uninitialized`, `null` or `mismatch`.\n\n**A**\n```c\nint16_t **link;\n**link = 40;\n```\n\n**B**\n```c\nchar *name = NULL;\nprintf(\"%c\\n\", *name);\n```\n\n**C**\n```c\ndouble rate = 2.5;\ndouble **rr = &rate;\n```", "blanks": [{"label": "A", "mode": "text", "accept": ["uninitialized", "uninitialised", "uninitialized pointer", "uninitialised pointer"], "acceptRe": ["^uninitiali[sz]ed"]}, {"label": "B", "mode": "text", "accept": ["null", "null pointer", "null dereference", "null pointer dereference"], "acceptRe": ["^null"]}, {"label": "C", "mode": "text", "accept": ["mismatch", "type mismatch", "type"], "acceptRe": ["mismatch"]}], "why": "**A:** `link` was never given an address, so `**link` follows garbage: an uninitialized pointer. **B:** `name` is NULL and `*name` dereferences it: a NULL pointer dereference (segmentation fault). **C:** `&rate` is a `double *`, but `rr` needs the address of a pointer: a type mismatch. A is not a NULL error: an uninitialized local is not NULL."}, {"id": "cp-sizeof", "type": "blanks", "q": "Give each `sizeof`.\n\n```c\nint16_t v = 1;\nint16_t *p = &v;\nint16_t **pp = &p;\n```", "blanks": [{"label": "sizeof(v)", "mode": "num", "accept": ["2"]}, {"label": "sizeof(p)", "mode": "num", "accept": ["8"]}, {"label": "sizeof(pp)", "mode": "num", "accept": ["8"]}, {"label": "sizeof(*pp)", "mode": "num", "accept": ["8"]}, {"label": "sizeof(**pp)", "mode": "num", "accept": ["2"]}], "why": "`v` is an `int16_t`: 2. `p` and `pp` are pointers: 8 each. `*pp` is `p`, still a pointer: **8**. `**pp` is `v`: 2. The one to watch is `sizeof(*pp)`: one star off a double pointer leaves a pointer, not an int."}, {"id": "cp-mix", "type": "mc", "q": "Given `int8_t t; int32_t w; double d;`, which line breaks the rule \"do not mix pointer types and data types\"?", "options": ["`int32_t *p = &t;`", "`int8_t *q = &t;`", "`double *r = &d;`", "`int32_t *s = &w;`"], "answer": 0, "why": "`t` is an `int8_t`, so only an `int8_t *` may point at it. Through an `int32_t *`, `*p` would read or write 4 bytes where only 1 belongs to `t`. The other three match: pointer type and variable type are the same."}, {"id": "cp-write-backup", "type": "self", "lines": 10, "q": "Write a function\n\n```c\nvoid use_backup(int32_t **active, int32_t *backup)\n```\n\nthat makes the **caller's** pointer point at `backup` if the caller's pointer is currently NULL, and otherwise leaves it alone. Then write the call from `main`, where these exist:\n\n```c\nint32_t dflt = 80;\nint32_t *cfg = NULL;\n```\n\nAfter the call, `*cfg` should be 80.", "model": "```c\nvoid use_backup(int32_t **active, int32_t *backup) {\n    if (*active == NULL) {\n        *active = backup;\n    }\n}\n\n// in main:\nuse_backup(&cfg, &dflt);\n```\n\n`*active` is the caller's `cfg`. The test reads it, and the assignment writes the address in `backup` into it.", "rubric": ["tests the caller's pointer with one star: `*active == NULL`", "assigns with one star on the left: `*active = backup;`", "does not write `active = backup;` (that changes only the copy)", "call passes the address of the pointer: `&cfg`", "call passes the address of the int: `&dflt`"], "why": "One star everywhere inside the function, because the thing being tested and changed is the caller's *pointer*. `**active == NULL` would dereference a NULL pointer and crash. (The model was compiled and run: after the call `*cfg` is 80, and a second call with a different backup leaves it at 80.)"}, {"id": "cp-purposes", "type": "self", "lines": 6, "q": "Short answer, as on the quiz: **list the four purposes of pointers**, with a few words on each.", "model": "1. **Indirect access to memory**: read or change a variable through its address, such as a variable that belongs to another function.\n2. **Efficient parameter passing**: pass an 8-byte address instead of copying a large array or structure.\n3. **Dynamic memory management**: `malloc` and `realloc` return addresses; pointers are how you hold and use heap memory.\n4. **Building complex data structures**: linked lists and trees, where each node stores the address of another node.", "rubric": ["indirect access to memory", "efficient parameter passing", "dynamic memory management", "building complex data structures (linked lists, trees)"], "why": "This is the first bullet of Objective 5. Lecture's slide words them as: modify variables in another function, work with dynamic memory, build linked data structures, efficiently pass large data structures. Either wording earns the points."}, {"id": "cp-advance", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid advance(int32_t **slot, int32_t *next) {\n    **slot = **slot + *next;\n    *slot = next;\n}\n\nint main(void) {\n    int32_t a = 5;\n    int32_t b = 6;\n    int32_t *cur = &a;\n    advance(&cur, &b);\n    advance(&cur, &a);\n    *cur = *cur + 1;\n    printf(\"%d %d\\n\", a, b);\n}\n```", "accept": ["12 17"], "placeholder": "two numbers", "why": "Call 1: `slot` → `cur` → `a`. `**slot = **slot + *next` → `a` = 5 + 6 = 11. `*slot = next` → `cur` points at `b`. Call 2: `cur` → `b`, and `next` points at `a`. `b` = 6 + 11 = 17, then `cur` points at `a`. Back in `main`: `*cur = *cur + 1` → `a` = 12. Output `12 17`. In call 2, `*next` is the *updated* `a` (11), not 5.", "hint": "`slot` holds the address of `cur`, so `*slot` is `cur`, and `**slot` is whatever `cur` points at right now."}, {"id": "cp-addr-values", "type": "blanks", "q": "Simplified addresses: `x` is stored at 500, `p` at 508, `q` at 516 and `pp` at 524.\n\n```c\nint32_t x = 77;\nint32_t *p = &x;\nint32_t *q = p;\nint32_t **pp = &q;\n```\n\nGive the value of each expression.", "blanks": [{"label": "q", "mode": "num", "accept": ["500"]}, {"label": "pp", "mode": "num", "accept": ["516"]}, {"label": "*pp", "mode": "num", "accept": ["500"]}, {"label": "**pp", "mode": "num", "accept": ["77"]}, {"label": "*q", "mode": "num", "accept": ["77"]}], "why": "`q = p` copies the address of `x`: `q` = 500 (not 508, which is where `p` lives). `pp = &q` → 516. `*pp` is `q`, so 500. `**pp` follows `pp` → `q` → `x`: 77, the same as `*q`. `p` is not on the path from `pp` at all."}, {"id": "cp-val-or-addr", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\nint32_t x = 1;\nint32_t y = 2;\nint32_t *p = &x;\nint32_t *q = &y;\np = q;\n*p = 30;\n*q = *q + x;\nprintf(\"%d %d\\n\", x, y);\n```", "accept": ["1 31"], "placeholder": "two numbers", "why": "`p = q` copies an address, so `p` now points at `y` and nothing points at `x` any more. `*p = 30` → `y` = 30. `*q = *q + x` → `y` = 30 + 1 = 31. `x` was never written: `1 31`. If you got `30 3`, you read `p = q` as `*p = *q`."}]}, {"id": "pointers-functions", "title": "Pointers and functions: stack diagrams and pass-by-pointer", "blurb": "Draw the stack for any function call in the class notation, predict what pass-by-value and pass-by-pointer code prints, and write functions that change the caller's variables.", "objective": "Objective 5: Pointers (with Objective 4: the stack)", "sources": "CL17 · CL18 · RD15 · HW6 · DIS §2.3", "minutes": 60, "cheats": ["Frame, top (higher addresses) to bottom: **parameters → RA → locals**. First parameter on top. `sp` marks the bottom slot of the newest frame.", "Slot notation `name(size): value`. `RA(8)` = line number of the call in the caller; `main`'s is `RA(8): 0`. Every pointer slot and RA is 8 bytes.", "A function that returns a value puts it in an **RV slot at the bottom of the caller's frame**, sized to the return type.", "Pass-by-value copies the value; pass-by-pointer copies the **address**. Only `*param = …` reaches the caller's variable.", "Forgot the `*` (`a = 10;`): changes the function's own copy, caller unchanged, no crash. Forgot the `&` (`fun(a)`): the function dereferences a small number → **segmentation fault** at the first dereference.", "Add one: `*n = *n + 1;`. Swap: `temp = *a; *a = *b; *b = temp;` where `temp` is a value, not a pointer. Call with `&x, &y`.", "An array argument decays to a pointer to its first element: an 8-byte slot, no copy, and `arr[i] = …` changes the caller's array. The length is a separate by-value parameter.", "Returning `&local` gives a **dangling pointer**: after the return the frame is below `sp`, and the next call overwrites it."], "chunks": [{"id": "frame", "title": "How a stack frame is drawn", "read": "Every function call gets a **stack frame**, and the quiz asks you to draw them, so the layout has to be automatic. Lecture's convention: when a function is called, three things happen in this order.\n\n1. \"The caller places the parameters on the stack.\"\n2. \"Then the function call places the return address (RA) on the stack.\"\n3. \"The called function then allocates space for its local variables.\"\n\nThe stack grows toward lower addresses, so a frame, read from the top of the page down, is:\n\n```\n   Higher addresses\n ┌──────────────────┐\n │    Parameters    │\n ├──────────────────┤\n │  Return Address  │\n ├──────────────────┤\n │  Local Variables │\n └──────────────────┘\n   Lower addresses\n```\n\nRules for filling it in:\n\n- Every slot is written **`name(size): value`**, with the size in bytes. `tag(1): 3` is a 1-byte variable holding 3.\n- **Parameters** go in the order of the signature, first parameter on top.\n- **`RA(8)`** holds the **line number of the call** in the caller: where execution continues after the return. `main`'s is drawn **`RA(8): 0`**. An RA is always 8 bytes.\n- **Locals** go in the order they are declared. A local with no value yet is `?`.\n- A new frame is drawn **below** its caller's frame.\n- **sp**, the stack pointer, is marked beside the bottom slot of the newest frame. It \"is keeping track of the last item in the active frame.\"\n\n> **Trap:** in the stack-frame lecture before Quiz 1, frames were drawn with the RA *first* and the parameters under it. From the pointers-and-functions lecture on, the order is **parameters, RA, locals**. That is the order used in this section. If a quiz question states an order, use the one it states.\n\n### Worked example\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void show(int32_t width, int8_t tag) {\n 5      int16_t area = width * 2;\n 6      printf(\"%d %d\\n\", area, tag);\n 7  }\n 8\n 9  int main(void) {\n10      int32_t w = 6;\n11      show(w, 3);\n12  }\n```\n\nThe stack just before line 6 runs:\n\n```\n          Stack\n          main\n RA(8): 0\n w(4): 6\n\n          show\n width(4): 6\n tag(1): 3\n RA(8): 11\n area(2): 12          ← sp\n```\n\n`show` was called from line 11, so its RA is 11. `main` has no parameters, so its frame starts at its RA.", "questions": [{"id": "frame-order", "type": "blanks",
