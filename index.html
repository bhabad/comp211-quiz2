num", "accept": ["-inf"]}, {"label": "1/512", "mode": "num", "accept": ["0"]}], "why": "48 is far above 15.5 → overflow → **+∞**. −17 = −`1.0001` × 2^{4} would need exponent field 4 + 3 = 7 = `111`, which is reserved → overflow → **−∞** (the sign is kept; it is not an underflow). 1/512 is less than half of the smallest denormal 1/64, so the nearest value is **0**: underflow."}, {"id": "ou-which", "type": "mc", "q": "Which of these is an **underflow** in Minifloat?", "options": ["Storing 1/1000: the result is 0.", "Storing −1000: the result is −∞.", "Storing 9.25: the result is 9.0.", "Storing 3/32: the result is the denormal `0 000 0110`."], "answer": 0, "why": "Underflow = a nonzero value so close to zero that it **rounds to 0**. 1/1000 is below 1/128, so it becomes 0. −1000 is an overflow (too large in size, even though it is negative). 9.25 → 9.0 is ordinary rounding. 3/32 is stored exactly as a denormal (6/64), so nothing is lost at all."}, {"id": "ou-bits", "type": "short", "mode": "bits", "q": "Format: 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits. Its largest normalized value is 240. What bit pattern is stored for **−1000**?", "accept": ["11111000"], "why": "−1000 is beyond −240 → overflow → −∞: sign `1`, exponent all 1s, fraction all 0s = **`1 1111 000`**. `1 1110 111` is −240, the largest finite value; overflow does not clamp to it.", "placeholder": "8 bits"}, {"id": "ou-reserved", "type": "mc", "q": "In Minifloat, why can't **24** (= `1.1` × 2^{4}) be stored, even though 4 + 3 = 7 fits in three bits?", "options": ["Exponent field `111` is reserved for ∞ and NaN, so the largest normalized exponent is 3.", "Its fraction needs more than 4 bits.", "The bias should be subtracted, which gives a field of 1.", "It can be stored: `0 111 1000` is 24."], "answer": 0, "why": "7 = `111` fits in the field, but an all-ones exponent is not available to normalized numbers. The largest normalized field is `110` (exponent 3), so the largest value is `1.1111` × 2^{3} = 15.5 and 24 overflows to +∞. `0 111 1000` is a NaN pattern."}]}, {"id": "hw-style", "title": "\"Can it be encoded?\" and writing the answer", "read": "The homework asks three things about a value in a given format. Expect the same shape on paper.\n\n**1. Can it be encoded?** Exactly one of:\n\n| Answer | When |\n|---|---|\n| yes, as a normalized value | exact, with an exponent field from `0…01` to `1…10` |\n| yes, as a denormalized value | exact, with an exponent field of all 0s |\n| no, not enough precision | inside the range, but the fraction needs more bits than the field has |\n| no, not enough range | too large for the biggest exponent |\n\n**2. Which bits are stored?** For a \"no\": the rounded value (precision), or ±∞ (range).\n\n**3. What is the stored value in decimal?** The value of the bits you wrote, **with its sign**.\n\nWork in this order: binary → normalize → e + bias → normalized or denormalized shape → do the fraction bits fit?\n\n**Worked example. Format: 1 sign bit, 2 exponent bits (bias 1), 4 fraction bits.** Normalized fields are `01` and `10` (exponents 0 and 1). The denormal exponent is 0.\n\n- **−3.375** = −`11.011` = −`1.1011` × 2^{1}. Field 1 + 1 = 2 = `10`; fraction `1011` fits. → **yes, normalized**; `1 10 1011`; **−3.375**.\n- **0.4375** = `0.0111` = `1.11` × 2^{−2}. Field −2 + 1 = −1 → denormal shape `0.0111` × 2^{0}; 4 bits, fits. → **yes, denormalized**; `0 00 0111`; **+0.4375**.\n- **2.90625** = `1.011101` × 2^{1}: six fraction bits. → **no, not enough precision**. Down `1.0111`, up `1.1000`; the dropped bits are `01`, so down. `0 10 0111`; **+2.875**.\n- **0.90625** = `0.11101`: five bits in denormal shape. → **no, not enough precision**. Down `0.1110`, up `0.1111`; a tie, and `1110` ends in 0. `0 00 1110`; **+0.875**.\n- **9** = `1.001` × 2^{3}. Field 3 + 1 = 4 does not fit. → **no, not enough range**; `0 11 0000`; **+Inf**.\n\n> **On paper:** always write the sign, and a leading 0 for values below 1: `+0.875`, `-3.375`, `+Inf`, `-Inf`, `NaN`. The homework wanted an explicit sign on every answer, positives included. Write the classification line too, even when the bits are obviously right.\n\n> **Trap:** for a \"no\", the stored value is the *rounded* one (+2.875), not the number you were asked about (2.90625).\n\n(A value so tiny that it rounds to 0 is an underflow. The homework did not ask you to classify that case.)", "questions": [{"id": "hw-1", "type": "mc", "q": "Format: 1 sign bit, 3 exponent bits (bias 3), 3 fraction bits. Can **−0.21875** (−7/32) be encoded?", "options": ["yes, as a normalized value", "yes, as a denormalized value", "no, not enough precision", "no, not enough range"], "answer": 1, "why": "7/32 = `0.00111` = `1.11` × 2^{−3}. Field needed: −3 + 3 = 0 → not normalized. Denormal shape (exponent 1 − 3 = −2): `0.111` × 2^{−2}, which is exactly 3 fraction bits → **yes, as a denormalized value**: `1 000 111`. \"Not enough range\" is the tempting wrong answer for anything small, but denormals exist precisely to cover this region.", "shuffle": false}, {"id": "hw-2", "type": "blanks", "q": "Format: 1 sign bit, 3 exponent bits (bias 3), 3 fraction bits. The value is **+5.25**.", "blanks": [{"label": "can it be encoded? (type normalized, denormalized, precision or range)", "mode": "text", "accept": ["precision", "not enough precision", "no, not enough precision"], "acceptRe": ["^(no,? ?)?(not enough )?precision$"]}, {"label": "bits stored (round-to-nearest, ties-to-even if needed)", "mode": "bits", "accept": ["0101010"]}, {"label": "stored value in decimal", "mode": "num", "accept": ["5"]}], "why": "No, **not enough precision**. 5.25 = `101.01` = `1.0101` × 2^{2}: 4 fraction bits, the field has 3. Down: `1.010` × 2^{2} = 5. Up: `1.011` × 2^{2} = 5.5. 5.25 is exactly halfway (a tie), so take the candidate whose last fraction bit is 0: that is the round-down one. Stored: **`0 101 010`** = **5**. Written the homework way: `+5`. Answering 5.25 for the stored value repeats the question instead of decoding the bits you wrote."}, {"id": "hw-3", "type": "blanks", "q": "Format: 1 sign bit, 2 exponent bits (bias 1), 5 fraction bits. The value is **−7.5**.", "blanks": [{"label": "can it be encoded? (type normalized, denormalized, precision or range)", "mode": "text", "accept": ["range", "not enough range", "no, not enough range"], "acceptRe": ["^(no,? ?)?(not enough )?range$"]}, {"label": "bits stored", "mode": "bits", "accept": ["11100000"]}, {"label": "stored value (type inf or -inf if needed)", "mode": "num", "accept": ["-inf"]}], "why": "7.5 = `111.1` = `1.111` × 2^{2}. Exponent field 2 + 1 = 3 = `11`, which is all 1s and therefore reserved: the largest normalized exponent here is 1 (largest value 3.9375). → **no, not enough range**. Stored: −∞ = **`1 11 00000`**, written `-Inf`. The fraction `111` would have fit, so this is not a precision problem."}, {"id": "hw-sign", "type": "short", "mode": "text", "q": "Decode the Minifloat `0 100 1000` and type the answer exactly the way the homework wanted it: with an explicit sign.", "accept": ["+3", "+3.0"], "why": "Sign `0` → positive. Exponent `100` = 4, 4 − 3 = 1. `1.1000` × 2^{1} = `11` = **3**. Written the homework way that is **`+3`**. A bare `3` has the right value but not the required sign.", "placeholder": "sign and value", "acceptRe": ["^\\+ ?3(\\.0+)?$"]}]}], "checkpoint": [{"id": "cp2-classify", "type": "blanks", "q": "Format: 1 sign bit, 3 exponent bits (bias 3), 5 fraction bits. Give the value of each pattern. Type `inf`, `-inf` or `nan` for special values; fractions are fine.", "blanks": [{"label": "`0 000 10100`", "mode": "num", "accept": ["0.15625", "5/32"]}, {"label": "`1 111 00000`", "mode": "num", "accept": ["-inf"]}, {"label": "`0 110 10000`", "mode": "num", "accept": ["12"]}, {"label": "`1 111 00100`", "mode": "num", "accept": ["nan"]}], "why": "Exponent field first. `000` with a nonzero fraction → denormalized: `0.10100` × 2^{−2} = 5/8 × 1/4 = **5/32**. `111` with fraction 0 and sign 1 → **−∞**. `110` → normalized: 6 − 3 = 3, `1.1` × 2^{3} = **12**. `111` with a nonzero fraction → **NaN**. Decoding the first one as `1.101` × 2^{−3} = 13/64 treats a denormal as normalized."}, {"id": "cp2-landmarks", "type": "blanks", "q": "A 10-bit format has 1 sign bit, 4 exponent bits and 5 fraction bits, with the standard bias. Fractions and powers of two (`2^-9`) are fine.", "blanks": [{"label": "bias", "mode": "num", "accept": ["7"]}, {"label": "denormal exponent", "mode": "num", "accept": ["-6"]}, {"label": "smallest positive denormalized value", "mode": "num", "accept": ["1/2048", "2^-11"]}, {"label": "largest denormalized value", "mode": "num", "accept": ["31/2048"]}, {"label": "smallest positive normalized value", "mode": "num", "accept": ["1/64", "2^-6"]}, {"label": "largest normalized value", "mode": "num", "accept": ["252"]}], "why": "Bias 2^{3} − 1 = **7**; denormal exponent 1 − 7 = **−6**. Smallest denormal `0 0000 00001` = `0.00001` × 2^{−6} = 2^{−11} = **1/2048**. Largest denormal `0 0000 11111` = 31/32 × 1/64 = **31/2048**. Smallest normalized `0 0001 00000` = 2^{−6} = **1/64** (= 32/2048, the next step up). Largest normalized `0 1110 11111` = `1.11111` × 2^{7} = **252**. Using exponent −7 for the denormals, or field `1111` for the largest value, are the two traps.", "hint": "Do not calculate from formulas. Write each landmark's bit pattern, then decode it."}, {"id": "cp2-enc-small", "type": "blanks", "q": "Format: 1 sign bit, 3 exponent bits (bias 3), 5 fraction bits. Encode both values.", "blanks": [{"label": "−11/64: normalized or denormalized?", "mode": "text", "accept": ["denormalized", "denormal", "denorm", "subnormal", "yes, as a denormalized value", "yes, denormalized"], "acceptRe": ["^(yes,? ?)?(as an? )?(de-?norm(al(i[sz]ed)?)?|subnormal)( value| number)?$"]}, {"label": "−11/64: bit pattern", "mode": "bits", "accept": ["100010110"]}, {"label": "+19/64: normalized or denormalized?", "mode": "text", "accept": ["normalized", "normal", "norm", "yes, as a normalized value", "yes, normalized"], "acceptRe": ["^(yes,? ?)?(as an? )?norm(al(i[sz]ed)?)?( value| number)?$"]}, {"label": "+19/64: bit pattern", "mode": "bits", "accept": ["000100110"]}], "why": "**−11/64:** 11/64 = `0.001011` = `1.011` × 2^{−3}. Field needed: −3 + 3 = 0, which is not ≥ 1 → denormalized. Rewrite with exponent 1 − 3 = −2: `0.1011` × 2^{−2}. Fraction `10110`, exponent field `000`. Sign bit `1`. → **`1 000 10110`**. **+19/64:** 19/64 = `0.010011` = `1.0011` × 2^{−2}. Exponent field −2 + 3 = 1 = `001`. Fraction `0011` → `00110`. Sign bit `0`. → **`0 001 00110`**. The two values are close together but sit on opposite sides of 1/4, the smallest normalized value of this format."}, {"id": "cp2-carry", "type": "blanks", "q": "Minifloat. **7.875** has to be stored. (Careful with the round-up candidate.)", "blanks": [{"label": "round-down candidate (decimal)", "mode": "num", "accept": ["7.75", "31/4"]}, {"label": "round-up candidate (decimal)", "mode": "num", "accept": ["8"]}, {"label": "bit pattern stored", "mode": "bits", "accept": ["01100000"]}], "why": "7.875 = `111.111` = `1.11111` × 2^{2}. Down: `1.1111` × 2^{2} = 7.75 (`0 101 1111`). Up: add 1 in the last place: `1.1111` + `0.0001` = `10.0000`, so the candidate is `10.0000` × 2^{2} = `1.0000` × 2^{3} = 8.0 (`0 110 0000`); the carry moves it into the next exponent. 7.875 is exactly halfway. The fraction ending in 0 is 8.0's → stored **`0 110 0000`** = 8.0. Assuming ties round down gives `0 101 1111`.", "hint": "Add 1 in the last place of `1.1111` and watch what happens to the left of the point."}, {"id": "cp2-round-denorm", "type": "blanks", "q": "Format: 1 sign bit, 2 exponent bits (bias 1), 4 fraction bits. The value is **0.71875** (23/32).", "blanks": [{"label": "can it be encoded? (type normalized, denormalized, precision or range)", "mode": "text", "accept": ["precision", "not enough precision", "no, not enough precision"], "acceptRe": ["^(no,? ?)?(not enough )?precision$"]}, {"label": "bits stored (round-to-nearest, ties-to-even if needed)", "mode": "bits", "accept": ["0001100"]}, {"label": "stored value in decimal", "mode": "num", "accept": ["0.75", "3/4"]}], "why": "No, **not enough precision**. 0.71875 = `0.10111`, a denormal-sized value: `0.10111` × 2^{0} needs 5 fraction bits, the field has 4. Down: `0.1011` × 2^{0} = 0.6875. Up: `0.1100` × 2^{0} = 0.75. 0.71875 is exactly halfway (a tie), so take the candidate whose last fraction bit is 0: that is the round-up one. Stored: **`0 00 1100`** = **0.75**. Written the homework way: `+0.75`. Rounding applies to denormals exactly as it does to normalized values."}, {"id": "cp2-boundary", "type": "mc", "q": "Format: 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits. Can **0.0078125** (1/128 = 2^{−7}) be encoded?", "options": ["yes, as a normalized value", "yes, as a denormalized value", "no, not enough precision", "no, not enough range"], "answer": 1, "why": "1/128 = `1.0` × 2^{−7}. Field needed: −7 + 7 = **0**, and 0 is the denormal code, so it is not normalized. Denormal shape (exponent 1 − 7 = −6): `0.1` × 2^{−6} → fraction `100` fits → **yes, as a denormalized value**, `0 0000 100`. \"Normalized\" is the tempting answer because the value is a clean power of two; the smallest normalized value here is 2^{−6} = 1/64.", "shuffle": false}, {"id": "cp2-sign", "type": "short", "mode": "text", "q": "Format: 1 sign bit, 2 exponent bits (bias 1), 4 fraction bits. Decode `0 01 0100` and type the answer the way the homework wanted it (explicit sign).", "accept": ["+1.25", "+5/4", "+1 1/4"], "why": "Sign `0` → positive. Exponent `01` = 1, 1 − 1 = 0. `1.0100` × 2^{0} = `1.01` = **1.25**. Homework style: **`+1.25`**. Reading the field `01` as a denormal (it is not all 0s) would give 0.25.", "placeholder": "sign and value", "acceptRe": ["^\\+ ?1\\.250*$"]}, {"id": "cp2-add-overflow", "type": "short", "mode": "num", "q": "Minifloat's largest value is 15.5. A program adds 15.5 + 15.5 in Minifloat. What value is stored in the result? (Type `inf`, `-inf` or `nan` if it is a special value.)", "accept": ["inf"], "why": "The exact sum is 31 = `1.1111` × 2^{4}, which would need exponent field 7 = `111` (reserved). It is larger than the largest finite value, so it **overflows to +∞** (`0 111 0000`). It does not \"stick\" at 15.5, and it is not NaN: NaN is for undefined operations such as 0/0.", "placeholder": "value"}, {"id": "cp2-full", "type": "blanks", "q": "Paper-style. Format: 1 sign bit, 3 exponent bits (bias 3), 3 fraction bits (7 bits). For each value give the classification (type normalized, denormalized, precision or range) and the bits that are stored (round-to-nearest, ties-to-even).", "blanks": [{"label": "+0.875: classification", "mode": "text", "accept": ["normalized", "normal", "norm", "yes, as a normalized value", "yes, normalized"], "acceptRe": ["^(yes,? ?)?(as an? )?norm(al(i[sz]ed)?)?( value| number)?$"]}, {"label": "+0.875: bits", "mode": "bits", "accept": ["0010110"]}, {"label": "−0.09375 (−3/32): classification", "mode": "text", "accept": ["denormalized", "denormal", "denorm", "subnormal", "yes, as a denormalized value", "yes, denormalized"], "acceptRe": ["^(yes,? ?)?(as an? )?(de-?norm(al(i[sz]ed)?)?|subnormal)( value| number)?$"]}, {"label": "−0.09375: bits", "mode": "bits", "accept": ["1000011"]}, {"label": "+2.6875: classification", "mode": "text", "accept": ["precision", "not enough precision", "no, not enough precision"], "acceptRe": ["^(no,? ?)?(not enough )?precision$"]}, {"label": "+2.6875: bits", "mode": "bits", "accept": ["0100011"]}, {"label": "−18: classification", "mode": "text", "accept": ["range", "not enough range", "no, not enough range"], "acceptRe": ["^(no,? ?)?(not enough )?range$"]}, {"label": "−18: bits", "mode": "bits", "accept": ["1111000"]}], "why": "**0.875** = `0.111` = `1.11` × 2^{−1}: field −1 + 3 = 2 → normalized, `0 010 110`. **−3/32** = −`0.00011` = −`1.1` × 2^{−4}: field −1 → denormal shape `0.011` × 2^{−2} fits → denormalized, `1 000 011`. **2.6875** = `10.1011` = `1.01011` × 2^{1}: five fraction bits → not enough precision; down `1.010` (2.5), up `1.011` (2.75), dropped bits `11` → up → `0 100 011` (+2.75). **−18** = −`1.001` × 2^{4}: field 7 = `111` is reserved (largest value is 15) → not enough range → `1 111 000` (−Inf).", "hint": "For each value: binary, normalize, e + bias. Then ask whether the fraction bits fit in 3."}, {"id": "cp2-minus3", "type": "mc", "q": "Suppose Minifloat's denormals used the exponent 0 − bias = −3 instead of 1 − bias = −2. What would go wrong?", "options": ["The largest denormal would be 15/128, leaving a hole before the smallest normalized value, 32/128.", "Nothing: `0.xxxx` × 2^{−3} produces the same set of values.", "The denormals would overlap the normalized numbers above 0.25.", "Zero could no longer be represented."], "answer": 0, "why": "With exponent −3 the denormals would be `0.xxxx` × 2^{−3} = k/128 for k = 1…15, ending at 15/128 ≈ 0.117. The next value up would be the smallest normalized number, 0.25 = 32/128: a jump of 17/128 in a region where the step is 1/128. With 1 − bias the largest denormal (15/64) and the smallest normalized (16/64) are adjacent."}, {"id": "cp2-why-denorm", "type": "self", "lines": 8, "q": "Explain in 3 or 4 sentences: (a) what problem denormalized numbers solve, (b) how a denormalized value is computed from its bits, and (c) why its exponent is 1 − bias rather than 0 − bias.", "model": "(a) Normalized numbers have an implicit leading 1, so none can be smaller than `1.0…0` × 2^{1 − bias}; that leaves a large gap between 0 and the smallest normalized value, and anything in the gap would round to 0 or jump up. (b) When the exponent field is all 0s and the fraction is not zero, the leading bit is an implicit 0 and the value is (−1)^{S} × `0.fraction` × 2^{1 − bias}. (c) 1 − bias is the same exponent the smallest normalized numbers use, so only the leading bit changes; the largest denormal and the smallest normalized number are then adjacent (15/64 and 16/64 in Minifloat) with the same spacing, and there is no hole.", "rubric": ["names the gap between 0 and the smallest normalized number", "blames the implicit leading 1 for the gap", "denormal = exponent field all 0s, fraction nonzero, implicit leading 0", "value = `0.f` × 2^{1 − bias}", "1 − bias matches the smallest normalized exponent, so the transition is smooth / values are adjacent"], "why": "\"Why do denormals exist\" and \"why 1 − bias\" were both asked out loud in lecture, and both have one-line answers: the implicit 1 leaves a gap at zero; 1 − bias keeps the pattern continuous."}]}, {"id": "fp-in-c", "title": "Floating point 3: range vs precision, and floating point in C", "blurb": "Explain the range / precision tradeoff, know float vs double cold, and predict what C does with 0.1 + 0.2, ==, x + delta, loops that add 0.1, overflow and underflow.", "objective": "Objective 3: Floating point", "sources": "CL13 · CL15", "minutes": 60, "cheats": ["Exponent bits → range. Fraction bits → precision. The total is fixed, so more of one means less of the other.", "`float` = 32 bits: 1 | 8 | 23, bias 127. `double` = 64 bits: 1 | 11 | 52, bias 1023. Denormal exponents −126 and −1022. float: smaller, faster. double: more accurate.", "0.1, 0.2 and 0.3 have no finite binary expansion, so each is rounded: `0.1 + 0.2 == 0.3` is false. Exact only if the denominator is a power of two.", "Never `==` on floating point. Use `fabs(a - b) < DBL_EPSILON` (`fabs` from `<math.h>`; `DBL_EPSILON` and `FLT_EPSILON` from `<float.h>`).", "`x + d == x` can be true with d ≠ 0: not enough precision to represent x + d, so it rounds back to x. At x = 1.0 the first such power of ten is 1e-8 for float and 1e-16 for double.", "A double has 52 fraction bits, a float 23, so doubles near 1.0 are much more closely spaced (about 2.2e-16 apart versus 1.2e-7).", "Errors accumulate in loops: ten additions of 0.1 are not 1.0. Count with an `int`; never use `==` or `!=` on a double as the loop test.", "Overflow: too large in size → ±∞. Underflow: not zero but too close to zero → rounds to 0. FP16 (1 | 5 | 10) overflows sooner; BF16 (1 | 8 | 7) rounds more."], "chunks": [{"id": "tradeoff", "title": "Range vs precision: one budget of bits", "read": "A format has a fixed number of bits. Every bit given to one field is taken from another:\n\n- **Exponent bits set the range**: how large, and how close to zero, a number can be.\n- **Fraction bits set the precision**: how finely neighbouring numbers can be told apart.\n\n> **Rule:** more exponent bits → more range, less precision. More fraction bits → more precision, less range.\n\nLecture showed this with three ways of splitting Microfloat's 4 bits (no sign, no bias, value = `1.f` × 2^{E}):\n\n| Version | Exponent bits | Fraction bits | Largest value | Step just above 1 |\n|---|---|---|---|---|\n| V2 | 1 | 3 | 3.75 | 0.125 |\n| V1 | 2 | 2 | 14 | 0.25 |\n| V3 | 3 | 1 | 192 | 0.5 |\n\nV3 reaches 192 in only four bits, but after 1 its next value is 1.5: it cannot store 1.25 at all. V2 has steps of 0.125 near 1 but tops out at 3.75. V1 is the \"happy medium\".\n\nA **range** failure: the number is too big (or too close to zero) for any exponent the field can hold. A **precision** failure: the number is inside the range but falls between two representable values, so it has to be rounded.\n\nThe step is not constant either. Each time the exponent goes up by one, the step doubles: in V3 the steps run 0.5, 1, 2, 4, … up to 64 between 128 and 192. Large numbers are stored coarsely.\n\n**Worked example.** A 6-bit toy format (no sign, no bias) could be split as 2 exponent + 4 fraction bits, or as 4 exponent + 2 fraction bits.\n\n- 2 + 4: largest = `1.1111` × 2^{3} = 15.5. Step just above 1 = 2^{−4} = 0.0625.\n- 4 + 2: largest = `1.11` × 2^{15} = 57344. Step just above 1 = 2^{−2} = 0.25.\n\nWhich is \"better\" depends on the data. Values that stay in a small range want precision; values that swing widely want range. The real formats in the next part are engineering compromises between the two.", "questions": [{"id": "to-move", "type": "mc", "q": "A designer takes one bit away from the fraction field and gives it to the exponent field. The total number of bits stays the same. What happens?", "options": ["Range increases and precision decreases.", "Precision increases and range decreases.", "Both range and precision increase.", "Nothing changes, because the total number of bits is the same."], "answer": 0, "why": "Exponent bits control range; fraction bits control precision. One more exponent bit doubles how many different exponents the field can hold, and one fewer fraction bit doubles the step between neighbours. With a fixed bit budget you cannot gain both."}, {"id": "to-compare", "type": "blanks", "q": "Two 5-bit toy formats with no sign bit, no bias and no reserved patterns (value = `1.f` × 2^{E}).\n\n- **A:** 3 exponent bits, 2 fraction bits\n- **B:** 2 exponent bits, 3 fraction bits", "blanks": [{"label": "largest value in A", "mode": "num", "accept": ["224"]}, {"label": "largest value in B", "mode": "num", "accept": ["15"]}, {"label": "gap between 1.0 and the next value in A", "mode": "num", "accept": ["0.25", "1/4"]}, {"label": "gap between 1.0 and the next value in B", "mode": "num", "accept": ["0.125", "1/8"]}], "why": "A: `1.11` × 2^{7} = **224**; the last fraction bit is worth 2^{−2} = **0.25**. B: `1.111` × 2^{3} = **15**; the last fraction bit is worth 2^{−3} = **0.125**. A has the range, B has the precision. Giving B's largest as 14 forgets the third fraction bit."}, {"id": "to-fail", "type": "mc", "q": "Same two toy formats (no sign bit, no bias, no reserved patterns, value = `1.f` × 2^{E}). **20** cannot be stored in B (2 exponent bits, 3 fraction bits), and **1.125** cannot be stored in A (3 exponent bits, 2 fraction bits). Which limit does each one hit?", "options": ["20 in B: not enough range. 1.125 in A: not enough precision.", "20 in B: not enough precision. 1.125 in A: not enough range.", "Both: not enough range.", "Both: not enough precision."], "answer": 0, "why": "20 = `1.01` × 2^{4}: the fraction `01` fits B's 3 bits, but exponent 4 does not fit in 2 bits (max 3) → **range**. 1.125 = `1.001` × 2^{0}: exponent 0 is fine, but `001` needs 3 fraction bits and A has 2 → **precision**. Each format stores the other one's problem value exactly."}]}, {"id": "ieee", "title": "IEEE-754: `float` and `double`", "read": "Real machines use the **IEEE-754** standard (established in 1985). It is Minifloat with more bits: the same three fields, the same bias formula, the same special cases.\n\n| Property | `float` (single precision) | `double` (double precision) |\n|---|---|---|\n| Total bits | 32 | 64 |\n| Sign bits | 1 | 1 |\n| Exponent bits | 8 | 11 |\n| Bias | 127 | 1023 |\n| Fraction bits | 23 | 52 |\n| Bit positions | sign 31, exponent 30–23, fraction 22–0 | sign 63, exponent 62–52, fraction 51–0 |\n\nBoth biases come from 2^{k−1} − 1: 2^{7} − 1 = 127 and 2^{10} − 1 = 1023. Check that the widths add up: 1 + 8 + 23 = 32 and 1 + 11 + 52 = 64. (It is 52, not 53. The 53rd bit of precision is the implicit leading 1, which is not stored.)\n\n\"The same rules apply as with minifloat\": exponent all 0s → zero or denormalized; all 1s → ∞ or NaN; anything else → normalized. The denormal exponent is still 1 − bias: **−126** for `float`, **−1022** for `double`. Derive these; the slides do not list them.\n\n| Aspect | `float` | `double` |\n|---|---|---|\n| Accuracy | smaller range, less precision | larger range, more precision |\n| Storage | less space (4 bytes) | more space (8 bytes) |\n| Speed | faster | slower |\n\nSo the reason to choose `float` is space and speed, and the reason to choose `double` is accuracy.\n\nThe arithmetic is done by hardware **floating-point units (FPUs)** that follow the IEEE-754 rules. That is why the same calculation gives the same result, with the same rounding errors, on different machines.\n\n**Worked example: decode the `float` with bits `0xC1700000`.**\nIn binary: `1100 0001 0111 0000 0000 …`. Re-split 1 | 8 | 23: sign `1`, exponent `10000010`, fraction `111` followed by zeros.\nExponent 130 − 127 = 3. `1.111` × 2^{3} = `1111` = 15. Sign 1 → **−15.0**.\n\nSame recipe as Minifloat. Only the widths and the bias changed.", "questions": [{"id": "ieee-float", "type": "blanks", "q": "Fill in for a C `float` (IEEE-754 single precision).", "blanks": [{"label": "total bits", "mode": "num", "accept": ["32"]}, {"label": "exponent bits", "mode": "num", "accept": ["8"]}, {"label": "fraction bits", "mode": "num", "accept": ["23"]}, {"label": "bias", "mode": "num", "accept": ["127"]}], "why": "1 sign + **8** exponent + **23** fraction = **32** bits. Bias = 2^{7} − 1 = **127**. Answering 24 fraction bits counts the implicit leading 1, which is not stored."}, {"id": "ieee-double", "type": "blanks", "q": "Fill in for a C `double` (IEEE-754 double precision).", "blanks": [{"label": "exponent bits", "mode": "num", "accept": ["11"]}, {"label": "fraction bits", "mode": "num", "accept": ["52"]}, {"label": "bias", "mode": "num", "accept": ["1023"]}, {"label": "exponent of a denormalized double", "mode": "num", "accept": ["-1022"]}], "why": "1 + **11** + **52** = 64 bits. Bias = 2^{10} − 1 = **1023**. Denormal exponent = 1 − bias = **−1022** (−1023 is the 0 − bias mistake). 53 is the number of significant bits including the implicit 1; the field itself is 52."}, {"id": "ieee-hex", "type": "short", "mode": "num", "q": "Decode the `float` whose 32 bits are `0x40B00000`.", "accept": ["5.5", "11/2"], "why": "`0x40B0…` = `0100 0000 1011 0000 …`. Re-split 1 | 8 | 23: sign `0`, exponent `10000001` = 129, fraction `011` then zeros. 129 − 127 = 2. `1.011` × 2^{2} = `101.1` = **+5.5**. Taking the first hex digit pair `0x40` = 64 as the exponent is the trap: the exponent starts one bit in, after the sign.", "placeholder": "value", "hint": "Write out the first 12 bits, then take 1 bit of sign and the next 8 as the exponent."}, {"id": "ieee-why-float", "type": "mc", "q": "According to lecture, why would you ever choose `float` over `double`?", "options": ["It uses less space and is faster, at the cost of accuracy.", "It has a larger range, because its bias is smaller.", "It stores decimal values such as 0.1 exactly.", "It cannot overflow to infinity."], "answer": 0, "why": "Single precision: less space, faster, **less accurate** (smaller range and less precision). Double precision: more space, slower, more accurate. Sometimes speed and memory matter more than the extra accuracy. Both types have the same special values and both round 0.1."}]}, {"id": "not-exact", "title": "Why 0.1 is not 0.1", "read": "A number can be stored exactly only if it is a sum of powers of two that fits in the fraction bits. 0.5 = 1/2, 0.375 = 1/4 + 1/8 and 2.75 = 2 + 1/2 + 1/4 are fine.\n\n0.1 is not. In binary, one tenth is\n\n```\n0.1 (decimal) = 0.0001100110011001100110011... (binary; the 0011 repeats forever)\n```\n\njust as 1/3 = 0.3333… never ends in decimal. A `double` keeps as many of those bits as it has room for and **rounds the rest**. So the variable does not hold 0.1. It holds the nearest double to 0.1.\n\n> **Lecture:** \"Since floating-point numbers have a limited number of bits, many real numbers cannot be represented exactly and must be rounded to the nearest representable value.\"\n\n```c\ndouble a = 0.1;\ndouble b = 0.2;\nprintf(\"%.23f\\n\", a);       // 0.10000000000000000555112\nprintf(\"%.23f\\n\", b);       // 0.20000000000000001110223\nprintf(\"%.23f\\n\", a + b);   // 0.30000000000000004440892\nprintf(\"%.23f\\n\", 0.3);     // 0.29999999999999998889777\n```\n\nThree roundings happen: 0.1 is rounded, 0.2 is rounded, and their sum is rounded again. The result is a different double from the one you get by rounding 0.3 directly. So\n\n```c\n0.1 + 0.2 == 0.3      // false (evaluates to 0)\n```\n\n> **Trap:** printing with few digits hides the error. `printf(\"%.1f\", a + b)` prints `0.3`, and plain `%f` prints `0.300000`. The comparison is still false.\n\nSums of exactly representable values behave: `0.5 + 0.25 == 0.75` is true, because 1/2, 1/4 and 3/4 all fit.\n\n> **Rule:** \"is it exact?\" Write the value as a fraction in lowest terms. If the denominator is a power of two (2, 4, 8, 16, …) the binary expansion ends. 0.375 = 3/8: exact. 0.1 = 1/10, 0.2 = 1/5, 0.3 = 3/10, 0.7 = 7/10: not exact (there is a factor of 5 in the denominator).\n\nThis is the \"not enough precision\" you met in Minifloat, with 52 fraction bits instead of 4.", "questions": [{"id": "ne-exact", "type": "mc", "q": "Which of these values are stored **exactly** in a `double`? Select all that apply.", "options": ["`0.5`", "`0.1`", "`0.375`", "`0.7`", "`2.75`"], "answer": [0, 2, 4], "why": "0.5 = 1/2, 0.375 = 3/8 and 2.75 = 11/4 have power-of-two denominators, so their binary expansions end (`0.1`, `0.011`, `10.11`). 0.1 = 1/10 and 0.7 = 7/10 have a factor of 5 in the denominator, so in binary they repeat forever and must be rounded."}, {"id": "ne-prints", "type": "blanks", "q": "What does each line print?\n\n```c\nprintf(\"%d\\n\", 0.1 + 0.2 == 0.3);     // line 1\nprintf(\"%d\\n\", 0.5 + 0.25 == 0.75);   // line 2\nprintf(\"%.1f\\n\", 0.1 + 0.2);          // line 3\n```", "blanks": [{"label": "line 1", "mode": "num", "accept": ["0"]}, {"label": "line 2", "mode": "num", "accept": ["1"]}, {"label": "line 3", "mode": "text", "accept": ["0.3"]}], "why": "Line 1: **0**. 0.1, 0.2 and 0.3 are all rounded, and the rounded sum (0.30000000000000004…) is not the rounded 0.3 (0.29999999999999998…). Line 2: **1**. 0.5, 0.25 and 0.75 are exact, so the sum is exact. Line 3: **0.3**. One decimal place hides the error; the stored value is still not the double for 0.3."}, {"id": "ne-why", "type": "mc", "q": "Why is `0.1 + 0.2 == 0.3` false in C (with doubles)?", "options": ["0.1, 0.2 and 0.3 cannot be represented exactly, so each is rounded; the rounded sum is a different double from the rounded 0.3.", "`==` on doubles compares where the two values are stored, not the values themselves.", "The addition overflows the 52 fraction bits, so the result is NaN.", "0.1 + 0.2 is computed as a `float`, while 0.3 is stored as a `double`."], "answer": 0, "why": "It is a **precision** (rounding) effect. None of the three decimals has a finite binary expansion, so each is stored as its nearest double, and the sum is rounded once more. Nothing overflows, no NaN appears, and `==` really does compare the values: they are simply not the same value."}]}, {"id": "epsilon", "title": "Never `==`: compare with an epsilon", "read": "Because of rounding error, two calculations that \"should\" give the same number often differ in their last bits. So:\n\n> **Rule:** do not compare floating-point values with `==`. Check whether they are **close enough**.\n\n\"Close enough\" means the distance between them is smaller than a small threshold called **epsilon** (ε):\n\n```c\nfabs(a - b) < EPSILON\n```\n\nRead it as: subtract, take the absolute value, compare that distance with the threshold.\n\n- `fabs` is the floating-point absolute value, from `<math.h>`.\n- `<float.h>` provides ready-made thresholds: `FLT_EPSILON` (1.19209290e-7F) for `float` and `DBL_EPSILON` (2.2204460492503131e-16) for `double`.\n\n**Worked example** (lecture's program, trimmed):\n\n```c\n#include <float.h>\n#include <math.h>\n#include <stdio.h>\n\nint are_equal(double a, double b) {\n    return fabs(a - b) < DBL_EPSILON;\n}\n\nint main(void) {\n    double z = 0.1 + 0.2;\n    double exp_res = 0.3;\n    printf(\"%d\\n\", z == exp_res);            // 0\n    printf(\"%d\\n\", are_equal(z, exp_res));   // 1\n    return 0;\n}\n```\n\nThe two values differ by about 5.6e-17, which is less than `DBL_EPSILON` (about 2.2e-16), so `are_equal` returns 1.\n\nThree ways to get the pattern wrong:\n\n| Wrong version | Why it is wrong |\n|---|---|\n| `a - b < DBL_EPSILON` | no absolute value: true whenever a is smaller than b, however far apart they are |\n| `abs(a - b) < DBL_EPSILON` | `abs` is the **integer** absolute value; it drops the fraction first, so 1.0 and 1.7 look \"equal\" |\n| `fabs(a - b) == 0` | still an exact comparison |\n\n`DBL_EPSILON` is the gap between 1.0 and the next double, so this exact test suits values of about size 1 or smaller. That is the version lecture taught, so write it as shown.", "questions": [{"id": "eps-expr", "type": "short", "mode": "code", "q": "Write the C expression that is true when the doubles `a` and `b` are closer together than `DBL_EPSILON`.", "accept": ["fabs(a-b)<DBL_EPSILON", "fabs(b-a)<DBL_EPSILON", "fabs(a-b)<=DBL_EPSILON", "fabs(b-a)<=DBL_EPSILON", "DBL_EPSILON>fabs(a-b)", "DBL_EPSILON>fabs(b-a)", "(fabs(a-b)<DBL_EPSILON)", "(fabs(b-a)<DBL_EPSILON)", "fabs(a-b)<DBL_EPSILON?1:0", "return fabs(a-b)<DBL_EPSILON"], "why": "**`fabs(a - b) < DBL_EPSILON`**: subtract, absolute value, compare the distance with the threshold. `a == b` is the thing to avoid, `abs` is the integer version, and leaving `fabs` out makes the test true whenever a is less than b.", "placeholder": "fabs(…) < …"}, {"id": "eps-headers", "type": "blanks", "q": "Which header file provides each of these? (Type the file name, like `stdio.h`.)", "blanks": [{"label": "`fabs`", "mode": "text", "accept": ["math.h", "<math.h>", "#include <math.h>"]}, {"label": "`DBL_EPSILON` and `FLT_EPSILON`", "mode": "text", "accept": ["float.h", "<float.h>", "#include <float.h>"]}], "why": "`fabs` is a math function → **`math.h`**. The epsilon constants describe the floating-point types → **`float.h`**. `stdlib.h` has `abs`, the integer version, which is the wrong function here."}, {"id": "eps-bug", "type": "mc", "q": "`same(1.0, 5.0)` returns 1. What is the bug?\n\n```c\nint same(double a, double b) {\n    return a - b < DBL_EPSILON;\n}\n```", "options": ["There is no absolute value: a − b is −4, and −4 is less than epsilon.", "`DBL_EPSILON` is too large a threshold for values near 1.", "It should use `FLT_EPSILON`, because the literals have no `f` suffix.", "It should compare with `<=` instead of `<`."], "answer": 0, "why": "1.0 − 5.0 = −4.0, and a negative number is always below a positive threshold, so the function says \"equal\". The distance must be non-negative: `fabs(a - b) < DBL_EPSILON`. With `fabs` the same call returns 0."}, {"id": "eps-write", "type": "self", "lines": 8, "q": "Write a C function `int close_enough(float a, float b)` that returns 1 when the two floats are within `FLT_EPSILON` of each other and 0 otherwise. Include the `#include` lines it needs.", "model": "```c\n#include <float.h>\n#include <math.h>\n\nint close_enough(float a, float b) {\n    return fabs(a - b) < FLT_EPSILON;\n}\n```", "rubric": ["`#include <math.h>` (for `fabs`)", "`#include <float.h>` (for `FLT_EPSILON`)", "subtracts one value from the other", "takes the absolute value with `fabs` (not `abs`)", "compares the distance with `< FLT_EPSILON`; no `==` anywhere", "returns the result of the comparison"], "why": "A comparison in C already evaluates to 1 or 0, so it can be returned directly; an `if` that returns 1 or 0 is equally fine. The whole pattern is one line: `fabs(a - b) < EPSILON`."}]}, {"id": "absorb", "title": "Adding a small number that changes nothing", "read": "Lecture's exercise:\n\n```c\nfloat x = 1.0;\nfloat delta = 0.1;\nif (x + delta == x) printf(\"Adding delta had NO effect!\\n\");\nelse                printf(\"Adding delta changed x.\\n\");\n```\n\nMake `delta` ten times smaller on each run. At some point adding it stops doing anything, even though `delta` is not zero.\n\n| Starting value | Last power of 10 that still changes x | First power of 10 with **no effect** |\n|---|---|---|\n| `float x = 1.0` | 1e-7 (`0.0000001`) | **1e-8** (`0.00000001`) |\n| `double x = 1.0` | 1e-15 | **1e-16** (`0.0000000000000001`) |\n\n**Why?** Lecture's answer: \"Both x and delta are representable. The problem is that there is not enough precision to represent x + delta.\" The exact sum 1.00000001 falls between two neighbouring floats: 1.0 and the next float up, about 1.00000012. It is rounded to the nearer one, which is 1.0. So `x + delta` *is* `x`.\n\nThis is rounding again, exactly like storing 9.25 in Minifloat. The floats just above 1.0 are 2^{−23} ≈ 1.19e-7 apart (that number is `FLT_EPSILON`). A delta smaller than **half that gap** rounds back down:\n\n- 1e-7 is more than half of 1.19e-7 → the sum rounds up → x changes.\n- 1e-8 is less than half → the sum rounds back → no effect.\n\n**Why can a double take a much smaller delta?** \"A double has 52 fraction bits, while a float has 23 fraction bits. Therefore, representable double values around 1.0 are much more closely spaced.\" The gap above 1.0 is 2^{−52} ≈ 2.2e-16 (`DBL_EPSILON`), so 1e-15 still registers and 1e-16 does not.\n\nThe gap grows with x (it doubles with each exponent). A `float` near 16,777,216 (2^{24}) has neighbours 2 apart, so:\n\n```c\nfloat big = 16777216.0f;\nfloat one = 1.0f;\nprintf(\"%d\\n\", big + one == big);   // 1: adding 1 had no effect\n```\n\n> **On paper:** 10^{−n} has n − 1 zeros between the point and the 1, so `0.00000001` (seven zeros) is 1e-8. For double, 1e-17 has no effect either, but **1e-16** is the first power of ten with no effect, and it is the slide's answer.", "questions": [{"id": "ab-prints", "type": "blanks", "q": "Each fragment is followed by `printf(\"%d\\n\", x + delta == x);`. What is printed?\n\n```c\nfloat  x = 1.0;  float  delta = 0.0000001;            // (a)\nfloat  x = 1.0;  float  delta = 0.00000001;           // (b)\ndouble x = 1.0;  double delta = 0.00000001;           // (c)\ndouble x = 1.0;  double delta = 0.0000000000000001;   // (d)\n```", "blanks": [{"label": "(a)", "mode": "num", "accept": ["0"]}, {"label": "(b)", "mode": "num", "accept": ["1"]}, {"label": "(c)", "mode": "num", "accept": ["0"]}, {"label": "(d)", "mode": "num", "accept": ["1"]}], "why": "(a) delta = 1e-7 (six zeros): still changes a float → **0**. (b) 1e-8 (seven zeros): the first power of ten a float absorbs → **1**. (c) the same 1e-8 in a double: doubles are far more closely spaced, so x changes → **0**. (d) 1e-16: the first power of ten a double absorbs → **1**. Miscounting the zeros in (a) and (b) is the usual slip."}, {"id": "ab-why", "type": "mc", "q": "`delta` is not zero. Why can `x + delta == x` still be true?", "options": ["There is not enough precision to represent x + delta, so the sum is rounded back to x.", "delta is too small to be represented, so it is stored as 0.", "The addition underflows, and an underflow leaves x unchanged.", "`==` ignores any difference smaller than `FLT_EPSILON`."], "answer": 0, "why": "Lecture's wording: \"Both x and delta are representable. The problem is that there is not enough precision to represent x + delta.\" The exact sum lies between x and the next representable value and is closer to x, so it rounds to x. delta itself (1e-8) is stored without trouble, and `==` compares exactly."}, {"id": "ab-double", "type": "short", "mode": "text", "q": "`double x = 1.0;` You shrink `delta` by a factor of 10 each run: 0.1, 0.01, 0.001, … What is the **first** value of `delta` for which `x + delta == x` is true? (Type it like `1e-5`.)", "accept": ["1e-16", "0.0000000000000001", "10^-16", "1.0e-16"], "why": "**1e-16.** The doubles just above 1.0 are 2^{−52} ≈ 2.2e-16 apart; half of that is about 1.1e-16. 1e-15 is bigger than half the gap, so it changes x; 1e-16 is smaller, so the sum rounds back to 1.0. 1e-8 is the float answer, and 1e-17 is not the *first*.", "placeholder": "1e-…", "acceptRe": ["^1(\\.0*)?e-0?16$", "^0?\\.0{15}1$", "^(1 ?[x*×] ?)?10\\^\\(?-16\\)?$"]}, {"id": "ab-mini", "type": "blanks", "q": "The same effect in Minifloat. x = 4.0 is `0 101 0000`, and the next value up is 4.25. What value is stored for each sum? (Round-to-nearest, ties-to-even.)", "blanks": [{"label": "4.0 + 0.0625", "mode": "num", "accept": ["4"]}, {"label": "4.0 + 0.125", "mode": "num", "accept": ["4"]}, {"label": "4.0 + 0.1875", "mode": "num", "accept": ["4.25", "17/4"]}], "why": "The gap above 4.0 is 0.25, so half the gap is 0.125. **4.0625** is closer to 4.0 → stored **4.0** (no effect). **4.125** is exactly halfway between 4.0 (`0000`) and 4.25 (`0001`) → tie → the fraction ending in 0 → **4.0** (no effect). **4.1875** is closer to 4.25 → stored **4.25**. This is `x + delta == x` on a scale you can check by hand."}]}, {"id": "accumulate", "title": "Errors add up: loops and counters", "read": "One rounding error is tiny. A loop repeats it.\n\n```c\ndouble sum = 0.0;\nfor (int i = 0; i < 10; i++) {\n    sum += 0.1;\n}\nprintf(\"%.20f\\n\", sum);        // 0.99999999999999988898\nprintf(\"%d\\n\", sum == 1.0);    // 0\n```\n\nTen additions of \"0.1\" do not make 1.0: each `+=` adds the rounded 0.1 and then rounds the running total again.\n\n**This makes `==` and `!=` dangerous as loop conditions:**\n\n```c\nfor (double x = 0.0; x != 1.0; x += 0.1) { ... }   // never stops\n```\n\nx goes 0.1, 0.2, 0.30000000000000004, …, 0.99999999999999989, 1.0999999999999999, … It steps straight over 1.0 without ever being equal to it, so the loop runs forever.\n\nSwitching to `<` stops the loop, but the count can still be off by one:\n\n```c\nint count = 0;\nfor (double x = 0.0; x < 1.0; x += 0.1) count++;\nprintf(\"%d\\n\", count);         // 11, not 10\n```\n\nAfter ten additions x is 0.99999999999999989, which is still less than 1.0, so the body runs an eleventh time.\n\n> **Rule:** count with an `int`. Compute the floating-point value from the counter if you need it, and compare with an epsilon, never with `==`.\n\n**It gets worse with `float` and with many additions.** Adding `0.1f` one million times in a `float` gives 100958.34, not 100000. Once the total is large its neighbours are far apart, so each added 0.1 is rounded badly. This is \"x + delta\" again: big x, small delta.\n\nThe extreme case is a `float` used as a counter:\n\n```c\nfloat f = 16777216.0f;   // 2^24\nf = f + 1.0f;\nprintf(\"%.1f\\n\", f);     // 16777216.0\n```\n\nAbove 2^{24} a `float`'s neighbours are 2 apart, so adding 1 changes nothing. A `float` that counts up by 1 gets stuck there.\n\nRounding errors do not always show (`0.5 + 0.25` is exact, and some inexact sums happen to land on the right double). That is exactly why code using `==` can pass a few tests and still be wrong.", "questions": [{"id": "acc-prints", "type": "blanks", "q": "What do the two `printf` lines print?\n\n```c\ndouble s = 0.0;\nfor (int i = 0; i < 10; i++) s += 0.1;\nprintf(\"%d\\n\", s == 1.0);                     // line 1\nprintf(\"%d\\n\", fabs(s - 1.0) < DBL_EPSILON);  // line 2\n```", "blanks": [{"label": "line 1", "mode": "num", "accept": ["0"]}, {"label": "line 2", "mode": "num", "accept": ["1"]}], "why": "After ten additions s is 0.99999999999999988898, not 1.0, so `==` gives **0**. The distance from 1.0 is about 1.1e-16, which is below `DBL_EPSILON` (about 2.2e-16), so the epsilon test gives **1**. Same data, opposite answers: that is why the comparison is written with an epsilon."}, {"id": "acc-loop", "type": "mc", "q": "How many times does `tick` get printed?\n\n```c\nfor (double x = 0.0; x != 0.3; x += 0.1) {\n    puts(\"tick\");\n}\n```", "options": ["It never stops printing.", "3 times", "4 times", "0 times"], "answer": 0, "why": "After three additions x is 0.30000000000000004, while the literal `0.3` is stored as 0.29999999999999998…. They are different doubles, so `x != 0.3` is still true, and after that x only moves further away. The loop never ends. \"3 times\" is what you would get if 0.1 were exact."}, {"id": "acc-count", "type": "short", "mode": "num", "q": "What does this print?\n\n```c\nint n = 0;\nfor (double x = 0.0; x != 1.0; x += 0.25) n++;\nprintf(\"%d\\n\", n);\n```", "accept": ["4"], "why": "**4.** 0.25 is a power of two, so 0.25, 0.5, 0.75 and 1.0 are all exact and x lands exactly on 1.0. The body runs for x = 0, 0.25, 0.5, 0.75. The danger is with steps like 0.1 that cannot be represented; the `!=` test is still bad style because it only works for lucky values."}, {"id": "acc-fix", "type": "mc", "q": "This loop is meant to print ten lines (0.0, 0.1, …, 0.9) but never stops. Which replacement **reliably** runs exactly ten times?\n\n```c\nfor (double x = 0.0; x != 1.0; x += 0.1) {\n    printf(\"%.1f\\n\", x);\n}\n```", "options": ["`for (int i = 0; i < 10; i++) { double x = i * 0.1; printf(\"%.1f\\n\", x); }`", "`for (double x = 0.0; x < 1.0; x += 0.1) { printf(\"%.1f\\n\", x); }`", "`for (float x = 0.0f; x != 1.0f; x += 0.1f) { printf(\"%.1f\\n\", x); }`", "`for (double x = 0.0; x == 1.0; x += 0.1) { printf(\"%.1f\\n\", x); }`"], "answer": 0, "why": "Count with an `int` and compute x from the counter: exactly ten passes, no floating-point comparison controlling the loop. The `x < 1.0` version runs **11** times (after ten additions x is 0.99999999999999989, still below 1.0). The `float` version never stops either: ten additions of `0.1f` give 1.0000001, not 1.0. The `==` version runs zero times."}]}, {"id": "over-under", "title": "Overflow vs underflow, and 16-bit floats in ML", "read": "\"Arithmetic may round, overflow, or underflow\" is one of lecture's three big ideas. Rounding you have seen. The other two are what happens at the two ends of the range.\n\n| Question | Overflow | Underflow |\n|---|---|---|\n| What is the result? | too **large** in size for the format | not zero, but too **close to zero** for the format |\n| What is stored? | **+∞ or −∞** | **0** (\"rounds to zero\") |\n| Where is it? | beyond the largest finite value | next to zero, below the smallest value |\n\n```c\nfloat big = 1e30f;\nfloat r1 = big * big;        // true answer 1e60; the largest float is about 3.4e38\nprintf(\"%f\\n\", r1);          // inf\n\nfloat tiny = 1e-30f;\nfloat r2 = tiny * tiny;      // true answer 1e-60, smaller than any float\nprintf(\"%d\\n\", r2 == 0.0f);  // 1\n```\n\n> **Trap:** underflow is not \"a big negative number\". `-1e30f * 1e30f` overflows to `-inf`. Underflow is about tiny sizes such as 1e-60.\n\nBoth happen because the **exponent** field runs out, so both are **range** problems. More exponent bits push both limits further away.\n\n### The tradeoff in practice: FP16 and BF16\n\nLarge language models store billions of weights as floating-point numbers, so bits per value decides the memory: 7 billion values × 4 bytes ≈ 28 GB as `float` (FP32), and × 2 bytes ≈ 14 GB in a 16-bit format.\n\n| Format | Sign | Exponent | Fraction | Bias | Largest finite value |\n|---|---|---|---|---|---|\n| FP32 (`float`) | 1 | 8 | 23 | 127 | ≈ 3.4 × 10^{38} |\n| FP16 (half precision) | 1 | 5 | 10 | 15 | ≈ 65,504 |\n| BF16 (bfloat16) | 1 | 8 | 7 | 127 | ≈ 3.39 × 10^{38} |\n\nThe two 16-bit formats use the same memory. They split the bits differently:\n\n- **FP16:** more fraction bits → more precision, less range → **more likely to overflow**.\n- **BF16:** the same exponent bits and bias as FP32 → about a `float`'s range, but only 7 fraction bits → **more rounding**.\n\n\"They both can overflow.\" The question is which one does so sooner.", "questions": [{"id": "ou-c-1", "type": "mc", "q": "What does `b` hold after this runs?\n\n```c\nfloat a = 3e38f;\nfloat b = a * 10.0f;\n```", "options": ["`inf` (the multiplication overflows)", "`0.0` (the multiplication underflows)", "`3e39`", "`NaN`"], "answer": 0, "why": "The true product, 3e39, is larger than the largest `float` (about 3.4e38), so it **overflows** and is stored as +∞; `printf(\"%f\", b)` prints `inf`. It is not NaN: NaN is for undefined operations like 0/0, and overflow has a defined result."}, {"id": "ou-c-2", "type": "mc", "q": "Which of these calculations **underflows** in a `float`?", "options": ["`1e-30f * 1e-30f`", "`-1e30f * 1e30f`", "`1.0f + 1e-8f`", "`3e38f * 10.0f`"], "answer": 0, "why": "1e-30 × 1e-30 = 1e-60 is not zero but is far smaller than any `float`, so it rounds to 0: **underflow**. `-1e30f * 1e30f` is −1e60: large in size, so it overflows to `-inf` (negative is not the same as small). `1.0f + 1e-8f` is ordinary rounding (the sum rounds back to 1.0). `3e38f * 10.0f` overflows to `inf`."}, {"id": "pq-compare", "type": "blanks", "q": "Two made-up 16-bit formats:\n\n- **P:** 1 sign bit, 4 exponent bits, 11 fraction bits\n- **Q:** 1 sign bit, 7 exponent bits, 8 fraction bits\n\nAnswer each line with `P` or `Q`.", "blanks": [{"label": "greater range", "mode": "text", "accept": ["Q", "format Q"], "acceptRe": ["^(format )?q$"]}, {"label": "greater precision", "mode": "text", "accept": ["P", "format P"], "acceptRe": ["^(format )?p$"]}, {"label": "more likely to overflow", "mode": "text", "accept": ["P", "format P"], "acceptRe": ["^(format )?p$"]}, {"label": "has to round more", "mode": "text", "accept": ["Q", "format Q"], "acceptRe": ["^(format )?q$"]}], "why": "Range follows exponent bits: Q has 7, P has 4 → **Q** has the greater range, so **P** overflows sooner. Precision follows fraction bits: P has 11, Q has 8 → **P** is more precise, so **Q** rounds more. Both need the same memory (16 bits per value). This is the FP16 (precision) versus BF16 (range) choice with different numbers."}, {"id": "ou-explain", "type": "self", "lines": 6, "q": "In two or three sentences, state the difference between **overflow** and **underflow** in floating point, and say what is stored in each case.", "model": "**Overflow** happens when a result is too large in size (positive or negative) for the format: it is beyond the largest representable value, and it is stored as +∞ or −∞. **Underflow** happens when a result is not zero but is too close to zero to be represented, and it is rounded to 0. Both are limits of the exponent (range), at opposite ends: overflow at the large end, underflow next to zero.", "rubric": ["overflow = result too large in size / exceeds the largest representable value", "overflow is stored as +∞ or −∞", "underflow = result too small in size (too close to zero), not \"very negative\"", "underflow rounds to 0", "both are range (exponent) limits, at opposite ends"], "why": "This is a learning-objective bullet nearly word for word (\"articulate the difference between overflow and underflow\"). The slide definitions: overflow = \"the result of a computation exceeds the largest representable floating-point number\"; underflow = \"a number is too small to be represented and is rounded to zero\"."}]}], "checkpoint": [{"id": "cp3-fp16", "type": "blanks", "q": "Half precision (FP16) has 1 sign bit, 5 exponent bits and 10 fraction bits, and follows the usual IEEE rules.", "blanks": [{"label": "bias", "mode": "num", "accept": ["15"]}, {"label": "true exponent when the exponent field is `10010`", "mode": "num", "accept": ["3"]}, {"label": "exponent of a denormalized FP16 value", "mode": "num", "accept": ["-14"]}, {"label": "largest true exponent of a normalized FP16 value", "mode": "num", "accept": ["15"]}], "why": "Bias = 2^{4} − 1 = **15**. `10010` = 18, and 18 − 15 = **3**. Denormal exponent = 1 − 15 = **−14**. The largest normalized field is `11110` = 30 (all 1s is reserved), and 30 − 15 = **15**. Answering 16 uses the reserved field `11111`."}, {"id": "cp3-program", "type": "blanks", "q": "What does this program print, line by line?\n\n```c\n#include <float.h>\n#include <math.h>\n#include <stdio.h>\n\nint main(void) {\n    double a = 0.1 + 0.2;\n    double b = 0.25 + 0.5;\n    printf(\"%d\\n\", a == 0.3);                      // line 1\n    printf(\"%d\\n\", b == 0.75);                     // line 2\n    printf(\"%d\\n\", fabs(a - 0.3) < DBL_EPSILON);   // line 3\n    printf(\"%.2f\\n\", a);                           // line 4\n    return 0;\n}\n```", "blanks": [{"label": "line 1", "mode": "num", "accept": ["0"]}, {"label": "line 2", "mode": "num", "accept": ["1"]}, {"label": "line 3", "mode": "num", "accept": ["1"]}, {"label": "line 4", "mode": "text", "accept": ["0.30"]}], "why": "Line 1: **0**: 0.1 + 0.2 is 0.30000000000000004…, not the double for 0.3. Line 2: **1**: 0.25, 0.5 and 0.75 are exact. Line 3: **1**: the difference (about 5.6e-17) is below `DBL_EPSILON`. Line 4: **0.30**: two decimal places hide the error. If you wrote 1 for line 1 because line 4 looks right, that is the trap."}, {"id": "cp3-abs-bug", "type": "mc", "q": "`same(1.0, 1.7)` returns 1. Why?\n\n```c\n#include <float.h>\n#include <stdlib.h>\n\nint same(double a, double b) {\n    return abs(a - b) < DBL_EPSILON;\n}\n```", "options": ["`abs` is the integer absolute value: −0.7 is converted to the int 0 before the comparison.", "`DBL_EPSILON` is larger than 0.7, so the two values count as close.", "The subtraction underflows to 0.", "1.0 and 1.7 are rounded to the same double."], "answer": 0, "why": "`abs` (from `stdlib.h`) takes an `int`, so −0.7 is truncated to 0, and 0 < `DBL_EPSILON` is true. The floating-point version is **`fabs`** from `math.h`: `fabs(1.0 - 1.7)` is 0.7, which is not below epsilon. `DBL_EPSILON` is about 2.2e-16, nowhere near 0.7."}, {"id": "cp3-absorb", "type": "blanks", "q": "Each fragment is followed by `printf(\"%d\\n\", x + d == x);`. What is printed?\n\n```c\nfloat  x = 1.0;          float  d = 0.000001;              // (a) 1e-6\ndouble x = 1.0;          double d = 0.000000000000001;     // (b) 1e-15\nfloat  x = 16777216.0f;  float  d = 1.0f;                  // (c)\ndouble x = 1.0;          double d = 0.00000000000000001;   // (d) 1e-17\n```", "blanks": [{"label": "(a)", "mode": "num", "accept": ["0"]}, {"label": "(b)", "mode": "num", "accept": ["0"]}, {"label": "(c)", "mode": "num", "accept": ["1"]}, {"label": "(d)", "mode": "num", "accept": ["1"]}], "why": "(a) **0**: a float at 1.0 only starts absorbing at 1e-8; 1e-6 changes it. (b) **0**: a double at 1.0 still registers 1e-15; the first absorbed power of ten is 1e-16. (c) **1**: at 2^{24} neighbouring floats are 2 apart, so adding 1 rounds back. (d) **1**: 1e-17 is below a double's half-gap at 1.0. The same type can absorb or not absorb depending on how big x is."}, {"id": "cp3-count", "type": "short", "mode": "num", "q": "What does this print?\n\n```c\nint n = 0;\nfor (double x = 0.0; x <= 0.3; x += 0.1) n++;\nprintf(\"%d\\n\", n);\n```", "accept": ["3"], "why": "**3**, not 4. The body runs for x = 0, 0.1 and 0.2. After the third addition x is 0.30000000000000004, which is *greater* than the stored 0.3 (0.29999999999999998…), so `x <= 0.3` is false and the pass you expected at \"0.3\" never happens. Accumulated error can make a loop run one time too few as well as one time too many.", "hint": "Follow x after each `+=`. What is x, exactly, after the third addition, and how does it compare with the stored 0.3?"}, {"id": "cp3-hex", "type": "short", "mode": "num", "q": "Decode the `float` whose 32 bits are `0xBF400000`. Include the sign.", "accept": ["-0.75", "-3/4"], "why": "`0xBF4…` = `1011 1111 0100 0000 …`. Re-split 1 | 8 | 23: sign `1`, exponent `01111110` = 126, fraction `1` then zeros. 126 − 127 = −1. −`1.1` × 2^{−1} = −`0.11` = **−0.75**. Subtracting Minifloat's bias of 3, or a double's 1023, are the two ways to get the exponent wrong.", "placeholder": "signed value"}, {"id": "cp3-toy-absorb", "type": "blanks", "q": "Paper-style. Format: 1 sign bit, 3 exponent bits (bias 3), 3 fraction bits. Let x = 6.0. (Round-to-nearest, ties-to-even.)", "blanks": [{"label": "bit pattern of x", "mode": "bits", "accept": ["0101100"]}, {"label": "next representable value above x", "mode": "num", "accept": ["6.5"]}, {"label": "value stored for x + 0.125", "mode": "num", "accept": ["6"]}, {"label": "value stored for x + 0.25", "mode": "num", "accept": ["6"]}, {"label": "value stored for x + 0.375", "mode": "num", "accept": ["6.5", "13/2"]}], "why": "6.0 = `110` = `1.1` × 2^{2}: field 2 + 3 = 5 = `101`, fraction `100` → **`0 101 100`**. One step up is `0 101 101` = `1.101` × 2^{2} = **6.5**, so the gap is 0.5 and half the gap is 0.25. 6.125 is closer to 6.0 → **6.0**. 6.25 is exactly halfway: 6.0 ends in `100`, 6.5 ends in `101`, so ties-to-even picks **6.0**. 6.375 is closer to 6.5 → **6.5**. The first two are `x + delta == x` with a nonzero delta.", "hint": "Find the gap between x and the next value first. Anything under half the gap rounds back; exactly half is a tie."}, {"id": "cp3-double-why", "type": "mc", "q": "At x = 1.0, a `float` stops noticing `delta` at 1e-8 but a `double` keeps noticing down to 1e-15. What is the reason?", "options": ["A double has 52 fraction bits and a float has 23, so doubles near 1.0 are much more closely spaced.", "A double has 11 exponent bits and a float has 8, so a double can represent smaller deltas.", "A double's bias (1023) is larger than a float's (127).", "A float rounds toward zero, while a double rounds to nearest."], "answer": 0, "why": "The effect is about **precision at 1.0**, which comes from fraction bits: 52 versus 23. The gap above 1.0 is about 2.2e-16 for a double and 1.2e-7 for a float. Exponent bits and bias set the range; delta = 1e-8 is representable in both types, so range is not the issue."}, {"id": "cp3-pick-format", "type": "mc", "q": "A sensor produces values between 1 and 2, and the program must tell apart readings that differ only slightly. You have 16 bits per value. Which split fits better, and why?", "options": ["More fraction bits (like FP16): the values stay in a small range, so the bits are better spent on precision.", "More exponent bits (like BF16): extra exponent bits make the steps between values smaller.", "It makes no difference: both use 16 bits, so they are equally accurate.", "More exponent bits (like BF16): values between 1 and 2 would overflow otherwise."], "answer": 0, "why": "All the values share one small exponent, so range is not needed; what matters is the step between neighbours, which is set by the **fraction** bits. FP16's 10 fraction bits give steps of 2^{−10} between 1 and 2; BF16's 7 give 2^{−7}. Exponent bits buy range, not finer steps."}, {"id": "cp3-mem", "type": "short", "mode": "num", "q": "A model has 6 billion parameters, each stored as a BF16 value. About how many GB of memory is that? (Take 1 GB as 1 billion bytes.)", "accept": ["12"], "why": "BF16 is 16 bits = 2 bytes per value. 6 billion × 2 bytes = 12 billion bytes ≈ **12 GB**. FP16 would need exactly the same: both are 16-bit formats. As 32-bit floats it would be 24 GB.", "placeholder": "GB"}, {"id": "cp3-ou", "type": "mc", "q": "A `double` calculation has the exact result 1e-400. The smallest positive `double` is about 4.9e-324. What is stored, and what is this called?", "options": ["`0.0`: underflow", "`inf`: overflow", "`-inf`: underflow", "`NaN`: underflow"], "answer": 0, "why": "The result is not zero, but it is closer to zero than any double can represent, so it **rounds to 0**: underflow. Overflow is the other end (too large, stored as ±∞). The negative exponent in 1e-400 makes the number tiny, not negative, so −∞ makes no sense here. (`1e-200 * 1e-200` does exactly this in C.)"}, {"id": "cp3-explain-eq", "type": "self", "lines": 7, "q": "A classmate adds 0.1 to a `double total` three times, then writes `if (total == 0.3)` and is surprised that the branch never runs. Explain why in 2 or 3 sentences, and write the condition they should use.", "model": "0.1 has no finite binary expansion, so the double holds a rounded value, and each addition rounds again; after three additions `total` is 0.30000000000000004…, while the literal 0.3 is stored as 0.29999999999999998…. The two doubles are different, so `==` is false. Compare with an epsilon instead:\n\n```c\nif (fabs(total - 0.3) < DBL_EPSILON)\n```\n\n(with `#include <math.h>` and `#include <float.h>`).", "rubric": ["0.1 (and 0.3) cannot be represented exactly in binary", "the stored values are rounded, and the error carries through the additions", "so `total` and `0.3` are two different doubles and `==` is false", "fix: `fabs(total - 0.3) < DBL_EPSILON` (absolute difference below an epsilon)"], "why": "\"Predict and explain\" is the wording of the objective, so practise the explanation, not only the prediction. The three ingredients: not exactly representable → rounded → compare with `fabs(a - b) < EPSILON`."}]}, {"id": "memory-layout", "title": "Program memory: text, data, heap, stack", "blurb": "Draw the memory map of a running C program, say what lives in each segment and which way it grows, and work out how many bits an address needs.", "objective": "Objective 4: Program memory layout", "sources": "CL16 · CL18 · RD14 · DIS §2.1", "minutes": 30, "cheats": ["Low → high address: **OS, text, data, heap, (free space), stack**. Drawn either way up, the stack is at the highest addresses and the OS at the lowest.", "**Text** = machine instructions. **Data** = globals + `static` variables. **Heap** = `malloc`/`realloc` blocks. **Stack** = one frame per call in progress (parameters, return address, locals).", "Heap grows toward **higher** addresses, stack toward **lower**; they share the free space between them. A push makes `sp` smaller.", "Stack = **automatic** (pushed on call, popped on return). Heap = **manual** (a block lasts until you `free` it).", "`int *p = malloc(…)` inside a function: `p` is on the stack, the block is on the heap. Place the pointer and its target separately.", "**Stack overflow** = the stack grew too large: deep or infinite recursion, or very large locals.", "Never return `&local`: the frame is deallocated at the return, so the pointer is **dangling**.", "Address bits = log₂(bytes); k bits reach 2^{k} bytes. 1 GB = 2^{30}. 32 bits → 4 GB. 48 bits → 256 TB. 64-bit addresses → every pointer is 8 bytes."], "chunks": [{"id": "map", "title": "The map of a running program", "read": "When a program starts, it is given a block of memory to work in. Every byte in that block has an **address**, a number that starts at 0. The block is divided into regions called **segments**, and each kind of thing in your program always lives in the same one.\n\nFrom the **lowest** address to the **highest**, lecture draws it like this:\n\n```\n Lowest address: 0\n ┌──────────────────┐\n │ Operating System │   reserved, not yours to touch\n ├──────────────────┤\n │ Text             │   program instructions\n ├──────────────────┤\n │ Data             │   global and static variables\n ├──────────────────┤\n │ Heap             │   dynamically allocated memory\n │                  │\n │   (free space)   │\n │                  │\n │ Stack            │   function stack frames\n └──────────────────┘\n Highest address\n```\n\n- **Text** (the reading calls it the **code** segment) holds the program's instructions: the compiled machine code, \"our ones and zeros\". It is *not* your `.c` file. The compiler translated the source before the program ran, and only the machine code is loaded.\n- **Data** holds **global** and **`static`** variables.\n- **Heap** holds memory the program asks for while it runs (`malloc`).\n- **Stack** holds one **stack frame** for each function call that is in progress.\n\nThe same map is often drawn the other way up, with the stack at the top of the page:\n\n```\n Highest address    Stack\n                    Heap\n                    Data\n                    Text\n Lowest address     Operating System\n```\n\n> **Lecture:** \"Both of these diagrams are communicating the same thing.\" Whichever way up it is drawn, **the stack is always at the highest addresses and the operating system at the lowest.**\n\n> **On paper:** before you label a box, find the words *lowest address* and *highest address*. The order never changes: OS, text, data, heap, stack. Only the direction you write it in does.\n\n### Worked example\n\nA diagram has five empty boxes and \"Highest address\" printed beside the top one. Fill from the top down: stack, heap, data, text, operating system. If \"Lowest address: 0\" were beside the top box instead, you would write the same five words in the opposite order.", "questions": [{"id": "map-text", "type": "mc", "q": "What does the **text** segment hold?", "options": ["The program's instructions: the machine code the compiler produced", "The characters of the `.c` source file, kept so the program can read its own code", "Global and `static` variables", "The local variables of the function that is currently running"], "answer": 0, "why": "Text (the reading's *code segment*) = program instructions. In lecture someone asked whether that means the C file. It doesn't: the source is translated to machine code first, and only the machine code is loaded. Globals and statics are **data**; locals are **stack**."}, {"id": "map-order", "type": "blanks", "q": "A quiz prints five stacked, empty boxes with **Highest address** written beside the top box. Name the region in each box.", "blanks": [{"label": "box 1 (top, highest address)", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "box 2", "mode": "text", "accept": ["heap", "the heap", "heap segment"]}, {"label": "box 3", "mode": "text", "accept": ["data", "the data segment", "data segment", "the data"]}, {"label": "box 4", "mode": "text", "accept": ["text", "code", "text segment", "code segment", "the text segment", "the code segment", "text/code", "code/text"]}, {"label": "box 5 (bottom, lowest address)", "mode": "text", "accept": ["operating system", "os", "the operating system", "the os"]}], "why": "Low to high the order is OS, text, data, heap, stack. Read from the highest address down, that is **stack, heap, data, text, operating system**. The usual slip is to start with text or the OS at the top because that is the order you say them in."}, {"id": "map-flipped", "type": "short", "mode": "text", "q": "A second diagram prints **Lowest address: 0** beside its *top* box. Which region is in the box at the very bottom of the page?", "accept": ["stack", "the stack", "stack segment"], "placeholder": "one word", "why": "It is the same map drawn the other way up. The bottom of this page is the highest address, and the stack is always at the highest addresses. Answering \"operating system\" means you went by position on the page instead of by the address labels."}]}, {"id": "whats-where", "title": "What lives in each segment", "read": "To place anything in a C program, ask **where it was declared and with which keyword**:\n\n| In your code | Segment | How long it exists |\n|---|---|---|\n| the code of a function (`main`, `bump`, …) | text | whole run |\n| a variable declared outside every function (a **global**) | data | whole run |\n| a variable declared `static`, even inside a function | data | whole run |\n| a **local variable** | stack, in that function's frame | until the function returns |\n| a **parameter** | stack, in that function's frame | until the function returns |\n| a function's **return address** | stack, in that function's frame | until the function returns |\n| a block handed back by `malloc` or `realloc` | heap | until you `free` it |\n\n**String literals.** The characters of a literal such as `\"hello\"` are part of the program and exist for the whole run, in a read-only area. They are never on the stack or the heap. Lecture's slide lists only globals and statics under data; if a question gives you just the four boxes, a string literal goes with **data** (many textbooks draw a separate read-only box for it).\n\n> **Trap:** a pointer variable and the thing it points to are two different objects and are often in two different segments. Place each one separately.\n\n### Worked example\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint total = 0;                          // global            -> data\n\nint bump(int by) {                      // bump's code -> text;  by -> stack\n    static int calls = 0;               // static            -> data\n    int old = total;                    // local             -> stack\n    calls++;\n    total += by;\n    return old;\n}\n\nint main(void) {\n    int n = 3;                          // local             -> stack\n    int *box = malloc(n * sizeof(int)); // box -> stack;  the 12 bytes -> heap\n    box[0] = bump(n);\n    free(box);\n    return 0;\n}\n```\n\nTwo lines to look at twice:\n\n- `static int calls` is written inside `bump`, but `static` gives it a whole-run lifetime, so it cannot be in a frame that disappears. It is in **data**.\n- `int *box = malloc(...)` creates two things: `box`, an 8-byte local in `main`'s frame (**stack**), and a 12-byte block (**heap**) whose address is stored in `box`.", "questions": [{"id": "classify-clamp", "type": "blanks", "q": "Give the segment (`text`, `data`, `heap` or `stack`) for each item in this program.\n\n```c\n#include <stdint.h>\n#include <stdlib.h>\n\nint32_t limit = 50;\n\nint32_t clamp(int32_t v) {\n    static int32_t hits = 0;\n    int32_t out = v;\n    if (v > limit) {\n        out = limit;\n        hits++;\n    }\n    return out;\n}\n\nint main(void) {\n    int32_t raw = 72;\n    int32_t *saved = malloc(sizeof(int32_t));\n    *saved = clamp(raw);\n    free(saved);\n    return 0;\n}\n```", "blanks": [{"label": "limit", "mode": "text", "accept": ["data", "the data segment", "data segment", "the data"]}, {"label": "hits", "mode": "text", "accept": ["data", "the data segment", "data segment", "the data"]}, {"label": "v", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "out", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "saved (the pointer variable itself)", "mode": "text", "accept": ["stack", "the stack", "stack segment"]}, {"label": "*saved (the 4 bytes saved points to)", "mode": "text", "accept": ["heap", "the heap", "heap segment"]}, {"label": "the instructions of clamp", "mode": "text", "accept": ["text", "code", "text segment", "code segment", "the text segment", "the code segment", "text/code", "code/text"]}], "why": "`limit` is a global and `hits` is `static`: both **data**. `v` is a parameter and `out` a local: both in `clamp`'s frame on the **stack**. `saved` is a local of `main` (**stack**), but the block `malloc` returned is on the **heap**. Function code is **text**. The two that get missed: `hits` (declared inside a function, yet data) and `saved` versus `*saved`.", "hint": "For each name ask: declared outside every function, or with `static`? Then data. A parameter or a plain local? Then stack. Reached through the pointer `malloc` returned? Then heap."}, {"id": "static-local", "type": "mc", "q": "In the program above, `hits` is declared inside `clamp`. Why is it not in `clamp`'s stack frame?", "options": ["`static` gives it a whole-run lifetime, so it is kept in the data segment instead of a frame", "It is in `clamp`'s frame; `static` only stops other files from using the name `hits`", "`static` variables are allocated on the heap the first time the function is called", "`static` makes it a constant, so it is stored with the instructions in the text segment"], "answer": 0, "why": "A frame lives only as long as one call. `hits` has to keep counting across calls, so it needs a location that exists for the whole run: the **data** segment, next to the globals. Its *scope* is still only inside `clamp`; scope (where the name works) and lifetime (how long the memory exists) are separate ideas."}, {"id": "literal-ptr", "type": "mc", "q": "Inside `main`, a program declares\n\n```c\nchar *msg = \"ready\";\n```\n\nWhich statement is true?", "options": ["`msg` is an 8-byte pointer in `main`'s frame; the characters are in a read-only area that exists for the whole run", "`msg` and the six bytes `r e a d y \\0` are all in `main`'s frame, because both come from a line inside `main`", "The six bytes are on the heap, because a `char *` always points to heap memory, and `msg` is in `main`'s frame", "`msg` is in the data segment beside the characters, because a pointer is stored next to whatever it points at"], "answer": 0, "why": "Two objects, two places. `msg` is a local variable, so it is on the **stack**, and it is 8 bytes because it is a pointer. The literal's characters are part of the program itself and exist for the whole run. A pointer does not live next to its target, and nothing is on the heap unless `malloc` or `realloc` put it there."}]}, {"id": "stack-auto", "title": "The stack: automatic memory", "read": "The stack \"is used for each function's stack frame\". A **frame** is the block of stack memory that belongs to one call of one function. It holds that call's **parameters**, its **return address** (where to continue in the caller afterwards) and its **local variables**: the temporary data a function needs while it runs.\n\n- **Growth.** Every time a function is called, a frame is **pushed** onto the stack. The stack \"grows from higher memory addresses to lower\", so each new frame sits at a *lower* address than its caller's frame.\n- **Shrinkage.** When the function returns, its frame is **popped**.\n- **Automatic.** Both happen without any code from you (\"the programmer does not have to think about it\"). That is why the stack is called *automatic memory*.\n\n**Stack pointer (sp):** a register (a small, fast storage location inside the CPU) that points to the current top of the stack, the place where the most recent stack data was stored. Because the stack grows toward lower addresses, a push **decreases** sp and a pop **increases** it.\n\n> **Trap:** \"top of the stack\" means the *newest* item, which is the *lowest* used address. When high addresses are at the top of the page, the top of the stack is drawn at the bottom, and the stack \"grows down\".\n\n### Worked example\n\n`main` calls `area`, and `area` calls `square`.\n\n```\n Higher addresses\n   main's frame          pushed first\n   area's frame          pushed when main calls area\n   square's frame        pushed when area calls square    ← sp\n Lower addresses\n```\n\nWhile `square` runs there are three frames. When `square` returns, its frame is popped and sp moves back up to the end of `area`'s frame: two frames. When `area` returns: one. Popping does not erase anything. The bytes are still there, below sp, but they are no longer valid, and the next call reuses that space.", "questions": [{"id": "frame-holds", "type": "mc", "q": "Which of these are stored in a function's stack frame? **Select all that apply.**", "options": ["its parameters", "its return address", "its local variables", "its machine instructions", "the global variables it reads"], "answer": [0, 1, 2], "why": "A frame holds the call's parameters, return address and locals. The instructions are in **text**, and globals are in **data** no matter which function uses them."}, {"id": "sp-push", "type": "mc", "q": "`parse` calls `trim`. What happens to the stack pointer during the call?", "options": ["It decreases, because the new frame is placed at lower addresses", "It increases, because the stack now holds more data", "It does not move; only the heap changes when a function is called", "It jumps to the top of the heap, where space for the new frame is found"], "answer": 0, "why": "The stack grows from higher addresses to lower, so adding a frame moves sp to a **smaller** address; returning moves it back up. \"More data, so a bigger number\" is the tempting mistake. The heap has nothing to do with an ordinary call: frames are never placed there."}, {"id": "frames-count", "type": "blanks", "q": "`main` calls `load`. `load` calls `parse`, and `parse` calls `trim`. Later, after `trim` and `parse` have both returned, `load` calls `store`.\n\nHow many stack frames exist at each moment? (Count `main`.)", "blanks": [{"label": "while trim is running", "mode": "num", "accept": ["4"]}, {"label": "while store is running", "mode": "num", "accept": ["3"]}], "why": "One frame per call that has started and not yet returned. During `trim`: main, load, parse, trim = **4**. By the time `store` runs, `trim` and `parse` have been popped: main, load, store = **3**. Answering 5 for the second one counts frames that have already been popped."}, {"id": "lowest-frame", "type": "short", "mode": "text", "q": "In the same program, while `trim` is running, which function's frame is at the **lowest** address?", "accept": ["trim", "trim's", "trim()"], "placeholder": "function name", "why": "The stack grows toward lower addresses, so the most recently called function has the lowest frame: `trim`. `main`, the first frame pushed, is the highest. (Checked on a real machine: the address of a local in each function goes down as the calls go deeper.)"}]}, {"id": "stack-errors", "title": "Two stack errors: overflow and a pointer to a dead local", "read": "### Stack overflow\n\nThe space the stack can grow into is limited. Lecture's slide: \"If the stack grows too large (e.g., due to **deep recursion** or **very large local variables**), you might encounter a **stack overflow**.\"\n\nEvery recursive call pushes one more frame, and none of them is popped until the recursion starts returning. A recursion that goes very deep, or one with no base case that never stops (infinite recursion), keeps pushing frames until the stack runs out of room, and the program crashes.\n\n```c\nint32_t sum_to(int32_t n) {\n    if (n == 0) return 0;          // base case: recursion stops here\n    return n + sum_to(n - 1);\n}\n```\n\n`sum_to(2)` calls `sum_to(1)`, which calls `sum_to(0)`. At the deepest point the stack holds `main`, `sum_to(2)`, `sum_to(1)` and `sum_to(0)`: four frames. Delete the `if` line and the calls continue with −1, −2, … with no end: stack overflow.\n\n### Returning a pointer to a local variable\n\nA local lives in its function's frame, and that frame is deallocated when the function returns.\n\n```c\nint32_t *make_score(void) {\n    int32_t score = 90;    // lives in make_score's frame\n    return &score;         // BUG: that frame is gone after the return\n}\n```\n\nThe caller receives an address inside a frame that no longer exists. The pointer has outlived
