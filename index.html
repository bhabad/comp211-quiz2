ements: on the stack too, because `u` is a local variable", "`t`: in the data segment, because it is statically allocated. `u`'s six elements: on the heap"], "answer": 0, "why": "`t` is a local array, so all 24 bytes of it are in `main`'s stack frame. `u` is a local *pointer*: its 8 bytes are in the frame, but the 24 bytes it points to came from `malloc`, so they are on the heap. \"Statically allocated\" describes when the size is fixed (compile time); a local array still lives on the stack. The data segment is for globals and `static` variables."}]}, {"id": "freeing-bugs", "title": "Freeing, and three classic mistakes", "read": "**Freeing.** One `free` for every `malloc`. Method 1 is `free(a);`. Method 2 is **every row first, then the outer array**: R + 1 frees.\n\n```c\nfor (int i = 0; i < R; i++) {\n    free(a[i]);      // rows first: a[i] is read out of the outer block\n}\nfree(a);             // the outer block last\n```\n\n> **Lecture:** \"If I freed this array first, I would lose the pointers to all of my rows, and then I couldn't free my rows.\"\n\n**Mistake 1: freeing the outer array first.**\n\n```c\nfree(a);\nfor (int i = 0; i < R; i++) free(a[i]);   // a[i] reads memory that was already freed\n```\n\nReading `a[i]` after `free(a)` is a use-after-free: undefined behaviour. If you stop after `free(a)` instead, every row is leaked, because the only copies of the row addresses were in the block you just gave back.\n\n**Mistake 2: `sizeof(int)` where `sizeof(int *)` is needed.**\n\n```c\nint **a = malloc(sizeof(int) * R);    // R × 4 bytes, but R pointers need R × 8\n```\n\nThe outer block is half the size it should be, so storing the row pointers runs off its end halfway through: a heap buffer overflow. The compiler gives no warning. When this was compiled and run for this page it finished normally, which is what makes the bug hard to see. It is still undefined behaviour.\n\n**Mistake 3: treating Method 2 as one contiguous block.**\n\n```c\nint *p = a[0];\nfor (int k = 0; k < R * C; k++) p[k] = 0;   // only p[0] to p[C-1] belong to row 0\n```\n\nOne loop like that works for Method 1 (starting from `p = a`), where everything is one block. In Method 2, row 0's block ends after C ints and row 1 is somewhere else, so `p[C]` is out of bounds: undefined behaviour. Point at each row in turn instead: `p = a[i];`.\n\n> **Trap:** \"undefined\" does not mean \"crashes\". It may crash, corrupt other data, or look fine. On the quiz, name the bug and say the behaviour is undefined.", "questions": [{"id": "bug-name", "type": "mc", "q": "What is wrong with this program?\n\n```c\n 1  #include <stdlib.h>\n 2\n 3  #define ROWS 4\n 4  #define COLS 5\n 5\n 6  int main(void) {\n 7      int **m = malloc(sizeof(int *) * ROWS);\n 8      for (int i = 0; i < ROWS; i++) {\n 9          m[i] = malloc(sizeof(int) * COLS);\n10      }\n11\n12      free(m);\n13      for (int i = 0; i < ROWS; i++) {\n14          free(m[i]);\n15      }\n16      return 0;\n17  }\n```", "options": ["Line 12 frees the outer array first, so line 14 reads `m[i]` from freed memory", "Line 14 should be `free(&m[i]);`, because `free` needs the address of each row pointer", "Nothing: there are 5 mallocs and 5 frees, and the order of the frees does not matter", "Line 9 should use `sizeof(int *)`, because `m[i]` is a pointer"], "answer": 0, "why": "The row addresses live *inside* the outer block. Once line 12 frees it, `m[i]` on line 14 is a use-after-free: undefined behaviour. (When this was run, the allocator aborted the program. It could equally have seemed to work.) Fix: move line 12 below the loop. `free(&m[i])` would pass an address inside the outer block, which `malloc` never returned. Line 9 is right as it is: each row holds `int`s."}, {"id": "bug-sizeof", "type": "blanks", "q": "This program compiles with no warnings.\n\n```c\n 1  #include <stdlib.h>\n 2\n 3  #define ROWS 6\n 4  #define COLS 3\n 5\n 6  int main(void) {\n 7      int **m = malloc(sizeof(int) * ROWS);\n 8      if (m == NULL) return 1;\n 9      for (int i = 0; i < ROWS; i++) {\n10          m[i] = malloc(sizeof(int) * COLS);\n11          if (m[i] == NULL) return 1;\n12      }\n13      m[5][2] = 7;\n14      for (int i = 0; i < ROWS; i++) {\n15          free(m[i]);\n16      }\n17      free(m);\n18      return 0;\n19  }\n```", "blanks": [{"label": "line with the bug", "mode": "num", "accept": ["7"]}, {"label": "bytes line 7 asks for", "mode": "num", "accept": ["24"]}, {"label": "bytes six row pointers need", "mode": "num", "accept": ["48"]}, {"label": "first value of i whose store on line 10 lands past the end of the block", "mode": "num", "accept": ["3"]}, {"label": "corrected argument to malloc on line 7", "mode": "code", "accept": ["sizeof(int *) * ROWS", "ROWS * sizeof(int *)", "sizeof(int *) * 6", "6 * sizeof(int *)", "sizeof(*m) * ROWS", "ROWS * sizeof(*m)", "sizeof(int*)*(ROWS)", "(ROWS)*sizeof(int*)", "malloc(sizeof(int *) * ROWS)", "malloc(ROWS * sizeof(int *))"]}], "why": "Line **7** sizes the outer block with `sizeof(int)`: 6 × 4 = **24** bytes. Six pointers need 6 × 8 = **48**. Slots `m[0]`, `m[1]`, `m[2]` use bytes 0 to 23 and fit. `m[3]` would be bytes 24 to 31: past the end, so **i = 3** is the first bad store. Fix: `malloc(sizeof(int *) * ROWS)`. Run normally the program exits cleanly. Under a checking allocator (Guard Malloc) it faults at exactly the `m[3]` store.", "hint": "How many 8-byte slots fit in the block line 7 actually gets?"}, {"id": "bug-leak", "type": "blanks", "q": "`int **a` is a Method 2 matrix with 6 rows and 10 columns of `int` (4 bytes). The program's only cleanup is `free(a);`.", "blanks": [{"label": "heap blocks leaked", "mode": "num", "accept": ["6"]}, {"label": "bytes leaked", "mode": "num", "accept": ["240"]}], "why": "The outer block was freed correctly. The **6** row blocks were not, and their addresses are gone with the outer block: 6 × (10 × 4) = **240** bytes leaked. Counting the 48-byte outer block as leaked too (7 blocks, 288 bytes) is the tempting slip. The `leaks` tool reports 6 leaked blocks for this program."}, {"id": "bug-contig", "type": "mc", "q": "`m` is a Method 2 matrix with 3 rows and 4 columns of `int`. What is true of these two lines?\n\n```c\nint *p = m[0];\np[5] = 9;\n```", "options": ["Undefined behaviour: row 0 is a block of only 4 `int`s, so `p[5]` is outside it", "It sets `m[1][1]`, because linear index 5 is 1 × 4 + 1 in a grid with 4 columns", "It sets `m[0][5]`, and row 0 grows to 6 columns to make room for the new value", "Compile error: an `int *` is not allowed to point into an `int **` matrix"], "answer": 0, "why": "`p` points at row 0, a block of exactly 4 ints, so `p[0]` to `p[3]` are valid and `p[5]` is out of bounds. \"Linear index 5 = `[1][1]`\" is true for a static array or Method 1, where the rows are back to back. In Method 2 they are separate mallocs. It compiles without a warning, blocks never grow by themselves, and when run normally it appeared to work, which is exactly why it is dangerous."}]}], "checkpoint": [{"id": "cp-linear", "type": "blanks", "q": "`uint8_t img[48][64]` holds one byte per pixel, in row-major order.", "blanks": [{"label": "linear index of img[30][17]", "mode": "num", "accept": ["1937"]}, {"label": "row of the pixel with linear index 1000", "mode": "num", "accept": ["15"]}, {"label": "column of that pixel", "mode": "num", "accept": ["40"]}], "why": "30 × 64 + 17 = 1920 + 17 = **1937**. Backwards: 1000 ÷ 64 = 15 remainder 40 (15 × 64 = 960), so `img[15][40]`. Using 48, the number of rows, gives 1457 for the first and row 20 for the second."}, {"id": "cp-addr", "type": "short", "mode": "hex", "q": "`int32_t A[50][9]` has base address `0xFFFF_8000_ABC0`. What is `&A[7][8]`?", "accept": ["0xFFFF8000ACDC"], "why": "Linear index 7 × 9 + 8 = 71. Offset 71 × 4 = 284 = 256 + 28 = `0x11C`. `0xABC0 + 0x11C`: 0 + C = C, C + 1 = D, B + 1 = C, A stays. **`0xFFFF_8000_ACDC`**. Using 50 as the row length gives index 358 and a far larger address.", "placeholder": "0x…"}, {"id": "cp-addr-carry", "type": "short", "mode": "hex", "q": "`double W[12][5]` has base address `0x3FF8`. What is `&W[2][4]`?", "accept": ["0x4068"], "why": "Linear index 2 × 5 + 4 = 14. Offset 14 × 8 = 112 = `0x70`. `0x3FF8 + 0x70`: 8 + 0 = 8, then F + 7 = 22 = `0x16` (write 6, carry 1), then F + 1 = `0x10` (write 0, carry 1), then 3 + 1 = 4. **`0x4068`**. Dropping the carries gives `0x3F68`, an address *below* the base, which cannot be right.", "placeholder": "0x…"}, {"id": "cp-reverse", "type": "blanks", "q": "`int64_t Q[7][6]` has base address `0x10000`. Which element is at `0x100E8`?", "blanks": [{"label": "row", "mode": "num", "accept": ["4"]}, {"label": "column", "mode": "num", "accept": ["5"]}], "why": "Offset `0xE8` = 14 × 16 + 8 = 232 bytes. 232 ÷ 8 = 29. 29 ÷ 6 = 4 remainder 5, so **`Q[4][5]`**. Check: (4 × 6 + 5) × 8 = 232. Dividing 29 by the 7 rows gives row 4, column 1, which is wrong."}, {"id": "cp-decimal", "type": "short", "mode": "num", "q": "`int T[9][11]` starts at address 5000, and `sizeof(int)` is 4. What is the address of `T[4][6]`?", "accept": ["5200"], "why": "No `0x`, so everything stays decimal. Linear index 4 × 11 + 6 = 50. Offset 50 × 4 = 200. 5000 + 200 = **5200**. Treating 5000 as hex and adding `0xC8` gives `0x50C8`, which answers a different question."}, {"id": "cp-two-ways", "type": "blanks", "q": "`tbl` is a grid with 10 columns. Write \"the element in row 2, column 7\" for each method.\n\n- (a) Method 2 (`int **tbl`), with pointer arithmetic only and no square brackets\n- (b) Method 1 (`int *tbl`): the single number k that makes `tbl[k]` that element", "blanks": [{"label": "(a)", "mode": "code", "accept": ["*(*(tbl+2)+7)", "*(7+*(tbl+2))", "*(*(2+tbl)+7)", "*(7+*(2+tbl))", "*((*(tbl+2))+7)"]}, {"label": "(b)", "mode": "num", "accept": ["27"]}], "why": "(a) **`*(*(tbl + 2) + 7)`**: fetch row pointer 2, move 7 ints along it. (b) k = 2 × 10 + 7 = **27**, so `tbl[27]` or `*(tbl + 27)`. The two are not interchangeable: `*(tbl + 27)` on an `int **` would read a row pointer for a row 27 that does not exist."}, {"id": "cp-diagram", "type": "blanks", "q": "Draw memory at the marked line, then fill in the diagram's numbers. Pointers are 8 bytes and `int` is 4.\n\n```c\n#define R 3\n#define C 5\n\nint main(void) {\n    int16_t **grid;\n    int i;\n    grid = malloc(sizeof(int16_t *) * R);\n    for (i = 0; i < R; i++) {\n        grid[i] = malloc(sizeof(int16_t) * C);\n    }\n    /* draw memory here */\n}\n```", "blanks": [{"label": "size written on the outer heap block", "mode": "num", "accept": ["24"]}, {"label": "size written on each row block", "mode": "num", "accept": ["10"]}, {"label": "number of heap blocks", "mode": "num", "accept": ["4"]}, {"label": "total heap bytes", "mode": "num", "accept": ["54"]}, {"label": "size of the slot for grid in main", "mode": "num", "accept": ["8"]}, {"label": "value in the slot for i", "mode": "num", "accept": ["3"]}], "why": "Outer block: 3 pointers × 8 = **(24)**. Each row: 5 × `int16_t` (2 bytes) = **(10)**. 1 + 3 = **4** blocks, 24 + 3 × 10 = **54** bytes. `grid` is a pointer, so its slot is `grid(8): ptr to heap`. The loop stops when `i < R` is false, so `i` holds **3** at the marked line. Using 4 bytes for the elements gives (20) per row: read the type."}, {"id": "cp-m2-trace", "type": "blanks", "q": "What does this program print? (The `NULL` checks are left out to keep it short.)\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void) {\n    int **a = malloc(sizeof(int *) * 3);\n    for (int i = 0; i < 3; i++) {\n        a[i] = malloc(sizeof(int) * 3);\n        for (int j = 0; j < 3; j++) {\n            a[i][j] = (i + 1) * 100 + j;\n        }\n    }\n\n    int *temp = a[0];\n    a[0] = a[2];\n    a[2] = temp;\n\n    printf(\"%d\\n\", a[0][1]);\n    printf(\"%d\\n\", *(*(a + 2) + 2));\n    printf(\"%d\\n\", **a);\n    printf(\"%d\\n\", *(a[1] + 1));\n    /* frees left out */\n}\n```", "blanks": [{"label": "1st line printed", "mode": "num", "accept": ["301"]}, {"label": "2nd line printed", "mode": "num", "accept": ["102"]}, {"label": "3rd line printed", "mode": "num", "accept": ["300"]}, {"label": "4th line printed", "mode": "num", "accept": ["201"]}], "why": "Before the swap the rows are `[100, 101, 102]`, `[200, 201, 202]`, `[300, 301, 302]`. The three `temp` lines swap the row **pointers** `a[0]` and `a[2]`. No `int` moves. Now `a[0]` is `[300, 301, 302]`, `a[1]` is `[200, 201, 202]`, `a[2]` is `[100, 101, 102]`. So `a[0][1]` = **301**. `*(*(a + 2) + 2)` is `a[2][2]` = **102**. `**a` is `a[0][0]` = **300**. `*(a[1] + 1)` is `a[1][1]` = **201**. Forgetting the swap gives 101, 302, 100, 201."}, {"id": "cp-bug-mc", "type": "mc", "q": "Four students each wrote the allocation for a Method 2 grid with `R` rows of `C` `int`s. Three versions never write outside the memory they allocated. Which one does?", "options": ["`int **a = malloc(sizeof(int) * R);` then `a[i] = malloc(sizeof(int) * C);` for each row", "`int **a = malloc(sizeof(int *) * R);` then `a[i] = malloc(sizeof(int *) * C);` for each row", "`int **a = malloc(R * sizeof(int *));` then `a[i] = malloc(C * sizeof(int));` for each row", "`int **a = calloc(R, sizeof(int *));` then `a[i] = calloc(C, sizeof(int));` for each row"], "answer": 0, "why": "The first one gives the outer array R × 4 bytes, but storing R row pointers writes R × 8: a heap buffer overflow. The second wastes memory (each row gets C × 8 bytes for C ints) but nothing lands out of bounds. The third is the correct version with the factors in the other order. The fourth is correct too: `calloc(count, size)` allocates count × size bytes and zeroes them."}, {"id": "cp-sizeof", "type": "blanks", "q": "Inside one function there is `int s[4][6];` and also `int **d`, built with Method 2 as a 4 × 6 grid. `sizeof(int)` is 4. Give each value.", "blanks": [{"label": "sizeof(s)", "mode": "num", "accept": ["96"]}, {"label": "sizeof(s[0])", "mode": "num", "accept": ["24"]}, {"label": "sizeof(d)", "mode": "num", "accept": ["8"]}, {"label": "sizeof(d[0])", "mode": "num", "accept": ["8"]}, {"label": "sizeof(d[0][0])", "mode": "num", "accept": ["4"]}], "why": "`s` *is* the 24 ints: 4 × 6 × 4 = **96**. `s[0]` is one row of 6 ints: **24**. `d` is only a pointer: **8**, whatever it points to. `d[0]` is a row pointer: **8**. `d[0][0]` is an `int`: **4**. This is the layout difference in one line: the static array's name stands for all the elements, and the `int **` is just an address on the stack."}, {"id": "cp-flatten", "type": "self", "lines": 16, "q": "Write the function `int *flatten(int **m, int rows, int cols)`. `m` is a Method 2 matrix. The function returns a **new Method 1 block** holding the same values in row-major order, or `NULL` if the allocation fails. It must not free or change `m`. Then answer in one or two sentences: how does the memory layout of the block you return differ from the layout of `m`?", "model": "```c\nint *flatten(int **m, int rows, int cols) {\n    int *flat = malloc(sizeof(int) * rows * cols);   // Method 1: ONE block of rows x cols ints\n    if (flat == NULL) return NULL;\n    for (int i = 0; i < rows; i++) {\n        for (int j = 0; j < cols; j++) {\n            flat[i * cols + j] = m[i][j];            // (i, j) goes to linear index i * cols + j\n        }\n    }\n    return flat;                                     // the caller frees it with one free\n}\n```\n\n**Layout:** `m` is R + 1 heap blocks: one block of row pointers plus one block per row, and the rows need not be next to each other. The returned block is a single contiguous row-major block of rows × cols ints, the same layout a static 2D array has, except that it is on the heap.", "rubric": ["one `malloc(sizeof(int) * rows * cols)` stored in an `int *`", "`NULL` check before the block is used", "nested loops over `i` and `j`", "copies with `flat[i * cols + j] = m[i][j]` (times `cols`, not `rows`)", "returns the pointer and does not free `m`", "layout answer: R + 1 separate blocks with non-contiguous rows versus one contiguous row-major block"], "why": "The left side is Method 1 indexing and the right side is Method 2 indexing, so this one function uses both. The caller now owns two things: `flat` (one `free`) and `m` (rows + 1 frees). The model was compiled and tested on a 5 × 8 matrix."}, {"id": "cp-flatten-count", "type": "blanks", "q": "`m` is a 5 × 8 Method 2 matrix of `int` (4 bytes; pointers 8) in which `m[i][j]` holds `100 * i + j`. After `int *flat = flatten(m, 5, 8);` succeeds:", "blanks": [{"label": "heap blocks that now exist", "mode": "num", "accept": ["7"]}, {"label": "heap bytes requested in total", "mode": "num", "accept": ["360"]}, {"label": "free calls needed to release everything", "mode": "num", "accept": ["7"]}, {"label": "value of flat[19]", "mode": "num", "accept": ["203"]}], "why": "`m` is 1 + 5 = 6 blocks and `flat` is 1 more: **7**. Bytes: 40 (row pointers) + 5 × 32 (rows) + 160 (`flat`) = **360**. One `free` per block: **7**, the five rows, then `m`, and `flat` at any point. `flat[19]`: 19 ÷ 8 = 2 remainder 3, so it is a copy of `m[2][3]` = **203**."}]}, {"id": "heap-manager", "title": "The heap memory manager: free list, first fit, coalescing", "blurb": "Explain how malloc and free find and recycle space, and trace a sequence of malloc / free / realloc calls on a small heap to the exact byte ranges and free list.", "objective": "Objective 4: Program memory layout (explain how heap memory is managed by the heap memory manager)", "sources": "CL20 slides 14–43 · CL18 (free and metadata) · RD16", "minutes": 75, "cheats": ["**Free list** = the start address and size of every contiguous **unallocated** block. It starts as one entry: the whole heap.", "**First fit:** scan the free list from the beginning and take the **first** block big enough. Not the best one.", "**Split:** the front of the chosen block is allocated, and the rest stays on the free list as a smaller block. An exact fit removes the entry.", "**Coalesce:** on `free`, if the block touches a free block before it, after it, or both, merge them into one entry.", "**Fragmentation:** free space scattered among allocated blocks. `malloc` returns `NULL` when no *single* free block is big enough, whatever the total.", "Ranges are inclusive: `a-b` holds b − a + 1 bytes, and `n` bytes starting at `s` end at s + n − 1.", "**realloc:** free space directly after the block → grows in place, same address. Otherwise: allocate new → copy → free old → return the new address.", "`free(p)` needs no size: the manager keeps metadata with each block's size."], "chunks": [{"id": "manager", "title": "The heap memory manager and its free list", "read": "`malloc`, `free` and `realloc` are ordinary library functions. The code behind them is the **heap memory manager**. Its job is to know which bytes of the heap are in use and which are available, and to find room for each request.\n\nWhat it keeps track of:\n\n- A **free list**: \"the start address and size of contiguous unallocated blocks of memory in the heap\". One entry per free block.\n- **Metadata** about the blocks it has handed out, including each block's size. That is why `free(p)` takes only an address: given an address, the manager \"looks up how much space corresponds to\" it.\n\n### The model lecture uses\n\n- The heap is **1000 bytes, numbered 0 to 999**. The slide calls this \"an oversimplification\": a real heap is far bigger.\n- \"Initially, the heap consists of a single large free block, so the free list contains one entry representing the entire available heap.\"\n- Metadata costs nothing in this model: `malloc(200)` uses exactly 200 bytes of the heap. (The reading says a real `malloc` stores the size in a small header just before each block. Lecture's pictures leave the header out.)\n\nHow the slides draw it, lowest address at the top:\n\n```\n        Heap               Free list\n   0 +--------+          Bytes 0 - 999\n     |        |\n     |  free  |\n     |        |\n 999 +--------+\n```\n\n### Ranges are inclusive\n\n`Bytes 0 - 999` means byte 0 **through** byte 999, which is 1000 bytes.\n\n- Size of a block from `a` to `b`: **b − a + 1**. The entry `200 - 499` is 499 − 200 + 1 = 300 bytes.\n- A block of `n` bytes that starts at `s` ends at **s + n − 1**. A 150-byte block starting at 400 covers 400–549.\n- The next block starts at the byte after that: 550.\n\n> **Trap:** off by one. A 200-byte block that starts at 0 ends at **199**, not 200. Byte 200 belongs to whatever comes next.", "questions": [{"id": "free-list-holds", "type": "mc", "q": "What does the heap memory manager's free list contain?", "options": ["The start address and size of each contiguous unallocated block", "The start address and size of each allocated block", "One entry for every pointer variable that points into the heap", "Every block that has ever been freed, in the order `free` was called"], "answer": 0, "why": "Slide wording: the free list \"contains the start address and size of contiguous unallocated blocks of memory in the heap\". It describes what is **available**, one entry per free block.\n\"Allocated blocks\" is the tempting opposite. The list also isn't a history of `free` calls: before any `free` has happened it already has one entry, the whole heap."}, {"id": "initial-free-list", "type": "short", "mode": "text", "q": "Lecture's model, but with a **600-byte** heap numbered from 0. Before the program has called `malloc` at all, what is the one entry on the free list? Write it as a range, like `200-499`.", "accept": ["0-599"], "why": "\"Initially, the heap consists of a single large free block\": bytes **0–599**.\n600 bytes numbered from 0 end at 599. Writing `0-600` would be 601 bytes.", "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?599[\\])]?$"], "placeholder": "first-last"}, {"id": "range-arithmetic", "type": "blanks", "q": "Ranges are inclusive. Fill in each number.", "blanks": [{"label": "size in bytes of the free entry 250-699", "mode": "num", "accept": ["450"]}, {"label": "last byte of a 120-byte block that starts at byte 300", "mode": "num", "accept": ["419"]}, {"label": "size in bytes of a block covering 500-579", "mode": "num", "accept": ["80"]}, {"label": "first byte of the block that comes right after 500-579", "mode": "num", "accept": ["580"]}], "why": "- 699 − 250 + 1 = **450** bytes (not 449: both ends count).\n- 300 + 120 − 1 = **419** (bytes 300, 301, …, 419 are 120 bytes).\n- 579 − 500 + 1 = **80** bytes.\n- The next block starts at **580**, the byte after 579."}, {"id": "metadata-word", "type": "short", "mode": "text", "q": "`free(p)` is passed an address and no size. The manager finds the block's size in the ________ it keeps about each allocated block.", "accept": ["metadata", "meta data", "meta-data", "the metadata", "heap metadata", "header"], "why": "**Metadata.** Slide: \"You don't need to provide the size of the block because the system already knows this from metadata stored in the heap.\" Lecture added that the heap memory manager keeps track of it and looks the size up from the address.\n(The reading's version: `malloc` stores it in a header just before the block.)", "acceptRe": ["meta[ -]?data", "header"], "placeholder": "one word"}]}, {"id": "first-fit-split", "title": "malloc: first fit and splitting", "read": "When the program calls `malloc(n)`, the manager uses the **first fit** strategy. From the slide, the allocator:\n\n1. \"Starts at the beginning of the free list and checks each free block one by one.\"\n2. \"Selects the first block that is large enough to accommodate the request.\"\n3. \"If the chosen free block is larger than needed, it may be **split** into two parts: one part is allocated, and the remaining part is left in the free list as a smaller free block.\"\n\nIn every lecture example the allocated part is the **front** of the chosen block (its lowest addresses), and `malloc` returns the address of the block's first byte.\n\nWorked example on the 1000-byte heap:\n\n| # | Operation | Result | Free list after |\n|---|---|---|---|\n| | start | | 0–999 |\n| 1 | `a = malloc(150)` | `a` = 0–149 | 150–999 |\n| 2 | `b = malloc(250)` | `b` = 150–399 | 400–999 |\n| 3 | `c = malloc(600)` | `c` = 400–999 | empty |\n\n- `a` takes the first 150 bytes of 0–999. What is left, 150–999, stays on the list as a smaller block.\n- `b` takes the first 250 bytes of *that*: 150 through 150 + 250 − 1 = 399.\n- `c` asks for 600, and the remaining block 400–999 is exactly 600 bytes. An exact fit leaves nothing over, so the entry disappears and the free list is empty.\n- One more `malloc(1)` would now return `NULL`: there is no free block left.\n\n> **On paper:** the new block starts where the chosen free entry started. Its last byte is start + n − 1. The free entry now starts at start + n.", "questions": [{"id": "split-three", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\np = malloc(120);\nq = malloc(300);\nr = malloc(80);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "p gets bytes", "mode": "text", "accept": ["0-119"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?119[\\])]?$"]}, {"label": "q gets bytes", "mode": "text", "accept": ["120-419"], "acceptRe": ["^[\\[(]?(?:bytes? )?120 ?(?:-|to|through|thru|\\.\\.) ?419[\\])]?$"]}, {"label": "r gets bytes", "mode": "text", "accept": ["420-499"], "acceptRe": ["^[\\[(]?(?:bytes? )?420 ?(?:-|to|through|thru|\\.\\.) ?499[\\])]?$"]}, {"label": "free list at the end", "mode": "text", "accept": ["500-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?500 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "1. `p = malloc(120)`: front of 0–999 → **0–119**. Free list: 120–999.\n2. `q = malloc(300)`: front of 120–999 → **120–419**. Free list: 420–999.\n3. `r = malloc(80)`: front of 420–999 → **420–499**. Free list: 500–999.\n\nEach block starts at the byte after the previous one ends. `q` is 120–419, not 120–420: 300 bytes starting at 120 end at 120 + 300 − 1."}, {"id": "split-500", "type": "blanks", "q": "**Model:** the heap is 500 bytes (bytes 0 to 499), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\nx = malloc(64);\ny = malloc(200);\n```", "blanks": [{"label": "the address (byte number) stored in y", "mode": "num", "accept": ["64"]}, {"label": "last byte of y's block", "mode": "num", "accept": ["263"]}, {"label": "free list at the end (write it as first-last)", "mode": "text", "accept": ["264-499"], "acceptRe": ["^[\\[(]?(?:bytes? )?264 ?(?:-|to|through|thru|\\.\\.) ?499[\\])]?$"]}], "why": "1. `x = malloc(64)`: front of 0–499 → **0–63**. Free list: 64–499.\n2. `y = malloc(200)`: front of 64–499 → **64–263**. Free list: 264–499.\n\n`x` uses bytes 0–63, so `y` starts at **64**, not 65. The heap ends at byte 499, not 999: always read the heap size from the question.", "hint": "x is 64 bytes starting at byte 0. Which byte is the first one after it?"}, {"id": "exact-fit", "type": "mc", "q": "Lecture's model, 1000-byte heap. The free list is `300-999`, and the program calls `malloc(700)`. What happens?", "options": ["It gets 300–999 exactly. Nothing is left over, so the free list is now empty.", "It returns `NULL`: 999 − 300 = 699 bytes, one byte short.", "It gets 300–1000, and the free list is now empty.", "It gets 300–999, and the entry `300-999` stays on the free list in case the block is freed later."], "answer": 0, "why": "The entry 300–999 holds 999 − 300 + 1 = **700** bytes, so the request fits exactly. With no remainder there is nothing to split off, and the entry is removed.\n699 is the off-by-one mistake (forgetting that both end bytes count). Byte 1000 does not exist in a heap numbered 0–999. And an allocated block is never on the free list: the list holds only unallocated space."}]}, {"id": "free-first-fit", "title": "free, and first fit with holes", "read": "`free(p)` hands a block back. Lecture: it \"just means that it's going to mark it as available. The way it marks it as available is it adds it to the free list.\"\n\nTwo things `free` does **not** do: it does not erase the bytes, and it does not change `p`.\n\nAfter a `free`, the list can have more than one entry. The slides list the entries from the lowest address down, and first fit checks them in that order:\n\n- A block that is **too small is skipped**.\n- The **first** block that is big enough is used, even when a later block would fit more snugly. First fit is not \"best fit\".\n\nWorked example:\n\n| # | Operation | Result | Free list after |\n|---|---|---|---|\n| | start | | 0–999 |\n| 1 | `a = malloc(200)` | `a` = 0–199 | 200–999 |\n| 2 | `b = malloc(300)` | `b` = 200–499 | 500–999 |\n| 3 | `c = malloc(100)` | `c` = 500–599 | 600–999 |\n| 4 | `free(b)` | 200–499 handed back | 200–499, 600–999 |\n| 5 | `d = malloc(350)` | `d` = 600–949 | 200–499, 950–999 |\n| 6 | `e = malloc(50)` | `e` = 200–249 | 250–499, 950–999 |\n\n- Step 4, `free(b)`: b's neighbours `a` (0–199) and `c` (500–599) are both still allocated, so 200–499 becomes an entry of its own, listed ahead of 600–999.\n- Step 5, `malloc(350)`: the first entry, 200–499, has only 300 bytes. Skip it. The next entry, 600–999, has 400 bytes. Take its front 350.\n- Step 6, `malloc(50)`: the first entry, 200–499, has 300 bytes. That is enough, so it is used and split. The entry 950–999 is exactly 50 bytes, but first fit never gets that far.\n\n> **Rule:** for every `malloc`, start again from the **top** of the free list.", "questions": [{"id": "first-not-best", "type": "short", "mode": "text", "q": "Lecture's model (first fit from the lowest address, block taken from the front, no header). The free list is `100-299, 500-579, 700-999`. Which bytes does `malloc(80)` get? Write a range like `200-499`.", "accept": ["100-179"], "why": "Go down the list from the top. The first entry, 100–299, has 200 bytes, which is enough. Take its front 80: **100–179**. The free list becomes 180–299, 500–579, 700–999.\n500–579 is exactly 80 bytes, so it is the tempting \"best fit\" answer. First fit stops at the **first** block that works.", "acceptRe": ["^[\\[(]?(?:bytes? )?100 ?(?:-|to|through|thru|\\.\\.) ?179[\\])]?$"], "placeholder": "first-last"}, {"id": "skip-small", "type": "blanks", "q": "Same model, same starting free list: `100-299, 500-579, 700-999`. This time the request is `malloc(250)`.\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "bytes the block gets", "mode": "text", "accept": ["700-949"], "acceptRe": ["^[\\[(]?(?:bytes? )?700 ?(?:-|to|through|thru|\\.\\.) ?949[\\])]?$"]}, {"label": "free list afterwards", "mode": "text", "accept": ["100-299, 500-579, 950-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?100 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?500 ?(?:-|to|through|thru|\\.\\.) ?579[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?950 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "Sizes of the entries: 200, 80, 300. The request needs 250.\n- 100–299 has 200: too small, skip.\n- 500–579 has 80: too small, skip.\n- 700–999 has 300: fits. Front 250 bytes → **700–949**, and 950–999 stays free.\n\nThe skipped entries are untouched: **100–299, 500–579, 950–999**. Don't take 100–349: that would run into allocated bytes after 299."}, {"id": "trace-free-skip", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\np1 = malloc(300);\np2 = malloc(200);\np3 = malloc(100);\nfree(p1);\np4 = malloc(350);\np5 = malloc(250);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "free list right after free(p1)", "mode": "text", "accept": ["0-299, 600-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "p4 gets bytes", "mode": "text", "accept": ["600-949"], "acceptRe": ["^[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?949[\\])]?$"]}, {"label": "p5 gets bytes", "mode": "text", "accept": ["0-249"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?249[\\])]?$"]}, {"label": "free list at the end", "mode": "text", "accept": ["250-299, 950-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?250 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?950 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "1. `p1 = malloc(300)`: front of 0–999 → **0–299**. Free list: 300–999.\n2. `p2 = malloc(200)`: front of 300–999 → **300–499**. Free list: 500–999.\n3. `p3 = malloc(100)`: front of 500–999 → **500–599**. Free list: 600–999.\n4. `free(p1)`: 0–299 has no free neighbour, so it is a new entry. Free list: 0–299, 600–999.\n5. `p4 = malloc(350)`: skip 0–299 (300 bytes), then front of 600–999 → **600–949**. Free list: 0–299, 950–999.\n6. `p5 = malloc(250)`: front of 0–299 → **0–249**. Free list: 250–299, 950–999.\n\nThe trap is `p4`: the hole 0–299 is only 300 bytes, so a 350-byte request can't go there even though it is first on the list."}, {"id": "free-does", "type": "mc", "q": "In lecture's model, what does `free(p)` do?", "options": ["It adds p's block back to the free list. The bytes are not erased and `p` is not changed.", "It sets every byte of the block to 0, then adds the block to the free list.", "It adds the block to the free list and sets `p` to `NULL`.", "It slides the later blocks down to close the gap, so the free space stays in one piece."], "answer": 0, "why": "`free` \"just means that it's going to mark it as available… it adds it to the free list\". Nothing is wiped, and `p` keeps the old address (now dangling), which is why you write `p = NULL;` yourself.\nThe manager never moves allocated blocks to tidy up: your program holds their addresses. That is why the heap can become fragmented (part 5)."}]}, {"id": "coalescing", "title": "Coalescing: merging free neighbours", "read": "Suppose two free blocks sit side by side but are listed as two entries. A request bigger than either one would be turned away, even though the space is there. So when a block is freed, the manager **coalesces**: if the freed block is adjacent to a free block, the two are merged into **one** entry.\n\nLecture: \"Instead of having two separate entries for adjacent blocks … if someone came by and was looking for 400 bytes, they would know that, hey, I can actually fit here.\"\n\n*Adjacent* means one block ends at byte `k` and the other starts at byte `k + 1`. Check **both** sides of the freed block:\n\n| Block just before | Block just after | The free list gets |\n|---|---|---|\n| allocated | allocated | a new, separate entry |\n| **free** | allocated | one entry: the block before plus the freed block |\n| allocated | **free** | one entry: the freed block plus the block after |\n| **free** | **free** | one entry covering all three |\n\nThe two ends of the heap count as \"allocated\": there is nothing before byte 0 or after byte 999 to merge with.\n\nWorked example:\n\n| # | Operation | Result | Free list after |\n|---|---|---|---|\n| | start | | 0–999 |\n| 1 | `a = malloc(100)` | `a` = 0–99 | 100–999 |\n| 2 | `b = malloc(200)` | `b` = 100–299 | 300–999 |\n| 3 | `c = malloc(300)` | `c` = 300–599 | 600–999 |\n| 4 | `d = malloc(100)` | `d` = 600–699 | 700–999 |\n| 5 | `free(b)` | 100–299 handed back | 100–299, 700–999 |\n| 6 | `free(d)` | 600–699 handed back | 100–299, 600–999 |\n| 7 | `free(c)` | 300–599 handed back | 100–999 |\n\n- Step 5, `free(b)`: `a` is before it and `c` is after it, both allocated. New entry 100–299.\n- Step 6, `free(d)`: 600–699 ends at 699, and the free block 700–999 starts at 700. Merge → 600–999.\n- Step 7, `free(c)`: 300–599 touches 100–299 on one side and 600–999 on the other. All three become **100–999**, one entry of 900 bytes.\n\nWithout coalescing the list would read 100–299, 300–599, 600–699, 700–999, and `malloc(850)` would fail with 900 bytes free.", "questions": [{"id": "coalesce-both-sides", "type": "blanks", "q": "Lecture's model, 1000-byte heap. The free list is `0-149, 400-999`, and the only allocated block is 150–399. The program frees that block.", "blanks": [{"label": "number of entries on the free list afterwards", "mode": "num", "accept": ["1"]}, {"label": "the free list afterwards (write it as first-last)", "mode": "text", "accept": ["0-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "The freed block 150–399 has a free block on **both** sides: 0–149 ends at 149 (right before 150), and 400–999 starts at 400 (right after 399). All three merge into a single entry, **0–999**: the heap is back to its initial state.\nAnswering 3 entries (0–149, 150–399, 400–999) forgets coalescing. Answering 2 merges only one side."}, {"id": "coalesce-four-cases", "type": "blanks", "q": "Lecture's model, 1000-byte heap. Allocated blocks: `A` = 0–199, `B` = 350–449, `C` = 450–599. Free list: `200-349, 600-999`.\n\nEach row below starts again from that state. Write the free list after the call(s), in address order, like `0-99, 400-999`.", "blanks": [{"label": "after free(B) only", "mode": "text", "accept": ["200-449, 600-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?200 ?(?:-|to|through|thru|\\.\\.) ?449[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "after free(C) only", "mode": "text", "accept": ["200-349, 450-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?200 ?(?:-|to|through|thru|\\.\\.) ?349[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?450 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "after free(A) only", "mode": "text", "accept": ["0-349, 600-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?349[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "after free(B) then free(C)", "mode": "text", "accept": ["200-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?200 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "- `free(B)`: 350–449. Before it, 200–349 is free → merge. After it, `C` is allocated. → **200–449, 600–999**\n- `free(C)`: 450–599. Before it, `B` is allocated. After it, 600–999 is free → merge. → **200–349, 450–999**\n- `free(A)`: 0–199. Nothing before byte 0. After it, 200–349 is free → merge. → **0–349, 600–999**\n- `free(B)` then `free(C)`: after the first call the list is 200–449, 600–999. `C` (450–599) now touches free blocks on both sides → **200–999**.", "hint": "For each freed block, ask: is the byte just before it free? Is the byte just after it free?"}, {"id": "trace-coalesce", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\np1 = malloc(250);\np2 = malloc(150);\np3 = malloc(400);\nfree(p2);\nfree(p1);\np4 = malloc(300);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "free list right after free(p2)", "mode": "text", "accept": ["250-399, 800-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?250 ?(?:-|to|through|thru|\\.\\.) ?399[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?800 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "free list right after free(p1)", "mode": "text", "accept": ["0-399, 800-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?399[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?800 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "p4 gets bytes", "mode": "text", "accept": ["0-299"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?$"]}, {"label": "free list at the end", "mode": "text", "accept": ["300-399, 800-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?300 ?(?:-|to|through|thru|\\.\\.) ?399[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?800 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "1. `p1 = malloc(250)`: front of 0–999 → **0–249**. Free list: 250–999.\n2. `p2 = malloc(150)`: front of 250–999 → **250–399**. Free list: 400–999.\n3. `p3 = malloc(400)`: front of 400–999 → **400–799**. Free list: 800–999.\n4. `free(p2)`: 250–399 has no free neighbour, so it is a new entry. Free list: 250–399, 800–999.\n5. `free(p1)`: 0–249 touches the free block 250–399 → merged into **0–399**. Free list: 0–399, 800–999.\n6. `p4 = malloc(300)`: front of 0–399 → **0–299**. Free list: 300–399, 800–999.\n\nWithout coalescing, the free pieces would be 250, 150 and 200 bytes, and `malloc(300)` would return `NULL`. Merging 0–249 with 250–399 is what makes room for `p4`."}, {"id": "why-coalesce", "type": "mc", "q": "Why does the manager coalesce adjacent free blocks?", "options": ["So a later request that is bigger than either block alone can be given the combined space.", "So the free list is sorted by size and first fit can stop sooner.", "So the freed bytes are erased before they are reused.", "So allocated blocks can be moved next to each other."], "answer": 0, "why": "Two adjacent free blocks listed separately look like two small spaces. Merged, the manager can see one big one. Lecture's example: someone \"looking for 400 bytes\" would know they fit in 100–499, but not in 100–199 and 200–499 listed apart.\nCoalescing does not sort the list, erase anything, or move allocated blocks."}]}, {"id": "fragmentation", "title": "Fragmentation: when malloc returns NULL", "read": "\"After performing a series of malloc and free operations, the heap can become **fragmented** (free spaces end up scattered among allocated blocks).\"\n\nCoalescing can only join free blocks that **touch**. An allocated block sitting between two free blocks keeps them apart, and the manager can't slide it out of the way, because your program holds its address.\n\nA block has to be contiguous. So `malloc(n)` needs **one single** free entry of at least `n` bytes. If no entry is big enough, `malloc` returns `NULL`, even when the free bytes add up to more than `n`. Lecture's version, after its exercise: \"there's no space left. And so that is the case where malloc would return NULL.\"\n\nWorked example. The free list is:\n\n```\nBytes  50 - 199     150 bytes\nBytes 400 - 449      50 bytes\nBytes 900 - 999     100 bytes\n```\n\nTotal free: 150 + 50 + 100 = **300** bytes. Largest single block: **150**.\n\n| Request | Result | Why |\n|---|---|---|\n| `malloc(100)` | 50–149 | the first entry fits (150 ≥ 100) |\n| `malloc(150)` | 50–199 | exact fit in the first entry |\n| `malloc(151)` | `NULL` | no entry has 151 contiguous bytes |\n| `malloc(300)` | `NULL` | 300 bytes are free, but in three pieces |\n\n(Each row starts again from the same free list.)\n\n> **On paper:** to decide whether `malloc(n)` succeeds, write each entry's size (last − first + 1) and compare `n` with each size, top to bottom. Never compare `n` with the total.\n\nThis is the reason every `malloc` is followed by a `NULL` check.", "questions": [{"id": "frag-numbers", "type": "blanks", "q": "Lecture's model, 1000-byte heap. The free list is `0-79, 300-499, 850-999`.", "blanks": [{"label": "total number of free bytes", "mode": "num", "accept": ["430"]}, {"label": "largest n for which malloc(n) succeeds", "mode": "num", "accept": ["200"]}, {"label": "number of separate free blocks", "mode": "num", "accept": ["3"]}], "why": "Sizes: 79 − 0 + 1 = 80, 499 − 300 + 1 = 200, 999 − 850 + 1 = 150.\n- Total: 80 + 200 + 150 = **430** bytes.\n- A block must be contiguous, so the biggest request that can succeed is the biggest single entry: **200**.\n- **3** blocks, kept apart by the allocated blocks at 80–299 and 500–849.\n\nAnswering 430 for the second blank is the fragmentation mistake: adding up pieces that don't touch."}, {"id": "frag-requests", "type": "blanks", "q": "Same free list: `0-79, 300-499, 850-999`. Each request below starts again from that list. Give the bytes the block gets (like `200-499`), or `NULL` if the call fails.", "blanks": [{"label": "malloc(150)", "mode": "text", "accept": ["300-449"], "acceptRe": ["^[\\[(]?(?:bytes? )?300 ?(?:-|to|through|thru|\\.\\.) ?449[\\])]?$"]}, {"label": "malloc(80)", "mode": "text", "accept": ["0-79"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?79[\\])]?$"]}, {"label": "malloc(210)", "mode": "text", "accept": ["NULL"], "acceptRe": ["^null$", "^(returns? )?null( pointer)?$"]}, {"label": "malloc(200)", "mode": "text", "accept": ["300-499"], "acceptRe": ["^[\\[(]?(?:bytes? )?300 ?(?:-|to|through|thru|\\.\\.) ?499[\\])]?$"]}], "why": "Sizes top to bottom: 80, 200, 150.\n- `malloc(150)`: 80 is too small, skip. 200 fits → front of 300–499 → **300–449**. (850–999 is an exact fit, but first fit already stopped.)\n- `malloc(80)`: the first entry fits exactly → **0–79**.\n- `malloc(210)`: 80, 200 and 150 are all too small → **NULL**, with 430 bytes free.\n- `malloc(200)`: skip 80, then exact fit → **300–499**."}, {"id": "frag-why-null", "type": "mc", "q": "A heap has 430 free bytes, but `malloc(250)` returns `NULL`. Which explanation fits lecture's model?", "options": ["The free bytes are in separate blocks, and no single block has 250 contiguous bytes.", "First fit looks only at the first entry of the free list, and that entry was too small.", "Free blocks are coalesced only when the program ends.", "Splitting a block needs spare room, so 430 free bytes is not enough for a 250-byte request."], "answer": 0, "why": "This is **fragmentation**: free space \"scattered among allocated blocks\". A malloc'd block is contiguous, so what matters is the largest single free block, not the total.\nFirst fit does not give up after one entry. It \"checks each free block one by one\" until one fits or the list ends. Coalescing happens at each `free`, and splitting costs nothing in this model."}, {"id": "trace-fragment", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\np1 = malloc(300);\np2 = malloc(100);\np3 = malloc(300);\np4 = malloc(100);\nfree(p3);\nfree(p1);\np5 = malloc(400);\np6 = malloc(250);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "free list right after free(p1)", "mode": "text", "accept": ["0-299, 400-699, 800-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?400 ?(?:-|to|through|thru|\\.\\.) ?699[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?800 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "total free bytes at that moment", "mode": "num", "accept": ["800"]}, {"label": "p5 gets bytes", "mode": "text", "accept": ["NULL"], "acceptRe": ["^null$", "^(returns? )?null( pointer)?$"]}, {"label": "p6 gets bytes", "mode": "text", "accept": ["0-249"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?249[\\])]?$"]}, {"label": "free list at the end", "mode": "text", "accept": ["250-299, 400-699, 800-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?250 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?400 ?(?:-|to|through|thru|\\.\\.) ?699[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?800 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "1. `p1 = malloc(300)`: front of 0–999 → **0–299**. Free list: 300–999.\n2. `p2 = malloc(100)`: front of 300–999 → **300–399**. Free list: 400–999.\n3. `p3 = malloc(300)`: front of 400–999 → **400–699**. Free list: 700–999.\n4. `p4 = malloc(100)`: front of 700–999 → **700–799**. Free list: 800–999.\n5. `free(p3)`: 400–699 has no free neighbour, so it is a new entry. Free list: 400–699, 800–999.\n6. `free(p1)`: 0–299 has no free neighbour, so it is a new entry. Free list: 0–299, 400–699, 800–999.\n7. `p5 = malloc(400)`: the free blocks hold 300, 300 and 200 bytes. None has 400 contiguous bytes → **NULL**. Free list unchanged.\n8. `p6 = malloc(250)`: front of 0–299 → **0–249**. Free list: 250–299, 400–699, 800–999.\n\n800 bytes are free when `p5` asks for 400, and it still fails: `p2` and `p4` sit between the free blocks, so nothing can be coalesced. The failed call changes nothing, and `p6` is then served normally.", "hint": "p2 and p4 are never freed. Which free blocks do they keep apart?"}]}, {"id": "realloc-cases", "title": "realloc inside the manager: grow in place or move", "read": "An array has to be contiguous. A stack array can't grow, because \"there may already be other data occupying the memory immediately after the array\" (the return address, the next frame). A heap array can be resized with `realloc(ptr, new_size)`. Inside the manager, \"realloc can do one of two things\", and which one happens is hidden from your code.\n\n**Case 1: room to grow in place.** \"If there's space directly after the current memory block, realloc just expands the block in place.\" The pointer does not change. The free entry after the block shrinks from the front.\n\n**Case 2: no room, must move.** \"If there's not enough room after the current block (maybe something else is in the way), realloc will:\"\n\n1. Allocate a new block of the requested size (found by first fit, like `malloc`).\n2. Copy the contents from the old block to the new one.\n3. Free the old block.\n4. Return a pointer to the new block.\n\nWorked example:\n\n| # | Operation | Result | Free list after |\n|---|---|---|---|\n| | start | | 0–999 |\n| 1 | `a = malloc(200)` | `a` = 0–199 | 200–999 |\n| 2 | `b = malloc(100)` | `b` = 200–299 | 300–999 |\n| 3 | `b = realloc(b, 250)` | `b` = 200–449 (in place) | 450–999 |\n| 4 | `a = realloc(a, 300)` | `a` = 450–749 (moved) | 0–199, 750–999 |\n\n- Step 3: the byte right after `b` is 300, and 300–999 is free. **Case 1.** `b` grows to 200–449 and still starts at 200.\n- Step 4: the byte right after `a` is 200, and that belongs to `b`. **Case 2.** First fit finds 300 bytes at 450–749, the 200 old bytes are copied there, and 0–199 goes back on the free list. `a` now holds 450, not 0.\n\nWhat this means for your code:\n\n- Always use the pointer realloc **returns**. Lecture: \"Yes, you have to update your pointer.\"\n- After a move the old address is a freed block. Any other pointer still holding it is dangling.\n- You never copy the data yourself: \"Realloc will automatically copy the contents for you.\"\n- If case 2 finds no free block big enough, realloc returns `NULL` and the old block stays as it was.", "questions": [{"id": "realloc-which-case", "type": "mc", "q": "Lecture's model, 1000-byte heap. `X` = 0–299 and `Y` = 300–399 are allocated, and the free list is `400-999`. The program runs `X = realloc(X, 350);`. What does the manager do?", "options": ["It moves `X` to 400–749, copies the contents, and frees 0–299, because byte 300 belongs to `Y`.", "It grows `X` in place to 0–349, because the heap still has 600 free bytes and only 50 more are needed.", "It grows `X` in place to 0–349 and shifts `Y` up to 350–449 to make room for the extra 50 bytes.", "It returns `NULL` and leaves `X` at 0–299, because the block directly after `X` is allocated."], "answer": 0, "why": "Growing in place needs free space **directly after** the block. Byte 300 is `Y`, so \"something else is in the way\": case 2. First fit finds 350 bytes at the front of 400–999 → `X` = **400–749**. The old block is freed, so the free list becomes 0–299, 750–999.\nFree space elsewhere in the heap doesn't help a block grow in place. The manager never moves `Y`: the program holds Y's address. And a blocked neighbour means *move*, not *fail*. `NULL` comes back only when no free block is big enough."}, {"id": "realloc-in-place", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes). `realloc` grows a block in place when the free block directly after it is big enough. Otherwise it allocates a new block by first fit, copies the contents, and frees the old block.\n\n```c\na = malloc(100);\nb = malloc(100);\nc = malloc(100);\nd = malloc(100);\nfree(c);\nb = realloc(b, 180);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "free list just before the realloc", "mode": "text", "accept": ["200-299, 400-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?200 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?400 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "b's bytes after the realloc", "mode": "text", "accept": ["100-279"], "acceptRe": ["^[\\[(]?(?:bytes? )?100 ?(?:-|to|through|thru|\\.\\.) ?279[\\])]?$"]}, {"label": "did b's address change? (yes / no)", "mode": "text", "accept": ["no", "n", "false"]}, {"label": "free list at the end", "mode": "text", "accept": ["280-299, 400-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?280 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?400 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "After the first 4 calls: `a` = 0–99, `b` = 100–199, `c` = 200–299, `d` = 300–399. Free list: 400–999.\n\n- Step 5. `free(c)`: 200–299 has no free neighbour, so it is a new entry. Free list: 200–299, 400–999.\n- Step 6. `b = realloc(b, 180)`: the free block 200–299 starts right after 100–199 and has room for the 80 extra bytes → grows in place to **100–279** (same address). Free list: 280–299, 400–999.\n\n`b` needs 80 more bytes, and the hole left by `c` (100 bytes) starts right after it, so it grows in place. Moving `b` to 400–579 is the mistake of treating every realloc as a fresh `malloc`."}, {"id": "realloc-move", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes). `realloc` grows a block in place when the free block directly after it is big enough. Otherwise it allocates a new block by first fit, copies the contents, and frees the old block.\n\n```c\na = malloc(100);\nb = malloc(100);\nc = malloc(100);\nfree(a);\nb = realloc(b, 250);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "b's bytes after the realloc", "mode": "text", "accept": ["300-549"], "acceptRe": ["^[\\[(]?(?:bytes? )?300 ?(?:-|to|through|thru|\\.\\.) ?549[\\])]?$"]}, {"label": "the address (byte number) b holds afterwards", "mode": "num", "accept": ["300"]}, {"label": "free list at the end", "mode": "text", "accept": ["0-199, 550-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?199[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?550 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "After the first 3 calls: `a` = 0–99, `b` = 100–199, `c` = 200–299. Free list: 300–999.\n\n- Step 4. `free(a)`: 0–99 has no free neighbour, so it is a new entry. Free list: 0–99, 300–999.\n- Step 5. `b = realloc(b, 250)`: the byte after 100–199 is allocated → must move. First fit puts the new block at **300–549** (skipping 0–99, 100 bytes), the contents are copied, and the old 100–199 is freed and merges with 0–99 into 0–199. Free list: 0–199, 550–999.\n\nTwo traps. The free block 0–99 is *before* `b`, which does not help it grow. And when the old block 100–199 is freed it lands next to 0–99, so the two coalesce into 0–199.", "hint": "What is at byte 200, right after b? Then do the four steps of case 2 in order."}, {"id": "realloc-move-order", "type": "short", "mode": "list", "q": "When realloc has to move a block, it does four things. Put the letters in the order they happen.\n\n- **A** copy the contents from the old block to the new one\n- **B** free the old block\n- **C** allocate a new block of the requested size\n- **D** return a pointer to the new block", "accept": ["C A B D", "c a b d", "CABD", "cabd"], "why": "**C, A, B, D**: allocate new → copy → free old → return the new pointer.\nThe order matters. The new block must exist before anything can be copied into it, and the old block can't be freed until its contents are safely copied. Freeing first (B before A) would copy from a freed block.", "placeholder": "e.g. A B C D"}]}, {"id": "full-traces", "title": "Full traces on paper", "read": "The slide exercise reads: \"Draw the state of the heap and the free list after the following operations are executed.\" A routine that works every time:\n\n1. Draw the heap as a tall box, 0 at the top and 999 at the bottom. Beside it, start the free list: `0 - 999`.\n2. **malloc:** for each `malloc(n)`, go down the free list from the top. Stop at the first entry whose size is at least `n`. Label bytes start through start + n − 1 with the pointer's name. Move the entry's start up by `n` (or delete the entry on an exact fit). If no entry fits, write `NULL` and change nothing.\n3. **free:** for each `free(p)`, rub out `p`'s label. Look at the byte just before the block and the byte just after it. If either belongs to a free entry, merge. Otherwise add a new entry, keeping the list in address order.\n4. **Check:** allocated bytes + free bytes = 1000.\n\nWorked example:\n\n| # | Operation | Result | Free list after |\n|---|---|---|---|\n| | start | | 0–999 |\n| 1 | `p1 = malloc(150)` | `p1` = 0–149 | 150–999 |\n| 2 | `p2 = malloc(250)` | `p2` = 150–399 | 400–999 |\n| 3 | `p3 = malloc(100)` | `p3` = 400–499 | 500–999 |\n| 4 | `free(p2)` | 150–399 handed back | 150–399, 500–999 |\n| 5 | `p4 = malloc(300)` | `p4` = 500–799 | 150–399, 800–999 |\n| 6 | `free(p1)` | 0–149 handed back | 0–399, 800–999 |\n| 7 | `p5 = malloc(200)` | `p5` = 0–199 | 200–399, 800–999 |\n\n- Step 4: `p1` and `p3` are on either side of the freed block, so there is no merge.\n- Step 5: 150–399 is only 250 bytes. Skip it and split 500–999.\n- Step 6: 0–149 ends at 149, and the free block 150–399 starts at 150. Merge → 0–399.\n- Step 7: the merged entry is first on the list and fits.\n\nThe final picture:\n\n```\n   0 +----------------+\n     | p5    (200)    |  0-199\n 200 +----------------+\n     | free  (200)    |  200-399   <- free list entry\n 400 +----------------+\n     | p3    (100)    |  400-499\n 500 +----------------+\n     | p4    (300)    |  500-799\n 800 +----------------+\n     | free  (200)    |  800-999   <- free list entry\n 999 +----------------+\n```\n\nCheck: allocated 200 + 100 + 300 = 600, free 200 + 200 = 400, total 1000.", "questions": [{"id": "trace-seven", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\nptr1 = malloc(300);\nptr2 = malloc(100);\nfree(ptr1);\nptr3 = malloc(150);\nptr4 = malloc(200);\nfree(ptr2);\nptr5 = malloc(250);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "ptr3 gets bytes", "mode": "text", "accept": ["0-149"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?149[\\])]?$"]}, {"label": "ptr4 gets bytes", "mode": "text", "accept": ["400-599"], "acceptRe": ["^[\\[(]?(?:bytes? )?400 ?(?:-|to|through|thru|\\.\\.) ?599[\\])]?$"]}, {"label": "free list right after free(ptr2)", "mode": "text", "accept": ["150-399, 600-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?150 ?(?:-|to|through|thru|\\.\\.) ?399[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "ptr5 gets bytes", "mode": "text", "accept": ["150-399"], "acceptRe": ["^[\\[(]?(?:bytes? )?150 ?(?:-|to|through|thru|\\.\\.) ?399[\\])]?$"]}, {"label": "free list at the end", "mode": "text", "accept": ["600-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "1. `ptr1 = malloc(300)`: front of 0–999 → **0–299**. Free list: 300–999.\n2. `ptr2 = malloc(100)`: front of 300–999 → **300–399**. Free list: 400–999.\n3. `free(ptr1)`: 0–299 has no free neighbour, so it is a new entry. Free list: 0–299, 400–999.\n4. `ptr3 = malloc(150)`: front of 0–299 → **0–149**. Free list: 150–299, 400–999.\n5. `ptr4 = malloc(200)`: skip 150–299 (150 bytes), then front of 400–999 → **400–599**. Free list: 150–299, 600–999.\n6. `free(ptr2)`: 300–399 touches the free block 150–299 → merged into **150–399**. Free list: 150–399, 600–999.\n7. `ptr5 = malloc(250)`: exact fit in 150–399 → **150–399**. Free list: 600–999.\n\nThe last step only works because of step 6: the 150-byte hole and ptr2's 100 bytes merged into exactly 250. Sending `ptr5` to 600–849 forgets the coalesce."}, {"id": "trace-eight-null", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\na = malloc(400);\nb = malloc(200);\nc = malloc(300);\nfree(c);\nfree(a);\nd = malloc(250);\ne = malloc(200);\nf = malloc(350);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "free list right after free(c)", "mode": "text", "accept": ["600-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "free list right after free(a)", "mode": "text", "accept": ["0-399, 600-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?399[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "d gets bytes", "mode": "text", "accept": ["0-249"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?249[\\])]?$"]}, {"label": "e gets bytes", "mode": "text", "accept": ["600-799"], "acceptRe": ["^[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?799[\\])]?$"]}, {"label": "f gets bytes", "mode": "text", "accept": ["NULL"], "acceptRe": ["^null$", "^(returns? )?null( pointer)?$"]}, {"label": "free list at the end", "mode": "text", "accept": ["250-399, 800-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?250 ?(?:-|to|through|thru|\\.\\.) ?399[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?800 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "total free bytes at the end", "mode": "num", "accept": ["350"]}], "why": "1. `a = malloc(400)`: front of 0–999 → **0–399**. Free list: 400–999.\n2. `b = malloc(200)`: front of 400–999 → **400–599**. Free list: 600–999.\n3. `c = malloc(300)`: front of 600–999 → **600–899**. Free list: 900–999.\n4. `free(c)`: 600–899 touches the free block 900–999 → merged into **600–999**. Free list: 600–999.\n5. `free(a)`: 0–399 has no free neighbour, so it is a new entry. Free list: 0–399, 600–999.\n6. `d = malloc(250)`: front of 0–399 → **0–249**. Free list: 250–399, 600–999.\n7. `e = malloc(200)`: skip 250–399 (150 bytes), then front of 600–999 → **600–799**. Free list: 250–399, 800–999.\n8. `f = malloc(350)`: the free blocks hold 150 and 200 bytes. None has 350 contiguous bytes → **NULL**. Free list unchanged.\n\nTwo things to notice. `free(c)` merges with the free tail 900–999, so the list still has one entry after step 4. And exactly 350 bytes are free when `f` asks for 350, yet it gets `NULL`: the 350 are split 150 + 200 with `b` in between.", "hint": "When c is freed, check the byte after it. When f asks, compare 350 with each entry, not with the total."}, {"id": "layout-eight", "type": "short", "mode": "list", "q": "Same eight operations as the previous question:\n\n```c\na = malloc(400);\nb = malloc(200);\nc = malloc(300);\nfree(c);\nfree(a);\nd = malloc(250);\ne = malloc(200);\nf = malloc(350);\n```\n\nNow *draw the heap*. List what is in the heap from byte 0 down to byte 999 at the end, using the pointer names and the word `free`. Example format: `a free b`.", "accept": ["d free b e free"], "why": "Top to bottom: `d` 0–249, free 250–399, `b` 400–599, `e` 600–799, free 800–999.\n\n`a` and `c` were freed, so their names are gone, and `f` never got a block. Every byte from 0 to 999 must belong to exactly one row: 250 + 150 + 200 + 200 + 200 = 1000.", "placeholder": "names and the word free"}]}], "checkpoint": [{"id": "cp-trace-eight", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\nptr1 = malloc(200);\nptr2 = malloc(150);\nptr3 = malloc(250);\nfree(ptr2);\nptr4 = malloc(100);\nfree(ptr1);\nptr5 = malloc(300);\nptr6 = malloc(220);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "ptr4 gets bytes", "mode": "text", "accept": ["200-299"], "acceptRe": ["^[\\[(]?(?:bytes? )?200 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?$"]}, {"label": "free list right after free(ptr1)", "mode": "text", "accept": ["0-199, 300-349, 600-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?199[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?300 ?(?:-|to|through|thru|\\.\\.) ?349[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "ptr5 gets bytes", "mode": "text", "accept": ["600-899"], "acceptRe": ["^[\\[(]?(?:bytes? )?600 ?(?:-|to|through|thru|\\.\\.) ?899[\\])]?$"]}, {"label": "ptr6 gets bytes", "mode": "text", "accept": ["NULL"], "acceptRe": ["^null$", "^(returns? )?null( pointer)?$"]}, {"label": "free list at the end", "mode": "text", "accept": ["0-199, 300-349, 900-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?199[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?300 ?(?:-|to|through|thru|\\.\\.) ?349[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?900 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "total free bytes at the end", "mode": "num", "accept": ["350"]}], "why": "1. `ptr1 = malloc(200)`: front of 0–999 → **0–199**. Free list: 200–999.\n2. `ptr2 = malloc(150)`: front of 200–999 → **200–349**. Free list: 350–999.\n3. `ptr3 = malloc(250)`: front of 350–999 → **350–599**. Free list: 600–999.\n4. `free(ptr2)`: 200–349 has no free neighbour, so it is a new entry. Free list: 200–349, 600–999.\n5. `ptr4 = malloc(100)`: front of 200–349 → **200–299**. Free list: 300–349, 600–999.\n6. `free(ptr1)`: 0–199 has no free neighbour, so it is a new entry. Free list: 0–199, 300–349, 600–999.\n7. `ptr5 = malloc(300)`: skip 0–199 (200 bytes) and 300–349 (50 bytes), then front of 600–999 → **600–899**. Free list: 0–199, 300–349, 900–999.\n8. `ptr6 = malloc(220)`: the free blocks hold 200, 50 and 100 bytes. None has 220 contiguous bytes → **NULL**. Free list unchanged.\n\nTwo traps. `free(ptr1)` does **not** coalesce: byte 200 is `ptr4`, which is allocated. And `ptr6` fails with 350 bytes free, because the largest single block is 200.", "hint": "After each free, check the byte on each side of the freed block before you merge anything."}, {"id": "cp-layout", "type": "short", "mode": "list", "q": "Same operations as the previous question:\n\n```c\nptr1 = malloc(200);\nptr2 = malloc(150);\nptr3 = malloc(250);\nfree(ptr2);\nptr4 = malloc(100);\nfree(ptr1);\nptr5 = malloc(300);\nptr6 = malloc(220);\n```\n\nList what is in the heap from byte 0 down to byte 999 at the end, using the pointer names and the word `free`. Example format: `a free b`.", "accept": ["free ptr4 free ptr3 ptr5 free"], "why": "Top to bottom: free 0–199, `ptr4` 200–299, free 300–349, `ptr3` 350–599, `ptr5` 600–899, free 900–999.\n\n`ptr1` and `ptr2` were freed, and `ptr6` is `NULL`, so none of them appears. The three free rows are the three free-list entries, kept apart by `ptr4` and by `ptr3` + `ptr5`.", "placeholder": "names and the word free"}, {"id": "cp-trace-800", "type": "blanks", "q": "**Model:** the heap is 800 bytes (bytes 0 to 799), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes).\n\n```c\na = malloc(100);\nb = malloc(200);\nc = malloc(150);\nd = malloc(100);\nfree(a);\nfree(c);\nfree(b);\ne = malloc(400);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-799` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "free list right after free(c)", "mode": "text", "accept": ["0-99, 300-449, 550-799"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?99[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?300 ?(?:-|to|through|thru|\\.\\.) ?449[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?550 ?(?:-|to|through|thru|\\.\\.) ?799[\\])]?$"]}, {"label": "free list right after free(b)", "mode": "text", "accept": ["0-449, 550-799"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?449[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?550 ?(?:-|to|through|thru|\\.\\.) ?799[\\])]?$"]}, {"label": "e gets bytes", "mode": "text", "accept": ["0-399"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?399[\\])]?$"]}, {"label": "free list at the end", "mode": "text", "accept": ["400-449, 550-799"], "acceptRe": ["^[\\[(]?(?:bytes? )?400 ?(?:-|to|through|thru|\\.\\.) ?449[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?550 ?(?:-|to|through|thru|\\.\\.) ?799[\\])]?$"]}], "why": "After the first 4 calls: `a` = 0–99, `b` = 100–299, `c` = 300–449, `d` = 450–549. Free list: 550–799.\n\n- Step 5. `free(a)`: 0–99 has no free neighbour, so it is a new entry. Free list: 0–99, 550–799.\n- Step 6. `free(c)`: 300–449 has no free neighbour, so it is a new entry. Free list: 0–99, 300–449, 550–799.\n- Step 7. `free(b)`: 100–299 touches the free blocks 0–99 and 300–449 → merged into **0–449**. Free list: 0–449, 550–799.\n- Step 8. `e = malloc(400)`: front of 0–449 → **0–399**. Free list: 400–449, 550–799.\n\nThis heap is 800 bytes, so it ends at 799. `free(b)` is the three-way merge: free blocks on both sides of `b` collapse into one entry. Leaving 0–99, 100–299, 300–449 as three entries would make `malloc(400)` fail.", "hint": "The heap is 0 to 799 this time."}, {"id": "cp-trace-realloc", "type": "blanks", "q": "**Model:** the heap is 1000 bytes (bytes 0 to 999), all free at the start. First fit. The free list is kept in address order (lowest address first), a block is taken from the front of the chosen free block, adjacent free blocks are coalesced on `free`, and there is no per-block header (`malloc(n)` uses exactly `n` bytes). `realloc` grows a block in place when the free block directly after it is big enough. Otherwise it allocates a new block by first fit, copies the contents, and frees the old block.\n\n```c\na = malloc(200);\nb = malloc(300);\nc = malloc(100);\nd = malloc(50);\nfree(b);\na = realloc(a, 350);\nc = realloc(c, 200);\n```\n\nWrite a range as `200-499`, a free list as `0-99, 400-999` (entries in address order), and a failed `malloc` as `NULL`.", "blanks": [{"label": "free list right after free(b)", "mode": "text", "accept": ["200-499, 650-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?200 ?(?:-|to|through|thru|\\.\\.) ?499[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?650 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "a's bytes after its realloc", "mode": "text", "accept": ["0-349"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?349[\\])]?$"]}, {"label": "did a's address change? (yes / no)", "mode": "text", "accept": ["no", "n", "false"]}, {"label": "c's bytes after its realloc", "mode": "text", "accept": ["650-849"], "acceptRe": ["^[\\[(]?(?:bytes? )?650 ?(?:-|to|through|thru|\\.\\.) ?849[\\])]?$"]}, {"label": "did c's address change? (yes / no)", "mode": "text", "accept": ["yes", "y", "true"]}, {"label": "free list at the end", "mode": "text", "accept": ["350-599, 850-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?350 ?(?:-|to|through|thru|\\.\\.) ?599[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?850 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}], "why": "After the first 4 calls: `a` = 0–199, `b` = 200–499, `c` = 500–599, `d` = 600–649. Free list: 650–999.\n\n- Step 5. `free(b)`: 200–499 has no free neighbour, so it is a new entry. Free list: 200–499, 650–999.\n- Step 6. `a = realloc(a, 350)`: the free block 200–499 starts right after 0–199 and has room for the 150 extra bytes → grows in place to **0–349** (same address). Free list: 350–499, 650–999.\n- Step 7. `c = realloc(c, 200)`: the byte after 500–599 is allocated → must move. First fit puts the new block at **650–849** (skipping 350–499, 150 bytes), the contents are copied, and the old 500–599 is freed and merges with 350–499 into 350–599. Free list: 350–599, 850–999.\n\n`a` has a free block directly after it, so it grows in place. `c` has `d` directly after it, so it must move, and first fit skips the 150-byte hole for a 200-byte request. Don't forget the last part of a move: the old block is freed, and here it coalesces.", "hint": "For each realloc, look only at the byte right after the block."}, {"id": "cp-explain-manager", "type": "self", "lines": 10, "q": "The quiz objective says: *explain how heap memory is managed by the heap memory manager.* In four to six sentences, say what the manager keeps track of, what it does on `malloc(n)`, and what it does on `free(p)`.", "model": "The heap memory manager keeps a **free list**: the start address and size of every contiguous unallocated block in the heap. At the start the list has one entry covering the whole heap. It also keeps metadata recording the size of each allocated block.\n\nOn `malloc(n)` it uses **first fit**: it scans the free list from the beginning and selects the first block that is large enough. If that block is bigger than needed it is **split**: one part is allocated, and the rest stays on the free list as a smaller free block. If no block is large enough, `malloc` returns `NULL`.\n\nOn `free(p)` it looks up the block's size and adds the block back to the free list. If the freed block is adjacent to another free block, the two are **coalesced** into one entry. After many mallocs and frees the free space can end up scattered among allocated blocks (**fragmentation**).", "rubric": ["free list = start address and size of each contiguous unallocated block", "initially one entry covering the whole heap", "first fit: scan from the beginning, take the first block large enough", "split: part is allocated, the remainder stays on the free list", "`free` puts the block back on the free list and coalesces adjacent free blocks", "mentions `NULL` when nothing fits, or fragmentation"], "why": "These are the slide's own terms, and a short-answer grader will look for them: **free list**, **first fit**, **split**, **coalesce**. Say what each one *does*, not just its name.\nA common slip is saying the free list tracks allocated blocks. It tracks the free ones."}, {"id": "cp-first-fit-pick", "type": "short", "mode": "text", "q": "Lecture's model (first fit from the lowest address, block taken from the front, no header). The free list is `0-59, 200-449, 600-699, 800-999`. Which bytes does `malloc(100)` get? Write a range like `200-499`.", "accept": ["200-299"], "why": "Sizes top to bottom: 60, 250, 100, 200.\n- 0–59 has 60 bytes: too small, skip.\n- 200–449 has 250 bytes: fits. Take the front 100 → **200–299**.\n\n600–699 is an exact fit and is the \"best fit\" answer. First fit never looks that far. 0–99 ignores that bytes 60–199 are allocated.", "acceptRe": ["^[\\[(]?(?:bytes? )?200 ?(?:-|to|through|thru|\\.\\.) ?299[\\])]?$"], "placeholder": "first-last"}, {"id": "cp-true-statements", "type": "mc", "q": "Which statements are true in lecture's model of the heap? **Select all that apply.**", "options": ["Before any `malloc`, the free list has exactly one entry.", "First fit chooses the smallest free block that is big enough.", "Two free blocks with an allocated block between them cannot be coalesced.", "`free(p)` must be told how many bytes to release.", "When the chosen free block is larger than the request, the leftover part stays on the free list."], "answer": [0, 2, 4], "why": "- True: \"initially, the heap consists of a single large free block\".\n- False: that describes best fit. First fit takes the **first** block that is large enough.\n- True: coalescing merges **adjacent** free blocks only. This is exactly how fragmentation survives.\n- False: `free` takes only the address. The manager knows the size from its metadata.\n- True: that is splitting.", "shuffle": false}, {"id": "cp-frag-state", "type": "blanks", "q": "Lecture's model, 1000-byte heap. The free list is `100-249, 400-459, 700-999`. Each request starts again from that list. Give a range like `200-499`, or `NULL`.", "blanks": [{"label": "total free bytes", "mode": "num", "accept": ["510"]}, {"label": "malloc(310)", "mode": "text", "accept": ["NULL"], "acceptRe": ["^null$", "^(returns? )?null( pointer)?$"]}, {"label": "malloc(160)", "mode": "text", "accept": ["700-859"], "acceptRe": ["^[\\[(]?(?:bytes? )?700 ?(?:-|to|through|thru|\\.\\.) ?859[\\])]?$"]}, {"label": "malloc(60)", "mode": "text", "accept": ["100-159"], "acceptRe": ["^[\\[(]?(?:bytes? )?100 ?(?:-|to|through|thru|\\.\\.) ?159[\\])]?$"]}], "why": "Sizes: 150, 60, 300. Total 150 + 60 + 300 = **510**.\n- `malloc(310)`: bigger than every entry → **NULL**, with 510 bytes free.\n- `malloc(160)`: skip 150, skip 60, take the front of 700–999 → **700–859**.\n- `malloc(60)`: the first entry (150 bytes) already fits → **100–159**. The exact-fit entry 400–459 is the best-fit trap."}, {"id": "cp-explain-fragmentation", "type": "self", "lines": 8, "q": "A 1000-byte heap has 350 bytes f
