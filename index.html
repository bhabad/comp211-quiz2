 "q": "Using this section's convention, name the three parts of a stack frame from the top of the page (higher addresses) to the bottom.", "blanks": [{"label": "top", "mode": "text", "accept": ["parameters", "params", "parameter", "arguments", "args", "the parameters"]}, {"label": "middle", "mode": "text", "accept": ["return address", "ra", "the return address", "return address (ra)"]}, {"label": "bottom", "mode": "text", "accept": ["local variables", "locals", "local variable", "local vars", "the local variables", "local"]}], "why": "Parameters (placed by the caller), then the return address (placed by the call), then local variables (allocated by the called function). That is also the order in time, and because the stack grows toward lower addresses the first thing placed ends up highest."}, {"id": "frame-fill", "type": "blanks", "q": "Fill in `bill`'s frame for the moment just before line 7 runs. Slots are numbered from the top of the frame down. Write slot names in the class notation, like `tag(1)`.\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void bill(int16_t hours, int32_t rate) {\n 5      int32_t pay = hours * rate;\n 6      int8_t ok = 1;\n 7      printf(\"%d %d\\n\", pay, ok);\n 8  }\n 9\n10  int main(void) {\n11      int16_t h = 8;\n12      int32_t r = 15;\n13      bill(h, r);\n14  }\n```", "blanks": [{"label": "slot 1 (top), as name(size)", "mode": "code", "accept": ["hours(2)"]}, {"label": "slot 2, as name(size)", "mode": "code", "accept": ["rate(4)"]}, {"label": "slot 3, as name(size)", "mode": "code", "accept": ["RA(8)", "ra(8)"]}, {"label": "value in slot 3", "mode": "num", "accept": ["13"]}, {"label": "slot 4, as name(size)", "mode": "code", "accept": ["pay(4)"]}, {"label": "value in slot 4", "mode": "num", "accept": ["120"]}, {"label": "slot 5 (bottom), as name(size)", "mode": "code", "accept": ["ok(1)"]}, {"label": "sp is marked beside which slot? (name only)", "mode": "code", "accept": ["ok"]}], "why": "`bill` = `hours(2): 8` · `rate(4): 15` · `RA(8): 13` · `pay(4): 120` · `ok(1): 1` ← sp. Parameters first in signature order, then the RA with the line of the call (line 13), then the locals in declaration order. `pay` = 8 × 15 = 120. The two usual slips are putting the RA at the top and writing the line of the function header (4) instead of the line of the call.", "hint": "Parameters in signature order, then the RA with the line of the call, then locals in declaration order."}, {"id": "ra-meaning", "type": "mc", "q": "In the program above, `bill`'s frame contains `RA(8): 13`. What does that slot record?", "options": ["When `bill` returns, execution continues at line 13, the line in `main` that made the call", "The code of `bill` is stored starting at line 13 of the program's text segment", "`bill` needs 13 bytes of stack space for its parameters and local variables", "`bill` has been called 13 times so far, counting the call that is running now"], "answer": 0, "why": "RA = return address: where to go back to in the caller. The class writes it as the line number of the call. It says nothing about where the callee's code is or how big its frame is. `main` has nowhere in your program to return to, so its RA is drawn as 0."}]}, {"id": "by-value", "title": "Pass-by-value, and where a return value goes", "read": "When you call a function, the **value** of each argument is copied into the matching parameter slot of the new frame. This is **pass-by-value**, and the slide sums it up in three lines:\n\n- A copy of the variable is passed.\n- The function works with its own copy.\n- Changes do **not** affect the original variable.\n\nThe parameter is a separate slot in a separate frame. Giving it the same name as the caller's variable changes nothing: they are still two variables.\n\n### Where a return value goes\n\nIf the function returns a value, the **caller's** frame has one extra slot for it: **`RV(size)`**, drawn at the bottom of the caller's frame, below the caller's locals, and sized to the return type. \"Before [the function] returns, it will place the return value in main's frame so that main can access it.\" The caller then copies it out of RV to wherever it is wanted.\n\n(The earliest slides label the slot with the function's name, `RV (add)(1)`. Later ones write just `RV(8)`. It is the same slot.)\n\n### Worked example\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  int32_t twice(int32_t n) {\n 5      n = n * 2;\n 6      return n;\n 7  }\n 8\n 9  int main(void) {\n10      int32_t x = 7;\n11      int32_t r = twice(x);\n12      printf(\"%d %d\\n\", x, r);\n13  }\n```\n\nJust before `twice` returns:\n\n```\n          Stack\n          main\n RA(8): 0\n x(4): 7\n r(4): ?\n RV(4): 14\n\n          twice\n n(4): 14             (7 crossed out)\n RA(8): 11            ← sp\n```\n\nLine 5 changed `twice`'s `n`, which is a copy. `main`'s `x` is still 7. `twice` has no locals, so its frame ends at the RA, and that is where sp is.\n\nWhen `twice` returns, sp moves back up to `main`'s last slot (the RV). Line 11 then copies 14 from RV into `r`, and line 12 prints `7 14`.\n\n> **On paper:** the RV slot belongs to the **caller**. Add it to the caller's frame only when the function it calls returns a value. A `void` function gets no RV.", "questions": [{"id": "rv-where", "type": "mc", "q": "A function returns a value. Where is the RV slot drawn?", "options": ["At the bottom of the caller's frame, below the caller's local variables", "At the bottom of the called function's frame, below its local variables", "At the top of the called function's frame, above its parameters", "In the data segment, so that it outlives both frames"], "answer": 0, "why": "The called function's frame is deallocated when it returns, so a value left there would be lost. The space is in the **caller's** frame: \"we allocate space for that returned value in the caller's frame.\" It sits after the caller's locals, which makes it the caller's bottom slot."}, {"id": "byval-levels", "type": "blanks", "q": "Trace the two calls.\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void raise(int32_t level) {\n 5      level = level + 5;\n 6  }\n 7\n 8  int main(void) {\n 9      int32_t level = 2;\n10      raise(level);\n11      raise(level);\n12      printf(\"%d\\n\", level);\n13  }\n```", "blanks": [{"label": "raise's level right after line 5, first call", "mode": "num", "accept": ["7"]}, {"label": "main's level at that same moment", "mode": "num", "accept": ["2"]}, {"label": "raise's level right after line 5, second call", "mode": "num", "accept": ["7"]}, {"label": "what the program prints", "mode": "num", "accept": ["2"]}], "why": "Each call copies `main`'s `level` (2) into a brand-new frame, and line 5 makes that copy 7. The copy disappears when `raise` returns, so the second call starts from 2 again and also reaches 7, not 12. `main`'s `level` is never written: it prints **2**. Sharing a name does not make two variables one."}, {"id": "rv-fill", "type": "blanks", "q": "Fill in the diagram for the moment just before `area` returns (its return value has already been placed).\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  int16_t area(int8_t w, int8_t h) {\n 5      int16_t a = w * h;\n 6      return a;\n 7  }\n 8\n 9  int main(void) {\n10      int8_t side = 12;\n11      int16_t total = area(side, 5);\n12      printf(\"%d\\n\", total);\n13  }\n```", "blanks": [{"label": "which function's frame holds the RV slot?", "mode": "text", "accept": ["main", "main's", "main()"]}, {"label": "size of the RV slot (bytes)", "mode": "num", "accept": ["2"]}, {"label": "value in the RV slot", "mode": "num", "accept": ["60"]}, {"label": "top slot of area's frame, as name(size)", "mode": "code", "accept": ["w(1)"]}, {"label": "value in area's RA slot", "mode": "num", "accept": ["11"]}, {"label": "what the program prints", "mode": "num", "accept": ["60"]}], "why": "`main` = `RA(8): 0` · `side(1): 12` · `total(2): ?` · `RV(2): 60`. `area` = `w(1): 12` · `h(1): 5` · `RA(8): 11` · `a(2): 60` ← sp. The RV slot is in the **caller's** frame and has the size of the return type, `int16_t` = 2 bytes (not 8: only addresses are 8). `area` was called from line 11. After the return, line 11 copies 60 from RV into `total`.", "hint": "The RV slot is sized to the function's return type. What does `area` return?"}]}, {"id": "by-pointer", "title": "Pass-by-pointer: a correct example, moment by moment", "read": "Pass-by-value cannot change the caller's variable. To do that, pass the variable's **address**. The slide's three lines for **pass-by-pointer**:\n\n- A pointer (address) to the variable is passed.\n- The function accesses the original data.\n- Changes **do** affect the original variable.\n\nThree things change in the code: the parameter is a pointer (`int16_t* hp`), the body uses the star (`*hp`), and the call passes an address (`&health`).\n\n### Worked example\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void refill(int16_t* hp, int16_t* mp) {\n 5      *hp = 100;\n 6      *mp = 40;\n 7  }\n 8\n 9  int main(void) {\n10      int16_t health = 35;\n11      int16_t mana = 5;\n12      refill(&health, &mana);\n13      printf(\"health: %d, mana: %d\\n\", health, mana);\n14  }\n```\n\n| Moment | `main`'s frame | `refill`'s frame |\n|---|---|---|\n| just before the call | `RA(8): 0` · `health(2): 35` · `mana(2): 5` ← sp | not there yet |\n| before line 5 | same | `hp(8): pointer to health in main` · `mp(8): pointer to mana in main` · `RA(8): 12` ← sp |\n| after line 6 | `health(2): 100` · `mana(2): 40` | unchanged |\n| after `refill` returns | unchanged; sp is back at `mana` | still drawn, but below sp: cross the frame out |\n| when `printf` is called | unchanged | `printf`'s frame goes where `refill`'s was |\n\nIt prints `health: 100, mana: 40`.\n\n**Why it works.** `refill`'s `hp` is an 8-byte slot holding the address of `main`'s `health`. On the diagram you write `pointer to health in main` and draw the arrow. `*hp = 100` means \"go to the address stored in `hp` and write 100 there\", and that address is inside `main`'s frame. Lecture, about its own example function `fun`: \"This allows fun to manipulate data inside of main's frame.\"\n\nNotice the sizes: `health` is 2 bytes, but `hp` is 8, because it is a pointer.\n\n**What \"deallocate\" means.** \"Once fun returns, we deallocate its frame. Our stack pointer moves back up… this data still exists… but it is considered invalid… it's all below the stack pointer.\" Nothing is erased, \"for efficiency\": moving sp is one fast step. The next call builds its frame in the same place and overwrites the old bytes.", "questions": [{"id": "bp-after-return", "type": "mc", "q": "In the worked example, what is true of the bytes that made up `refill`'s frame right after `refill` returns?", "options": ["They still hold the old values, but they are below sp, so they are invalid and the next call overwrites them", "They are reset to 0 as part of popping the frame, so that the next function starts with clean memory", "They are moved to the heap, where they stay until `main` itself returns to the operating system", "They are copied into `main`'s frame as the return value, which is how `health` and `mana` were updated"], "answer": 0, "why": "Deallocating a frame only moves sp back up. Zeroing the bytes would cost time, so it is not done: the data \"still exists\" but \"is considered invalid\". `printf`'s frame is then built over it. (Lecture also noted the cost: leftover data like this is a security risk.)"}, {"id": "bp-fill", "type": "blanks", "q": "Fill in the diagram for the moment just after line 6 has run (before `settle` returns).\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void settle(int32_t* owed, int8_t* done) {\n 5      *owed = *owed - 20;\n 6      *done = 1;\n 7  }\n 8\n 9  int main(void) {\n10      int32_t debt = 75;\n11      int8_t paid = 0;\n12      settle(&debt, &paid);\n13      printf(\"%d %d\\n\", debt, paid);\n14  }\n```", "blanks": [{"label": "size of settle's owed slot (bytes)", "mode": "num", "accept": ["8"]}, {"label": "owed's arrow points at which variable in main?", "mode": "code", "accept": ["debt"]}, {"label": "value in settle's RA slot", "mode": "num", "accept": ["12"]}, {"label": "value in main's debt slot", "mode": "num", "accept": ["55"]}, {"label": "size of main's paid slot (bytes)", "mode": "num", "accept": ["1"]}, {"label": "value in main's paid slot", "mode": "num", "accept": ["1"]}, {"label": "sp is marked beside which slot of settle? (name only)", "mode": "code", "accept": ["RA", "ra"]}], "why": "`main` = `RA(8): 0` · `debt(4): 55` · `paid(1): 1`. `settle` = `owed(8): pointer to debt in main` · `done(8): pointer to paid in main` · `RA(8): 12` ← sp. Line 5 reads 75 through `owed` and writes 55 back; line 6 writes 1 through `done`. Both parameters are 8 bytes, whatever they point at, and `settle` has no locals, so sp is at its RA."}, {"id": "bp-out", "type": "short", "mode": "list", "q": "One parameter is a pointer and one is not. What does this print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid scale(int32_t* v, int32_t by) {\n    by = by + 1;\n    *v = *v * by;\n}\n\nint main(void) {\n    int32_t n = 4;\n    int32_t k = 2;\n    scale(&n, k);\n    scale(&n, k);\n    printf(\"%d %d\\n\", n, k);\n}\n```", "accept": ["36 2"], "placeholder": "two numbers", "why": "First call: `by` is a copy of `k`, 2 → 3; `*v = *v * by` → `n` = 4 × 3 = 12. Second call: `by` is a **fresh** copy of `k`, 2 → 3 again; `n` = 12 × 3 = 36. `k` was only ever copied, so it is still 2: `36 2`. Getting 48 means you carried `by` = 3 into the second call and made it 4."}]}, {"id": "no-star", "title": "Mistake 1: forgetting the `*` (it runs, and does nothing)", "read": "Take the `refill` program and delete the stars in the body. The call is unchanged.\n\n```c\n 4  void refill(int16_t* hp, int16_t* mp) {\n 5      hp = 100;\n 6      mp = 40;\n 7  }\n```\n\nBefore line 5 the diagram is exactly the same as the correct version: `hp(8): pointer to health in main`, `mp(8): pointer to mana in main`, `RA(8): 12`.\n\nBut `hp = 100` has no star, so it does not follow the arrow. It assigns to **`hp` itself**, the slot in `refill`'s own frame. After line 6:\n\n```\n          Stack\n          main\n RA(8): 0\n health(2): 35\n mana(2): 5\n\n          refill\n hp(8): 100           (pointer to health in main, crossed out)\n mp(8): 40            (pointer to mana in main, crossed out)\n RA(8): 12            ← sp\n```\n\nThe two slots now hold the meaningless addresses 100 and 40. The arrows are gone, and `main`'s variables were never touched. The program prints `health: 35, mana: 5`. There is no crash and no error message at run time. The function simply fails to do its job.\n\n> **Lecture:** without the star it \"is just going to overwrite the value inside of fun's frame… it's the same as assigning a regular variable.\"\n\n> **Rule:** `p = …` (no star) changes the called function's own copy of the pointer. Only `*p = …` reaches the caller's variable.\n\nThe same is true of *any* assignment to the parameter itself, such as `p = NULL;`, `p = &some_local;` or `p = other_pointer;`. Each one changes where the function's copy points. The caller's variable is untouched, and anything written through `p` afterwards goes to the new target.\n\n(Compilers object to storing a plain integer such as 100 in a pointer: older ones warn, newer ones refuse. Assigning `NULL` or another pointer compiles without a word, which is how this mistake gets into real programs.)", "questions": [{"id": "ns-which", "type": "mc", "q": "Which body makes `void set7(int32_t *p)` change the caller's variable to 7?", "options": ["`*p = 7;`", "`p = 7;`", "`&p = 7;`", "`int32_t q = 7; p = &q;`"], "answer": 0, "why": "Only `*p = 7;` follows the pointer to the caller's variable. `p = 7;` stores the number 7 in the function's own pointer slot. `&p = 7;` is not valid C. The last one makes the local copy point at a local `q`, and the caller sees nothing."}, {"id": "ns-frame", "type": "blanks", "q": "The stars are missing from the body. Fill in the diagram for the moment just after line 6 has run, then give the output. (Assume it compiled with a warning, as in lecture.)\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void top_up(int8_t* fuel, int8_t* oil) {\n 5      fuel = 90;\n 6      oil = 60;\n 7  }\n 8\n 9  int main(void) {\n10      int8_t fuel = 20;\n11      int8_t oil = 30;\n12      top_up(&fuel, &oil);\n13      printf(\"%d %d\\n\", fuel, oil);\n14  }\n```", "blanks": [{"label": "value now in top_up's fuel(8) slot", "mode": "num", "accept": ["90"]}, {"label": "value now in top_up's oil(8) slot", "mode": "num", "accept": ["60"]}, {"label": "value in top_up's RA slot", "mode": "num", "accept": ["12"]}, {"label": "value in main's fuel(1) slot", "mode": "num", "accept": ["20"]}, {"label": "value in main's oil(1) slot", "mode": "num", "accept": ["30"]}, {"label": "the program prints (two numbers)", "mode": "list", "accept": ["20 30"]}], "why": "`fuel = 90` and `oil = 60` overwrite the pointer slots in `top_up`'s own frame: `fuel(8): 90`, `oil(8): 60`, with \"pointer to … in main\" crossed out. Nothing follows an arrow, so `main`'s `fuel` and `oil` stay 20 and 30, and that is what prints. The names match `main`'s on purpose: the parameters are still different variables in a different frame."}, {"id": "ns-zero", "type": "short", "mode": "num", "q": "What does this print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid zero(int32_t* p) {\n    int32_t z = 0;\n    p = &z;\n    *p = 0;\n}\n\nint main(void) {\n    int32_t total = 42;\n    zero(&total);\n    printf(\"%d\\n\", total);\n}\n```", "accept": ["42"], "why": "`p = &z` re-points the function's copy of the pointer at its own local `z`. `*p = 0` then writes to `z`, not to `total`. `main`'s `total` is still **42**. One correct line, `*p = 0;` on its own, would have printed 0."}, {"id": "ns-out", "type": "short", "mode": "list", "q": "One line in this function is missing a star. What does the program print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid reset(int32_t* count, int32_t* flag) {\n    *count = 0;\n    flag = count;\n    *flag = 9;\n}\n\nint main(void) {\n    int32_t count = 5;\n    int32_t flag = 1;\n    reset(&count, &flag);\n    printf(\"%d %d\\n\", count, flag);\n}\n```", "accept": ["9 1"], "placeholder": "two numbers", "why": "`*count = 0` → `main`'s `count` = 0. `flag = count` has no star: it copies the address in `count` into `reset`'s own `flag`, so that copy now points at `main`'s `count`. `*flag = 9` therefore writes 9 into `main`'s **`count`**. `main`'s `flag` was never written. Output `9 1`. The tempting answer is `0 9`, which treats `flag = count` as harmless.", "hint": "After `flag = count;`, where does the function's own copy of `flag` point?"}]}, {"id": "no-amp", "title": "Mistake 2: forgetting the `&` (segmentation fault)", "read": "Now keep the body correct (`*hp = 100; *mp = 40;`) and break the call instead:\n\n```c\n12      refill(health, mana);      // forgot the &\n```\n\nThe **values** 35 and 5 are copied into the pointer parameters:\n\n```\n          Stack\n          main\n RA(8): 0\n health(2): 35\n mana(2): 5\n\n          refill\n hp(8): 35\n mp(8): 5\n RA(8): 12            ← sp\n```\n\nThere are no arrows now, only small numbers that will be *treated* as addresses. Line 5, `*hp = 100`, means \"go to address 35 and write 100.\" Address 35 is not the program's memory: \"low addresses are reserved for the operating system.\" So **line 5 produces a segmentation fault**. The program is stopped right there. Line 6 never runs and nothing is printed.\n\n> **Rule:** \"A segmentation fault (often called a segfault) happens when your program tries to access memory it's not allowed to use.\"\n\n**Does it even compile?** Lecture's answer: \"You will get a warning… 'This type doesn't match,' but it will still let you try.\" (Newer compilers turn that warning into an error.) On paper, give lecture's answer: it compiles with a warning and crashes at run time.\n\n### The three versions side by side\n\n| Call | Body | What happens | Output |\n|---|---|---|---|\n| `refill(&health, &mana)` | `*hp = 100;` | writes into `main`'s frame | `health: 100, mana: 40` |\n| `refill(&health, &mana)` | `hp = 100;` | changes `refill`'s own pointer copies | `health: 35, mana: 5` |\n| `refill(health, mana)` | `*hp = 100;` | dereferences address 35 | `Segmentation fault` |\n\n> **On paper:** the crash is at the **first statement that dereferences** the bad pointer. The call itself does not crash: copying 35 into `hp` is harmless until something follows it.", "questions": [{"id": "na-line", "type": "short", "mode": "num", "q": "The call on line 13 is missing its `&`s. Assume the program compiled with a warning, as in lecture. Which **line number** produces the segmentation fault?\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void tally(int32_t* sum, int32_t* n) {\n 5      int32_t step = 3;\n 6      *n = *n + 1;\n 7      *sum = *sum + step;\n 8  }\n 9\n10  int main(void) {\n11      int32_t sum = 10;\n12      int32_t n = 2;\n13      tally(sum, n);\n14      printf(\"%d %d\\n\", sum, n);\n15  }\n```", "accept": ["6"], "placeholder": "line number", "why": "Line 13 copies the values 10 and 2 into the pointer parameters; that is legal and harmless. Line 5 only sets a local. **Line 6** is the first dereference: `*n` tries to read address 2, which the program may not touch. Line 7 never runs. Answering 13 blames the call; answering 7 misses that `*n` on line 6 comes first. (Run with the warning allowed: the program dies on line 6 having printed nothing.)", "hint": "Find the first line that follows one of the bad pointers."}, {"id": "na-frame", "type": "blanks", "q": "For the same program, fill in `tally`'s frame for the moment just before line 6 runs.", "blanks": [{"label": "value in the sum(8) slot", "mode": "num", "accept": ["10"]}, {"label": "value in the n(8) slot", "mode": "num", "accept": ["2"]}, {"label": "value in the RA slot", "mode": "num", "accept": ["13"]}, {"label": "bottom slot, as name(size)", "mode": "code", "accept": ["step(4)"]}, {"label": "address that line 6 tries to read", "mode": "num", "accept": ["2"]}], "why": "`tally` = `sum(8): 10` · `n(8): 2` · `RA(8): 13` · `step(4): 3` ← sp. The parameter slots are still 8 bytes, because their type is pointer, but they hold plain numbers with no arrows. `*n` uses the 2 as an address."}, {"id": "na-three", "type": "blanks", "q": "One skeleton, three versions. For each, give what the program prints. If it crashes instead, type `segmentation fault`.\n\n```c\nvoid fix(int8_t* t) {\n    BODY\n}\n\nint main(void) {\n    int8_t t = 4;\n    CALL\n    printf(\"%d\\n\", t);\n}\n```\n\n- **A:** BODY is `*t = 9;` and CALL is `fix(&t);`\n- **B:** BODY is `t = NULL;` and CALL is `fix(&t);`\n- **C:** BODY is `*t = 9;` and CALL is `fix(t);`", "blanks": [{"label": "A", "mode": "num", "accept": ["9"]}, {"label": "B", "mode": "num", "accept": ["4"]}, {"label": "C", "mode": "text", "accept": ["segmentation fault", "segfault", "seg fault", "a segmentation fault"], "acceptRe": ["seg(mentation)?[ -]?fault"]}], "why": "**A** is correct pass-by-pointer: 9. **B** forgets the star: it sets `fix`'s own copy of the pointer to NULL and never touches `main`'s `t`, so it prints 4 (and nothing dereferences the NULL, so no crash). **C** forgets the `&`: `fix` receives the value 4 and `*t = 9` writes to address 4 → segmentation fault, nothing printed."}]}, {"id": "addone-swap", "title": "Writing them yourself: add-one and swap", "read": "The quiz has code writing, and \"write a function that changes the caller's variable\" is the standard task. The recipe never changes:\n\n1. The **parameter** is a pointer: `int32_t* n`.\n2. The **body** reads and writes through it: `*n`.\n3. The **call** passes an address: `&x`.\n\n```c\nvoid double_it(int32_t* n) {\n    *n = *n * 2;      // the right *n reads the caller's value, the left *n writes it back\n}\n\nint main(void) {\n    int32_t x = 10;\n    double_it(&x);    // x is now 20\n}\n```\n\n> **Lecture:** \"when it's on the left-hand side, that means write. When it's on the right-hand side, that means read.\"\n\nLecture's version of this adds one: `*n = *n + 1;`. A student asked about `+=`, and `*n += 1;` is fine too. So is `(*n)++;`. But `*n++;` is **not**: without the parentheses the `++` applies to the pointer, so the function's copy of the pointer moves and the caller's variable is left alone.\n\n### Swap\n\nLecture: \"This is actually a common interview question.\"\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void swap(int32_t* first, int32_t* second) {\n 5      int32_t saved = *first;\n 6      *first = *second;\n 7      *second = saved;\n 8  }\n 9\n10  int main(void) {\n11      int32_t left = 30;\n12      int32_t right = 70;\n13      swap(&left, &right);\n14      printf(\"%d %d\\n\", left, right);\n15  }\n```\n\n- `saved` is an **`int32_t`, not a pointer**: \"I want to hold the value, not the address.\"\n- `*first` is overwritten first, because its old value is already safe in `saved`.\n- The call passes two addresses: `swap(&left, &right)`.\n\nThe stack just before line 7:\n\n```\n          Stack\n          main\n RA(8): 0\n left(4): 70          (30 crossed out)\n right(4): 70\n\n          swap\n first(8): pointer to left in main\n second(8): pointer to right in main\n RA(8): 13\n saved(4): 30         ← sp\n```\n\n`swap`'s frame is in the usual order: parameters, RA, then the local. Line 7 writes 30 into `right`, and the program prints `70 30`.\n\n> **Trap:** the two earlier mistakes apply here as well. `first = second;` (no stars) swaps nothing, and `swap(left, right)` (no `&`) is a segmentation fault.", "questions": [{"id": "star-incr", "type": "mc", "q": "`void bump(int32_t* n)` is called as `bump(&x);`. Which body does **not** add one to the caller's `x`?", "options": ["`*n++;`", "`*n += 1;`", "`(*n)++;`", "`*n = *n + 1;`"], "answer": 0, "why": "In `*n++` the `++` belongs to `n`, the pointer, so the function's copy of the pointer moves on and `x` is not changed. The other three all follow the pointer first and then add one to the int. (Run: 11, 11, 11 for those three, and 10 for `*n++`.)"}, {"id": "sw-wrong", "type": "short", "mode": "list", "q": "A student writes swap like this. What does the program print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid swap(int32_t* a, int32_t* b) {\n    int32_t* t = a;\n    a = b;\n    b = t;\n}\n\nint main(void) {\n    int32_t x = 1;\n    int32_t y = 2;\n    swap(&x, &y);\n    printf(\"%d %d\\n\", x, y);\n}\n```", "accept": ["1 2"], "placeholder": "two numbers", "why": "Every assignment in this `swap` is to a pointer with no star: it exchanges the function's own **copies** of the two addresses. No int is ever written, so `main` still has `x` = 1 and `y` = 2. The giveaway is `int32_t* t`: the temporary should hold a value (`int32_t`), not an address."}, {"id": "sw-diagram", "type": "blanks", "q": "Fill in the diagram for the moment just before line 7 runs, then give the final output.\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void swap(int8_t* p, int8_t* q) {\n 5      int8_t keep = *p;\n 6      *p = *q;\n 7      *q = keep;\n 8  }\n 9\n10  int main(void) {\n11      int8_t lo = 9;\n12      int8_t hi = 2;\n13      int32_t calls = 1;\n14      swap(&lo, &hi);\n15      printf(\"%d %d %d\\n\", lo, hi, calls);\n16  }\n```", "blanks": [{"label": "value in main's lo slot", "mode": "num", "accept": ["2"]}, {"label": "value in main's hi slot", "mode": "num", "accept": ["2"]}, {"label": "p's arrow points at which variable in main?", "mode": "code", "accept": ["lo"]}, {"label": "value in swap's RA slot", "mode": "num", "accept": ["14"]}, {"label": "bottom slot of swap's frame, as name(size)", "mode": "code", "accept": ["keep(1)"]}, {"label": "value in that bottom slot", "mode": "num", "accept": ["9"]}, {"label": "the program prints (three numbers)", "mode": "list", "accept": ["2 9 1"]}], "why": "After line 5, `keep` = 9. After line 6, `lo` = 2, so just before line 7 **both** `lo` and `hi` are 2 and the old 9 survives only in `keep`. `swap` = `p(8): pointer to lo in main` · `q(8): pointer to hi in main` · `RA(8): 14` · `keep(1): 9` ← sp. Line 7 writes 9 into `hi`: `2 9 1`. `calls` sits in `main`'s frame and pushes the call to line 14, which is the RA.", "hint": "Line 6 has already run, line 7 has not. Which variable has been overwritten so far?"}, {"id": "write-triple", "type": "self", "lines": 8, "q": "Write a function `triple` that takes a pointer to an `int32_t` and multiplies the caller's variable by 3. It returns nothing. Then write the line in `main` that calls it on a variable declared as `int32_t score = 14;`.", "model": "```c\nvoid triple(int32_t* n) {\n    *n = *n * 3;\n}\n\n// in main:\ntriple(&score);     // score is now 42\n```", "rubric": ["return type `void`, parameter is a pointer: `int32_t* n`", "reads through the pointer on the right: `*n * 3`", "writes through the pointer on the left: `*n = …`", "call passes the address: `triple(&score);`"], "why": "Parameter is a pointer, body uses `*n` on both sides, call passes `&score`. `n = n * 3;` changes only the copy of the address, and `triple(score)` hands the function the number 14 to use as an address. (Model compiled and run: prints 42.)"}]}, {"id": "arrays", "title": "Arrays as arguments", "read": "> **Lecture:** \"When you pass an array to a function in C, it 'decays' to a pointer to its first element.\"\n\nSo an array argument is pass-by-pointer automatically.\n\n- The parameter (`int8_t marks[]`) is an **8-byte pointer slot**, not a copy of the array. \"Instead of passing an entire copy of the array, we just pass a pointer to the array.\"\n- You write **no `&`** in the call: `curve(grades, count)`.\n- `marks[1] = 100` inside the function changes the **caller's** array.\n- A pointer does not carry the array's length (inside the function `sizeof(marks)` is 8), so the length is passed as a separate, ordinary by-value parameter.\n\nOn the diagram the whole array is one slot in its owner's frame, written `grades(3): [70, 80, 90]`, where the size is the number of elements × the element size. The parameter is written like any other pointer, `marks(8): pointer to grades in main`, with an arrow. (The slides for this topic write \"address of nums\", and the earlier stack-frame rules write \"pointer to stack\". All three mean the same arrow.)\n\n### Worked example\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void curve(int8_t marks[], int8_t count) {\n 5      count = 0;\n 6      marks[1] = 100;\n 7  }\n 8\n 9  int main(void) {\n10      int8_t grades[] = {70, 80, 90};\n11      int8_t count = 3;\n12      curve(grades, count);\n13      printf(\"%d %d\\n\", grades[1], count);\n14  }\n```\n\nAfter line 6:\n\n```\n          Stack\n          main\n RA(8): 0\n grades(3): [70, 100, 90]\n count(1): 3\n\n          curve\n marks(8): pointer to grades in main\n count(1): 0          (3 crossed out)\n RA(8): 12            ← sp\n```\n\nIt prints `100 3`. The array element changed in `main`; `main`'s `count` did not, because `count` was passed by value.\n\n### Which to use\n\n| | Pass-by-value | Pass-by-pointer |\n|---|---|---|\n| Pros | **Safety:** the function cannot modify the original. **Simplicity:** no unintended side effects | **Efficient for large data:** nothing is copied. **Allows modification** of the original |\n| Cons | **Performance overhead:** copying large objects costs time. **More memory:** every call makes a copy | **Risk of unintended modification** of the original |", "questions": [{"id": "arr-size", "type": "short", "mode": "num", "q": "In the worked example, `grades` holds three `int8_t` values. How many bytes is the `marks` slot in `curve`'s frame?", "accept": ["8"], "placeholder": "bytes", "why": "**8.** The array decays to a pointer to its first element, and every pointer is 8 bytes. The 3-byte array itself stays in `main`'s frame and is not copied. Answering 3 assumes the array was passed by value."}, {"id": "arr-pros", "type": "mc", "q": "Which of these is an advantage of pass-by-**value** over pass-by-pointer?", "options": ["Safety: the function cannot modify the caller's original variable", "Efficiency for large data: nothing has to be copied during the call", "Flexibility: the function can change the caller's data directly", "Memory: each call uses less of it when the data is large"], "answer": 0, "why": "With a copy, nothing the function does can reach the original: that is the safety (and simplicity) of pass-by-value. Its costs are the copy's time and memory. \"No copy\" and \"can modify the original\" are the advantages of pass-by-**pointer**, whose risk is unintended modification."}, {"id": "arr-trace", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid shift(int16_t vals[], int16_t n) {\n    for (int16_t i = 0; i < n; i++) {\n        vals[i] = vals[i] + n;\n    }\n    n = 0;\n}\n\nint main(void) {\n    int16_t data[] = {5, 10, 15};\n    int16_t n = 3;\n    shift(data, n);\n    printf(\"%d %d %d %d\\n\", data[0], data[1], data[2], n);\n}\n```", "accept": ["8 13 18 3"], "placeholder": "four numbers", "why": "`vals` points at `main`'s `data`, so the loop changes the real array: 5 + 3, 10 + 3, 15 + 3 = 8, 13, 18. `n` is a by-value copy, so `n = 0` at the end affects only `shift`'s copy and `main`'s `n` is still 3. Output `8 13 18 3`. (The loop finished before `n` was set to 0, so all three elements were updated.)"}, {"id": "arr-diagram", "type": "blanks", "q": "Fill in the diagram for the moment the loop has just finished (before `cool` returns), then give the output.\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void cool(int32_t t[], int32_t len) {\n 5      int32_t i;\n 6      for (i = 0; i < len; i++) {\n 7          t[i] = t[i] - 10;\n 8      }\n 9  }\n10\n11  int main(void) {\n12      int32_t temps[] = {80, 95, 70, 60};\n13      int32_t len = 4;\n14      cool(temps, len);\n15      printf(\"%d %d\\n\", temps[0], temps[3]);\n16  }\n```", "blanks": [{"label": "size of main's temps slot (bytes)", "mode": "num", "accept": ["16"]}, {"label": "size of cool's t slot (bytes)", "mode": "num", "accept": ["8"]}, {"label": "size of cool's len slot (bytes)", "mode": "num", "accept": ["4"]}, {"label": "value in cool's RA slot", "mode": "num", "accept": ["14"]}, {"label": "value in cool's i slot", "mode": "num", "accept": ["4"]}, {"label": "value of temps[1] in main", "mode": "num", "accept": ["85"]}, {"label": "the program prints (two numbers)", "mode": "list", "accept": ["70 50"]}], "why": "`main` = `RA(8): 0` · `temps(16): [70, 85, 60, 50]` · `len(4): 4`. `cool` = `t(8): pointer to temps in main` · `len(4): 4` · `RA(8): 14` · `i(4): 4` ← sp. Four `int32_t` elements are 16 bytes in `main`, but only an 8-byte address is passed. The loop stops when `i` reaches 4. Every element dropped by 10, so it prints `70 50`."}]}, {"id": "return-local", "title": "Returning a pointer to a local: the dangling pointer", "read": "A function can return a pointer. Like any return value it goes in an RV slot at the bottom of the caller's frame, and because it is an address the slot is **`RV(8)`**.\n\nThe danger is *which* address it returns.\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  int32_t* make_id(void) {\n 5      int32_t id = 512;\n 6      return &id;\n 7  }\n 8\n 9  int main(void) {\n10      int32_t* p = make_id();\n11      printf(\"%d\\n\", *p);\n12  }\n```\n\nJust before `make_id` returns:\n\n```\n          Stack\n          main\n RA(8): 0\n p(8): ?\n RV(8): pointer to id    ──┐\n                           │\n          make_id          │\n RA(8): 10                 │\n id(4): 512      ◄─────────┘      ← sp\n```\n\nThen `make_id` returns. sp moves back up to `main`'s RV slot, `p` receives a copy of the address, and `make_id`'s frame is now **below sp**: deallocated. `p` still points into it.\n\nThat is a **dangling pointer**: \"when the pointer lives longer than the data it points to.\" When line 11 calls `printf`, `printf`'s frame is built in the very place the dead frame was, on top of the bytes `p` points at. So `*p` is **undefined behaviour**. It might print 512, it might print garbage. It compiles, and it may appear to work, which is what makes it dangerous.\n\nTwo correct designs:\n\n- Let the **caller** own the variable and pass its address in: `void make_id(int32_t* out) { *out = 512; }`, called as `make_id(&id);`. This is plain pass-by-pointer, and the data is in the caller's frame, which is still alive.\n- Allocate the data on the **heap** with `malloc`. Heap memory stays valid until it is freed (it has its own section).\n\n> **Rule:** a pointer into a frame is good only while that frame is on the stack. Passing `&local` *down* to a function you call is safe, because your frame is still there while it runs. Returning `&local` *up* to your caller never is.", "questions": [{"id": "rl-fill", "type": "blanks", "q": "Fill in the diagram for the moment just before `latest` returns (its return value has already been placed).\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  int16_t* latest(void) {\n 5      int16_t reading = 88;\n 6      return &reading;\n 7  }\n 8\n 9  int main(void) {\n10      int8_t tries = 1;\n11      int16_t* r = latest();\n12      printf(\"%d %d\\n\", tries, *r);\n13  }\n```", "blanks": [{"label": "which function's frame holds the RV slot?", "mode": "text", "accept": ["main", "main's", "main()"]}, {"label": "size of the RV slot (bytes)", "mode": "num", "accept": ["8"]}, {"label": "the RV slot's arrow points at which variable?", "mode": "code", "accept": ["reading"]}, {"label": "value in latest's RA slot", "mode": "num", "accept": ["11"]}, {"label": "size of the reading slot (bytes)", "mode": "num", "accept": ["2"]}, {"label": "top slot of latest's frame (name only)", "mode": "code", "accept": ["RA", "ra"]}], "why": "`main` = `RA(8): 0` · `tries(1): 1` · `r(8): ?` · `RV(8): pointer to reading`. `latest` = `RA(8): 11` · `reading(2): 88` ← sp. The RV is in the caller's frame and is 8 bytes because the return type is a pointer (answering 2 confuses it with the `int16_t` it points at). `latest` has no parameters, so its frame starts at the RA, and the call is on line 11."}, {"id": "rl-name", "type": "short", "mode": "text", "q": "After `latest` returns, `r` holds the address of a variable whose frame has been deallocated. What is a pointer like that called?", "accept": ["dangling pointer", "dangling", "a dangling pointer", "dangling pointers"], "acceptRe": ["^(a )?dangling( pointer)?s?$"], "placeholder": "two words", "why": "A **dangling pointer**: it outlives the data it points to. It is not a NULL pointer (it holds a real-looking address, so a NULL check cannot catch it) and it is not uninitialized (it was given a value on purpose)."}, {"id": "rl-fix", "type": "mc", "q": "Which change makes the program above correct?", "options": ["Change it to `void latest(int16_t* out)` with the body `*out = 88;`, and pass the address of an `int16_t` declared in `main`", "Keep the function as it is, and add `if (r != NULL)` in `main` around every statement that uses `*r`", "Keep the function as it is, and declare `r` in `main` as `int16_t**` so that it can hold the returned address safely", "Change the return statement to `return (int16_t*)reading;` so that the value is returned instead of the address"], "answer": 0, "why": "With an out-parameter the `int16_t` lives in `main`'s frame, which is still on the stack while `latest` runs and afterwards. A NULL check does nothing here: `r` is not NULL, it is dangling. A double pointer does not make the dead frame live again. Casting the value 88 to a pointer makes 88 the address, and dereferencing that is a segmentation fault."}, {"id": "rl-explain", "type": "self", "lines": 6, "q": "In the `latest` program, line 5 sets `reading` to 88 and the function returns its address. Explain, using the stack pointer, why `*r` on line 12 is still not safe to use. Two or three sentences.", "model": "`reading` is a local in `latest`'s stack frame. When `latest` returns, its frame is deallocated: sp moves back up to `main`'s frame, so the bytes that held 88 are now below sp and are invalid, even though nothing erased them. The call to `printf` on line 12 builds a new frame in that same space and can overwrite them, so `r` is a dangling pointer and `*r` is undefined behaviour.", "rubric": ["`reading` is in `latest`'s frame (a local / automatic variable)", "on return the frame is deallocated: sp moves back up, the data is below sp and invalid", "the old bytes are not erased, so it can appear to work", "the next call (`printf`) reuses that space and may overwrite it", "names it: dangling pointer / undefined behaviour"], "why": "The full answer has both halves: the data is *still there* (deallocation only moves sp), and it is *not yours* (the next frame overwrites it). Saying only \"the variable is deleted\" misses why the bug can hide. (Tested: after one more function call, the bytes no longer hold 88.)"}]}], "checkpoint": [{"id": "cp-spend", "type": "blanks", "q": "The paper-quiz kind of question. Draw both frames for the moment just before `spend` returns (its return value has already been placed), then fill in these parts of your diagram.\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  int32_t spend(int32_t* wallet, int16_t cost) {\n 5      int32_t before = *wallet;\n 6      *wallet = *wallet - cost;\n 7      cost = 0;\n 8      return before;\n 9  }\n10\n11  int main(void) {\n12      int32_t cash = 90;\n13      int16_t price = 25;\n14      int32_t was = spend(&cash, price);\n15      printf(\"%d %d %d\\n\", cash, price, was);\n16  }\n```", "blanks": [{"label": "top slot of spend's frame, as name(size)", "mode": "code", "accept": ["wallet(8)"]}, {"label": "value in spend's cost slot", "mode": "num", "accept": ["0"]}, {"label": "value in spend's RA slot", "mode": "num", "accept": ["14"]}, {"label": "bottom slot of spend's frame, as name(size)", "mode": "code", "accept": ["before(4)"]}, {"label": "value in main's cash slot", "mode": "num", "accept": ["65"]}, {"label": "value in main's price slot", "mode": "num", "accept": ["25"]}, {"label": "size of main's RV slot (bytes)", "mode": "num", "accept": ["4"]}, {"label": "value in main's RV slot", "mode": "num", "accept": ["90"]}], "why": "`main` = `RA(8): 0` · `cash(4): 65` · `price(2): 25` · `was(4): ?` · `RV(4): 90`. `spend` = `wallet(8): pointer to cash in main` · `cost(2): 0` · `RA(8): 14` · `before(4): 90` ← sp. `wallet` is a pointer, so line 6 changes `main`'s `cash` (90 − 25 = 65). `cost` is a copy, so line 7 zeroes only `spend`'s slot and `price` stays 25. The return type is `int32_t`, so RV is 4 bytes and holds 90.", "hint": "Start with `main`: RA, locals in order, then an RV slot because `spend` returns a value. Then `spend`: parameters, RA, locals."}, {"id": "cp-spend-out", "type": "short", "mode": "list", "q": "What does the program above print?", "accept": ["65 25 90"], "placeholder": "three numbers", "why": "`cash` was changed through the pointer: 65. `price` was passed by value: still 25. `was` receives the returned `before`: 90. Output `65 25 90`. Printing `65 0 90` means you let `cost = 0` reach `main`."}, {"id": "cp-variants", "type": "blanks", "q": "One skeleton, four versions. Give what each prints. If it crashes instead, type `segmentation fault`.\n\n```c\nvoid boost(int16_t* s) {\n    BODY\n}\n\nint main(void) {\n    int16_t s = 6;\n    CALL\n    printf(\"%d\\n\", s);\n}\n```\n\n- **A:** BODY `*s = *s * 3;` and CALL `boost(&s);`\n- **B:** BODY `s = NULL;` and CALL `boost(&s);`\n- **C:** BODY `*s = *s * 3;` and CALL `boost(s);`\n- **D:** BODY `int16_t t = *s * 3; s = &t;` and CALL `boost(&s);`", "blanks": [{"label": "A", "mode": "num", "accept": ["18"]}, {"label": "B", "mode": "num", "accept": ["6"]}, {"label": "C", "mode": "text", "accept": ["segmentation fault", "segfault", "seg fault", "a segmentation fault"], "acceptRe": ["seg(mentation)?[ -]?fault"]}, {"label": "D", "mode": "num", "accept": ["6"]}], "why": "**A:** correct pass-by-pointer, 6 × 3 = 18. **B:** no star, so only `boost`'s copy of the pointer becomes NULL: 6. **C:** no `&`, so `boost` dereferences address 6: segmentation fault. **D:** it reads through the pointer correctly but stores the result in a local `t`, then re-points its own copy at `t`; `main`'s `s` is never written: 6."}, {"id": "cp-swap-half", "type": "short", "mode": "list", "q": "A swap written without a temporary. What does it print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid swap(int32_t* a, int32_t* b) {\n    *a = *b;\n    *b = *a;\n}\n\nint main(void) {\n    int32_t x = 4;\n    int32_t y = 9;\n    swap(&x, &y);\n    printf(\"%d %d\\n\", x, y);\n}\n```", "accept": ["9 9"], "placeholder": "two numbers", "why": "`*a = *b` → `x` = 9. The old 4 is now gone. `*b = *a` → `y` = 9 (it reads the new `x`). Output `9 9`. This is why swap saves `*a` in a temporary value first."}, {"id": "cp-array", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid fill(int16_t out[], int16_t n, int16_t start) {\n    for (int16_t i = 0; i < n; i++) {\n        out[i] = start;\n        start = start + 2;\n    }\n    n = 0;\n}\n\nint main(void) {\n    int16_t seq[] = {0, 0, 0};\n    int16_t n = 3;\n    int16_t start = 5;\n    fill(seq, n, start);\n    printf(\"%d %d %d %d %d\\n\", seq[0], seq[1], seq[2], n, start);\n}\n```", "accept": ["5 7 9 3 5"], "placeholder": "five numbers", "why": "`out` is a pointer to `main`'s `seq`, so the loop fills the real array: 5, 7, 9. `start` and `n` are by-value copies: the function's `start` climbs to 11 and its `n` becomes 0, but `main`'s are still 5 and 3. Output `5 7 9 3 5`."}, {"id": "cp-write-minmax", "type": "self", "lines": 14, "q": "Code writing. Write a function\n\n```c\nvoid min_max(int32_t a, int32_t b, int32_t* lo, int32_t* hi)\n```\n\nthat stores the smaller of `a` and `b` in the caller's variable that `lo` points at, and the larger in the one `hi` points at. Then write the lines in `main` that declare two `int32_t` variables `small` and `big` and call the function with `a` = 12 and `b` = 7.", "model": "```c\nvoid min_max(int32_t a, int32_t b, int32_t* lo, int32_t* hi) {\n    if (a < b) {\n        *lo = a;\n        *hi = b;\n    } else {\n        *lo = b;\n        *hi = a;\n    }\n}\n\n// in main:\nint32_t small;\nint32_t big;\nmin_max(12, 7, &small, &big);     // small = 7, big = 12\n```", "rubric": ["compares `a` and `b` (plain values, no stars)", "writes through the pointers with a star: `*lo = …;` and `*hi = …;`", "never assigns to `lo` or `hi` themselves", "`small` and `big` are declared as `int32_t`, not as pointers", "call passes addresses for the last two arguments: `&small, &big`"], "why": "A function can only return one value, so two results come back through two pointer parameters. `a` and `b` are inputs and stay by-value. The classic slips: `lo = a;` (no star, and the wrong type), declaring `int32_t* small;` in `main` (an uninitialized pointer), and calling with `small, big` (no `&`). (Model compiled and run: 7 and 12.)"}, {"id": "cp-chain", "type": "blanks", "q": "Three frames deep. Fill in the diagram for the moment the **second** call of `inner` is about to run line 5, then give the output.\n\n```c\n 1  #include <stdint.h>\n 2  #include <stdio.h>\n 3\n 4  void inner(int32_t* v) {\n 5      *v = *v + 1;\n 6  }\n 7\n 8  void outer(int32_t* v) {\n 9      inner(v);\n10      inner(v);\n11  }\n12\n13  int main(void) {\n14      int32_t hits = 0;\n15      outer(&hits);\n16      printf(\"%d\\n\", hits);\n17  }\n```", "blanks": [{"label": "number of frames on the stack", "mode": "num", "accept": ["3"]}, {"label": "value in outer's RA slot", "mode": "num", "accept": ["15"]}, {"label": "value in inner's RA slot", "mode": "num", "accept": ["10"]}, {"label": "size of inner's v slot (bytes)", "mode": "num", "accept": ["8"]}, {"label": "inner's v arrow points at which variable?", "mode": "code", "accept": ["hits"]}, {"label": "value in main's hits slot at this moment", "mode": "num", "accept": ["1"]}, {"label": "the program prints", "mode": "num", "accept": ["2"]}], "why": "`main` = `RA(8): 0` · `hits(4): 1`. `outer` = `v(8): pointer to hits in main` · `RA(8): 15`. `inner` = `v(8): pointer to hits in main` · `RA(8): 10` ← sp. `outer` passes `v`, the **value** of its pointer, which is the address of `hits`; so `inner`'s `v` points at `hits`, not at `outer`'s `v`. The first `inner` call already made `hits` 1, and its frame was popped; the second call's frame reuses the same space and its RA is line 10. Final output 2.", "hint": "When `outer` writes `inner(v)`, does it pass the address *of* its `v`, or the address stored *in* its `v`?"}, {"id": "cp-seg-why", "type": "mc", "q": "In the \"forgot the `&`\" mistake, a function ends up dereferencing a small number such as 6. Why is that a segmentation fault?", "options": ["The 6 is used as an address, and low addresses are reserved for the operating system, so the access is not allowed", "Addresses have to be multiples of 8 because every pointer is 8 bytes, and 6 is not a multiple of 8", "Small integers are converted to `NULL` when they are passed as pointers, and NULL cannot be dereferenced", "Address 6 is inside `main`'s frame, which a called function is never allowed to read or write"], "answer": 0, "why": "A pointer slot holds whatever number was copied in, and a dereference treats that number as an address. Address 6 belongs to the operating system's reserved low region, so the access is not allowed: segmentation fault. Called functions *can* touch `main`'s frame through a real pointer; that is the whole point of pass-by-pointer."}, {"id": "cp-drop", "type": "short", "mode": "list", "q": "What does this print?\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\nvoid drop(int32_t* p) {\n    *p = *p - 1;\n    p = NULL;\n}\n\nint main(void) {\n    int32_t lives = 3;\n    int32_t* lp = &lives;\n    drop(lp);\n    drop(lp);\n    printf(\"%d %d\\n\", lives, *lp);\n}\n```", "accept": ["1 1"], "placeholder": "two numbers", "why": "`drop` gets a copy of the address in `lp`. `*p = *p - 1` changes `lives` (3 → 2, then 2 → 1 on the second call). `p = NULL` sets only `drop`'s copy to NULL; `main`'s `lp` still points at `lives`, which is why the second call and the final `*lp` are both safe. Output `1 1`. To make `main`'s `lp` NULL the function would need an `int32_t**` and `*p = NULL`.", "hint": "`drop` receives a copy of the address in `lp`. Which statements in `drop` follow that address, and which only change the copy?"}, {"id": "cp-dangle-pick", "type": "mc", "q": "Which of these functions returns a **dangling** pointer?", "options": ["`int32_t* g(void) { int32_t n = 1; return &n; }`", "`int32_t* f(int32_t* p) { *p = 1; return p; }`", "`int32_t* h(void) { int32_t* n = malloc(sizeof(int32_t)); *n = 1; return n; }`", "`int32_t* k(void) { static int32_t n = 1; return &n; }`"], "answer": 0, "why": "`g` returns the address of a local, which lives in `g`'s frame and dies at the return. `f` returns an address the caller gave it, so the data is the caller's. `h` returns heap memory, valid until it is freed. `k`'s `n` is `static`, so it is in the data segment for the whole run. Only `g` points into a dead frame."}, {"id": "cp-sp-after", "type": "short", "mode": "text", "q": "In the `spend` program at the top of this checkpoint, `spend` has just returned and `printf` has not been called yet. sp is marked beside which slot of `main`'s frame?", "accept": ["rv", "rv(4)", "main's rv", "the rv slot", "rv slot", "return value"], "acceptRe": ["^(main'?s? )?(the )?rv( ?\\(4\\))?( slot)?$"], "placeholder": "slot name", "why": "The **RV** slot. sp marks the last item of the active frame. `main`'s frame is `RA`, `cash`, `price`, `was`, `RV`, so its bottom slot is RV. `spend`'s old frame is still on the page, crossed out, below sp. Answering `was` forgets that the RV slot comes after the locals."}]}, {"id": "bytes-endian", "title": "Bytes, addresses and little-endian", "blurb": "Find any byte or array element by its hex address, turn a value into its little-endian bytes and back, and fill in the class's low-level stack and heap diagrams.", "objective": "Objective 5: Pointers", "sources": "CL17 · CL19 · HW6 · HW7", "minutes": 75, "cheats": ["One byte = 8 bits = 2 hex digits = one address. A value of size S at address A occupies A through A + S − 1, and its address is the lowest of those.", "**Little-endian:** least significant byte at the lowest address. `0x1A2B3C4D` at `0x500` puts `4D` at `0x500`, `3C` at `0x501`, `2B` at `0x502`, `1A` at `0x503`. Bytes reverse; the two digits inside a byte do not.", "Reading bytes back: write the byte from the **highest address on the left**. How many bytes to read comes from the question (check its definition of word and half-word), never from memory.", "Bytes per row = the step between row addresses (1, 2, 4 or 8). A row is one number, and its **rightmost** byte is the one at the row's own address.", "Pointers and RAs are 8 bytes, and the top two bytes of an address are `0000`. In 4-byte rows: `0x0000FFFF` on the upper row (4–7), the low 8 hex digits on the lower row (0–3).", "`&a[i] = base + i × sizeof(T)`. Multiply in decimal, convert the product to hex, add in hex. \"Element k\" means index k; the array's length never enters.", "Backwards: `&a[j] = &a[i] − (i − j) × size`. Element holding address X: `(X − base) ÷ size`, rounded down.", "Stack diagram: highest address on top, main's RA (0) first, locals in declaration order going down, but **element 0 of an array at the array's lowest address**."], "chunks": [{"id": "bytes", "title": "Memory is one long column of bytes", "read": "A running program's memory is one long column of **bytes**. A byte is 8 bits, which is exactly **two hex digits**: `0x00` up to `0xFF`. Nothing smaller than a byte gets an address.\n\nEvery byte has a **byte address**: its position number in the column. The first byte is at address 0, the next at 1, and so on. Lecture's point about them: **these addresses are not stored anywhere.** They are positions, like seat numbers. The data is what sits in the seat.\n\nHow addresses are written in this class:\n\n- In **hex**, with `0x` in front. A number with no `0x` is decimal.\n- Addresses are **64 bits**, but only 48 are used, so the slides print 12 hex digits, such as `0xFFFFFFFFFF20`. Homework groups them in fours: `0xFFFF_FFFF_FF20`. The two bytes above those 12 digits are always `0000`.\n- Hex digits run 0 to 9, then A B C D E F (A = 10, F = 15). After F a digit rolls over to 0 and the digit to its left goes up by one: `0x0F` is followed by `0x10`, and `0xFF` by `0x100`.\n\nThis is how the slides first draw memory, **one byte per row**. These three bytes hold 5, 4 and −2 (8-bit two's complement):\n\n| Byte address | Data in binary | Same byte in hex |\n|---|---|---|\n| `0x000000000000` | `0000 0101` | `0x05` |\n| `0x000000000001` | `0000 0100` | `0x04` |\n| `0x000000000002` | `1111 1110` | `0xFE` |\n\n> **Rule:** one byte = 8 bits = 2 hex digits = one address.\n\n**Worked example.** What is the address 4 bytes after `0x3E`? Count up one at a time: `0x3F`, `0x40`, `0x41`, `0x42`. After `0x3F` comes `0x40`, because F rolls over. The answer is `0x42`.", "questions": [{"id": "b-digits", "type": "short", "mode": "num", "q": "How many hex digits does it take to write the contents of exactly one byte?", "accept": ["2"], "why": "A byte is 8 bits and each hex digit stands for 4 bits, so one byte is always **2** hex digits (`0x00` to `0xFF`).\n\nTempting wrong answers: 8 (that is the number of bits) and 1 (a single hex digit is only half a byte)."}, {"id": "b-next", "type": "short", "mode": "hex", "q": "A byte sits at address `0x0000_0040_2FFF`. What is the address of the very next byte?", "accept": ["0x000000403000"], "placeholder": "0x…", "why": "Add 1. The last digit F rolls over to 0 and carries; the next F does the same; so does the third. Then 2 + 1 = 3.\n\n`0x2FFF + 1 = 0x3000`, so the address is `0x0000_0040_3000`.\n\nThere is no digit after F, so answers like `…2FFG` or `…2FF10` cannot be right."}, {"id": "b-count", "type": "short", "mode": "num", "q": "How many bytes are there from address `0x1F8` up to and including address `0x207`? Answer in decimal.", "accept": ["16"], "hint": "Subtract in hex, then remember that both end bytes are included.", "why": "`0x207 − 0x1F8 = 0xF` = 15. Both ends are counted, so add 1: **16** bytes.\n\nCheck by splitting at the rollover: `0x1F8` to `0x1FF` is 8 bytes, `0x200` to `0x207` is 8 more.\n\nTempting wrong answers: 15 (forgot to count both ends) and 9 (subtracting 207 − 198 as if they were decimal)."}, {"id": "b-stored", "type": "mc", "q": "A one-byte-per-row diagram shows `1111 1110` next to byte address 2. Where in memory is that address, the number 2, stored?", "options": ["Nowhere. An address is the byte's position, not something stored with it", "In the byte just before the data, at address 1", "In the top two bytes of the row, which is why they read `0000`", "In an 8-byte slot beside every byte, because addresses are 64 bits"], "answer": 0, "why": "Lecture: byte addresses \"are not stored anywhere\". The address column of a diagram is a label for positions, not memory contents.\n\nAn address only takes up memory when the program saves it in a **pointer variable**. Then it is ordinary data in that variable's own 8 bytes, which is what the \"8-byte slot\" option is mixing up."}]}, {"id": "hex-math", "title": "Hex address arithmetic, and values bigger than a byte", "read": "Every address question ends in a small hex sum. Three moves cover all of them.\n\n**1. Turn a decimal number into hex.** Divide by 16: the quotient is the left digit, the remainder is the right digit. 18 = 1 × 16 + 2 = `0x12`. 40 = 2 × 16 + 8 = `0x28`.\n\n**2. Add in hex, right to left, carrying at 16** (not at 10).\n\n- `0x2C + 0x12`: C + 2 = 14 = E. Then 2 + 1 = 3. Result `0x3E`.\n- `0xF8 + 0x18`: 8 + 8 = 16 = `0x10`, write 0 carry 1. F + 1 + 1 = 17 = `0x11`, write 1 carry 1. Result `0x110`.\n\n**3. Never add a decimal number straight onto hex digits.** \"`0x2C` plus 18\" is not `0x44`. Convert 18 to `0x12` first.\n\n> **Lecture:** asked why rows at `…30` and `…28` are 8 bytes apart, the answer was \"just remember, it's hex\". `0x30 − 0x28 = 8`, not 2.\n\n### Values bigger than one byte\n\nSlide: \"Variables whose types are larger than one byte span multiple addresses in memory.\" A value of size S stored at address A occupies the S consecutive addresses **A, A + 1, …, A + S − 1**.\n\n| Type | Bytes |\n|---|---|\n| `int8_t`, `char` | 1 |\n| `int16_t`, `short` | 2 |\n| `int32_t`, `int`, `float` | 4 |\n| `int64_t`, `long`, `double`, any pointer | 8 |\n\nA value's **address is the lowest address it occupies**. Lecture: \"It's always just the lowest of the addresses that it occupies.\" Its last byte is at A + S − 1, and the next thing in memory can start at A + S.\n\n**Worked example.** An `int32_t` at `0x402E` occupies `0x402E`, `0x402F`, `0x4030`, `0x4031`. Last byte: `0x402E + 3 = 0x4031` (E + 3 = 17 = `0x11`, write 1 carry 1). Address `0x4032` already belongs to whatever comes next.", "questions": [{"id": "hm-conv", "type": "short", "mode": "hex", "q": "Convert decimal 44 to hex.", "accept": ["0x2C"], "placeholder": "0x…", "why": "44 ÷ 16 = 2 remainder 12. The digit for 12 is C, so 44 = `0x2C`.\n\nCheck: 2 × 16 + 12 = 44.\n\nTempting wrong answer: `0x44`, which is just the decimal digits with `0x` in front (`0x44` is really 68)."}, {"id": "hm-add", "type": "short", "mode": "hex", "q": "Work out `0x0000_7FA0_0B5C + 0x2C`.", "accept": ["0x00007FA00B88"], "placeholder": "0x…", "why": "Right to left:\n\n- C + C = 12 + 12 = 24 = `0x18`. Write 8, carry 1.\n- 5 + 2 + 1 = 8. Write 8.\n- Nothing else changes.\n\nResult: `0x0000_7FA0_0B88`.\n\nDropping the carry gives the tempting wrong answer `…0B78`."}, {"id": "hm-carry", "type": "short", "mode": "hex", "q": "An address is `0x0000_0003_1FF4`. What address is 20 bytes later? (The 20 is decimal.)", "accept": ["0x000000032008"], "placeholder": "0x…", "hint": "Convert 20 to hex before you add.", "why": "Convert first: 20 = 1 × 16 + 4 = `0x14`.\n\nRight to left: 4 + 4 = 8. Then F + 1 = 16, write 0 carry 1. Then F + 0 + 1 = 16, write 0 carry 1. Then 1 + 1 = 2.\n\nResult: `0x0000_0003_2008`.\n\nAdding the 20 as if it were already hex gives `…2014`, the tempting wrong answer."}, {"id": "hm-span", "type": "blanks", "q": "An `int32_t` is stored at address `0x0000_0050_00FE`. Give the full addresses.", "blanks": [{"label": "first (lowest) address it occupies", "mode": "hex", "accept": ["0x0000005000FE"]}, {"label": "last (highest) address it occupies", "mode": "hex", "accept": ["0x000000500101"]}], "why": "An `int32_t` is 4 bytes, so it occupies A, A + 1, A + 2, A + 3:\n\n`…00FE`, `…00FF`, `…0100`, `…0101`.\n\nThe first is its address, `0x0000_0050_00FE`. The last is A + 3 = `0x0000_0050_0101` (E + 3 = 17 = `0x11`, write 1 carry 1; F + 1 = 16, write 0 carry 1).\n\nTempting wrong answer: `…0102`, which is A + 4. That is where the next variable can start."}]}, {"id": "le-store", "title": "Little-endian: from a value to its bytes", "read": "An `int32_t` needs four addresses. Which of its four bytes goes where?\n\nFirst name the ends. Write the value as 8 hex digits and split it into four pairs. The leftmost pair is the **most significant byte (MSB)**. The rightmost pair is the **least significant byte (LSB)**.\n\n> **Rule (little-endian):** \"The least significant byte of the integer goes in the lowest address.\"\n\nSo the bytes go into memory **from the right-hand end of the number**: the rightmost pair at the value's own address, the next pair at address + 1, and so on. **Big-endian** is the opposite: the least significant byte goes in the largest address. Lecture: little-endian \"is dominant in processor architectures and is what we will be using in this class\"; big-endian is something you might see in networking.\n\n**Worked example.** `int32_t v = 0x7A3E90C5;` stored at `0x500`. Pairs: `7A 3E 90 C5`.\n\n| Address | Little-endian (this class) | Big-endian |\n|---|---|---|\n| `0x500` | `C5` | `7A` |\n| `0x501` | `90` | `3E` |\n| `0x502` | `3E` | `90` |\n| `0x503` | `7A` | `C5` |\n\nThree things that go wrong:\n\n- **Reversing the digits inside a byte.** Bytes swap places. `C5` never becomes `5C`.\n- **Forgetting the padding.** Write the value at its full size first. As an `int32_t`, 5 is `0x00000005`, so its bytes from the lowest address up are `05 00 00 00`.\n- **Negative numbers.** Use two's complement at the full size. `int32_t` −4 is `0xFFFFFFFC`, so its bytes are `FC FF FF FF`.\n\n> **On paper:** write the value in hex, draw a bar between each pair, and number the pairs **from the right**: +0, +1, +2, +3. Those are the offsets from the value's address.", "questions": [{"id": "ls-low", "type": "short", "mode": "hex", "q": "`int32_t v = 0x3F81A2B6;` is stored at address `0x0000_0020_0500` on a little-endian machine. Which byte is at `0x0000_0020_0500`? Answer in hex.", "accept": ["0xB6"], "placeholder": "0x…", "why": "Pairs: `3F 81 A2 B6`. Little-endian puts the **least significant** byte, the rightmost pair, at the lowest address. The value's own address is its lowest, so it holds `0xB6`.\n\n`0x3F` is the big-endian answer (leftmost byte first)."}, {"id": "ls-mid", "type": "short", "mode": "hex", "q": "`int32_t v = 0x3F81A2B6;` is stored at address `0x0000_0020_0500` on a little-endian machine. Which byte is at `0x0000_0020_0502`? Answer in hex.", "accept": ["0x81"], "placeholder": "0x…", "why": "Number the pairs from the right: `B6` is +0, `A2` is +1, `81` is +2, `3F` is +3.\n\nAddress `…0502` is offset +2, so it holds `0x81`.\n\nCounting two in from the left instead gives `0xA2`, which is where the byte would be on a big-endian machine."}, {"id": "ls-neg", "type": "blanks", "q": "`int16_t t = -3;` is stored at address `0x0000_0020_0610`. Give each byte in hex.", "blanks": [{"label": "byte at …0610", "mode": "hex", "accept": ["0xFD"]}, {"label": "byte at …0611", "mode": "hex", "accept": ["0xFF"]}], "why": "First the value in 16-bit two's complement: 3 is `0x0003`; flip the bits, `0xFFFC`; add 1, `0xFFFD`.\n\nPairs: `FF FD`. The rightmost pair goes at the lowest address: `…0610` holds `0xFD` and `…0611` holds `0xFF`.\n\nTempting wrong answers: `FF` then `FD` (big-endian order), or `03` and `80` (sign-and-magnitude instead of two's complement)."}, {"id": "ls-300", "type": "blanks", "q": "`int32_t n = 300;` is stored at address `0x0000_0020_0700`. Fill in all four bytes in hex.", "blanks": [{"label": "byte at …0700", "mode": "hex", "accept": ["0x2C"]}, {"label": "byte at …0701", "mode": "hex", "accept": ["0x01"]}, {"label": "byte at …0702", "mode": "hex", "accept": ["0x00"]}, {"label": "byte at …0703", "mode": "hex", "accept": ["0x00"]}], "hint": "Pad to 8 hex digits before you split into pairs.", "why": "300 = 256 + 44 = `0x12C`. At full `int32_t` size that is `0x0000012C`, pairs `00 00 01 2C`.\n\nFrom the lowest address up: `2C`, `01`, `00`, `00`.\n\nTempting wrong answers: `00 00 01 2C` (big-endian), or starting with `12` and `C0` (splitting `12C` from the left before padding it to 8 digits)."}]}, {"id": "le-read", "title": "Bytes back into a value", "read": "Now the other direction: you are shown bytes and asked for the value.\n\n> **Rule:** collect the bytes the value occupies. Write the byte from the **highest address on the left** and the byte from the value's own (lowest) address on the **right**.\n\nYou also have to be told **how many bytes to read**. Lecture: \"You cannot tell just by looking at memory.\" Memory is a sequence of bytes with no types and no boundaries, so every access specifies both \"the starting address, and the size of the data to read or write\".\n\nSizes are sometimes given in words. Lecture's definition: a **word** is the processor's standard unit of data, 64 bits on a 64-bit computer, which makes a **half-word** 32 bits. Other problems call 32 bits a word. **Use the definition printed in the question.** The method never changes, only the number of bytes.\n\n**Worked example.** A one-byte-per-row dump:\n\n| Byte address | Data |\n|---|---|\n| `0x300` | `0x9C` |\n| `0x301` | `0x44` |\n| `0x302` | `0xE0` |\n| `0x303` | `0x17` |\n| `0x304` | `0x5B` |\n| `0x305` | `0x02` |\n| `0x306` | `0x00` |\n| `0x307` | `0xA6` |\n\n- Byte at `0x301`: `0x44`.\n- 16-bit value at `0x300`: bytes `9C` and `44`. Higher address on the left: `0x449C`.\n- 32-bit value at `0x300`: bytes `9C 44 E0 17`, written last one first: `0x17E0449C`.\n- 16-bit value at `0x302`: `0x17E0`.\n- A read can start at any address. 16-bit value at `0x301`: bytes `44` and `E0`, so `0xE044`.\n- 64-bit value at `0x300`: all eight bytes, last one first: `0xA600025B17E0449C`.\n\n> **Trap:** writing the bytes in the order you meet them going up the addresses (`0x9C44`) is the big-endian answer.", "questions": [{"id": "lr-16", "type": "short", "mode": "hex", "q": "Little-endian machine, one byte per row:\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0020_0800` | `0x3A` |\n| `0x0000_0020_0801` | `0xC4` |\n| `0x0000_0020_0802` | `0x07` |\n| `0x0000_0020_0803` | `0xF2` |\n| `0x0000_0020_0804` | `0x91` |\n| `0x0000_0020_0805` | `0x6E` |\n| `0x0000_0020_0806` | `0x00` |\n| `0x0000_0020_0807` | `0x80` |\n\nWhat is the 16-bit value stored at `0x0000_0020_0800`? Answer in hex.", "accept": ["0xC43A"], "placeholder": "0x…", "why": "A 16-bit value is 2 bytes: `…0800` holds `3A` and `…0801` holds `C4`.\n\nHigher address on the left: `0xC43A`.\n\n`0x3AC4` is the big-endian reading."}, {"id": "lr-32", "type": "short", "mode": "hex", "q": "Little-endian machine, one byte per row:\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0020_0800` | `0x3A` |\n| `0x0000_0020_0801` | `0xC4` |\n| `0x0000_0020_0802` | `0x07` |\n| `0x0000_0020_0803` | `0xF2` |\n| `0x0000_0020_0804` | `0x91` |\n| `0x0000_0020_0805` | `0x6E` |\n| `0x0000_0020_0806` | `0x00` |\n| `0x0000_0020_0807` | `0x80` |\n\nWhat is the 32-bit value stored at `0x0000_0020_0804`? Answer in hex.", "accept": ["0x80006E91"], "placeholder": "0x…", "why": "Four bytes starting at `…0804`: `91`, `6E`, `00`, `80` (addresses `…0804` to `…0807`).\n\nWrite them from the highest address down: `80 00 6E 91`, so the value is `0x80006E91`.\n\nTempting wrong answers: `0x916E0080` (address order, big-endian) and `0xF207C43A` (the four bytes at `…0800`, the wrong starting address)."}, {"id": "lr-64", "type": "short", "mode": "hex", "q": "Little-endian machine, one byte per row. **In this question a word is 64 bits.**\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0020_0800` | `0x3A` |\n| `0x0000_0020_0801` | `0xC4` |\n| `0x0000_0020_0802` | `0x07` |\n| `0x0000_0020_0803` | `0xF2` |\n| `0x0000_0020_0804` | `0x91` |\n| `0x0000_0020_0805` | `0x6E` |\n| `0x0000_0020_0806` | `0x00` |\n| `0x0000_0020_0807` | `0x80` |\n\nWhat is the word stored at `0x0000_0020_0800`? Answer in hex (16 digits).", "accept": ["0x80006E91F207C43A"], "placeholder": "0x…", "why": "A 64-bit word is all 8 bytes, `…0800` to `…0807`: `3A C4 07 F2 91 6E 00 80`.\n\nHighest address first: `80 00 6E 91 F2 07 C4 3A`, so the word is `0x80006E91F207C43A`.\n\nTempting wrong answer: `0xF207C43A80006E91`. Each half is right, but the half at the higher addresses has to go on the left."}, {"id": "lr-mid", "type": "short", "mode": "hex", "q": "Little-endian machine, one byte per row:\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0020_0800` | `0x3A` |\n| `0x0000_0020_0801` | `0xC4` |\n| `0x0000_0020_0802` | `0x07` |\n| `0x0000_0020_0803` | `0xF2` |\n| `0x0000_0020_0804` | `0x91` |\n| `0x0000_0020_0805` | `0x6E` |\n| `0x0000_0020_0806` | `0x00` |\n| `0x0000_0020_0807` | `0x80` |\n\nWhat is the 16-bit value stored at `0x0000_0020_0803`? Answer in hex.", "accept": ["0x91F2"], "placeholder": "0x…", "hint": "Which two addresses does a 2-byte value at …0803 occupy?", "why": "Start exactly where the question says: `…0803` holds `F2` and `…0804` holds `91`.\n\nHigher address on the left: `0x91F2`.\n\nTempting wrong answers: `0xF207` (the bytes at `…0802` and `…0803`: a value never reaches below its own address) and `0xF291` (address order)."}]}, {"id": "rows", "title": "The class diagram: several bytes per row", "read": "One byte per row gets long, so, as the slides say, \"sometimes memory diagrams will show 4 bytes per row instead of 1 byte per row\". Rows of 2 and of 8 bytes appear too. Nothing about memory changes, only the drawing.\n\n**How many bytes are in a row?** Lecture: \"Look at the byte address.\" The step between neighbouring row addresses is the row size. Steps of 4 show up as last digits C, 8, 4, 0. Steps of 8 show up as 8, 0. Steps of 2 run E, C, A, 8, 6, 4, 2, 0.\n\n**What a row shows.** A row is written as **one number**: all of its bytes read together, little-endian. The slides write small values in decimal (a row holding 5 is the bytes `05 00 00 00`) and addresses in hex. Either way:\n\n- the **rightmost** pair of hex digits is the byte at the row's own address,\n- each pair further left is one address higher,\n- the leftmost pair is at row address + (row size − 1).\n\n**Which way is up?** The first byte tables in the slides put address 0 at the top. **Stack diagrams put the highest address at the top** and the lowest at the bottom. Always read the address column.\n\n**Worked example** (4 bytes per row, drawn like a stack):\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0004_2008` | `0x00C0FFEE` |\n| `0x0000_0004_2004` | `0x1234ABCD` |\n| `0x0000_0004_2000` | `0x89E6D310` |\n\n- Byte at `…2000`: `0x10`. Byte at `…2003`: `0x89`.\n- Byte at `…2006`: that is row `…2004`, offset 2, so the third pair from the right: `0x34`.\n- 16-bit value at `…2002`: bytes `E6` (at `…2002`) and `89` (at `…2003`), so `0x89E6`.\n- 64-bit value at `…2000`: two rows, and the **higher row goes on the left**: `0x1234ABCD89E6D310`.\n\n> **Recipe:** for the byte at address A, find the row whose address is at or just below A. Offset = A − row address. Count that many pairs in **from the right**.", "questions": [{"id": "rw-step", "type": "short", "mode": "num", "q": "Reading down a diagram's address column you see `0x…001C`, `0x…001A`, `0x…0018`, `0x…0016`. How many bytes does each row hold?", "accept": ["2"], "why": "The row size is the step between neighbouring addresses: `0x1C − 0x1A = 2`. Each row holds **2** bytes.\n\nIt is not 4: a four-byte diagram would go C, 8, 4, 0. Here the last digits go C, A, 8, 6."}, {"id": "rw-byte1", "type": "short", "mode": "hex", "q": "Little-endian machine, 4 bytes per row:\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0004_A00C` | `0x5F3759DF` |\n| `0x0000_0004_A008` | `0x0000012C` |\n| `0x0000_0004_A004` | `0xE4D3C2B1` |\n| `0x0000_0004_A000` | `0x90817263` |\n\nWhat is the byte stored at `0x0000_0004_A005`? Answer in hex.", "accept": ["0xC2"], "placeholder": "0x…", "why": "`…A005` is in the row at `…A004`, at offset 1.\n\nThat row is `E4 D3 C2 B1`. From the right: `B1` is offset 0, `C2` is offset 1. The byte is `0xC2`.\n\nCounting one in from the left gives `0xD3`, the tempting wrong answer (that byte is at `…A006`)."}, {"id": "rw-byte3", "type": "short", "mode": "hex", "q": "Little-endian machine, 4 bytes per row:\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0004_A00C` | `0x5F3759DF` |\n| `0x0000_0004_A008` | `0x0000012C` |\n| `0x0000_0004_A004` | `0xE4D3C2B1` |\n| `0x0000_0004_A000` | `0x90817263` |\n\nWhat is the byte stored at `0x0000_0004_A00F`? Answer in hex.", "accept": ["0x5F"], "placeholder": "0x…", "why": "`…A00F` is in the top row, `…A00C`, at offset `0xF − 0xC = 3`.\n\nThat row is `5F 37 59 DF`. Offset 3 is the fourth pair from the right, which is the leftmost: `0x5F`.\n\n`0xDF` is the byte at the row's own address, `…A00C`."}, {"id": "rw-word", "type": "short", "mode": "hex", "q": "Little-endian machine, 4 bytes per row. **In this question a word is 64 bits and a half-word is 32 bits.**\n\n| Byte address | Data |\n|---|---|\n| `0x0000_0004_A00C` | `0x5F3759DF` |\n| `0x0000_0004_A008` | `0x0000012C` |\n| `0x0000_0004_A004` | `0xE4D3C2B1` |\n| `0x0000_0004_A000` | `0x90817263` |\n\nWhat is the word stored at `0x0000_0004_A000`? Answer in hex (16 digits).", "accept": ["0xE4D3C2B190817263"], "placeholder": "0x…", "why": "A 64-bit word is 8 bytes: the row at `…A000` and the row at `…A004`.\n\nThe row at the **higher** address holds the more significant half, so it goes on the left: `0xE4D3C2B1` then `0x90817263`.\n\nWord = `0xE4D3C2B190817263`.\n\nGluing the rows in increasing-address order gives `0x90817263E4D3C2B1`, the tempting wrong answer."}]}, {"id": "ptr-rows", "title": "Pointers and return addresses in the diagram", "read": "A pointer is a variable whose value is an address. In a low-level diagram its bytes are simply that address, stored little-endian like any other number. A return address (RA) is stored the same way. Both are **8 bytes**.\n\nAddresses are 64 bits but only 48 are used. At full size, an address is the 12 digits from the address column with `0000` in front: `0xFFFF_C3A0_5B18` is really `0x0000_FFFF_C3A0_5B18`. Lecture, on why a pointer's top row starts with zeros: \"That's why this is all 0 at the top.\"\n\n**Worked example.** `int32_t* p = &x;` where `x` is at `0xFFFF_C3A0_5B18` and `p` itself is stored at `0xFFFF_C3A0_5B08`.\n\nWith four bytes per row, `p` takes **two rows**, labelled the way the slides label them:\n\n| Byte address | Data | What |\n|---|---|---|\n| `0xFFFF_C3A0_5B0C` | `0x0000FFFF` | p (4–7) |\n| `0xFFFF_C3A0_5B08` | `0xC3A05B18` | p (0–3) |\n\nThe **low half** of the address goes on the **lower** row, because the least significant bytes go at the lowest addresses. The upper row always starts `0x0000`.\n\nThe same pointer with other row sizes:\n\n- **8 bytes per row:** one row holding the whole address.\n- **2 bytes per row:** four rows. From the lowest address up: `0x5B18`, `0xC3A0`, `0xFFFF`, `0x0000`.\n- **1 byte per row,** from `…5B08` up: `18 5B A0 C3 FF FF 00 00`.\n\nReturn addresses are small numbers. Main's RA is drawn as 0, and a callee's RA is the line number of the call. An RA of 14 in 4-byte rows is 14 on the lower row (0–3) and 0 on the upper row (4–7).\n\n> **Trap:** `p` is **at** `0xFFFF_C3A0_5B08` (where it lives) but **holds** `0xFFFF_C3A0_5B18` (where it points). To follow a pointer, rebuild the address from its rows, then go to that row.", "questions": [{"id": "pr-split", "type": "blanks", "q": "A pointer `p` holds the address `0xFFFF_D2C4_7E90`. `p` itself is stored at `0xFFFF_D2C4_7E80` in a diagram with 4 bytes per row. What does each of its two rows show? Answer in hex.", "blanks": [{"label": "row …7E84, p (4–7)", "mode": "hex", "accept": ["0x0000FFFF"]}, {"label": "row …7E80, p (0–3)", "mode": "hex", "accept": ["0xD2C47E90"]}], "why": "Write the address at its full 8-byte size: `0x0000_FFFF_D2C4_7E90`.\n\nSplit it in half. The low half, `0xD2C47E90`, goes on the lower row (`…7E80`). The high half, `0x0000FFFF`, goes on the upper row (`…7E84`).\n\nTempting wrong answers: the two halves swapped, or `0xFFFFD2C4` and `0x7E90…` from splitting the 12 printed digits without putting `0000` in front."}, {"id": "pr-join", "type": "short", "mode": "hex", "q": "Four bytes per row:\n\n| Byte address | Data | What |\n|---|---|---|\n| `0xFFFF_D2C4_7E6C` | `0x0000FFFF` | q (4–7) |\n| `0xFFFF_D2C4_7E68` | `0xD2C47E94` | q (0–3) |\n\nWhat address does `q` hold? Give all 12 hex digits.", "accept": ["0xFFFFD2C47E94"], "placeholder": "0x…", "why": "The row at the higher address is the high half, so it goes on the left: `0x0000FFFF` then `0xD2C47E94`.\n\n`q` holds `0x0000_FFFF_D2C4_7E94`, which is the address `0xFFFF_D2C4_7E94`.\n\nTempting wrong answers: `0xFFFF_D2C4_7E68` (that is where `q` lives, not what it holds) and `0xD2C47E940000FFFF` (rows glued in the wrong order)."}, {"id": "pr-two", "type": "blanks", "q": "`int16_t* ptr` holds the address `0xFFFF_B7A0_0024` and is stored at `0xFFFF_B7A0_0010`. The diagram has **2 bytes per row**. Fill in ptr's four rows in hex.", "blanks": [{"label": "row …0016, ptr (bytes 6–7)", "mode": "hex", "accept": ["0x0000"]}, {"label": "row …0014, ptr (bytes 4–5)", "mode": "hex", "accept": ["0xFFFF"]}, {"label": "row …0012, ptr (bytes 2–3)", "mode": "hex", "accept": ["0xB7A0"]}, {"label": "row …0010, ptr (bytes 0–1)", "mode": "hex", "accept": ["0x0024"]}], "why": "Full size: `0x0000_FFFF_B7A0_0024`. Cut it into four 2-byte pieces: `0000`, `FFFF`, `B7A0`, `0024`.\n\nThe least significant piece goes at the lowest address, so from the bottom row up: `0x0024` at `…0010`, `0xB7A0` at `…0012`, `0xFFFF` at `…0014`, `0x0000` at `…0016`.\n\nTempting wrong answer: writing the pieces top to bottom starting from the lowest address (`0x0000` at `…0010`), which is big-endian."}, {"id": "pr-byte", "type": "short", "mode": "hex", "q": "A pointer holding `0xFFFF_D2C4_7E90` is stored at `0xFFFF_D2C4_7E80`. What single byte is at address `0xFFFF_D2C4_7E86`? Answer in hex.", "accept": ["0x00"], "placeholder": "0x…", "hint": "Write out all 8 bytes of the pointer, starting from its lowest address.", "why": "Full value: `0x0000_FFFF_D2C4_7E90`. Its bytes from `…7E80` upward are `90 7E C4 D2 FF FF 00 00`.\n\n`…7E86` is offset 6, which holds `0x00`.\n\nThe two unused top bytes of every address are `0000`, and being the most significant they sit at the two **highest** addresses. `0xFF` (offsets 4 and 5) and `0
