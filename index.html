ree, yet `malloc(220)` returns `NULL`. In three or four sentences: explain how that can happen, name the problem, and say what the manager does to reduce it.", "model": "The 350 free bytes are not in one piece. They are scattered among allocated blocks, for example as 0–199, 300–349 and 900–999. A block returned by `malloc` must be contiguous, so the manager needs a **single** free block of at least 220 bytes, and the largest one is only 200. This is **fragmentation**.\n\nThe manager reduces it by **coalescing**: when a freed block is adjacent to another free block, the two are merged into one larger free-list entry. It cannot merge free blocks that have an allocated block between them.", "rubric": ["the free bytes are split across several separate blocks", "an allocation must be contiguous: one free block of at least 220 bytes is needed", "names it: fragmentation", "coalescing merges adjacent free blocks into one entry", "free blocks separated by an allocated block cannot be merged"], "why": "The example numbers are the end state of the first checkpoint trace: free list 0–199, 300–349, 900–999, which is 200 + 50 + 100 = 350 bytes with a largest block of 200.\nThe key sentence is the contiguity one. \"Not enough memory\" is wrong: there is enough, it is just in pieces."}, {"id": "cp-word-coalesce", "type": "short", "mode": "text", "q": "Merging two adjacent free blocks into a single free-list entry is called ________.", "accept": ["coalescing", "coalesce", "coalescing free blocks", "coalescence", "coalesced"], "why": "**Coalescing.** Slide: \"Two adjacent blocks are now free (100 – 199 and 200 – 499), so they can be merged into one block.\"\nSplitting is the opposite operation (one free block becomes an allocated part and a smaller free part).", "acceptRe": ["^coalesc"], "placeholder": "one word"}, {"id": "cp-derive-free-list", "type": "blanks", "q": "Lecture's model, 1000-byte heap. The only allocated blocks are 100–299 and 600–749. Everything else is free, and all coalescing has been done.", "blanks": [{"label": "number of entries on the free list", "mode": "num", "accept": ["3"]}, {"label": "the free list, in address order (like 0-99, 400-999)", "mode": "text", "accept": ["0-99, 300-599, 750-999"], "acceptRe": ["^[\\[(]?(?:bytes? )?0 ?(?:-|to|through|thru|\\.\\.) ?99[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?300 ?(?:-|to|through|thru|\\.\\.) ?599[\\])]?[ ,;]*(?:and |then )?[\\[(]?(?:bytes? )?750 ?(?:-|to|through|thru|\\.\\.) ?999[\\])]?$"]}, {"label": "total free bytes", "mode": "num", "accept": ["650"]}], "why": "The free list is everything the allocated blocks don't cover:\n- before the first block: **0–99** (100 bytes)\n- between them: **300–599** (300 bytes)\n- after the second: **750–999** (250 bytes)\n\n**3** entries, 100 + 300 + 250 = **650** bytes. Check: allocated 200 + 150 = 350, and 350 + 650 = 1000.\nStarting the middle entry at 299 or ending it at 600 double-counts a byte that is allocated."}, {"id": "cp-word-fragmentation", "type": "short", "mode": "text", "q": "After many `malloc` and `free` calls, the free space ends up scattered among allocated blocks, so a large request can fail even though enough bytes are free in total. What is this called?", "accept": ["fragmentation", "external fragmentation", "heap fragmentation", "fragmented"], "why": "**Fragmentation.** Slide: the heap \"can become fragmented (free spaces end up scattered among allocated blocks)\".\nA memory leak is a different problem: there the bytes are still *allocated* and nobody can free them. With fragmentation the bytes are free, but not contiguous.", "acceptRe": ["^(external |heap )?fragment"], "placeholder": "one word"}]}, {"id": "strings-buffers", "title": "Strings, buffers and the common pointer errors", "blurb": "Say what a char [], a char * and a char ** look like in memory, read input safely with fgets, and name, explain and fix the five common pointer bugs.", "objective": "Objective 5: Pointers (common pointer errors)", "sources": "CL20 · CL03 · CL16–CL18 · HW6 · HW7", "minutes": 70, "cheats": ["A string of N letters needs **N + 1 bytes** for the `'\\0'`. `char name[5]` holds at most 4 letters.", "`char a[] = \"tar\";` is an array: `sizeof` 4, its own writable bytes. `char *p = \"tar\";` is a pointer: `sizeof` 8, aimed at a literal you must not write to.", "`char **` = one heap block of pointers (8 bytes each) + one block per string (letters + 1). Free each string, then the outer array.", "`fgets(buf, n, stdin)` stores at most n − 1 characters then `'\\0'`, keeps the `'\\n'` if it fits, leaves the rest in the stream, and returns `buf` or `NULL`.", "**Buffer overflow** = writing past the end of a buffer. Prevent it by passing the size (`fgets`). `gets`, `scanf(\"%s\")` and unchecked `strcpy` do not know the size.", "Before every `*p` or `p[i]`: does `p` hold a real address (not uninitialized, not `NULL`), and is the index inside the block (0 to N − 1)?", "`p + i` already moves `i` **elements**. Never multiply by `sizeof` yourself. `*p + 1` is not `*(p + 1)`. `free` needs the exact address `malloc` returned.", "Undefined behaviour may crash, corrupt data or look fine. Name the bug and say \"undefined\". Do not promise one outcome."], "chunks": [{"id": "array-vs-pointer", "title": "char [] versus char *", "read": "A C string is an array of `char` that ends with the null terminator `'\\0'`, so a string of N letters needs **N + 1 bytes**. There are two ways to hold one. They look alike in code and are different in memory.\n\n```c\nchar a[] = \"tar\";    // an ARRAY: 4 bytes of its own: 't' 'a' 'r' '\\0'\nchar *p  = \"tar\";    // a POINTER: 8 bytes holding the address of a 't' stored somewhere else\n```\n\n| | `char a[] = \"tar\";` | `char *p = \"tar\";` |\n|---|---|---|\n| The variable is | the 4 characters themselves | one address |\n| `sizeof` | 4 (letters + 1) | 8 (every pointer is 8) |\n| `strlen` | 3 | 3 |\n| The characters live | in the array (in the stack frame, for a local) | in a string literal kept with the program's static data, not in the frame |\n| Write a character: `a[0] = 'c';` or `p[0] = 'c';` | fine: it is your array | undefined behaviour: never write to a string literal |\n| Assign a new string: `a = \"pot\";` or `p = \"pot\";` | does not compile: an array cannot be assigned | fine: `p` just holds a new address |\n\nIn a stack diagram that is `a(4): \"tar\"` against `p(8): ptr to the literal`.\n\n**`sizeof` is not `strlen`.** `sizeof` is the bytes the variable occupies. `strlen` counts the characters before the first `'\\0'`. For `char b[10] = \"hi\";`, `sizeof(b)` is 10 and `strlen(b)` is 2.\n\n**A `char *` owns no characters.** `char *name;` on its own is 8 bytes of garbage with nowhere to put a string. Give it memory first: an existing array (`name = a;` works because an array's name decays to the address of its first element), or the heap:\n\n```c\nchar *copy = malloc(strlen(a) + 1);    // letters + 1 for the '\\0'\n```\n\n**Worked example.** After `char *q = a; q[1] = 'o';` the array `a` holds `\"tor\"`. `q` points at `a`'s own bytes, so writing through `q` changes `a`.", "questions": [{"id": "avp-sizes", "type": "blanks", "q": "Pointers are 8 bytes. Give each value.\n\n```c\nchar city[] = \"Durham\";\nchar *team = \"Durham\";\nchar pad[16] = \"Durham\";\n```", "blanks": [{"label": "sizeof(city)", "mode": "num", "accept": ["7"]}, {"label": "sizeof(team)", "mode": "num", "accept": ["8"]}, {"label": "sizeof(pad)", "mode": "num", "accept": ["16"]}, {"label": "strlen(pad)", "mode": "num", "accept": ["6"]}], "why": "`city` is an array sized by its initializer: 6 letters + `'\\0'` = **7**. `team` is a pointer: **8**, whatever it points at. `pad` is an array you sized yourself: **16**, even though only 7 bytes are in use. `strlen` stops at the first `'\\0'`: **6**. Answering 6 for `sizeof(city)` forgets the terminator, and answering 7 for `sizeof(team)` treats a pointer as if it were the array."}, {"id": "avp-legal", "type": "mc", "q": "Start from these two lines:\n\n```c\nchar a[] = \"oak\";\nchar *p = \"oak\";\n```\n\nWhich of these statements, each tried on its own straight after them, compiles **and** has defined behaviour? Select all that apply.", "options": ["`a[0] = 'e';`", "`p[0] = 'e';`", "`p = a;`", "`a = p;`"], "answer": [0, 2], "why": "`a[0] = 'e'` changes your own array: fine. `p = a` stores the address of `a[0]` in `p`: fine. `p[0] = 'e'` compiles, but it writes to a string literal: undefined behaviour (when this was run, the program was killed with a bus error). `a = p` does not compile: \"array type 'char[4]' is not assignable.\"", "shuffle": false}, {"id": "avp-alias", "type": "short", "mode": "text", "q": "What does this print?\n\n```c\n#include <stdio.h>\n\nint main(void) {\n    char w[] = \"mint\";\n    char *q = w;\n    q[0] = 'l';\n    *(q + 3) = 'e';\n    printf(\"%s\\n\", w);\n    return 0;\n}\n```", "accept": ["line"], "why": "`q = w` makes `q` point at `w[0]`, so writes through `q` land in `w`. `q[0] = 'l'` turns `\"mint\"` into `\"lint\"`. `*(q + 3)` is `q[3]`, the `'t'`, which becomes `'e'`: **`line`**. The `'\\0'` at index 4 is untouched. Answering `mint` assumes `q` got its own copy."}, {"id": "avp-heapsize", "type": "short", "mode": "num", "q": "How many bytes must `malloc` be asked for to hold a copy of the string `\"Chapel Hill\"`?", "accept": ["12"], "why": "Count every character including the space: `Chapel` (6) + space (1) + `Hill` (4) = 11, plus 1 for `'\\0'` = **12**. In code: `malloc(strlen(s) + 1)`. Asking for 11 leaves no room for the terminator, and `strcpy` would write one byte past the end."}]}, {"id": "array-of-strings", "title": "An array of strings is a char **", "read": "An array of strings is \"just another application of 2D arrays\" (lecture): each string is itself an array of `char`. On the heap it has the Method 2 shape, **one block of pointers plus one block per string**, and its type is **`char **`**.\n\n```c\nchar **pets = malloc(3 * sizeof(char *));                         // outer block: 3 pointers\npets[0] = malloc(4 * sizeof(char));   strcpy(pets[0], \"Cat\");     // 3 letters + '\\0'\npets[1] = malloc(7 * sizeof(char));   strcpy(pets[1], \"Parrot\");  // 6 + 1\npets[2] = malloc(5 * sizeof(char));   strcpy(pets[2], \"Newt\");    // 4 + 1\n```\n\n(`NULL` checks are left out to keep the picture small. Your code needs them.)\n\n```\nStack: main                     Heap\nRA(8): 0\npets(8): ptr to heap  ----->    (24) [Address to heap, Address to heap, Address to heap]\n                                (4)  \"Cat\"\n                                (7)  \"Parrot\"\n                                (5)  \"Newt\"\n```\n\n- The outer block is 3 pointers × 8 bytes = **24**. Lecture on writing that 8 in code: \"Not a magic number.\" Write `sizeof(char *)`.\n- Each string block is **letters + 1**. \"Parrot\" has 6 letters, so 7 bytes.\n- Total: 24 + 4 + 7 + 5 = **40 bytes**, in **4 mallocs**.\n- `sizeof(char)` is 1. Lecture keeps it anyway, as \"good practice for making your code self-documenting.\"\n\n| Expression | Type | Value here |\n|---|---|---|\n| `pets` | `char **` | address of the outer block |\n| `pets[1]` | `char *` | address of the `'P'` |\n| `pets[1][0]` | `char` | `'P'` |\n| `*pets[2]` | `char` | `'N'`, the same as `pets[2][0]` |\n\n`printf(\"%s\", pets[1])` prints `Parrot`: `%s` takes a `char *` and prints up to the `'\\0'`.\n\n**Freeing** is Method 2 again: each string first, then the outer array. Here that is 4 frees.\n\n**Worked example.** `pets[1][3]`: go to slot 1 of the outer block, follow that pointer to \"Parrot\", take index 3: `'r'`.\n\n> **Trap:** sizing the outer array as `count * length * sizeof(char)`. That is Method 1 thinking. The outer array holds **pointers**, not characters.", "questions": [{"id": "aos-sizes", "type": "blanks", "q": "A `char **towns` on the heap holds these five strings in this order, each in a block of exactly the size it needs: `\"Raleigh\"`, `\"Cary\"`, `\"Apex\"`, `\"Wilmington\"`, `\"Boone\"`. Pointers are 8 bytes.", "blanks": [{"label": "bytes in the outer block", "mode": "num", "accept": ["40"]}, {"label": "bytes in the block for \"Wilmington\"", "mode": "num", "accept": ["11"]}, {"label": "number of malloc calls", "mode": "num", "accept": ["6"]}, {"label": "total heap bytes", "mode": "num", "accept": ["75"]}], "why": "Outer block: 5 pointers × 8 = **40**. \"Wilmington\" has 10 letters, + 1 = **11**. One `malloc` for the outer block and one per string: **6**. Strings: 8 + 5 + 5 + 11 + 6 = 35, so 40 + 35 = **75**. Leaving out the five terminators gives 70."}, {"id": "aos-index", "type": "blanks", "q": "With `towns` as in the previous question, give the character each expression evaluates to.\n\n- (a) `towns[3][0]`\n- (b) `towns[1][2]`\n- (c) `*towns[4]`\n- (d) `*(*(towns + 2) + 1)`", "blanks": [{"label": "(a)", "mode": "text", "accept": ["W"]}, {"label": "(b)", "mode": "text", "accept": ["r"]}, {"label": "(c)", "mode": "text", "accept": ["B"]}, {"label": "(d)", "mode": "text", "accept": ["p"]}], "why": "(a) String 3 is \"Wilmington\", index 0: **W**. (b) String 1 is \"Cary\", index 2: **r**. (c) `towns[4]` points at \"Boone\", and `*` takes its first character: **B**. (d) `*(towns + 2)` is `towns[2]`, \"Apex\". One `char` along is index 1: **p**. Counting strings or letters from 1 instead of 0 gives the neighbours."}, {"id": "aos-outer", "type": "mc", "q": "`read_words` must build a `char **` for `n` words of at most `len` letters each. Which line allocates the **outer** array correctly?", "options": ["`char **w = malloc(n * sizeof(char *));`", "`char **w = malloc(n * len * sizeof(char));`", "`char **w = malloc(n * sizeof(char));`", "`char **w = malloc(n * (len + 1));`"], "answer": 0, "why": "The outer array has `n` elements and each element is a `char *`: number of elements times size of each element = `n * sizeof(char *)`. `n * len * sizeof(char)` is the Method 1 idea of one big block of characters. `n * sizeof(char)` is only `n` bytes, an eighth of what `n` pointers need. `len + 1` belongs in the *inner* mallocs, one per word."}, {"id": "aos-free", "type": "blanks", "q": "The program is finished with `towns` (five strings) and must release all of it.", "blanks": [{"label": "number of free calls", "mode": "num", "accept": ["6"]}, {"label": "argument of the LAST free", "mode": "code", "accept": ["towns", "free(towns)"]}], "why": "One `free` per `malloc`: five strings plus the outer block = **6**. The outer block goes last, `free(towns)`, because the only copies of the five string addresses are stored inside it. Freeing `towns` first would leave no safe way to reach the strings."}]}, {"id": "buffers-fgets", "title": "Buffers and fgets", "read": "A **buffer** is \"just a chunk of memory used to store data\", like an array. Writing into a buffer fills that space.\n\n```c\nchar name[5];     // a buffer that can hold a string of up to 4 characters plus the null terminator\n```\n\nA buffer of N bytes holds a string of at most **N − 1** characters.\n\n**`fgets(buffer, size, stream)`** reads one line of input into a buffer.\n\n| Argument | Meaning |\n|---|---|\n| `buffer` | where to store what is read (a `char *`) |\n| `size` | the most characters to store, **including the `'\\0'`** |\n| `stream` | where to read from: `stdin` for the keyboard |\n\nWhat it does:\n\n- Stores at most **size − 1** characters, then always adds `'\\0'`.\n- Stops early at the end of the line, and **keeps the `'\\n'`** in the buffer if there is room for it.\n- If the line is longer than the buffer, \"only part of it is read, and the rest remains in the input stream to be consumed later.\"\n- Returns the same pointer you passed in on success, and **`NULL`** on failure (end of file or an error).\n\n**Worked example.** `char buf[6]; fgets(buf, sizeof(buf), stdin);` Each row was run.\n\n| You type | `buf` holds | Left in the stream |\n|---|---|---|\n| `Oak` + Enter | `'O' 'a' 'k' '\\n' '\\0'` | nothing |\n| `Magnolia` + Enter | `'M' 'a' 'g' 'n' 'o' '\\0'` | `lia\\n` |\n| `Maple` + Enter | `'M' 'a' 'p' 'l' 'e' '\\0'` | `\\n` |\n\nIn the last row the word fills the buffer exactly, so the newline is still waiting, and the **next** `fgets` reads just `\"\\n\"`: an empty line.\n\nTo drop a stored newline: `buf[strcspn(buf, \"\\n\")] = '\\0';`\n\n**Why it is the safe choice:** you tell `fgets` how big the buffer is, so it never writes more than `size` bytes.\n\n> **Trap:** `sizeof(buf)` gives the buffer's size only when `buf` is an **array**. For a `char *` from `malloc`, `sizeof` is 8. Pass the number you allocated.", "questions": [{"id": "fg-capacity", "type": "short", "mode": "num", "q": "`char code[12];` What is the longest string, counted in characters, that `code` can hold?", "accept": ["11"], "why": "12 bytes, and one of them must be the `'\\0'`, so **11** characters. Twelve characters would leave no terminator, and anything that reads the string (`printf(\"%s\")`, `strlen`) would run off the end of the array."}, {"id": "fg-long", "type": "blanks", "q": "`char b[8]; fgets(b, sizeof(b), stdin);` The user types `Carolina` and presses Enter.", "blanks": [{"label": "strlen(b) afterwards", "mode": "num", "accept": ["7"]}, {"label": "the string now in b", "mode": "text", "accept": ["Carolin"], "acceptRe": ["^carolin(\\\\0)?$"]}, {"label": "characters still waiting in the stream (count the newline)", "mode": "num", "accept": ["2"]}], "why": "`size` is 8, so `fgets` stores at most 7 characters and then `'\\0'`: `b` holds **`Carolin`**, `strlen` **7**. The `a` and the newline were never read: **2** characters stay in the stream for the next read. Answering 8 forgets that the terminator uses one of the 8 bytes."}, {"id": "fg-short", "type": "blanks", "q": "Same `char b[8]` and the same `fgets(b, sizeof(b), stdin)`, but this time the user types `Duke` and presses Enter.", "blanks": [{"label": "strlen(b) afterwards", "mode": "num", "accept": ["5"]}, {"label": "the character stored in b[4]", "mode": "text", "accept": ["\\n", "newline", "new line", "a newline", "the newline", "newline character", "the newline character", "\\n (newline)", "newline (\\n)"]}, {"label": "characters still waiting in the stream", "mode": "num", "accept": ["0"]}], "why": "The whole line fits, **including the newline**, so `b` holds `'D' 'u' 'k' 'e' '\\n' '\\0'`. `strlen` is **5**, not 4, `b[4]` is **`'\\n'`**, and **0** characters are left. That stored newline is why a name read with `fgets` prints with a line break after it until you strip it.", "hint": "Does the Enter key count as a character that fits?"}, {"id": "fg-call", "type": "mc", "q": "Which call reads one line safely into `char line[40];`?", "options": ["`fgets(line, sizeof(line), stdin);`", "`fgets(line, strlen(line), stdin);`", "`fgets(stdin, line, 40);`", "`fgets(line, sizeof(line) + 1, stdin);`"], "answer": 0, "why": "The order is buffer, size, stream, and the size is the buffer's full size: `fgets` already reserves one of those bytes for `'\\0'`. `sizeof(line) + 1` tells it the buffer is 41 bytes, so it may write one byte past the end. `strlen(line)` measures whatever garbage is in the buffer now, not its capacity. The third option has the arguments in the wrong order."}]}, {"id": "buffer-overflow", "title": "Buffer overflow", "read": "A **buffer overflow** is writing past the end of a buffer.\n\n```c\nchar word[5];\nstrcpy(word, \"Dogwood\");     // copies 8 bytes (7 letters + '\\0') into a 5-byte buffer\n```\n\nC does not check. `strcpy` keeps copying until it reaches the source's `'\\0'`, so the 3 extra bytes land on **whatever is next in memory**.\n\n**Why it is dangerous**\n\n- On the stack, the neighbours are the function's other variables and its **return address**. Overwriting them silently changes data, or sends the function \"back\" to the wrong place.\n- On the heap, the neighbours are other blocks and the heap manager's own bookkeeping.\n- If the bytes come from a user, the user chooses what gets overwritten. That is a classic security hole.\n- The behaviour is **undefined**: it may crash, it may corrupt something that only shows up later, or it may look fine.\n\n**Why these calls can overflow:** none of them is told the size of the buffer.\n\n| Call | It stops when |\n|---|---|\n| `strcpy(dst, src)` | it reaches `src`'s `'\\0'` |\n| `gets(buf)` | the input line ends, however long it is |\n| `scanf(\"%s\", buf)` | the word ends, however long it is |\n\n**How to prevent it**\n\n1. Read text with `fgets(buf, sizeof(buf), stdin)`. It takes the size.\n2. Before copying a string, make sure `strlen(src) + 1` fits in the destination, or `malloc` exactly `strlen(src) + 1` bytes.\n3. Count the `'\\0'`: N letters need N + 1 bytes.\n4. Loop while `i < N`, not `i <= N`.\n\n**Worked example.** `char pin[4]; strcpy(pin, \"2468\");` looks as if it fits: 4 digits, 4 bytes. It does not. `strcpy` writes 5 bytes, and the `'\\0'` lands one past the end. One byte too many is still an overflow.", "questions": [{"id": "ov-count", "type": "blanks", "q": "```c\nchar tag[6];\nstrcpy(tag, \"Tar Heels\");\n```", "blanks": [{"label": "bytes strcpy writes", "mode": "num", "accept": ["10"]}, {"label": "bytes that land past the end of tag", "mode": "num", "accept": ["4"]}], "why": "\"Tar Heels\" is 9 characters (the space counts) plus `'\\0'`: `strcpy` writes **10** bytes. `tag` has 6, so **4** bytes go past its end. clang even warns here: \"'strcpy' will always overflow; destination buffer has size 6, but the source string has length 10 (including NUL byte).\" Answering 9 and 3 forgets the terminator."}, {"id": "ov-which", "type": "mc", "q": "`char b[16];` The user types a 40-letter word with no spaces and presses Enter. Which of these calls can write past the end of `b`? Select all that apply.", "options": ["`gets(b);`", "`scanf(\"%s\", b);`", "`fgets(b, sizeof(b), stdin);`", "`fgets(b, 40, stdin);`"], "answer": [0, 1, 3], "why": "`gets` and `scanf(\"%s\")` are never told how big `b` is, so they store all 40 letters and a `'\\0'`: 41 bytes into 16. `fgets(b, 40, stdin)` *is* told a size, but the wrong one: it will store up to 39 characters plus `'\\0'`. Only `fgets(b, sizeof(b), stdin)` is safe: it stores 15 letters and `'\\0'` and leaves the rest in the stream. (All three bad versions were run with that input, and each one was killed.)", "shuffle": false}, {"id": "ov-line", "type": "blanks", "q": "This compiles with no warnings and, when it was run normally, printed `Rameses`. It still has a buffer overflow.\n\n```c\n 1  #include <stdio.h>\n 2  #include <stdlib.h>\n 3  #include <string.h>\n 4\n 5  int main(void) {\n 6      char first[] = \"Rameses\";\n 7      char *copy = malloc(strlen(first));\n 8      if (copy == NULL) return 1;\n 9      strcpy(copy, first);\n10      printf(\"%s\\n\", copy);\n11      free(copy);\n12      return 0;\n13  }\n```", "blanks": [{"label": "line that asks for too little memory", "mode": "num", "accept": ["7"]}, {"label": "line that writes past the end of the block", "mode": "num", "accept": ["9"]}, {"label": "how many bytes past the end are written", "mode": "num", "accept": ["1"]}, {"label": "corrected argument to malloc", "mode": "code", "accept": ["strlen(first) + 1", "1 + strlen(first)", "(strlen(first) + 1) * sizeof(char)", "sizeof(char) * (strlen(first) + 1)", "(strlen(first) + 1)", "sizeof(first)", "strlen(first) + sizeof(char)", "malloc(strlen(first) + 1)"]}], "why": "`strlen(first)` is 7, so line **7** allocates 7 bytes. `strcpy` on line **9** writes 8: the seven letters and the `'\\0'`. **1** byte lands past the block. Fix: `malloc(strlen(first) + 1)`. Run under a checking allocator (Guard Malloc), the original faults on line 9 and the fixed version runs clean. \"It printed the right thing\" is not evidence that the code is right.", "hint": "How many bytes does a 7-letter string occupy?"}, {"id": "ov-fix", "type": "self", "lines": 12, "q": "This reads a name with no limit on its length:\n\n```c\nchar name[10];\nprintf(\"Name: \");\nscanf(\"%s\", name);\nprintf(\"Hello, %s\\n\", name);\n```\n\nRewrite it so that no input can overflow `name`. If the read fails, print an error and stop. Then say in one sentence what happens when the user types 25 characters.", "model": "```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nint main(void) {\n    char name[10];\n    printf(\"Name: \");\n    if (fgets(name, sizeof(name), stdin) == NULL) {   // at most 9 characters + '\\0'\n        fprintf(stderr, \"Error reading input!\\n\");\n        return 1;\n    }\n    name[strcspn(name, \"\\n\")] = '\\0';                 // drop the newline fgets kept (if any)\n    printf(\"Hello, %s\\n\", name);\n    return 0;\n}\n```\n\nWith 25 characters typed, `fgets` stores the first 9 and a `'\\0'`. The other 16 and the newline stay in the input stream for the next read. Nothing is written outside `name`.", "rubric": ["reads with `fgets(name, sizeof(name), stdin)` (or 10 as the size), not `scanf(\"%s\")` or `gets`", "the size passed is the buffer's real size, not something larger", "checks the return value against `NULL` and stops on failure", "says only 9 characters are stored, followed by `'\\0'`", "says the extra characters stay in the input stream"], "why": "`fgets` is safe because it is told the size. Stripping the newline with `strcspn` is a nice extra, not part of the safety fix. The model was run with a 22-character input and greeted only its first 9 characters."}]}, {"id": "clinic-uninit-null", "title": "Bug clinic 1: uninitialized and NULL pointers", "read": "For every `*p` and `p[i]` in a \"find the bug\" question, ask three things. Does `p` hold a **real address**? Is the access **inside the block** it points to? Is that block **still alive**? This part is about the first question, the next part is about the second, and the third is the dangling-pointer question from the heap material.\n\n**Uninitialized pointer.** Declaring a pointer makes room for an address, not for the thing it points to. Until you assign it, its 8 bytes are whatever was left there: `p(8): ?`.\n\n```c\n1  int *count;\n2  *count = 0;        // BUG: count was never given an address\n```\n\nLine 2 writes a 0 to some unknown location. That is undefined behaviour: it may crash, it may quietly overwrite other data, it may seem to work. `cc -Wall` says \"variable 'count' is uninitialized when used here\", so read your warnings.\n\n**Fix:** make it point at real memory first.\n\n```c\nint n;\nint *count = &n;                        // an existing variable, or\nint *count = malloc(sizeof(int));       // a new heap block (then NULL-check it)\n```\n\nThe string version is the same bug: `char *name; fgets(name, 20, stdin);` has nowhere to store 20 bytes. Use `char name[20];` or `malloc(20)`.\n\n**NULL pointer dereference.** `NULL` \"is used to indicate an invalid or uninitialized pointer\": it points at nothing. You meet it on purpose:\n\n- `malloc` and `realloc` return `NULL` when they fail.\n- `fgets` returns `NULL` at end of input.\n- A search function returns `NULL` for \"not found\".\n- You set a pointer to `NULL` after `free`.\n\n> **Lecture:** \"If you dereference a NULL pointer, you're going to get a segmentation fault. Your program will crash.\"\n\n(Strictly, C calls it undefined behaviour. On the machines this course uses it shows up as a segfault.)\n\n**Fix:** check before you dereference, wherever `NULL` is possible.\n\n```c\nint *a = malloc(n * sizeof(int));\nif (a == NULL) {                        // the same test: if (!a)\n    fprintf(stderr, \"Memory allocation failed!\\n\");\n    exit(EXIT_FAILURE);\n}\n```\n\n> **Rule:** `NULL` is a value you can test for. Garbage is not. If you have no address yet, initialize the pointer to `NULL` so that an `if` can catch the mistake.", "questions": [{"id": "c1-name", "type": "mc", "q": "Name the bug.\n\n```c\n1  #include <stdio.h>\n2\n3  int main(void) {\n4      double *avg;\n5      *avg = 3.5;\n6      printf(\"%.1f\\n\", *avg);\n7      return 0;\n8  }\n```", "options": ["Uninitialized pointer: `avg` is never given an address, so line 5 writes to an unknown location", "NULL pointer dereference: a local pointer starts out as `NULL`, so line 5 writes to address 0", "Memory leak: `avg` is never freed before `main` returns", "No bug: line 4 creates the `double` and line 5 fills it in"], "answer": 0, "why": "Line 4 makes room for an **address** (8 bytes), not for a `double`, and never sets it. Line 5 then follows whatever garbage is in `avg`: undefined behaviour. (`cc -Wall` warns \"variable 'avg' is uninitialized when used here\", and when run, the program was killed at line 5.) Local variables are not set to `NULL` or 0 for you. Nothing was allocated, so there is nothing to leak."}, {"id": "c1-fix", "type": "blanks", "q": "Same program as the previous question. Fix it by giving `avg` one `double` on the heap: line 4 becomes `double *avg = ____;` and you supply the right-hand side.", "blanks": [{"label": "first line that dereferences the bad pointer", "mode": "num", "accept": ["5"]}, {"label": "new right-hand side for line 4", "mode": "code", "accept": ["malloc(sizeof(double))", "malloc(1 * sizeof(double))", "malloc(sizeof(double) * 1)", "malloc(sizeof(*avg))", "malloc(sizeof *avg)", "(double *)malloc(sizeof(double))", "calloc(1, sizeof(double))", "(double*)malloc(sizeof(*avg))"]}], "why": "Line **5** is the first `*avg`. The fix is `double *avg = malloc(sizeof(double));`, then a `NULL` check before line 5 and a `free(avg)` at the end. With that change the program prints `3.5`. Write `sizeof(double)`, not `8`: lecture's rule is no magic numbers. Pointing `avg` at an existing variable (`double x; double *avg = &x;`) is the other correct fix.", "hint": "Use `sizeof`, not a number."}, {"id": "c1-null", "type": "blanks", "q": "This program crashes.\n\n```c\n 1  #include <stdio.h>\n 2\n 3  int *find(int *a, int n, int target) {\n 4      for (int i = 0; i < n; i++) {\n 5          if (a[i] == target) return &a[i];\n 6      }\n 7      return NULL;\n 8  }\n 9\n10  int main(void) {\n11      int nums[4] = {3, 8, 15, 22};\n12      int *hit = find(nums, 4, 15);\n13      *hit = 0;\n14      int *miss = find(nums, 4, 9);\n15      *miss = 0;\n16      printf(\"%d\\n\", nums[2]);\n17      return 0;\n18  }\n```", "blanks": [{"label": "line that dereferences NULL", "mode": "num", "accept": ["15"]}, {"label": "value of nums[2] just before that line runs", "mode": "num", "accept": ["0"]}, {"label": "what find returned for the target 9", "mode": "text", "accept": ["NULL", "null", "0", "(nil)", "null pointer", "a null pointer"]}], "why": "`find(nums, 4, 15)` returns `&nums[2]`, so line 13 sets `nums[2]` to **0**. 9 is not in the array, so the loop ends and `find` returns **`NULL`**. Line **15** then does `*miss = 0` on `NULL`. When run, it dies with a segmentation fault at line 15 and never reaches the `printf`. Line 13 only works because 15 happened to be in the array: it needs the same check."}, {"id": "c1-guard", "type": "self", "lines": 10, "q": "In that program, rewrite lines 14 and 15 so that it prints `not found` instead of crashing when the target is missing, and still zeroes the element when it is found. Then say in one sentence why a `NULL` pointer can be guarded against and an uninitialized pointer cannot.", "model": "```c\n    int *miss = find(nums, 4, 9);\n    if (miss == NULL) {\n        printf(\"not found\\n\");\n    } else {\n        *miss = 0;\n    }\n```\n\n`NULL` is one known value, so an `if` can compare against it. An uninitialized pointer holds an unpredictable address that looks like any other, so no test can tell it is bad.\n\nWith this change the program prints `not found` and then `0`.", "rubric": ["tests `miss == NULL` (or `!miss`, or `miss != NULL` with the branches swapped) **before** any `*miss`", "prints `not found` on the `NULL` branch", "dereferences `miss` only on the non-`NULL` branch", "explains that `NULL` is a known value an `if` can test, and garbage is not"], "why": "A function that can return `NULL` puts the duty on its caller: check, then dereference. The same pattern guards every `malloc`, `realloc` and `fgets` call."}]}, {"id": "clinic-bounds-arith", "title": "Bug clinic 2: out of bounds and improper pointer arithmetic", "read": "**Out-of-bounds access.** An array of N elements has indices 0 to N − 1. C does no bounds checking: `a[i]` is `*(a + i)`, and it computes that address whatever `i` is.\n\n```c\nint a[5];\na[5] = 1;      // BUG: the last element is a[4]\n```\n\nReading out of bounds gives garbage. Writing out of bounds corrupts whatever is there. Both are undefined behaviour. The usual causes:\n\n- `<=` in a loop: `for (i = 0; i <= N; i++)`.\n- Forgetting the `'\\0'` when sizing a string.\n- Trusting an index that came from the user.\n\n**Fix:** loop while `i < N`, and check `0 <= i && i < n` before using an index you did not compute yourself.\n\nA **buffer overflow** is the special case where the access is a *write* that runs past the *end* of a buffer, usually because the data being copied in is longer than the buffer.\n\n**Improper pointer arithmetic.** `p + i` already moves `i` **elements**, which is i × sizeof(element) bytes. The compiler does the scaling. The common mistakes:\n\n| Mistake | What actually happens |\n|---|---|\n| `*(p + i * sizeof(int))` | scaled twice: it lands on element 4 × i |\n| `*p + 1` where `*(p + 1)` was meant | adds 1 to the *value* at `p` and never moves |\n| stepping past the block: `p += N; *p = 0;` | `p` is one past the end: out of bounds |\n| `p++` in a loop, then `free(p)` | `free` needs the exact address `malloc` returned |\n| walking from one Method 2 row into the next | the rows are separate blocks |\n\n**Worked example.** `int a[5] = {10, 20, 30, 40, 50}; int *p = a;` with `a` at `0x1000`.\n\n| Expression | Value |\n|---|---|\n| `p + 2` | `0x1008` (2 ints = 8 bytes further on) |\n| `*(p + 2)` | 30 |\n| `*p + 2` | 12 |\n| `*(p + 2 * sizeof(int))` | `a[8]`: out of bounds, undefined |\n\n> **On paper:** to explain one of these, say which element the expression *really* reaches, then say why that is outside the block.", "questions": [{"id": "c2-name", "type": "mc", "q": "This should print the total of the six scores. Name the bug.\n\n```c\n 1  #include <stdio.h>\n 2\n 3  int main(void) {\n 4      int scores[6] = {71, 85, 90, 64, 78, 88};\n 5      int total = 0;\n 6      for (int i = 0; i <= 6; i++) {\n 7          total += scores[i];\n 8      }\n 9      printf(\"%d\\n\", total);\n10      return 0;\n11  }\n```", "options": ["Out-of-bounds read: on the last pass `i` is 6, and the last valid index is 5", "Uninitialized pointer: `scores` is used before it points anywhere", "Improper pointer arithmetic: `scores[i]` should be `scores[i * sizeof(int)]`", "NULL pointer dereference: `scores[6]` is `NULL`"], "answer": 0, "why": "`scores` has indices 0 to 5. The condition `i <= 6` lets the loop run once more with `i` = 6, so line 7 reads `scores[6]`, which is whatever sits after the array. Undefined behaviour: run several times, it printed a different nonsense total each time (444400336, then −907869548, …) instead of 476, and it could just as well crash. `scores` is a real, initialized array, and `[i]` already scales by the element size."}, {"id": "c2-fix", "type": "blanks", "q": "Same program as the previous question.", "blanks": [{"label": "line with the bug", "mode": "num", "accept": ["6"]}, {"label": "corrected loop condition", "mode": "code", "accept": ["i < 6", "i <= 5", "6 > i", "5 >= i", "i != 6"]}, {"label": "what the fixed program prints", "mode": "num", "accept": ["476"]}], "why": "Line **6**: change `i <= 6` to **`i < 6`**. Then the loop adds exactly `scores[0]` to `scores[5]`: 71 + 85 + 90 + 64 + 78 + 88 = **476**. Line 7 is where the bad read happens, but the mistake to fix is the bound on line 6."}, {"id": "c2-trace", "type": "blanks", "q": "Every expression here stays in bounds. Give each value.\n\n```c\nint v[6] = {4, 9, 16, 25, 36, 49};\nint *p = v + 1;\n```\n\n- (a) `*p + 3`\n- (b) `*(p + 3)`\n- (c) `p[-1]`\n- (d) `*(v + 5) - *v`", "blanks": [{"label": "(a)", "mode": "num", "accept": ["12"]}, {"label": "(b)", "mode": "num", "accept": ["36"]}, {"label": "(c)", "mode": "num", "accept": ["4"]}, {"label": "(d)", "mode": "num", "accept": ["45"]}], "why": "`p` points at `v[1]`, the 9. (a) `*p + 3` is the value 9 plus 3: **12**. (b) `*(p + 3)` moves three ints on, to `v[4]`: **36**. (c) `p[-1]` is `*(p - 1)`, which is `v[0]`: **4**. It is in bounds because `p` is not at the start of the array. (d) `v[5] − v[0]` = 49 − 4 = **45**. Swapping (a) and (b) is the precedence mistake: `*` binds tighter than `+`."}, {"id": "c2-scale", "type": "blanks", "q": "This should store 0, 1, 4, 9, 16 in a block of five ints.\n\n```c\n 1  #include <stdio.h>\n 2  #include <stdlib.h>\n 3\n 4  int main(void) {\n 5      int *sq = malloc(5 * sizeof(int));\n 6      if (sq == NULL) return 1;\n 7      for (int i = 0; i < 5; i++) {\n 8          *(sq + i * sizeof(int)) = i * i;\n 9      }\n10      printf(\"%d\\n\", sq[2]);\n11      free(sq);\n12      return 0;\n13  }\n```", "blanks": [{"label": "line with the bug", "mode": "num", "accept": ["8"]}, {"label": "index of the element written when i is 1", "mode": "num", "accept": ["4"]}, {"label": "first i whose write lands outside the block", "mode": "num", "accept": ["2"]}, {"label": "corrected left-hand side of line 8", "mode": "code", "accept": ["*(sq + i)", "sq[i]", "*(i + sq)", "sq[i] = i * i", "*(sq + i) = i * i"]}], "why": "Line **8** scales by `sizeof(int)` by hand, but `sq + k` already moves `k` ints. So pass `i` writes element 4 × i: element 0, then **4**, then 8. The block has elements 0 to 4, so `i` = **2** is the first write outside it (a heap buffer overflow, confirmed with Guard Malloc). Fix: `*(sq + i)` or `sq[i]`. The buggy version also never writes `sq[1]` to `sq[3]`, so line 10 prints whatever was already in that memory. The fixed one prints 4.", "hint": "`sq + k` moves `k` ints, not `k` bytes."}]}], "checkpoint": [{"id": "cp-sizes", "type": "blanks", "q": "`days` is a local array of three `char *`. Pointers are 8 bytes.\n\n```c\nchar *days[3] = {\"Mon\", \"Tues\", \"Wed\"};\n```", "blanks": [{"label": "sizeof(days)", "mode": "num", "accept": ["24"]}, {"label": "sizeof(days[1])", "mode": "num", "accept": ["8"]}, {"label": "strlen(days[1])", "mode": "num", "accept": ["4"]}, {"label": "the character days[1][3]", "mode": "text", "accept": ["s"]}], "why": "`days` is an array of 3 pointers: 3 × 8 = **24** (the letters are not inside it). `days[1]` is one `char *`: **8**. It points at \"Tues\": `strlen` **4**, and index 3 is **s**. Answering 5 for `sizeof(days[1])` confuses the pointer with the 5-byte literal it points to."}, {"id": "cp-fgets2", "type": "blanks", "q": "`char a[5], b[5];` The user types `Bojangles` and presses Enter. Then the program runs `fgets(a, 5, stdin);` followed by `fgets(b, 5, stdin);`", "blanks": [{"label": "the string in a", "mode": "text", "accept": ["Boja"]}, {"label": "the string in b", "mode": "text", "accept": ["ngle"]}, {"label": "characters still waiting in the stream (count the newline)", "mode": "num", "accept": ["2"]}], "why": "Each call stores at most 5 − 1 = 4 characters and a `'\\0'`. The first takes **`Boja`**. The rest stays in the stream, so the second call carries on from there and takes **`ngle`**. `s` and the newline, **2** characters, are still waiting. Nothing was lost and nothing overflowed. Expecting `b` to be empty assumes `fgets` throws the rest of a long line away."}, {"id": "cp-five", "type": "blanks", "q": "Name each bug with one letter. Each letter is used exactly once.\n\n**U** uninitialized pointer · **N** NULL pointer dereference · **O** out-of-bounds read · **B** buffer overflow · **A** improper pointer arithmetic\n\n```c\n/* 1 */  char c[4];\n         strcpy(c, \"blue\");\n\n/* 2 */  int w[4] = {5, 9, 7, 8};\n         int *p = w;\n         int second = *p + 1;        // meant: the second element\n\n/* 3 */  int *big = malloc(n * sizeof(int));   // suppose malloc fails here\n         big[0] = 1;\n\n/* 4 */  int t[3] = {1, 2, 3};\n         int last = t[3];\n\n/* 5 */  int *q;\n         *q = 5;\n```", "blanks": [{"label": "snippet 1", "mode": "text", "accept": ["B"]}, {"label": "snippet 2", "mode": "text", "accept": ["A"]}, {"label": "snippet 3", "mode": "text", "accept": ["N"]}, {"label": "snippet 4", "mode": "text", "accept": ["O"]}, {"label": "snippet 5", "mode": "text", "accept": ["U"]}], "why": "1 is **B**: `strcpy` writes 5 bytes (\"blue\" + `'\\0'`) into 4. 2 is **A**: `*p + 1` is 5 + 1 = 6, the first *value* plus one. The second element, 9, is `*(p + 1)`. 3 is **N**: a failed `malloc` returns `NULL`, and `big[0]` dereferences it. 4 is **O**: the valid indices are 0 to 2, so `t[3]` reads past the end. 5 is **U**: `q` was never given an address."}, {"id": "cp-title", "type": "mc", "q": "What is the bug?\n\n```c\nchar *title;\nstrcpy(title, \"COMP 211\");\n```", "options": ["Uninitialized pointer: `title` holds no valid address to copy into", "Buffer overflow: \"COMP 211\" needs 9 bytes and `title` has only 8", "NULL pointer dereference: `title` is `NULL` until it is assigned", "No bug: `strcpy` allocates the room it needs for the copy"], "answer": 0, "why": "A `char *` is 8 bytes that hold an **address**. They are not an 8-byte buffer for characters, so the \"9 into 8\" reasoning does not apply: there is no buffer at all. `title` was never assigned, so `strcpy` writes 9 bytes wherever the garbage happens to point: undefined (when run, the program was killed). Locals are not `NULL` by default, and `strcpy` never allocates. Fix: `char title[9];` or `char *title = malloc(strlen(\"COMP 211\") + 1);`."}, {"id": "cp-latecheck", "type": "short", "mode": "num", "q": "One line of this program can dereference a `NULL` pointer. Which line?\n\n```c\n 1  #include <stdio.h>\n 2  #include <stdlib.h>\n 3  #include <string.h>\n 4\n 5  int main(void) {\n 6      int n = 3;\n 7      char **list = malloc(n * sizeof(char *));\n 8      list[0] = malloc(16);\n 9      if (list == NULL) return 1;\n10      if (list[0] == NULL) return 1;\n11      strcpy(list[0], \"ok\");\n12      printf(\"%s\\n\", list[0]);\n13      free(list[0]);\n14      free(list);\n15      return 0;\n16  }\n```", "accept": ["8"], "why": "Line **8**. `list[0]` means `*(list + 0)`: it dereferences `list`, one line *before* line 9 checks whether the `malloc` on line 7 failed. Swap lines 8 and 9. Line 11 is safe: line 10 has already checked `list[0]`. A check only protects the lines that come after it.", "hint": "Storing into `list[0]` is itself a dereference of `list`."}, {"id": "cp-ovcount", "type": "blanks", "q": "```c\nchar id[8];\nchar *src = \"PID-730012345\";\nstrcpy(id, src);\n```", "blanks": [{"label": "bytes strcpy writes", "mode": "num", "accept": ["14"]}, {"label": "bytes that land past the end of id", "mode": "num", "accept": ["6"]}, {"label": "smallest size for id that makes this copy safe", "mode": "num", "accept": ["14"]}], "why": "The string is 13 characters (`PID-` is 4, then 9 digits), so `strcpy` writes 13 + 1 = **14** bytes. `id` has 8: **6** go past the end. It needs to be at least **14** bytes. `sizeof(src)` is 8 here, the size of the pointer, which is why \"8 into 8, it fits\" is wrong."}, {"id": "cp-nonul", "type": "mc", "q": "Which statement about this code is correct?\n\n```c\nchar s[4] = {'U', 'N', 'C', '!'};\nprintf(\"%lu\\n\", strlen(s));\n```", "options": ["Undefined: `s` has no `'\\0'`, so `strlen` keeps reading past the end of the array", "It always prints 4, because `strlen` counts the four characters in the array", "It always prints 3, because the last byte of a `char` array is reserved for `'\\0'`", "It does not compile, because four characters need `char s[5]`"], "answer": 0, "why": "All four bytes are letters, so there is no terminator and `s` is not a valid C string. `strlen` keeps reading past `s[3]`: an out-of-bounds read. When this was run it printed 4, but only because the next byte in memory happened to be 0. That is luck, not a guarantee. It compiles without a warning. Fix: `char s[5] = \"UNC!\";`."}, {"id": "cp-word", "type": "blanks", "q": "Give what each `printf` prints.\n\n```c\nchar word[] = \"pointer\";\nchar *p = word + 2;\n```\n\n- (a) `printf(\"%c\", *p);`\n- (b) `printf(\"%c\", *(p + 3));`\n- (c) `printf(\"%c\", *p + 1);`\n- (d) `printf(\"%c\", p[-2]);`\n- (e) `printf(\"%lu\", strlen(p));`", "blanks": [{"label": "(a)", "mode": "text", "accept": ["i"]}, {"label": "(b)", "mode": "text", "accept": ["e"]}, {"label": "(c)", "mode": "text", "accept": ["j"]}, {"label": "(d)", "mode": "text", "accept": ["p"]}, {"label": "(e)", "mode": "num", "accept": ["5"]}], "why": "Index the letters: p0 o1 i2 n3 t4 e5 r6. `p` points at index 2. (a) **i**. (b) Three further on is index 5: **e**. (c) `*p + 1` is the *character* `'i'` plus 1, which is **j**. It does not move to `'n'`. (d) `p[-2]` is index 0: **p**. (e) `strlen` counts from `p` to the `'\\0'`: `inter` is **5**."}, {"id": "cp-freemoved", "type": "mc", "q": "Name the bug.\n\n```c\n 1  #include <stdlib.h>\n 2\n 3  int main(void) {\n 4      int *d = malloc(4 * sizeof(int));\n 5      if (d == NULL) return 1;\n 6      for (int i = 0; i < 4; i++) {\n 7          *d = i * i;\n 8          d++;\n 9      }\n10      free(d);\n11      return 0;\n12  }\n```", "options": ["Improper pointer arithmetic: `d` has been moved, so line 10 frees an address `malloc` never returned", "Out-of-bounds write: on the last pass of the loop, line 7 stores into element 4 of the block", "Double free: the block is released once per pass and then again on line 10", "NULL pointer dereference: after four `d++` steps, `d` is `NULL` when line 10 runs"], "answer": 0, "why": "Each pass writes through `d` and then advances it, so the four writes hit elements 0, 1, 2 and 3: all in bounds. After the loop `d` is 16 bytes past the start of the block. `free` must be given exactly the address `malloc` returned, so line 10 is undefined behaviour (when run, the allocator killed the program). Fix: write `d[i] = i * i;` and leave `d` alone, or walk a second pointer and free the original."}, {"id": "cp-exclaim-count", "type": "blanks", "q": "`exclaim` should return a new heap string: the word followed by `!`. Trace the call `exclaim(\"go\")` through the code as written.\n\n```c\n 1  #include <stdio.h>\n 2  #include <stdlib.h>\n 3  #include <string.h>\n 4\n 5  char *exclaim(char *word) {\n 6      char *out = malloc(strlen(word));\n 7      strcpy(out, word);\n 8      out[strlen(word)] = '!';\n 9      return out;\n10  }\n```", "blanks": [{"label": "bytes line 6 allocates", "mode": "num", "accept": ["2"]}, {"label": "bytes line 7 writes", "mode": "num", "accept": ["3"]}, {"label": "index that line 8 writes the ! to", "mode": "num", "accept": ["2"]}, {"label": "bytes a correct block for \"go!\" needs", "mode": "num", "accept": ["4"]}], "why": "`strlen(\"go\")` is 2, so line 6 allocates **2** bytes. `strcpy` writes `g`, `o` and `'\\0'`: **3** bytes, one past the end. Line 8 writes `'!'` at index **2**, also past the end, and on top of the `'\\0'`, so the result has no terminator. \"go!\" needs 3 characters + 1 = **4** bytes. Run normally, this still printed `go!`. Under a checking allocator (Guard Malloc) it faults on line 7."}, {"id": "cp-exclaim-fix", "type": "self", "lines": 16, "q": "`exclaim` (previous question) has three pointer bugs. Name each one, then write a corrected version of the function.", "model": "1. **Buffer overflow:** `malloc(strlen(word))` is too small for what lines 7 and 8 write.\n2. **Possible NULL dereference:** `out` is used without checking whether `malloc` failed.\n3. **Lost terminator:** the `'!'` overwrites the `'\\0'`, so the result is not a valid string and anything that reads it runs out of bounds.\n\n```c\nchar *exclaim(char *word) {\n    size_t n = strlen(word);\n    char *out = malloc(n + 2);       // n letters + '!' + '\\0'\n    if (out == NULL) return NULL;    // check BEFORE using out\n    strcpy(out, word);\n    out[n] = '!';\n    out[n + 1] = '\\0';               // put the terminator back\n    return out;                      // the caller frees it\n}\n```", "rubric": ["names the buffer overflow: the block is too small for the copy", "names the missing `NULL` check on `malloc`", "names the missing `'\\0'` after the `!`", "allocates `strlen(word) + 2` bytes (letters, `!`, terminator)", "writes `'!'` at index `strlen(word)` and `'\\0'` at the next index", "returns the pointer without freeing it (the caller frees)"], "why": "Count what the result holds before you allocate: n letters, one `!`, one `'\\0'`, so n + 2. Then check the pointer, then write. The corrected function was compiled and run: `exclaim(\"go\")` returns `go!` with `strlen` 3, and Guard Malloc reports nothing."}, {"id": "cp-fgets-facts", "type": "blanks", "q": "`char line[32];` and the call `fgets(line, sizeof(line), stdin)`.", "blanks": [{"label": "most characters it stores before the terminator", "mode": "num", "accept": ["31"]}, {"label": "most bytes it can write into line", "mode": "num", "accept": ["32"]}, {"label": "what it returns at end of input", "mode": "text", "accept": ["NULL", "null", "0", "a null pointer", "null pointer"]}], "why": "The size, 32, includes the `'\\0'`: at most **31** characters, then the terminator, so never more than **32** bytes, which is exactly the buffer. At end of input (or on an error) it returns **`NULL`**, which is why the call goes inside an `if`. On success it returns `line`."}]}, {"id": "make", "title": "Makefiles: targets, timestamps, rebuilds", "blurb": "Read any small Makefile and say exactly which recipes run, and in what order, for `make`, `make <target>`, after an edit, after `make clean`, and when a file is missing.", "objective": "Objective 1: Makefiles (Lab 1)", "sources": "Lab 1 Part 2 handout (Makefiles) · Lab 1 Part 2–3 questions · DIS §17.15.1–17.15.6", "minutes": 45, "cheats": ["Default target = the **first target in the file**, whatever it is called. Variable lines like `CC = gcc` are not targets.", "A target is rebuilt only if its file is **missing** or **older than a dependency**. Otherwise it is up to date and its recipe is skipped. make compares timestamps, never contents.", "Order: dependencies first, **left to right**, then the target. The target you asked for is always last. Rule order in the file does not matter.", "`make t` builds `t` and what `t` needs, nothing else. `make t1 t2` finishes `t1`, then does `t2`; a shared file is built once.", "After an edit: rebuild every target on a path from the changed file up to the goal, and nothing else.", "`clean` is an ordinary target with no dependencies and no file named `clean`, so its recipe runs every time you ask. After it, `make` is a full rebuild; `make t` builds only `t`'s chain.", "Missing dependency with no rule: `No rule to make target 'x', needed by 'y'.  Stop.` Recipes already run stay done; nothing after the error runs.", "Every recipe line starts with a **tab**."], "chunks": [{"id": "rule-anatomy", "title": "What make does, and how to read a rule", "read": "Typing long `gcc` commands by hand is slow and easy to get wrong. **`make`** is a tool that reads a file named **`Makefile`** in the current directory and runs the build commands for you. Lab 1's handout gives three reasons to use one:\n\n- compile commands are saved in one place,\n- one short command rebuilds the program,\n- files that have not changed are **not recompiled**.\n\nA Makefile is a list of **rules**. Every rule has the same three pieces:\n\n```make\ntarget: dependency1 dependency2\n\trecipe\n```\n\n- **Target** (left of the colon): the file this rule knows how to make.\n- **Dependencies** (right of the colon): the files the target is made *from*. If one of them changes, the target is out of date.\n- **Recipe** (the indented line or lines underneath): the shell command(s) that create the target. Every recipe line must begin with a **tab character**, not spaces.\n\n### Worked example\n\n```make\nCC = gcc\nCFLAGS = -Wall -g\n\nviewer: viewer.c pixels.h\n\t$(CC) $(CFLAGS) -o viewer viewer.c\n```\n\nThe first two lines are **variables**, not rules. Wherever `$(CC)` appears, make substitutes `gcc`; `$(CFLAGS)` becomes `-Wall -g`. The one rule says: the target `viewer` depends on `viewer.c` and `pixels.h`, and is built by running\n\n```\ngcc -Wall -g -o viewer viewer.c\n```\n\nmake prints each recipe command as it runs it, with the variables already filled in.\n\n> **On paper:** read a rule aloud as \"to make *target* I need *dependencies*; if the target is missing or older than any of them, run the *recipe*.\" The rest of this section is that one sentence applied carefully.", "questions": [{"id": "rule-parts", "type": "blanks", "q": "Here is one rule from a Makefile:\n\n```make\nmixer.o: mixer.c mixer.h levels.h\n\tgcc -Wall -c mixer.c\n```\n\nPick out its pieces.", "blanks": [{"label": "target", "mode": "text", "accept": ["mixer.o"]}, {"label": "number of dependencies", "mode": "num", "accept": ["3"]}, {"label": "the dependencies (any order)", "mode": "set", "accept": ["mixer.c mixer.h levels.h"]}], "why": "The target is the name left of the colon: `mixer.o`. Everything right of the colon is a dependency: `mixer.c`, `mixer.h`, `levels.h`, so 3. The tab-indented `gcc` line is the recipe.\n\nTempting mistake: counting only `mixer.c` because it is the only file the recipe mentions. make checks the dependency list, not the recipe, so a change to either header also makes `mixer.o` out of date."}, {"id": "tab-bug", "type": "mc", "q": "A teammate's Makefile fails before building anything:\n\n```\nMakefile:2: *** missing separator.  Stop.\n```\n\nLine 1 is `badge: badge.c` and line 2 is the `gcc` command for that rule. What is wrong with line 2?", "options": ["It is indented with spaces instead of a tab", "Its target, `badge`, has not been built yet", "The dependency `badge.c` does not exist", "It uses `gcc` directly instead of `$(CC)`"], "answer": 0, "why": "A recipe line must start with a tab character. With spaces, make cannot tell the line is a recipe and rejects the Makefile itself (`missing separator`), so nothing is built.\n\nA missing `badge.c` gives a different message (`No rule to make target`, Part 7), and a target that is not built yet is the normal starting state. Writing `gcc` instead of `$(CC)` is fine."}, {"id": "expand-vars", "type": "short", "mode": "cmd", "q": "```make\nCC = gcc\nCFLAGS = -Wall -Wextra -std=c11\n\ntally: tally.c\n\t$(CC) $(CFLAGS) -o tally tally.c\n```\n\n`tally.c` exists and `tally` does not. Type the exact command that `make` runs (it is also what make prints).", "accept": ["gcc -Wall -Wextra -std=c11 -o tally tally.c"], "placeholder": "gcc …", "why": "Substitute the variables into the recipe: `$(CC)` → `gcc`, `$(CFLAGS)` → `-Wall -Wextra -std=c11`. The rest of the line is copied as written:\n\n`gcc -Wall -Wextra -std=c11 -o tally tally.c`\n\nMistakes to avoid: leaving `$(CC)` in the answer, or dropping the flags."}]}, {"id": "default-target", "title": "The default target is the first one", "read": "Running `make` with no arguments builds exactly one thing: the **default target**. That is the **first target in the Makefile**, whatever its name. Not the one called `all`, not the \"main\" program, not the last one. Variable lines such as `CC = gcc` are skipped, because they are not rules.\n\n`all` is only a naming habit. Lab 1's Makefile began with a rule named `all` that listed every program, so plain `make` built them all, but only because that rule came **first**. Expect unhelpful names on the quiz.\n\n### Worked example\n\n```make\nCC = gcc\nCFLAGS = -Wall -g\n\nquartz: opal.o jade.o\n\t$(CC) $(CFLAGS) -o quartz opal.o jade.o\n\nall: quartz extra\n\nopal.o: opal.c\n\t$(CC) $(CFLAGS) -c opal.c\n\njade.o: jade.c\n\t$(CC) $(CFLAGS) -c jade.c\n\nextra: extra.c\n\t$(CC) $(CFLAGS) -o extra extra.c\n\nclean:\n\trm -f quartz extra opal.o jade.o\n```\n\nThe directory holds only `opal.c`, `jade.c` and `extra.c`. `make` prints:\n\n```\ngcc -Wall -g -c opal.c\ngcc -Wall -g -c jade.c\ngcc -Wall -g -o quartz opal.o jade.o\n```\n\nThe first rule's target is `quartz`, so make builds `quartz` and the two `.o` files it needs. `extra` is **not** built: nothing `quartz` depends on leads to it. The rules for `all` and `clean` are simply two more targets. They run only when you ask for them by name (`make all`, `make clean`).\n\n> **On paper:** to find the default target, skip variable lines and comments, then take the name left of the first colon.", "questions": [{"id": "default-lumen", "type": "short", "mode": "text", "q": "```make\nCFLAGS = -Wall -g\n\nlumen: scan.o emit.o\n\tgcc $(CFLAGS) -o lumen scan.o emit.o\n\nclean:\n\trm -f lumen scan.o emit.o\n\nall: lumen\n\nscan.o: scan.c\n\tgcc $(CFLAGS) -c scan.c\n\nemit.o: emit.c\n\tgcc $(CFLAGS) -c emit.c\n```\n\nWhat is the default target of this Makefile?", "accept": ["lumen"], "why": "Skip the variable line `CFLAGS = -Wall -g`. The first rule is `lumen: scan.o emit.o`, so the default target is `lumen`.\n\n`all` is the tempting answer, but it is the third rule here, and its name gives it no special status. `CFLAGS` is a variable, not a target."}, {"id": "default-lumen-built", "type": "short", "mode": "set", "q": "```make\nCFLAGS = -Wall -g\n\nlumen: scan.o emit.o\n\tgcc $(CFLAGS) -o lumen scan.o emit.o\n\nclean:\n\trm -f lumen scan.o emit.o\n\nall: lumen\n\nscan.o: scan.c\n\tgcc $(CFLAGS) -c scan.c\n\nemit.o: emit.c\n\tgcc $(CFLAGS) -c emit.c\n```\n\nThe directory holds only `scan.c` and `emit.c`. You run `make`. List every target whose recipe runs (any order).", "accept": ["emit.o lumen scan.o"], "placeholder": "names separated by spaces", "why": "Plain `make` builds the default target `lumen`. `lumen` needs `scan.o` and `emit.o`, and neither exists, so both are compiled, then `lumen` is linked: `scan.o`, `emit.o`, `lumen`.\n\n`clean` does not run (nobody asked for it, and `lumen` does not depend on it). `all` is not involved either: it has no recipe, and it is not the default."}, {"id": "default-clean-first", "type": "mc", "q": "```make\nclean:\n\trm -f notes notes.o\n\nnotes: notes.o\n\tgcc -o notes notes.o\n\nnotes.o: notes.c\n\tgcc -c notes.c\n```\n\n`notes.c` exists, and `notes.o` and `notes` were built earlier with `make notes`. Now you type plain `make`. What happens?", "options": ["It runs `rm -f notes notes.o` and builds nothing", "It prints that `notes` is up to date and does nothing", "It rebuilds `notes.o` and then `notes`", "It deletes the old files and then rebuilds `notes`"], "answer": 0, "why": "The first rule in this file is `clean`, so `clean` is the default target. Plain `make` means `make clean` here: it runs `rm -f notes notes.o` and stops. Afterwards only `notes.c` is left.\n\nThe default is decided by position, never by which target looks like the real program. To build the program with this Makefile you must type `make notes`."}]}, {"id": "timestamps", "title": "Missing or older: how make decides", "read": "For every target it looks at, make asks one question.\n\n> **Rule:** rebuild the target if its file **does not exist**, or if **any dependency is newer** than it (has a later modification time). Otherwise the target is **up to date** and its recipe is skipped.\n\nmake never looks inside files. It compares **timestamps**, the \"last modified\" times that `ls -l` shows.\n\nBefore it can judge a target, make first brings each of that target's dependencies up to date, **left to right**, using the same rule. So the work starts at the bottom of the dependency graph, and the target you asked for is always built **last**. A plain source file such as `ui.c` has no rule of its own; it only has to exist.\n\nIn this section, a target is \"built\" when its recipe runs.\n\n### Worked example\n\n```make\nbundle: ui.o net.o\n\tgcc -o bundle ui.o net.o\n\nui.o: ui.c\n\tgcc -c ui.c\n\nnet.o: net.c\n\tgcc -c net.c\n```\n\nFresh directory containing only `ui.c` and `net.c`. `make` wants `bundle`:\n\n1. `bundle` is missing. First check its dependencies, left to right.\n2. `ui.o` is missing → run `gcc -c ui.c`.\n3. `net.o` is missing → run `gcc -c net.c`.\n4. Both dependencies are ready → link `bundle`.\n\n```\n$ make\ngcc -c ui.c\ngcc -c net.c\ngcc -o bundle ui.o net.o\n$ make\nmake: 'bundle' is up to date.\n```\n\nThe second `make` runs nothing: every target exists and is newer than its dependencies. (For a target with no recipe, such as Lab 1's `all`, the message is `make: Nothing to be done for 'all'.` Either message means \"no recipe needed to run\".)\n\n> **Trap:** the build order comes from the **dependency lists**, not from the order the rules are written in the file.", "questions": [{"id": "how-decides", "type": "mc", "q": "A Makefile contains the rule\n\n```make\ntail.o: tail.c\n\tgcc -c tail.c\n```\n\n`tail.o` already exists. What does make check to decide whether to run this recipe?", "options": ["Whether `tail.c` has a later modification time than `tail.o` does", "Whether the text of `tail.c` differs from what was compiled last time", "Whether the program built from `tail.o` has run since the last build", "Whether the `tail.o` rule comes before or after the other rules"], "answer": 0, "why": "make compares modification times. `tail.o` exists, so the only question is whether its dependency `tail.c` is newer. If it is, the recipe runs; if not, `tail.o` is up to date.\n\nmake never compares file contents, which is the most common wrong picture. Saving a file without changing a character still makes it newer and still triggers a rebuild."}, {"id": "order-pilot", "type": "short", "mode": "list", "q": "```make\npilot: wing.o tail.o\n\tgcc -o pilot wing.o tail.o\n\ntail.o: tail.c\n\tgcc -c tail.c\n\nwing.o: wing.c gauge.h\n\tgcc -c wing.c\n```\n\nThe directory holds only `wing.c`, `tail.c` and `gauge.h`. You run `make`. List the targets in the order their recipes run.", "accept": ["wing.o tail.o pilot"], "placeholder": "first second third", "why": "The default target is `pilot`. Its dependency list is `wing.o tail.o`, checked left to right: `wing.o` is missing → built first; `tail.o` is missing → built second; then `pilot` itself.\n\n`tail.o wing.o pilot` is the tempting answer because the `tail.o` rule is written first in the file. Rule order in the file does not matter (apart from choosing the default target); the dependency list does."}, {"id": "second-run", "type": "blanks", "q": "```make\npilot: wing.o tail.o\n\tgcc -o pilot wing.o tail.o\n\ntail.o: tail.c\n\tgcc -c tail.c\n\nwing.o: wing.c gauge.h\n\tgcc -c wing.c\n```\n\nStarting from a directory with only the three source files, you type `make` and then immediately `make` again. How many recipes run each time?", "blanks": [{"label": "first `make`", "mode": "num", "accept": ["3"]}, {"label": "second `make`", "mode": "num", "accept": ["0"]}], "why": "First run: nothing exists, so all three recipes run (`wing.o`, `tail.o`, `pilot`). Second run: every target now exists and is newer than its dependencies, so make prints `make: 'pilot' is up to date.` and runs 0 recipes.\n\nAnswering 3 for the second run forgets that make only does work when something is missing or older."}, {"id": "stale-times", "type": "short", "mode": "list", "q": "```make\npilot: wing.o tail.o\n\tgcc -o pilot wing.o tail.o\n\ntail.o: tail.c\n\tgcc -c tail.c\n\nwing.o: wing.c gauge.h\n\tgcc -c wing.c\n```\n\nThe directory contains these files:\n\n| file | last modified |\n|---|---|\n| `tail.c` | 09:50 |\n| `wing.c` | 10:02 |\n| `tail.o` | 10:15 |\n| `wing.o` | 10:15 |\n| `pilot` | 10:16 |\n| `gauge.h` | 10:30 |\n\nYou run `make`. List the targets whose recipes run, in order.", "accept": ["wing.o pilot"], "placeholder": "names in order", "why": "Check each target against its own dependencies.\n\n- `wing.o` (10:15) depends on `wing.c` (10:02, older) and `gauge.h` (10:30, **newer**) → rebuild `wing.o`.\n- `tail.o` (10:15) depends on `tail.c` (09:50, older) → up to date.\n- `pilot` (10:16) depends on `wing.o`, which has just been rebuilt and is now newer → rebuild `pilot`.\n\nSo `wing.o`, then `pilot`. Forgetting the header (comparing `wing.o` only with `wing.c`) gives the wrong answer \"nothing\"."}]}, {"id": "explicit-targets", "title": "Asking for a target: make t, make t1 t2", "read": "Name a target on the command line and make builds **that target instead of the default**: the target itself plus everything it depends on, directly or through other targets, and nothing else. Any target can be named, including a `.o` file in the middle of the graph.\n\nName several targets and make handles them **in the order you typed them**. It finishes the first one completely, then starts the second. A file that was already built for the first goal is up to date by the time the second goal needs it, so it is **not built twice**.\n\n### Worked example\n\n```make\napex: draw.o shape.o\n\tgcc -o apex draw.o shape.o\n\nprobe: probe.o shape.o\n\tgcc -o probe probe.o shape.o\n\ndraw.o: draw.c\n\tgcc -c draw.c\n\nprobe.o: probe.c\n\tgcc -c probe.c\n\nshape.o: shape.c\n\tgcc -c shape.c\n```\n\nEach row starts again from a fresh directory holding only `draw.c`, `probe.c` and `shape.c`:\n\n| command | targets built, in order |\n|---|---|\n| `make` | `draw.o`, `shape.o`, `apex` |\n| `make probe` | `probe.o`, `shape.o`, `probe` |\n| `make shape.o` | `shape.o` |\n| `make probe apex` | `probe.o`, `shape.o`, `probe`, then `draw.o`, `apex` |\n\nLast row, step by step: `probe` is handled first and needs `probe.o` and `shape.o`. Then `apex` needs `draw.o` and `shape.o`. `shape.o` was built a moment ago and is newer than `shape.c`, so it is skipped; only `draw.o` is compiled before `apex` is linked.\n\n> **Trap:** `make probe` does not build `apex`, even though `apex` is the default target. The default matters only when you name no target at all.", "questions": [{"id": "explicit-hinge", "type": "short", "mode": "num", "q": "```make\nvault: lock.o hinge.o\n\tgcc -o vault lock.o hinge.o\n\nlock.o: lock.c pins.h\n\tgcc -c lock.c\n\nhinge.o: hinge.c\n\tgcc -c hinge.c\n\nkeygen: keygen.o lock.o\n\tgcc -o keygen keygen.o lock.o\n\nkeygen.o: keygen.c pins.h\n\tgcc -c keygen.c\n```\n\nThe directory holds only the source files (`lock.c`, `hinge.c`, `keygen.c`, `pins.h`). You run `make hinge.o`. How many recipes run?", "accept": ["1"], "why": "`make hinge.o` builds `hinge.o` and whatever it depends on. Its only dependency is `hinge.c`, a source file that already exists, so exactly 1 recipe runs: `gcc -c hinge.c`.\n\nAnswering 3 means you built the default target `vault` instead. Naming a target replaces the default."}, {"id": "explicit-keygen", "type": "short", "mode": "list", "q": "```make\nvault: lock.o hinge.o\n\tgcc -o vault lock.o hinge.o\n\nlock.o: lock.c pins.h\n\tgcc -c lock.c\n\nhinge.o: hinge.c\n\tgcc -c hinge.c\n\nkeygen: keygen.o lock.o\n\tgcc -o keygen keygen.o lock.o\n\nkeygen.o: keygen.c pins.h\n\tgcc -c keygen.c\n```\n\nFresh directory (source files only). You run `make keygen`. List the targets in the order their recipes run.", "accept": ["keygen.o lock.o keygen"], "placeholder": "names in order", "why": "`keygen` depends on `keygen.o lock.o`, left to right. Both are missing: `keygen.o` is compiled, then `lock.o`, then `keygen` is linked.\n\n`hinge.o` and `vault` are not touched: `keygen` does not depend on them. The trap is starting with `lock.o` because its rule appears earlier in the file."}, {"id": "explicit-two", "type": "short", "mode": "list", "q": "```make\nvault: lock.o hinge.o\n\tgcc -o vault lock.o hinge.o\n\nlock.o: lock.c pins.h\n\tgcc -c lock.c\n\nhinge.o: hinge.c\n\tgcc -c hinge.c\n\nkeygen: keygen.o lock.o\n\tgcc -o keygen keygen.o lock.o\n\nkeygen.o: keygen.c pins.h\n\tgcc -c keygen.c\n```\n\nFresh directory (source files only). You run `make keygen vault`. List the targets in the order their recipes run.", "accept": ["keygen.o lock.o keygen hinge.o vault"], "placeholder": "names in order", "why": "Goals are handled in the order typed.\n\n1. `keygen`: `keygen.o`, `lock.o`, `keygen`.\n2. `vault` depends on `lock.o hinge.o`. `lock.o` already exists and is newer than `lock.c` and `pins.h` → skipped. `hinge.o` is missing → built. Then `vault`.\n\nFull order: `keygen.o lock.o keygen hinge.o vault`. Listing `lock.o` a second time is the mistake to avoid."}, {"id": "explicit-after", "type": "short", "mode": "list", "q": "```make\nvault: lock.o hinge.o\n\tgcc -o vault lock.o hinge.o\n\nlock.o: lock.c pins.h\n\tgcc -c lock.c\n\nhinge.o: hinge.c\n\tgcc -c hinge.c\n\nkeygen: keygen.o lock.o\n\tgcc -o keygen keygen.o lock.o\n\nkeygen.o: keygen.c pins.h\n\tgcc -c keygen.c\n```\n\nFresh directory (source files only). You run `make keygen`, and then plain `make`. List the targets whose recipes run during the **second** command, in order.", "accept": ["hinge.o vault"], "placeholder": "names in order", "why": "After `make keygen`, the files `keygen.o`, `lock.o` and `keygen` exist. Plain `make` builds the default target `vault`, which depends on `lock.o hinge.o`:\n\n- `lock.o` exists and is newer than its dependencies → skipped.\n- `hinge.o` is missing → built.\n- `vault` is missing → built.\n\nAnswer: `hinge.o vault`. The full fresh-build answer `lock.o hinge.o vault` ignores what the first command left behind."}]}, {"id": "minimal-rebuild", "title": "One file changed: the minimal rebuild", "read": "Editing and saving a file gives it a new timestamp, later than everything built before. Apply the rule from Part 3 and the rebuild follows a predictable path:\n\n1. Every target that lists the changed file as a dependency is now **older** than it → rebuilt.\n2. Each rebuilt target is now newer than the targets that depend on *it* → they are rebuilt too, all the way up to the goal.\n3. Everything else still exists and is still newer than its own dependencies → **not rebuilt**.\n\nSo \"what gets rebuilt?\" has a mechanical answer: the targets on a path **from the changed file up to the target you asked for**. That is the *minimal set*, and doing only that much work is what makes the build *incremental*.\n\n### Worked example\n\n```make\nrelay: msg.o queue.o log.o\n\tgcc -o relay msg.o queue.o log.o\n\nmsg.o: msg.c queue.h\n\tgcc -c msg.c\n\nqueue.o: queue.c queue.h\n\tgcc -c queue.c\n\nlog.o: log.c\n\tgcc -c log.c\n```\n\nEverything has been built. You edit `log.c`, then run `make`:\n\n```\ngcc -c log.c\ngcc -o relay msg.o queue.o log.o\n```\n\n- `log.o` depends on `log.c`, which is now newer → rebuilt.\n- `relay` depends on `log.o`, which is now newer → rebuilt.\n- `msg.o` and `queue.o` are skipped. Neither lists `log.c`, and each is still newer than its own `.c` file and `queue.h`.\n\nEdit `queue.h` instead and **two** rules list it, so make runs `msg.o`, `queue.o`, then `relay`, and leaves `log.o` alone.\n\n> **On paper:** \"Why wasn't X rebuilt?\" Answer with timestamps: *X already exists and none of its dependencies is newer than X.*", "questions": [{"id": "rebuild-mapc", "type": "short", "mode": "list", "q": "```make\natlas: map.o route.o city.o\n\tgcc -o atlas map.o route.o city.o\n\nmap.o: map.c grid.h\n\tgcc -c map.c\n\nroute.o: route.c grid.h city.h\n\tgcc -c route.c\n\ncity.o: city.c city.h\n\tgcc -c city.c\n```\n\nEverything has been built with `make`. You edit `map.c` and run `make` again. List the targets whose recipes run, in order.", "accept": ["map.o atlas"], "placeholder": "names in order", "why": "Only one rule lists `map.c`: `map.o`. It is now older than `map.c` → rebuilt. `atlas` depends on `map.o`, which is now newer → rebuilt.\n\n`route.o` and `city.o` are untouched: none of their dependencies changed. Answering with all four targets treats make like a script that reruns everything."}, {"id": "rebuild-cityh", "type": "short", "mode": "list", "q": "```make\natlas: map.o route.o city.o\n\tgcc -o atlas map.o route.o city.o\n\nmap.o: map.c grid.h\n\tgcc -c map.c\n\nroute.o: route.c grid.h city.h\n\tgcc -c route.c\n\ncity.o: city.c city.h\n\tgcc -c city.c\n```\n\nEverything has been built with `make`. You edit the header `city.h` and run `make` again. List the targets whose recipes run, in order.", "accept": ["route.o city.o atlas"], "placeholder": "names in order", "why": "Find every rule with `city.h` on the right of the colon: `route.o` and `city.o`. Both are now older than the header → both rebuilt, in the order `atlas` lists them (`map.o route.o city.o`, with `map.o` skipped). Then `atlas`, because two of its dependencies are newer.\n\nAnswer: `route.o city.o atlas`. The usual slip is `city.o atlas`: the header's name suggests only `city.o`, but `route.o` lists it too."}, {"id": "why-not-map", "type": "mc", "q": "```make\natlas: map.o route.o city.o\n\tgcc -o atlas map.o route.o city.o\n\nmap.o: map.c grid.h\n\tgcc -c map.c\n\nroute.o: route.c grid.h city.h\n\tgcc -c route.c\n\ncity.o: city.c city.h\n\tgcc -c city.c\n```\n\nEverything has been built with `make`. You edit `route.c` and run `make` again. `map.o` is **not** rebuilt. Which explanation is correct?", "options": ["`map.o` exists and is newer than both `map.c` and `grid.h`", "make compared `map.c` with its previous contents and found no change", "make rebuilds at most one dependency of a target per run", "`map.o` is not one of the dependencies of `atlas`"], "answer": 0, "why": "A target is skipped when its file exists and no dependency is newer. `map.o` depends on `map.c` and `grid.h`; neither was touched, so `map.o` is still newer than both. (What does run: `route.o`, then `atlas`.)\n\nmake does not compare contents and has no limit on how many targets it rebuilds. `map.o` *is* a dependency of `atlas`; that is why make checked it at all."}, {"id": "rebuild-other-target", "type": "blanks", "q": "```make\natlas: map.o route.o city.o\n\tgcc -o atlas map.o route.o city.o\n\nmap.o: map.c grid.h\n\tgcc -c map.c\n\nroute.o: route.c grid.h city.h\n\tgcc -c route.c\n\ncity.o: city.c city.h\n\tgcc -c city.c\n```\n\nEverything has been built. You edit `city.c`. Then you run two commands, one after the other.", "blanks": [{"label": "`make route.o`: how many recipes run?", "mode": "num", "accept": ["0"]}, {"label": "then `make`: targets built, in order", "mode": "list", "accept": ["city.o atlas"]}], "why": "`make route.o` looks only at `route.o` and its dependencies (`route.c`, `grid.h`, `city.h`). `city.c` is not among them, so make reports `'route.o' is up to date`: 0 recipes.\n\nPlain `make` then builds `atlas`: `city.o` is older than the edited `city.c` → rebuilt, and `atlas` is older than the new `city.o` → rebuilt. `city.c` and `city.h` are different files; mixing them up is the trap."}]}, {"id": "clean", "title": "make clean, and what comes after", "read": "```make\ndepot: crate.o label.o\n\tgcc -o depot crate.o label.o\n\ncrate.o: crate.c\n\tgcc -c crate.c\n\nlabel.o: label.c\n\tgcc -c label.c\n\nclean:\n\trm -f depot crate.o label.o\n```\n\n`clean` is an ordinary rule: a target with **no dependencies** whose recipe deletes the files the other rules create. `make clean` just means \"build the target called `clean`\", so make runs that recipe. Nothing ever creates a file named `clean`, so the target always counts as missing and its recipe runs **every time you ask**.\n\nTwo consequences of the timestamp rule:\n\n- `make clean` compiles nothing. It only runs the `rm` line.\n- Afterwards the built files are gone, so the next build cannot skip anything it needs. `make` rebuilds **everything the default target needs**. `make <target>` rebuilds **only that target's chain**.\n\n`clean` runs only when you name it (unless it happens to be the first target). It deletes build products, never your `.c` and `.h` files, because the `rm` line lists only products. `rm -f` does not complain when a file is already gone, so `make clean` works in a directory with nothing built.\n\n### Worked example\n\n```\n$ make\ngcc -c crate.c\ngcc -c label.c\ngcc -o depot crate.o label.o\n$ make clean\nrm -f depot crate.o label.o\n$ make\ngcc -c crate.c\ngcc -c label.c\ngcc -o depot crate.o label.o\n```\n\nWithout the `make clean` in the middle, the second `make` would have printed `make: 'depot' is up to date.` That is why `make clean` followed by `make` is the standard way to force a complete rebuild.", "questions": [{"id": "clean-then-make", "type": "short", "mode": "list", "q": "```make\nferry: deck.o horn.o\n\tgcc -o ferry deck.o horn.o\n\ndeck.o: deck.c\n\tgcc -c deck.c\n\nhorn.o: horn.c\n\tgcc -c horn.c\n\nclean:\n\trm -f ferry deck.o horn.o\n```\n\nEverything has been built. You edit `deck.c`, run `make clean`, and then run `make`. List the targets whose recipes run during that last `make`, in order.", "accept": ["deck.o horn.o ferry"], "placeholder": "names in order", "why": "`make clean` deleted `ferry`, `deck.o` and `horn.o`. For the final `make` every target is missing, so everything the default target needs is built: `deck.o`, `horn.o`, `ferry`.\n\n`deck.o ferry` would be right **without** the clean (only the edited file's path). After a clean, which file you edited no longer matters."}, {"id": "clean-then-target", "type": "blanks", "q": "```make\nferry: deck.o horn.o\n\tgcc -o ferry deck.o horn.o\n\ndeck.o: deck.c\n\tgcc -c deck.c\n\nhorn.o: horn.c\n\tgcc -c horn.c\n\nclean:\n\trm -f ferry deck.o horn.o\n```\n\nEverything has been built. You run `make clean` and then `make horn.o`.", "blanks": [{"label": "targets built by `make horn.o`, in order", "mode": "list", "accept": ["horn.o"]}, {"label": "does the file `ferry` exist afterwards? (yes/no)", "mode": "text", "accept": ["no", "n"]}], "why": "After the clean nothing built is left. `make horn.o` builds only `horn.o` and what it depends on (`horn.c`, which exists): one recipe. `ferry` was deleted by `clean` and nobody asked for it again, so it does not exist; the directory now holds `deck.c horn.c horn.o`.\n\nThe trap is assuming any `make` after a clean rebuilds the whole program."}, {"id": "clean-always", "type": "mc", "q": "You run `make clean` twice in a row. Both times make runs the `rm -f …` recipe; it never says `'clean' is up to date`. Why?", "options": ["No file named `clean` exists, so the target always counts as missing", "make gives the name `clean` special treatment and always runs it", "`rm -f` resets the timestamps of the source files, so everything looks stale", "A target is rebuilt whenever it comes last in the Makefile"], "answer": 0, "why": "It is the ordinary rule again: a target whose file does not exist must be built. The `clean` recipe deletes files but never creates one called `clean`, so the target is missing every time and the recipe runs every time.\n\nmake attaches no meaning to the name (a rule called `clean` that came first would even be the default target), and `rm` does not touch your sources."}, {"id": "ferry-then-clean", "type": "short", "mode": "list", "q": "```make\nferry: deck.o horn.o\n\tgcc -o ferry deck.o horn.o\n\ndeck.o: deck.c\n\tgcc -c deck.c\n\nhorn.o: horn.c\n\tgcc -c horn.c\n\nclean:\n\trm -f ferry deck.o horn.o\n```\n\nFresh directory holding only `deck.c` and `horn.c`. You type `make ferry clean` (two targets on one command line). List every target whose recipe runs, in order. Include `clean` if its recipe runs.", "accept": ["deck.o horn.o ferry clean"], "placeholder": "names in order", "why": "Goals are handled in the order typed. First `ferry`: `deck.o`, `horn.o`, `ferry`. Then `clean`: its recipe deletes all three again. The directory ends up holding only `deck.c horn.c`.\n\nmake does exactly what was asked, in order, even when the result is pointless. Typing them the other way round, `make clean ferry`, gives a clean followed by a full build."}]}, {"id": "missing-existing", "title": "Missing files, and files that already exist", "read": "**A dependency that does not
