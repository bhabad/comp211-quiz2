<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --ink: #1a1f26; --muted: #5d6673; --line: #dfe3e8; --soft: #eef1f5;

  --code-bg: #f3f4f7; --code-ink: #1f2430; --tok-c: #6b7785; --tok-s: #a3442c; --tok-k: #7a3fb5; --tok-n: #0b6e99; --tok-p: #9a6700;
  --radius: 12px; --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --card: #1b1f26; --ink: #e8ebf0; --muted: #9aa4b2; --line: #2e343d; --soft: #232831;
    --accent: #6cb6ea; --accent-ink: #0c1620; --accent-soft: #1c2f40;
    --ok: #5fcf8f; --ok-soft: #163324; --no: #ff8a80; --no-soft: #3a1c1a; --mid: #f0c060; --mid-soft: #3a2f12;
    --code-bg: #14171c; --code-ink: #e3e7ee; --tok-c: #8490a0; --tok-s: #f0a58c; --tok-k: #c8a2f5; --tok-n: #7fd1f0; --tok-p: #f0c060;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --card: #1b1f26; --ink: #e8ebf0; --muted: #9aa4b2; --line: #2e343d; --soft: #232831;
  --accent: #6cb6ea; --accent-ink: #0c1620; --accent-soft: #1c2f40;
  --ok: #5fcf8f; --ok-soft: #163324; --no: #ff8a80; --no-soft: #3a1c1a; --mid: #f0c060; --mid-soft: #3a2f12;
  --code-bg: #14171c; --code-ink: #e3e7ee; --tok-c: #8490a0; --tok-s: #f0a58c; --tok-k: #c8a2f5; --tok-n: #7fd1f0; --tok-p: #f0c060;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 860px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.brand { font-weight: 700; color: var(--ink); text-decoration: none; margin-right: auto; white-space: nowrap; }
.topnav { display: flex; gap: 2px; flex-wrap: wrap; }
.topnav a { color: var(--muted); text-decoration: none; padding: 4px 9px; border-radius: 8px; font-size: 14.5px; white-space: nowrap; }
.topnav a:hover, .topnav a.on { color: var(--ink); background: var(--soft); }
.save-badge, #theme { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
.save-badge.file { color: var(--ok); border-color: var(--ok); }
.save-badge.pending { color: var(--mid); border-color: var(--mid); }

main { max-width: 860px; margin: 0 auto; padding: 22px 16px 90px; }
h1 { font-size: clamp(25px, 4.4vw, 33px); line-height: 1.2; margin: 6px 0 10px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; }
h3 { font-size: 17px; margin: 18px 0 6px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.lede { color: var(--muted); margin: 0 0 14px; max-width: 62ch; }
.muted { color: var(--muted); font-size: 14.5px; }
.back { font-size: 14.5px; text-decoration: none; display: inline-block; margin-bottom: 8px; }

.hero { padding: 6px 0 4px; }
.hero-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.meters { display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 14px; flex: 1; min-width: 280px; }
.meter-top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.meter-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
.meter-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.bar { display: block; height: 7px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s; }

.tools, .drill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 22px 0 8px; }
.drill-grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.tool { display: flex; flex-direction: column; gap: 2px; padding: 11px 13px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.tool:hover { border-color: var(--accent); }
.tool span { font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.drill-stat { margin-top: 6px; font-variant-numeric: tabular-nums; }

.list-title { margin: 26px 0 10px; }
.sec-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.sec-card { display: grid; grid-template-columns: 38px 1fr 150px; gap: 12px; align-items: center; padding: 13px 15px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.sec-card:hover { border-color: var(--accent); }
.sec-n { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.sec-card.done .sec-n { background: var(--ok-soft); color: var(--ok); }
.sec-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.sec-title { font-weight: 650; line-height: 1.3; }
.star { font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--mid); background: var(--mid-soft); border-radius: 99px; padding: 1px 8px; margin-left: 8px; white-space: nowrap; vertical-align: 2px; }
.sec-blurb { font-size: 14.5px; color: var(--muted); line-height: 1.4; }
.sec-meta { font-size: 12.5px; color: var(--muted); opacity: 0.85; }
.sec-prog { display: flex; flex-direction: column; gap: 5px; }
.sec-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.foot { margin-top: 30px; font-size: 13.5px; color: var(--muted); }

.sec-head { margin-bottom: 14px; }
.rail { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.rail-step { min-width: 34px; height: 34px; padding: 0 10px; display: grid; place-items: center; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rail-step.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.rail-step.cur { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.read { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px 12px; }
.read-label, .qs-label { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.qs-label { margin: 24px 0 8px; color: var(--muted); }
.qs { display: grid; gap: 14px; }
.skip { display: inline-block; margin-top: 16px; font-size: 14px; color: var(--muted); }

.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 12px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 24px; }
.md li { margin: 3px 0; }
.md li > ul, .md li > ol { margin: 3px 0; }
.md h4 { font-size: 16.5px; margin: 18px 0 6px; }
.md code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }
.md pre.code { background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px; font: 14px/1.5 var(--mono); tab-size: 4; }
.md pre.code code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; white-space: pre; }
.tok-c { color: var(--tok-c); font-style: italic; } .tok-s { color: var(--tok-s); } .tok-k { color: var(--tok-k); } .tok-n { color: var(--tok-n); } .tok-p, .tok-v { color: var(--tok-p); }
.tbl { overflow-x: auto; margin: 0 0 12px; }
.md table { border-collapse: collapse; font-size: 15px; min-width: 50%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--soft); font-weight: 650; font-size: 14px; }
.callout { margin: 0 0 12px; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 9px 9px 0; }
.callout.trap { border-color: var(--no); background: var(--no-soft); }
.callout.rule { border-color: var(--ok); background: var(--ok-soft); }
.callout.paper { border-color: var(--mid); background: var(--mid-soft); }
.callout.lecture { border-color: var(--muted); background: var(--soft); }
.md.inline, .md.inline p { display: inline; margin: 0; }

.q-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; scroll-margin-top: 70px; }
.q-card.is-right { border-color: var(--ok); } .q-card.is-wrong { border-color: var(--no); } .q-card.is-mid { border-color: var(--mid); }
.q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.q-num { font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.q-prev { font-size: 12px; border-radius: 99px; padding: 0 8px; }
.q-prev.ok { background: var(--ok-soft); color: var(--ok); } .q-prev.no { background: var(--no-soft); color: var(--no); }
.flag-btn { margin-left: auto; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 8px; padding: 1px 8px; cursor: pointer; }
.flag-btn:hover { border-color: var(--line); } .flag-btn.on { color: var(--mid); border-color: var(--mid); }
.flag-row { margin-bottom: 10px; }
.flag-note { width: 100%; font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--mid); border-radius: 8px; background: var(--card); color: var(--ink); }
.q-text { margin-bottom: 12px; }

.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 11px; align-items: baseline; text-align: left; width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; opacity: 1; color: var(--ink); }
.opt-key { flex: none; font-size: 12.5px; font-weight: 700; color: var(--muted); width: 14px; }
.opt-text code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.incorrect { border-color: var(--no); background: var(--no-soft); }

.short-row { display: flex; align-items: center; gap: 8px; }
.ans-input { font: 15.5px var(--mono); width: 100%; max-width: 420px; padding: 8px 11px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); }
.ans-input:focus, .self-input:focus, .flag-note:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.ans-input.good { border-color: var(--ok); background: var(--ok-soft); } .ans-input.bad { border-color: var(--no); background: var(--no-soft); }
.ans-input:disabled { opacity: 1; color: var(--ink); -webkit-text-fill-color: var(--ink); }
.mark { width: 18px; font-weight: 700; flex: none; } .mark.ok { color: var(--ok); } .mark.no { color: var(--no); }
.fix { font-size: 14px; color: var(--muted); white-space: nowrap; }
.fix code { font-family: var(--mono); background: var(--ok-soft); color: var(--ok); border-radius: 5px; padding: 1px 6px; }
.blanks { display: grid; gap: 8px; }
.blank { display: grid; grid-template-columns: minmax(120px, 44%) 1fr; gap: 10px; align-items: center; }
.blank-label { font-size: 15px; } .blank-label code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
.blank-in { display: flex; align-items: center; gap: 8px; min-width: 0; }
.blank-in .ans-input { max-width: 300px; }
.self-input { width: 100%; font: 14.5px/1.5 var(--mono); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); resize: vertical; tab-size: 4; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.try-again { margin-top: 8px; font-size: 14.5px; color: var(--no); }
.hint { margin-top: 6px; font-size: 14.5px; color: var(--muted); }

.btn { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { font-size: 16.5px; padding: 10px 18px; }
.btn.ghost { background: none; }
.btn.good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.mid { background: var(--mid-soft); border-color: var(--mid); color: var(--mid); }
.btn.bad { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.btn:focus-visible, .opt:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.q-fb { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.verdict { font-weight: 700; margin-bottom: 6px; } .verdict.ok { color: var(--ok); } .verdict.no { color: var(--no); } .verdict.mid { color: var(--mid); }
.ans { margin-bottom: 6px; } .ans > span { color: var(--muted); }
.why { font-size: 15.5px; }
.next-btn { margin-top: 12px; }
.model { margin-top: 12px; padding: 12px 14px; background: var(--soft); border-radius: 10px; }
.model-label { font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
.model-label:first-child { margin-top: 0; }
.rubric { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 4px; }
.rubric label { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.rubric code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
.self-grade { display: flex; gap: 8px; flex-wrap: wrap; }

.quiz-prog { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); margin: 6px 0 12px; font-variant-numeric: tabular-nums; }
.quiz-prog .bar { flex: 1; }
.result { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; text-align: center; }
.result.left { text-align: left; }
.result.left .result-actions { justify-content: flex-start; }
.score { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 14px 0 4px; }
.miss-list { text-align: left; font-size: 14.5px; color: var(--muted); margin: 10px auto; max-width: 60ch; }
.miss-secs { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
.miss-secs li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; }
.cheat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 18px; margin-bottom: 10px; break-inside: avoid; }
.cheat h3 { margin: 0 0 6px; } .cheat h3 a { color: var(--ink); text-decoration: none; }
.cheat ul { margin: 0; padding-left: 20px; } .cheat li { margin: 4px 0; }
.cheat code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
.clock { position: sticky; top: 52px; z-index: 5; width: max-content; margin: 0 0 12px auto; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; font: 600 14px var(--mono); }
.clock.over { color: var(--no); border-color: var(--no); }
.mock-score { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 18px; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14.5px; z-index: 20; }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .sec-card { grid-template-columns: 34px 1fr; }
  .sec-prog { grid-column: 2; }
  .read { padding: 16px 15px 8px; }
  .q-card { padding: 14px 14px; }
  .blank { grid-template-columns: 1fr; gap: 4px; }
  .star { display: inline-block; margin-left: 0; }
}
@media print {
  .topbar, .back, .foot { display: none; }
  body { background: #fff; }
}

<script>window.__DATA__ = {"quizAt": "2026-10-14T10:10:00-04:00", "high": ["fp-special", "bytes-endian", "pointer-arithmetic", "arrays-2d", "heap-manager"], "sections": [{"id": "fp-fields", "title": "Floating point 1: fields, bias, encode and decode", "blurb": "Turn bits into a number and a number into bits, in Microfloat, Minifloat, or any sign / exponent / fraction format a question hands you (normalized values only).", "objective": "Objective 3: Floating point", "sources": "CL13 · CL14 · RD11 · RD12 · HW5", "minutes": 55, "cheats": ["Binary places after the point: `0.1` = 1/2, `0.01` = 1/4, `0.001` = 1/8, `0.0001` = 1/16.", "Normalized = `1.f` × 2^{e}. The leading 1 is implicit (not stored). Point moved left → positive e, moved right → negative e.", "Bias = 2^{k−1} − 1 for k exponent bits (3 → 3, 4 → 7, 5 → 15, 8 → 127, 11 → 1023). If the question states a bias, use that one.", "Stored exponent = true exponent + bias. True exponent = stored − bias.", "Decode (normalized): (−1)^{S} × `1.f` × 2^{E − bias}. Split the bits by the given widths first.", "Encode: sign → binary → normalize → E = e + bias (pad zeros on the LEFT) → fraction (pad zeros on the RIGHT).", "Fraction needs too many bits → not enough precision. Exponent does not fit → not enough range.", "Microfloat = 4 bits, `[exponent][significand]`, no sign (V4: 2 + 2, bias 2). Minifloat = 1 sign, 3 exponent (bias 3), 4 fraction."], "chunks": [{"id": "bin-frac", "title": "Binary fractions: what `0.101` is worth", "read": "In decimal, the digits right of the point are worth 1/10, 1/100, 1/1000. In binary, each place right of the **binary point** is worth half of the place before it:\n\n| place | 2^{2} | 2^{1} | 2^{0} | point | 2^{−1} | 2^{−2} | 2^{−3} | 2^{−4} |\n|---|---|---|---|---|---|---|---|---|\n| worth | 4 | 2 | 1 | . | 1/2 | 1/4 | 1/8 | 1/16 |\n\nTo read a binary fraction, add up the places that hold a 1.\n\n**Worked example.** `0.101` has a 1 in the 1/2 place and in the 1/8 place: 1/2 + 1/8 = 5/8 = **0.625**.\n\n**Worked example.** `110.011` = 4 + 2 + 1/4 + 1/8 = **6.375**.\n\n**Going the other way** (decimal → binary): do the whole part as usual, then build the fraction part out of halves, quarters, eighths, sixteenths.\n\n- 2.6875 → whole part 2 = `10`. Fraction 0.6875 = 0.5 + 0.125 + 0.0625 = 1/2 + 1/8 + 1/16 → `.1011`. Together: `10.1011`.\n\n> **Rule:** if the fraction is k/2^{n}, write k in binary and make it n places long after the point. 11/16 → 11 is `1011` and 16 = 2^{4}, so four places: `0.1011`. 3/16 → `11` padded to four places: `0.0011`.\n\nWorth knowing cold: 1/2 = 0.5, 1/4 = 0.25, 1/8 = 0.125, 1/16 = 0.0625, 1/32 = 0.03125, 1/64 = 0.015625.\n\n> **On paper:** the homework writes these as `0b10.1011`, and takes mixed fractions like `2 11/16`. Check that your powers of two really add up to the number before moving on; every later step depends on this one.", "questions": [{"id": "bf-read-1", "type": "short", "mode": "num", "q": "What is the binary fraction `0.011` worth in decimal?", "accept": ["0.375", "3/8"], "why": "The 1s are in the 1/4 and 1/8 places: 1/4 + 1/8 = 3/8 = **0.375**. Reading the digits as \"eleven\" and answering 0.11, or forgetting that the first place after the point is 1/2 (not 1/4), are the usual slips.", "placeholder": "decimal or fraction"}, {"id": "bf-read-2", "type": "short", "mode": "num", "q": "What is `101.101` (binary) in decimal?", "accept": ["5.625", "45/8"], "why": "Left of the point: 4 + 1 = 5. Right of the point: 1/2 + 1/8 = 0.625. Total **5.625**. Answering 5.5 drops the 1/8 place.", "placeholder": "decimal or fraction"}, {"id": "bf-write", "type": "short", "mode": "text", "q": "Write **5.3125** in binary place-value form (like `10.1011`).", "accept": ["101.0101", "0b101.0101"], "why": "5 = `101`. 0.3125 = 0.25 + 0.0625 = 1/4 + 1/16 → `.0101`. Answer **`101.0101`**. `101.101` would be 5.625: the 1/2 place must be 0.", "placeholder": "101.…"}, {"id": "bf-32", "type": "mc", "q": "Which binary fraction equals **11/32**?", "options": ["`0.01011`", "`0.1011`", "`0.001011`", "`0.11010`"], "answer": 0, "why": "32 = 2^{5}, so the fraction needs five places. 11 = `1011`, padded on the left to five places: **`0.01011`**. `0.1011` uses only four places, which is 11/16; `0.001011` uses six, which is 11/64."}]}, {"id": "normalized", "title": "Normalized form and the implicit 1", "read": "Floating point is binary scientific notation. Decimal scientific notation writes 756 as 7.56 × 10^{2}: one digit before the point, and a power of ten that says where the point really goes. Binary does the same with powers of two:\n\n```\n     1.0101   x   2^6\n     ------       ---\n   significand  exponent        (the base is always 2)\n```\n\nA number is in **normalized form** when exactly one `1` sits left of the binary point: `1.xxx` × 2^{e}. So 1 ≤ significand < 2.\n\n**To normalize:** slide the point until it is just after the first 1, and count the places you moved it.\n\n- Point moved **left** → exponent is **positive**.\n- Point moved **right** → exponent is **negative**.\n\n**Worked examples.**\n\n- 11.25 = `1011.01`. Point moves 3 places left: `1.01101` × 2^{3}.\n- 0.15625 = `0.00101`. Point moves 3 places right: `1.01` × 2^{−3}.\n- 1.5 = `1.1`. Already normalized: `1.1` × 2^{0}.\n\n### The implicit 1\n\nIn normalized form the digit left of the point is *always* 1 (for every number except zero). A bit that is always 1 tells you nothing, so the format **does not store it**. Only the bits *after* the point are stored. That stored part is the **fraction** (the slides label it \"significand bits\"; the homework says \"significand (mantissa)\").\n\n- Not storing the 1 frees one bit, so you get **one more bit of precision**.\n- The **range is unaffected**, because range comes from the exponent bits.\n\nSo `1.01101` × 2^{3} is stored as fraction `01101` plus exponent 3. When you decode, you put the `1.` back in front.\n\n> **Trap:** the exponent is the number of places the point moved, not the number of digits. `1011.01` has four digits before the point but the point moves only three places.", "questions": [{"id": "norm-52", "type": "blanks", "q": "Normalize 52 = `110100`: write it as `1.xxx` × 2^{e}.", "blanks": [{"label": "fraction bits (after the point, trailing zeros dropped)", "mode": "bits", "accept": ["101"]}, {"label": "exponent e", "mode": "num", "accept": ["5"]}], "why": "`110100.` → move the point 5 places left → `1.101` × 2^{5}. Fraction `101`, exponent **5**. Answering 6 counts the digits instead of the places moved."}, {"id": "norm-small", "type": "blanks", "q": "Normalize 0.09375 = `0.00011`: write it as `1.xxx` × 2^{e}.", "blanks": [{"label": "fraction bits (after the point)", "mode": "bits", "accept": ["1"]}, {"label": "exponent e", "mode": "num", "accept": ["-4"]}], "why": "Move the point 4 places right to get past the first 1: `1.1` × 2^{−4}. Fraction `1`, exponent **−4**. Answering −3 counts only the zeros; the point has to pass the first 1 as well."}, {"id": "norm-675", "type": "blanks", "q": "Normalize 6.75. (Convert to binary first.)", "blanks": [{"label": "6.75 in binary", "mode": "text", "accept": ["110.11", "0b110.11"]}, {"label": "fraction bits of the normalized form", "mode": "bits", "accept": ["1011"]}, {"label": "exponent e", "mode": "num", "accept": ["2"]}], "why": "6 = `110`, 0.75 = 1/2 + 1/4 = `.11`, so 6.75 = `110.11`. Point moves 2 places left: `1.1011` × 2^{2}. The fraction is everything after the point, `1011`; the leading 1 is not part of it."}, {"id": "implicit-why", "type": "mc", "q": "Why doesn't a floating-point format store the 1 that sits in front of the binary point?", "options": ["In normalized form that bit is always 1, so leaving it out frees a bit for the fraction: more precision, same range.", "In normalized form that bit is always 1, so leaving it out frees a bit for the exponent: more range, same precision.", "The bias that is added to the exponent already accounts for that 1, so storing it would count it twice.", "Leaving it out is what allows the format to represent the value zero."], "answer": 0, "why": "The leading bit of a normalized number is always 1, so it carries no information. Dropping it gives the **fraction** one extra bit (precision). Range is set by the exponent bits and does not change. The bias only shifts the exponent; it has nothing to do with the leading 1. The zero option has it backwards: because of the implicit 1, zero needs its own reserved pattern (next section)."}]}, {"id": "microfloat", "title": "Fields in 4 bits: Microfloat V1, V2, V3", "read": "Lecture builds up to the real standard (IEEE-754) with toy formats. The first, **Microfloat**, has only 4 bits, split into two fields with the exponent first:\n\n```\n [ exponent bits ][ significand bits ]\n\n value = 1.<significand bits>  x  2^<exponent bits>\n```\n\nThere is no sign bit, and in versions 1 to 3 the exponent is a plain unsigned number.\n\n| Version | Exponent bits | Significand bits | Smallest value | Largest value |\n|---|---|---|---|---|\n| V1 | 2 | 2 | `00 00` = 1 | `11 11` = `1.11` × 2^{3} = 14 |\n| V2 | 1 | 3 | `0 000` = 1 | `1 111` = `1.111` × 2^{1} = 3.75 |\n| V3 | 3 | 1 | `000 0` = 1 | `111 1` = `1.1` × 2^{7} = 192 |\n\n**Encode** (decimal → bits): binary → normalize → fill the two fields.\n\n- **Significand field** = the bits after the point. Too few? Pad with zeros on the **right** (`1.1` and `1.10` are the same number).\n- **Exponent field** = the exponent as an unsigned number. Too few bits? Pad with zeros on the **left**, like any integer.\n\n**Worked example: 6 in V1.** 6 = `110` = `1.1` × 2^{2}. Exponent 2 = `10`. Significand `1` → pad right → `10`. Answer **`1010`**.\n\n**Decode** (bits → decimal): split the fields, put the `1.` back, apply the exponent.\n\n**Worked example: `1011` in V2.** Exponent `1` = 1, significand `011`. `1.011` × 2^{1} = `10.11` = **2.75**.\n\n### When it does not fit\n\n- The significand needs more bits than the field has → **not enough precision**.\n- The exponent needs more bits than the field has → **not enough range**.\n\n10 in V2: `1010` = `1.01` × 2^{3}. The significand `01` fits in 3 bits, but exponent 3 = `11` needs 2 bits and V2 has 1 → not enough range.\n\n2.25 in V1: `10.01` = `1.001` × 2^{1}. Exponent 1 fits, but `001` needs 3 significand bits and V1 has 2 → not enough precision.\n\n> **On paper:** the readings ask for the bits as `0b1010`, or `N/A` plus the reason.", "questions": [{"id": "mf-enc-5", "type": "short", "mode": "bits", "q": "Encode **5** in Microfloat V1 (2 exponent bits, then 2 significand bits, no bias).", "accept": ["1001"], "why": "5 = `101` = `1.01` × 2^{2}. Exponent 2 = `10`. Significand `01`. → **`1001`**. `0110` has the fields in the wrong order (significand first).", "placeholder": "4 bits"}, {"id": "mf-dec-v3", "type": "short", "mode": "num", "q": "Decode `1011` in Microfloat V3 (3 exponent bits, then 1 significand bit, no bias).", "accept": ["48"], "why": "Split 3 | 1: exponent `101` = 5, significand `1`. `1.1` × 2^{5} = `110000` = **48**. Splitting it 2 | 2 as if it were V1 gives `1.11` × 2^{2} = 7."}, {"id": "mf-fit-v1", "type": "mc", "q": "Can **5.5** be stored in Microfloat V1 (2 exponent bits, 2 significand bits, no bias)?", "options": ["No: not enough precision", "No: not enough range", "Yes, as `1001`", "Yes, as `1011`"], "answer": 0, "why": "5.5 = `101.1` = `1.011` × 2^{2}. Exponent 2 = `10` fits, but the significand `011` needs 3 bits and V1 has 2 → **not enough precision**. `1001` is 5 and `1011` is 7; chopping or rounding the last bit changes the value."}, {"id": "mf-fit-v2", "type": "mc", "q": "Can **9** be stored in Microfloat V2 (1 exponent bit, 3 significand bits, no bias)?", "options": ["No: not enough range", "No: not enough precision", "Yes, as `1001`", "Yes, as `0001`"], "answer": 0, "why": "9 = `1001` = `1.001` × 2^{3}. The significand `001` fits in 3 bits. The exponent 3 = `11` needs 2 bits and V2 has 1 → **not enough range**. `1001` is not \"9 in binary\" here: in V2 it decodes to `1.001` × 2^{1} = 2.25."}]}, {"id": "bias", "title": "Negative exponents: the bias", "read": "V1 to V3 cannot store anything between 0 and 1. Their exponent field is unsigned, so the smallest exponent is 0 and the smallest value is `1.0` × 2^{0} = 1. To write 0.75 you need a **negative** exponent.\n\nThe fix: keep the field unsigned, but agree that it holds **exponent + bias**, where the bias is a fixed number chosen by the format.\n\n> **Rule:** stored exponent = true exponent + bias. True exponent = stored exponent − bias. Add when you encode, subtract when you decode.\n\n**Microfloat V4** = 2 exponent bits, 2 significand bits, **bias 2**:\n\n| Stored bits | `00` | `01` | `10` | `11` |\n|---|---|---|---|---|\n| True exponent (stored − 2) | −2 | −1 | 0 | 1 |\n\nValue = `1.<significand>` × 2^{stored − 2}. V4 runs from `0000` = 0.25 up to `1111` = 3.5.\n\n**Worked example: encode 1.25 in V4.** `1.01` × 2^{0}. Stored exponent 0 + 2 = 2 = `10`. Significand `01`. → **`1001`**.\n\n**Worked example: decode `0011` in V4.** Stored `00` = 0, true exponent 0 − 2 = −2. `1.11` × 2^{−2} = `0.0111` = 1/4 + 1/8 + 1/16 = **0.4375**.\n\nA value still fails with **not enough range** when the stored exponent would need too many bits (5 = `1.01` × 2^{2} → 2 + 2 = 4) or would be negative (0.1875 = `1.1` × 2^{−3} → −3 + 2 = −1).\n\n### The general bias formula\n\n> **Rule:** bias = 2^{k−1} − 1, where k is the number of **exponent** bits.\n\n| k (exponent bits) | 3 | 4 | 5 | 8 | 11 |\n|---|---|---|---|---|---|\n| bias | 3 | 7 | 15 | 127 | 1023 |\n\nThat puts roughly half of the stored values below exponent 0 and half above. V4's bias of 2 is a hand-picked teaching value (the formula gives 1 for 2 bits, and the homework uses 1 for a 2-bit exponent). **If a question states the bias, use the stated bias.**\n\n**Why a bias instead of two's complement?** With a bias, a bigger exponent always has a bigger unsigned bit pattern, so hardware can compare two floats the same way it compares unsigned integers. A two's-complement negative exponent starts with 1s and would look *bigger* than a positive one, which breaks the ordering.", "questions": [{"id": "v4-enc", "type": "short", "mode": "bits", "q": "Encode **0.625** in Microfloat V4 (2 exponent bits with bias 2, then 2 significand bits).", "accept": ["0101"], "why": "0.625 = `0.101` = `1.01` × 2^{−1}. Stored exponent −1 + 2 = 1 = `01`. Significand `01`. → **`0101`**. The field holds exponent + bias (1), not the exponent itself: −1 cannot be written in an unsigned field. `1001` (stored exponent 2) would be 1.25.", "placeholder": "4 bits"}, {"id": "v4-dec", "type": "short", "mode": "num", "q": "Decode `1010` in Microfloat V4 (2 exponent bits with bias 2, then 2 significand bits).", "accept": ["1.5", "3/2"], "why": "Stored exponent `10` = 2, true exponent 2 − 2 = 0. `1.10` × 2^{0} = **1.5**. Forgetting to subtract the bias gives `1.1` × 2^{2} = 6, which is the V1 answer."}, {"id": "bias-map", "type": "blanks", "q": "A format has **4 exponent bits** and uses the standard bias formula.", "blanks": [{"label": "bias", "mode": "num", "accept": ["7"]}, {"label": "true exponent when the field holds `1010`", "mode": "num", "accept": ["3"]}, {"label": "field bits for a true exponent of −5", "mode": "bits", "accept": ["0010"]}], "why": "Bias = 2^{3} − 1 = **7** (15 is 2^{4} − 1: the formula uses k − 1). `1010` = 10, 10 − 7 = **3**. −5 + 7 = 2 = **`0010`**, padded on the left to 4 bits."}, {"id": "bias-why", "type": "mc", "q": "Why is the exponent stored with a bias rather than in two's complement?", "options": ["A bigger exponent then always has a bigger unsigned bit pattern, so floats can be compared like unsigned integers.", "A biased field can hold more different exponents than a two's-complement field of the same width.", "Two's complement has no way to represent an exponent of zero.", "The bias is what makes room for the implicit leading 1 in the fraction."], "answer": 0, "why": "Lecture's reason: it **simplifies comparison**. With a bias, larger exponents have larger unsigned patterns. In two's complement, negative exponents start with 1s and would compare as larger. Both schemes hold the same number of exponents (2^{k}), so the \"more exponents\" option is false."}]}, {"id": "decode", "title": "Decode: Minifloat, then any format", "read": "**Minifloat** is the class's 8-bit format. It adds a sign bit and uses the standard bias:\n\n```\n bit:     7   | 6  5  4 | 3  2  1  0\n        sign  | exponent| fraction\n        1 bit |  3 bits |  4 bits          bias = 2^(3-1) - 1 = 3\n```\n\nSign bit: 0 = positive, 1 = negative. For a **normalized** number:\n\n> **Rule:** value = (−1)^{S} × `1.<fraction bits>` × 2^{(exponent field) − bias}\n\n### Decode recipe\n\n1. **Split** the bits into fields, using the widths the question gives. Do this first.\n2. **Sign:** 0 → +, 1 → −.\n3. **Exponent:** read the field as an unsigned number, then subtract the bias.\n4. **Significand:** write `1.` in front of the fraction bits.\n5. **Move the point** by the exponent (positive → right, negative → left) and add up the places.\n\n**Worked example: Minifloat `1 100 0110`.**\nSign 1 → negative. Exponent `100` = 4, and 4 − 3 = 1. Significand `1.0110`. `1.0110` × 2^{1} = `10.110` = 2 + 1/2 + 1/4 = 2.75. Answer **−2.75**.\n\n**Worked example in another format: 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits. Decode `0 1001 101`.**\nSign 0 → positive. Exponent `1001` = 9, and 9 − 7 = 2. `1.101` × 2^{2} = `110.1` = **+6.5**.\n\nNothing about the recipe changed; only the widths and the bias did. On the quiz the format is stated in the question (\"1 sign, 3 exponent, 4 fraction\"), so read it before you split.\n\n> **Trap:** patterns are often printed without field gaps, like `0b1100_0110`. That underscore is only a nibble separator. Re-split by the field widths (1, 3, 4), not at the underscore.\n\n> **On paper:** write the sign even for positives: `+6.5`, `-2.75`. Fractions are accepted (`-3/8`).\n\nThis recipe is for exponent fields that are **not all 0s and not all 1s**. Those two fields are reserved for special values, which is the next section.", "questions": [{"id": "mini-dec-1", "type": "blanks", "q": "Decode the Minifloat `0 110 0101` (1 sign bit, 3 exponent bits with bias 3, 4 fraction bits).", "blanks": [{"label": "stored exponent (decimal)", "mode": "num", "accept": ["6"]}, {"label": "true exponent", "mode": "num", "accept": ["3"]}, {"label": "value", "mode": "num", "accept": ["10.5", "21/2"]}], "why": "Sign `0` → positive. Exponent `110` = 6, 6 − 3 = 3. `1.0101` × 2^{3} = `1010.1` = **10.5**. Leaving out the implicit 1 gives `0.0101` × 2^{3} = 2.5."}, {"id": "mini-dec-2", "type": "blanks", "q": "Decode the Minifloat `0b1010_1100`.", "blanks": [{"label": "exponent field bits", "mode": "bits", "accept": ["010"]}, {"label": "true exponent", "mode": "num", "accept": ["-1"]}, {"label": "value (with its sign)", "mode": "num", "accept": ["-0.875", "-7/8"]}], "why": "Re-split 1 | 3 | 4: `1 010 1100`. Sign `1` → negative. Exponent `010` = 2, 2 − 3 = −1. `1.1100` × 2^{−1} = `0.111` = **−0.875**. Splitting at the underscore (exponent `1010`?) is the trap; the exponent is always the 3 bits after the sign."}, {"id": "fmt-dec-1", "type": "short", "mode": "num", "q": "Format: 1 sign bit, 4 exponent bits (bias 7), 5 fraction bits. Decode `0 0101 10100`.", "accept": ["0.40625", "13/32"], "why": "Sign `0` → positive. Exponent `0101` = 5, 5 − 7 = −2. `1.10100` × 2^{−2} = `0.01101` = **0.40625**. (13/32.) Using Minifloat's bias of 3 out of habit gives 5 − 3 = 2 and 6.5.", "placeholder": "decimal or fraction"}, {"id": "fmt-dec-2", "type": "short", "mode": "num", "q": "Format: 1 sign bit, 2 exponent bits (bias 1), 5 fraction bits. Decode `1 10 00110`. Include the sign.", "accept": ["-2.375", "-19/8"], "why": "Sign `1` → negative. Exponent `10` = 2, 2 − 1 = 1. `1.00110` × 2^{1} = `10.011` = **−2.375**. The bias here is 1 (it is stated), so the exponent is 2 − 1 = 1, not 2.", "placeholder": "signed value"}]}, {"id": "encode", "title": "Encode: Minifloat, then any format", "read": "Encoding is the decode recipe run backwards.\n\n### Encode recipe\n\n1. **Sign bit:** 0 if positive, 1 if negative. Then work with the size of the number.\n2. **Binary:** write it in binary place-value form.\n3. **Normalize:** `1.xxx` × 2^{e}.\n4. **Exponent field:** e + bias, as an unsigned number, padded with zeros on the **left** to the field width.\n5. **Fraction field:** the bits after the point, padded with zeros on the **right** to the field width.\n6. **Check that it fits** (table below), then write sign, exponent, fraction in that order.\n\n**Worked example: −6.5 in Minifloat** (1 sign bit, 3 exponent bits with bias 3, 4 fraction bits).\nNegative → sign `1`. 6.5 = `110.1` = `1.101` × 2^{2}. Exponent field: 2 + 3 = 5 = `101`. Fraction: `101` → pad right → `1010`. Answer **`1 101 1010`** (homework style: `0b1101_1010`).\n\n**Worked example: 0.4375 in the format 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits.**\nSign `0`. 0.4375 = 7/16 = `0.0111` = `1.11` × 2^{−2}. Exponent field: −2 + 7 = 5 = `0101` (padded left to 4 bits). Fraction: `11` → `110`. Answer **`0 0101 110`**.\n\n### Does it fit?\n\n| What goes wrong | Example in Minifloat | Call it |\n|---|---|---|\n| The fraction needs more bits than the field has | 10.25 = `1.01001` × 2^{3} needs 5 fraction bits | not enough precision |\n| e + bias is too big for the field | −40 = −`1.01` × 2^{5}, and 5 + 3 = 8 = `1000` needs 4 bits | not enough range |\n\nIn formats with special values (Minifloat and everything after it), a normalized exponent field also may not be all 0s or all 1s. What the machine actually stores when a value does not fit (a rounded value, infinity, a denormalized number) is the next section. For now, be able to say which of the two limits was hit.\n\n> **Rule:** check by decoding your own answer. `1 101 1010` → −`1.1010` × 2^{5−3} = −`110.1` = −6.5. It takes thirty seconds and catches a wrong pad or a forgotten bias.", "questions": [{"id": "mini-enc-1", "type": "short", "mode": "bits", "q": "Encode **+9.5** in Minifloat (1 sign bit, 3 exponent bits with bias 3, 4 fraction bits).", "accept": ["01100011"], "why": "9.5 = `1001.1` = `1.0011` × 2^{3}. Exponent field 3 + 3 = 6 = `110`. Fraction `0011`. Sign bit `0`. → **`0 110 0011`**. Forgetting the bias leaves the exponent field at `011`, which decodes to 1.1875.", "placeholder": "8 bits"}, {"id": "mini-enc-2", "type": "short", "mode": "bits", "q": "Encode **−0.6875** (−11/16) in Minifloat.", "accept": ["10100110"], "why": "0.6875 = `0.1011` = `1.011` × 2^{−1}. Exponent field −1 + 3 = 2 = `010`. Fraction `011` → `0110`. Sign bit `1`. → **`1 010 0110`**. Writing the fraction as `1011` keeps the leading 1 that should be implicit; the fraction is only the bits after the point (`011`), padded on the right.", "placeholder": "8 bits"}, {"id": "fmt-enc", "type": "blanks", "q": "Format: 1 sign bit, 4 exponent bits, 5 fraction bits, standard bias. Encode **+20.5**.", "blanks": [{"label": "bias", "mode": "num", "accept": ["7"]}, {"label": "exponent field", "mode": "bits", "accept": ["1011"]}, {"label": "fraction field", "mode": "bits", "accept": ["01001"]}], "why": "Bias = 2^{3} − 1 = 7. 20.5 = `10100.1` = `1.01001` × 2^{4}. Exponent field 4 + 7 = 11 = `1011`. Fraction `01001`. Sign bit `0`. → **`0 1011 01001`**. Using 4 as the exponent field (`0100`) forgets the bias."}, {"id": "mini-fit", "type": "mc", "q": "What stops Minifloat from storing **13.75** exactly?", "options": ["Not enough precision: the fraction would need 5 bits.", "Not enough range: the exponent field would need 4 bits.", "Nothing: it is `0 110 1011`.", "Nothing: it is `0 110 1110`."], "answer": 0, "why": "13.75 = `1101.11` = `1.10111` × 2^{3}. Exponent field 3 + 3 = 6 = `110` fits. The fraction `10111` is 5 bits and the field has 4 → **not enough precision**. `0 110 1011` is 13.5 (last bit chopped) and `0 110 1110` is 15."}]}], "checkpoint": [{"id": "cp-bf", "type": "short", "mode": "num", "q": "What is `11.0011` (binary) in decimal?", "accept": ["3.1875", "51/16"], "why": "3 + 1/8 + 1/16 = 3 + 0.125 + 0.0625 = **3.1875**. The first two places after the point (1/2 and 1/4) are 0; reading the fraction as 3/4 gives 3.75.", "placeholder": "decimal or fraction"}, {"id": "cp-v4", "type": "blanks", "q": "Microfloat V4: 2 exponent bits with **bias 2**, then 2 significand bits (no sign bit, no reserved patterns).", "blanks": [{"label": "encode 0.375", "mode": "bits", "accept": ["0010"]}, {"label": "decode `1100`", "mode": "num", "accept": ["2"]}, {"label": "stored exponent that 6 would need (decimal)", "mode": "num", "accept": ["4"]}], "why": "0.375 = `0.011` = `1.1` × 2^{−2}: stored exponent −2 + 2 = 0 = `00`, significand `1` → `10`, so **`0010`**. `1100`: stored 3, true exponent 1, `1.00` × 2^{1} = **2**. 6 = `1.1` × 2^{2} needs 2 + 2 = **4**, which does not fit in 2 bits: not enough range. (In V4 the field `00` is an ordinary exponent; reserved patterns only start with Minifloat.)"}, {"id": "cp-pad", "type": "mc", "q": "A student encodes **1.5** in Microfloat V4 (2 exponent bits with bias 2, then 2 significand bits) and writes `1001`. The correct answer is `1010`. What went wrong?", "options": ["They padded the significand with a zero on the left instead of on the right.", "They forgot to add the bias to the exponent.", "They stored the leading 1 in the significand field.", "They used a bias of 3 instead of 2."], "answer": 0, "why": "1.5 = `1.1` × 2^{0}: exponent field 0 + 2 = `10`, significand `1` → pad on the **right** → `10`. Padding on the left gives `01`, and `1001` decodes to 1.25. Forgetting the bias would give `0010`; storing the leading 1 would give `1011`; a bias of 3 would give `1110`."}, {"id": "cp-hex", "type": "blanks", "q": "One byte holds the Minifloat `0xD9`. Decode it.", "blanks": [{"label": "the 8 bits", "mode": "bits", "accept": ["11011001"]}, {"label": "true exponent", "mode": "num", "accept": ["2"]}, {"label": "value (with its sign)", "mode": "num", "accept": ["-6.25", "-25/4"]}], "why": "`0xD9` = `1101 1001`. Re-split 1 | 3 | 4: `1 101 1001`. Sign `1` → negative. Exponent `101` = 5, 5 − 3 = 2. `1.1001` × 2^{2} = `110.01` = **−6.25**. Reading the high nibble `1101` as the exponent is the trap: hex digits and fields do not line up.", "hint": "Write out the 8 bits first, then regroup them 1 | 3 | 4."}, {"id": "cp-mini-enc", "type": "short", "mode": "bits", "q": "Encode **−1.375** in Minifloat (1 sign bit, 3 exponent bits with bias 3, 4 fraction bits).", "accept": ["10110110"], "why": "1.375 = `1.011` × 2^{0}. Exponent field 0 + 3 = 3 = `011`. Fraction `011` → `0110`. Sign bit `1`. → **`1 011 0110`**. A true exponent of 0 does not mean an exponent field of `000`: the field holds exponent + bias = 3.", "placeholder": "8 bits"}, {"id": "cp-multi", "type": "blanks", "q": "A 12-bit format has 1 sign bit, 5 exponent bits and 6 fraction bits, with the standard bias.\n\n(a) What is the bias?\n\n(b) Encode **−44.5**.\n\n(c) Decode `0 01101 100000`.", "blanks": [{"label": "(a) bias", "mode": "num", "accept": ["15"]}, {"label": "(b) exponent field for −44.5", "mode": "bits", "accept": ["10100"]}, {"label": "(b) fraction field for −44.5", "mode": "bits", "accept": ["011001"]}, {"label": "(c) value of `0 01101 100000`", "mode": "num", "accept": ["0.375", "3/8"]}], "why": "(a) 2^{4} − 1 = **15**. (b) 44.5 = `101100.1` = `1.011001` × 2^{5}. Exponent field 5 + 15 = 20 = `10100`. Fraction `011001`. Sign bit `1`. → **`1 10100 011001`**. (c) Sign `0` → positive. Exponent `01101` = 13, 13 − 15 = −2. `1.100000` × 2^{−2} = `0.011` = **0.375**. The usual slip in (b) is stopping at exponent 5 = `00101` without adding the bias.", "hint": "44 = 32 + 8 + 4. For (c), check the exponent field against the bias before anything else."}, {"id": "cp-limit", "type": "mc", "q": "Format: 1 sign bit, 3 exponent bits (bias 3), 5 fraction bits. Why can't **72** be stored exactly?", "options": ["Not enough range: the exponent field would have to hold 9.", "Not enough precision: the fraction would need 6 bits.", "Not enough range: the exponent field would have to hold 3.", "Not enough precision: 72 is not a power of two."], "answer": 0, "why": "72 = `1001000` = `1.001` × 2^{6}. The fraction `001` fits easily in 5 bits. The exponent field would be 6 + 3 = **9**, and 3 bits hold at most 7 → not enough range. (6 − 3 = 3 subtracts the bias; when encoding you add it.)"}, {"id": "cp-largest", "type": "short", "mode": "num", "q": "A Microfloat-style format has 3 exponent bits (no bias) followed by 2 significand bits. No sign bit, no reserved patterns. What is the **largest** value it can store?", "accept": ["224"], "why": "Largest = every bit 1: exponent `111` = 7, significand `11`. `1.11` × 2^{7} = 1.75 × 128 = **224**. Answering 192 uses `1.1` (the 1-significand-bit V3 answer)."}, {"id": "cp-fmt-dec", "type": "short", "mode": "num", "q": "Format: 1 sign bit, 5 exponent bits (bias 15), 2 fraction bits. Decode `1 10010 11`. Include the sign.", "accept": ["-14"], "why": "Sign `1` → negative. Exponent `10010` = 18, 18 − 15 = 3. `1.11` × 2^{3} = `1110` = **−14**. Leaving out the implicit 1 gives −`0.11` × 2^{3} = −6.", "placeholder": "signed value"}, {"id": "cp-one", "type": "short", "mode": "num", "q": "Decode the Minifloat `0 011 0000`.", "accept": ["1"], "why": "Exponent `011` = 3, and 3 − 3 = 0. Fraction `0000`, so the significand is `1.0000`. `1.0000` × 2^{0} = **+1**. A zero fraction does not make the value zero: the implicit 1 is still there."}, {"id": "cp-show-steps", "type": "self", "lines": 9, "q": "On paper, showing every step: encode **−12.75** in the format 1 sign bit, 4 exponent bits (bias 7), 5 fraction bits.", "model": "```\nsign:        negative            -> 1\nbinary:      12.75 = 1100.11\nnormalize:   1.10011 x 2^3\nexponent:    3 + 7 = 10          -> 1010\nfraction:    10011 (already 5 bits)\nanswer:      1 1010 10011\ncheck:       -1.10011 x 2^(10-7) = -1100.11 = -12.75\n```", "rubric": ["sign bit is 1", "12.75 written as `1100.11`", "normalized to `1.10011` × 2^{3}", "exponent field = 3 + 7 = 10 = `1010`", "fraction field `10011` (leading 1 not stored)", "final pattern `1 1010 10011`"], "why": "Each line of the recipe earns its own mark on paper, so write them all. The two classic slips: an exponent field of `0011` (bias not added) and a fraction of `11001` (keeping the leading 1 and losing the last bit)."}, {"id": "cp-describe", "type": "self", "lines": 7, "q": "Without notes: describe how a normalized floating-point value is stored using a sign, an exponent and a fraction, and how you get the value back from the three fields. (3 to 5 sentences.)", "model": "The number is written in normalized binary form, `1.f` × 2^{e}. The **sign** bit is 0 for positive and 1 for negative. The **exponent** field stores e + bias as an unsigned number, where bias = 2^{k−1} − 1 for a k-bit field. The **fraction** field stores only the bits after the binary point; the leading 1 is implicit and not stored. To decode: value = (−1)^{S} × `1.fraction` × 2^{field − bias}.", "rubric": ["sign bit: 0 positive, 1 negative", "number is put in normalized form `1.f` × 2^{e}", "exponent field holds e + bias (unsigned)", "bias = 2^{k−1} − 1", "fraction holds the bits after the point; leading 1 is implicit", "value = (−1)^{S} × `1.f` × 2^{field − bias}"], "why": "This is the first bullet of the floating-point objective almost word for word (\"describe how floating-point values are encoded using a sign, exponent, and fraction\"), so have a three-sentence version ready."}]}, {"id": "fp-special", "title": "Floating point 2: zero, infinity, NaN, denormals, rounding", "blurb": "Classify any bit pattern from its exponent field, decode and encode denormalized values in any format, find a format's smallest and largest values, round ties-to-even, and answer \"can it be encoded?\" the way the homework asks it.", "objective": "Objective 3: Floating point", "sources": "CL14 · CL15 · RD12 · RD13 · HW5", "minutes": 85, "cheats": ["Exponent field first. All 0s → zero (fraction 0) or denormalized (fraction ≠ 0). All 1s → ±∞ (fraction 0) or NaN (fraction ≠ 0). Anything else → normalized.", "Denormalized value = (−1)^{S} × `0.f` × 2^{1 − bias}. The exponent is 1 − bias, never 0 − bias. Minifloat: −2.", "To encode: normalize, compute e + bias. 1 or more → normalized. 0 or less → denormalized: rewrite as `0.xxxx` × 2^{1 − bias}.", "Landmarks: smallest denormal `0 0…0 0…01`; largest denormal `0 0…0 1…1`; smallest normalized `0 0…01 0…0` = 2^{1 − bias}; largest normalized `0 1…10 1…1`.", "The step between neighbours doubles each time the exponent goes up by one. Denormals share the step of the smallest normalized numbers.", "Rounding: keep the top f fraction bits (down) or add 1 to them (up); store the closer. Exact tie → the candidate whose last fraction bit is 0.", "Too big → overflow → ±∞. Not zero but too close to zero → underflow → rounds to 0.", "On paper: a classification (normalized / denormalized / not enough precision / not enough range) AND a signed value: `+0.25`, `-10`, `+Inf`, `-Inf`, `NaN`."], "chunks": [{"id": "exp-first", "title": "Read the exponent field first", "read": "Section 1's decode formula only works for *normalized* numbers. Before you use any formula, look at the **exponent field** and sort the pattern into one of three cases:\n\n| Exponent field | Fraction field | The pattern is |\n|---|---|---|\n| all 0s | all 0s | **zero** |\n| all 0s | not zero | a **denormalized** number (next part) |\n| all 1s | all 0s | **infinity** (the sign bit picks +∞ or −∞) |\n| all 1s | not zero | **NaN** |\n| anything else | anything | a **normalized** number: `1.f` × 2^{E − bias} |\n\n(The slide's version of this table calls a normalized exponent \"nonzero\". Read that as \"not all 0s **and** not all 1s\".)\n\nIn Minifloat (1 sign, 3 exponent, 4 fraction):\n\n- `0 000 0000` is +0, and `1 000 0000` is −0\n- `0 111 0000` is +∞, and `1 111 0000` is −∞\n- exponent `111` with any other fraction (`0 111 0001` … `1 111 1111`) is NaN\n\n**NaN** means \"Not a Number\": the result of an undefined operation such as 0/0, ∞/∞, √−1 or log(−5). NaN **propagates**: if x is NaN then x + 5 is NaN, so one bad operation shows up in the final result instead of quietly disappearing. There are many NaN patterns so that programs can tell different error sources apart.\n\n**Worked examples** (Minifloat):\n\n- `1 111 0110` → exponent all 1s, fraction not zero → **NaN**. (Just write NaN; the sign bit does not matter.)\n- `1 111 0000` → exponent all 1s, fraction zero → **−∞**.\n- `0 011 0000` → exponent `011` is neither → normalized: `1.0000` × 2^{3−3} = **+1**.\n- `1 000 0101` → exponent all 0s, fraction not zero → **denormalized** (a small negative number).\n\nReserving these patterns uses up two exponent fields, so Minifloat's normalized fields are `001` to `110`: true exponents −2 to 3.\n\n> **Trap:** `0 111 1000` is not `1.1` × 2^{4} = 24. Once the exponent field is all 1s, the normalized formula is off the table.", "questions": [{"id": "cls-nan", "type": "mc", "q": "What does the Minifloat pattern `0 111 1000` represent?", "options": ["NaN", "+∞", "+24", "a denormalized number"], "answer": 0, "why": "Exponent field `111` is all 1s, so it is special. The fraction `1000` is not zero → **NaN**. +∞ needs a fraction of `0000`. +24 comes from using the normalized formula (`1.1` × 2^{4}), which does not apply. Denormalized needs exponent `000`."}, {"id": "cls-values", "type": "blanks", "q": "Format: 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits. Give the value of each pattern. Type `inf`, `-inf` or `nan` for special values.", "blanks": [{"label": "`1 1111 000`", "mode": "num", "accept": ["-inf"]}, {"label": "`0 1111 010`", "mode": "num", "accept": ["nan"]}, {"label": "`1 0000 000`", "mode": "num", "accept": ["0"]}, {"label": "`0 0111 000`", "mode": "num", "accept": ["1"]}], "why": "Exponent field first. `1111` (all 1s) with fraction `000` → infinity, sign 1 → **−∞**. `1111` with fraction `010` → **NaN**. `0000` with fraction `000` → **0** (negative zero; 0 is the value). `0111` is neither → normalized: 7 − 7 = 0, `1.000` × 2^{0} = **1**. Calling the last one 0 because its fraction is zero forgets the implicit 1."}, {"id": "nan-ops", "type": "mc", "q": "Which of these evaluate to **NaN**? Select all that apply.", "options": ["`0 / 0`", "`√(−1)`", "`x + 5`, where `x` is already NaN", "`−3 × 2`", "`0 × 5`"], "answer": [0, 1, 2], "why": "0/0 and √−1 are undefined operations, so they give NaN (lecture's list: 0/0, ∞/∞, √−1, log(−5)). NaN **propagates**, so NaN + 5 is NaN too. −3 × 2 = −6 and 0 × 5 = 0 are ordinary numbers: a zero operand does not make a NaN."}, {"id": "bits-neg-inf", "type": "short", "mode": "bits", "q": "Write the bit pattern of **−∞** in the format 1 sign bit, 2 exponent bits, 5 fraction bits.", "accept": ["11100000"], "why": "Sign `1`, exponent all 1s (`11`), fraction all 0s (`00000`): **`1 11 00000`**. A nonzero fraction would make it NaN; exponent `00` would make it −0.", "placeholder": "8 bits"}]}, {"id": "gap", "title": "The hole next to zero, and denormalized numbers", "read": "What is the smallest positive **normalized** Minifloat? Take the smallest allowed exponent field (`001`, because `000` is reserved) and fraction `0000`:\n\n`0 001 0000` = `1.0000` × 2^{1−3} = 2^{−2} = **0.25**\n\nThe next one up is `0 001 0001` = `1.0001` × 2^{−2} = **0.265625**, only 1/64 further on. So the normalized numbers start like this:\n\n```\n 0 ................ 0.25   0.265625   0.28125   0.296875 ...\n    nothing at all   ^ steps of 1/64 from here on\n```\n\nThe gap from 0 to 0.25 is 16 times wider than the steps after it. The cause is the **implicit leading 1**: no normalized number can be smaller than `1.0000` × 2^{−2}. Without a fix, any result below 0.25 could only be stored as 0 or as 0.25.\n\n**The fix: denormalized numbers** (also called *subnormal*). When the exponent field is **all 0s** and the fraction is not zero:\n\n- the leading bit is an implicit **0** instead of 1\n- the exponent is fixed at **1 − bias**\n\n> **Rule:** denormalized value = (−1)^{S} × `0.<fraction bits>` × 2^{1 − bias}\n\nFor Minifloat 1 − 3 = −2, so every denormal is `0.xxxx` × 2^{−2}.\n\n**Worked examples** (Minifloat):\n\n- `0 000 0001` = `0.0001` × 2^{−2} = `0.000001` = 2^{−6} = **1/64**, the smallest positive denormal\n- `0 000 1000` = `0.1000` × 2^{−2} = `0.001` = **1/8**\n- `0 000 1111` = `0.1111` × 2^{−2} = `0.001111` = **15/64**, the largest denormal\n\n> **Rule:** shortcut for Minifloat only: read the fraction bits as a whole number F; the value is F/64. `1111` = 15 → 15/64.\n\n> **Trap:** the exponent is **not** 0 − bias = −3. The \"field minus bias\" formula is for normalized numbers. Lecture: \"the formula doesn't apply for denormalized numbers.\"\n\nNow there is no hole: 0, 1/64, 2/64, …, 15/64 (denormals), then 16/64 = 0.25, 17/64, … (normalized).", "questions": [{"id": "dn-exp", "type": "mc", "q": "Which power of two multiplies the fraction in the Minifloat pattern `0 000 1010`?", "options": ["2^{−2}", "2^{−3}", "2^{0}", "2^{−4}"], "answer": 0, "why": "Exponent field `000` with a nonzero fraction → denormalized. The exponent is fixed at 1 − bias = 1 − 3 = **−2**, so the value is `0.1010` × 2^{−2} = 10/64. 2^{−3} is the tempting one: it applies field − bias (0 − 3), which is only for normalized numbers."}, {"id": "dn-dec-1", "type": "blanks", "q": "Decode the Minifloat `0 000 0101`.", "blanks": [{"label": "implicit leading bit (0 or 1)", "mode": "num", "accept": ["0"]}, {"label": "exponent used", "mode": "num", "accept": ["-2"]}, {"label": "value", "mode": "num", "accept": ["0.078125", "5/64"]}], "why": "Sign `0` → positive. Exponent field all 0s and fraction not zero → denormalized. Exponent = 1 − 3 = −2. `0.0101` × 2^{−2} = `0.000101` = **0.078125**. (5/64.) Treating it as normalized gives `1.0101` × 2^{−3} = 21/128, which is wrong on both counts: the leading bit and the exponent."}, {"id": "dn-dec-2", "type": "short", "mode": "num", "q": "Decode the Minifloat `1 000 1100`. Include the sign.", "accept": ["-0.1875", "-3/16"], "why": "Sign `1` → negative. Exponent field all 0s and fraction not zero → denormalized. Exponent = 1 − 3 = −2. `0.1100` × 2^{−2} = `0.0011` = **−0.1875**. (−12/64 = −3/16.) The normalized formula would give −`1.1100` × 2^{−3} = −0.21875.", "placeholder": "signed value"}, {"id": "dn-why", "type": "mc", "q": "Without denormalized numbers, why is the gap between 0 and the smallest positive value so much wider than the gaps that follow it?", "options": ["Every normalized number has an implicit leading 1, so none can be smaller than `1.000…` times the smallest power of two.", "The exponent field is unsigned, so the format has no negative exponents.", "The all-ones exponent field is reserved for infinity and NaN.", "Round-to-nearest pushes every small value up to the next power of two."], "answer": 0, "why": "Lecture's one-line answer: **the implicit leading 1**. The smallest normalized value is `1.0000` × 2^{−2} = 0.25 in Minifloat, and nothing of the form `1.xxxx` can get closer to 0. Negative exponents do exist (that is what the bias is for), and the all-ones field matters at the top of the range, not at zero."}]}, {"id": "denorm-any", "title": "Denormals in any format: recompute 1 − bias", "read": "−2 is not a magic number. It is 1 − bias for Minifloat's bias of 3. For another format, redo three small steps before you touch the bits:\n\n1. **Bias** = 2^{k−1} − 1 (or whatever the question states).\n2. **Denormal exponent** = 1 − bias.\n3. **Value** = `0.<fraction bits>` × 2^{1 − bias}.\n\n| Format (sign, exponent, fraction bits) | Bias | Denormal exponent | A denormal looks like |\n|---|---|---|---|\n| 1, 2, 4 | 1 | 1 − 1 = 0 | `0.xxxx` × 2^{0} |\n| 1, 3, 4 (Minifloat) | 3 | 1 − 3 = −2 | `0.xxxx` × 2^{−2} |\n| 1, 4, 3 | 7 | 1 − 7 = −6 | `0.xxx` × 2^{−6} |\n| 1, 5, 10 (half precision) | 15 | 1 − 15 = −14 | `0.xxxxxxxxxx` × 2^{−14} |\n| 1, 8, 23 (C `float`) | 127 | 1 − 127 = −126 | `0.xxx…` × 2^{−126} |\n\nLook at the first row: with a bias of 1 the denormal exponent is **0**, so a denormal there is just `0.xxxx`, a plain binary fraction below 1.\n\n**Worked example. Format: 1 sign bit, 2 exponent bits (bias 1), 4 fraction bits. Decode `1 00 1011`.**\nExponent field `00`, fraction not zero → denormalized. Exponent = 1 − 1 = 0. Value = −`0.1011` × 2^{0} = −(1/2 + 1/8 + 1/16) = **−0.6875**.\n\n**Worked example. Format: 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits. Decode `0 0000 101`.**\nDenormalized. Exponent = 1 − 7 = −6. Value = `0.101` × 2^{−6} = 5/8 × 1/64 = **5/512**.\n\nLeaving an answer as 5/512, or as 5 × 2^{−9}, is fine.\n\n> **Lecture:** why 1 − bias? The smallest normalized exponent field is `0…01`, which gives exponent 1 − bias. Denormals reuse that same exponent and change only the leading bit from 1 to 0, so the largest denormal and the smallest normalized number end up **adjacent** with the usual spacing: 15/64 then 16/64 in Minifloat. With 0 − bias the denormals would stop at 15/128 and leave a hole before 32/128.", "questions": [{"id": "dn-fmt-1", "type": "blanks", "q": "Format: 1 sign bit, 2 exponent bits (bias 1), 3 fraction bits. Decode `1 00 110`.", "blanks": [{"label": "denormal exponent", "mode": "num", "accept": ["0"]}, {"label": "value (with its sign)", "mode": "num", "accept": ["-0.75", "-3/4"]}], "why": "Sign `1` → negative. Exponent field all 0s and fraction not zero → denormalized. Exponent = 1 − 1 = 0. `0.110` × 2^{0} = `0.11` = **−0.75**. Using Minifloat's −2 out of habit gives −0.1875; the exponent has to be recomputed from this format's bias."}, {"id": "dn-fmt-2", "type": "blanks", "q": "Format: 1 sign bit, 4 exponent bits (standard bias), 4 fraction bits. Decode `0 0000 0110`. A fraction is fine for the value.", "blanks": [{"label": "bias", "mode": "num", "accept": ["7"]}, {"label": "denormal exponent", "mode": "num", "accept": ["-6"]}, {"label": "value", "mode": "num", "accept": ["3/512", "0.005859375"]}], "why": "Bias = 2^{3} − 1 = 7. Sign `0` → positive. Exponent field all 0s and fraction not zero → denormalized. Exponent = 1 − 7 = −6. `0.0110` × 2^{−6} = `0.000000011` = **0.005859375**. That is 6/16 × 1/64 = 6/1024 = 3/512. Using 0 − 7 = −7 halves it to 3/1024."}, {"id": "dn-fmt-3", "type": "short", "mode": "num", "q": "Format: 1 sign bit, 5 exponent bits (bias 15), 2 fraction bits. What is the value of `0 00000 01`? (A power of two such as `2^-9` is fine.)", "accept": ["2^-16", "1/65536"], "why": "Exponent field all 0s, fraction `01` → denormalized. Exponent = 1 − 15 = −14. `0.01` × 2^{−14} = 2^{−2} × 2^{−14} = **2^{−16}**. Answering 2^{−14} forgets that `0.01` is itself 1/4; answering 2^{−17} uses 0 − bias.", "placeholder": "2^-…"}, {"id": "dn-fmt-bug", "type": "mc", "q": "Format: 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits. A student decodes `0 0000 100` as `0.100` × 2^{−7} = 1/256. What is the mistake?", "options": ["A denormal's exponent is 1 − bias = −6, so the value is 1/128.", "It should use an implicit 1: `1.100` × 2^{−7} = 3/256.", "An exponent field of all 0s always means the value is zero.", "Nothing is wrong: 1/256 is correct."], "answer": 0, "why": "The student used field − bias = 0 − 7 = −7. For a denormal the exponent is fixed at 1 − bias = −6: `0.100` × 2^{−6} = 1/2 × 1/64 = **1/128**. The implicit bit is 0 here, and an all-zero exponent means zero only when the fraction is zero as well."}]}, {"id": "encode-small", "title": "Encoding small numbers: normalized or denormalized?", "read": "Given a small value, how do you know which kind it is? Lecture's method: **try normalized first.**\n\n1. Write the value in binary and normalize it: `1.xxx` × 2^{e}.\n2. Work out the exponent field it would need: **e + bias**.\n3. **1 or more** → normalized. Encode as in Section 1.\n4. **0 or negative** → too small to be normalized, so it is denormalized. The exponent field is all 0s. Rewrite the value as `0.xxxx` × 2^{1 − bias} by sliding the point; the fraction field is the bits after that point, padded on the right.\n\n> **Trap:** e + bias = **0** means denormalized, not normalized. A field of all 0s *is* the denormal code, so a normalized number needs a field of at least 1.\n\n**Worked example: 5/32 in Minifloat** (bias 3, denormal exponent −2).\n5/32 = `0.00101` = `1.01` × 2^{−3}. Field needed: −3 + 3 = **0** → denormalized.\nRewrite with exponent −2: `1.01` × 2^{−3} = `0.101` × 2^{−2}. Fraction `101` → `1010`. Answer **`0 000 1010`**.\n\n**Worked example: 5/16 in Minifloat.**\n5/16 = `0.0101` = `1.01` × 2^{−2}. Field needed: −2 + 3 = **1** → normalized. Fraction `01` → `0100`. Answer **`0 001 0100`**.\n\nSame digits, one binary place apart, different kind.\n\n> **Rule:** shortcut for the rewrite: the `0.xxxx` part is the value divided by 2^{1 − bias}. In Minifloat that means the value × 4: 5/32 × 4 = 5/8 = `0.101` → fraction `1010`.\n\n**Worked example in another format: 1 sign bit, 2 exponent bits (bias 1), 4 fraction bits. Encode 0.8125.**\n0.8125 = 13/16 = `0.1101` = `1.101` × 2^{−1}. Field needed: −1 + 1 = 0 → denormalized. The denormal exponent is 1 − 1 = 0, so the value is already in the right shape: `0.1101` × 2^{0}. Answer **`0 00 1101`**.\n\nIn that format every value below 1 is denormalized, because its smallest normalized number is `1.0000` × 2^{0} = 1.", "questions": [{"id": "es-1", "type": "blanks", "q": "Encode **7/64** in Minifloat (bias 3).", "blanks": [{"label": "e + bias (the field a normalized encoding would need)", "mode": "num", "accept": ["-1"]}, {"label": "normalized or denormalized?", "mode": "text", "accept": ["denormalized", "denormal", "denorm", "subnormal", "yes, as a denormalized value", "yes, denormalized"], "acceptRe": ["^(yes,? ?)?(as an? )?(de-?norm(al(i[sz]ed)?)?|subnormal)( value| number)?$"]}, {"label": "bit pattern", "mode": "bits", "accept": ["00000111"]}], "why": "7/64 = `0.000111` = `1.11` × 2^{−4}. Field needed: −4 + 3 = −1, which is not ≥ 1 → denormalized. Rewrite with exponent 1 − 3 = −2: `0.0111` × 2^{−2}. Fraction `0111`, exponent field `000`. Sign bit `0`. → **`0 000 0111`**. Shortcut check: 7/64 × 4 = 7/16 = `0.0111`. Writing `0 000 1110` pads the wrong side: the zeros that come from sliding the point belong on the left of the fraction."}, {"id": "es-2", "type": "blanks", "q": "Encode **−7/16** in Minifloat (bias 3).", "blanks": [{"label": "e + bias", "mode": "num", "accept": ["1"]}, {"label": "normalized or denormalized?", "mode": "text", "accept": ["normalized", "normal", "norm", "yes, as a normalized value", "yes, normalized"], "acceptRe": ["^(yes,? ?)?(as an? )?norm(al(i[sz]ed)?)?( value| number)?$"]}, {"label": "bit pattern", "mode": "bits", "accept": ["10011100"]}], "why": "7/16 = `0.0111` = `1.11` × 2^{−2}. Exponent field −2 + 3 = 1 = `001`. Fraction `11` → `1100`. Sign bit `1`. → **`1 001 1100`**. A field of 1 is enough to be normalized. Assuming \"small means denormalized\" and writing `1 000 …` is the trap: −7/16 is bigger in size than 1/4, Minifloat's smallest normalized value."}, {"id": "es-3", "type": "blanks", "q": "Format: 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits. Encode **3/256**.", "blanks": [{"label": "e + bias", "mode": "num", "accept": ["0"]}, {"label": "normalized or denormalized?", "mode": "text", "accept": ["denormalized", "denormal", "denorm", "subnormal", "yes, as a denormalized value", "yes, denormalized"], "acceptRe": ["^(yes,? ?)?(as an? )?(de-?norm(al(i[sz]ed)?)?|subnormal)( value| number)?$"]}, {"label": "bit pattern", "mode": "bits", "accept": ["00000110"]}], "why": "3/256 = `0.00000011` = `1.1` × 2^{−7}. Field needed: −7 + 7 = 0, which is not ≥ 1 → denormalized. Rewrite with exponent 1 − 7 = −6: `0.11` × 2^{−6}. Fraction `110`, exponent field `0000`. Sign bit `0`. → **`0 0000 110`**. The field comes out as exactly 0, and 0 is the denormal code, so this is the boundary case that must go denormalized.", "hint": "3/256 = 2/256 + 1/256 = 1/128 + 1/256."}, {"id": "es-rule", "type": "mc", "q": "You normalize a value and find that e + bias comes out as exactly **0**. What does that tell you?", "options": ["It has to be encoded as a denormalized number.", "It is the smallest normalized number.", "The value is zero.", "It cannot be stored: not enough range."], "answer": 0, "why": "An exponent field of all 0s is the code for denormalized, so a normalized number needs e + bias ≥ 1. Exactly 0 (or anything negative) → **denormalized**: rewrite as `0.xxxx` × 2^{1 − bias}. The smallest normalized number has e + bias = 1."}]}, {"id": "landmarks", "title": "Smallest and largest values of any format", "read": "A favourite question: \"what is the smallest / largest normalized / denormalized value of this format?\" There is nothing to memorise. Build the bit pattern, then decode it.\n\n| Landmark | Exponent field | Fraction field | Value |\n|---|---|---|---|\n| Smallest positive denormalized | all 0s | `0…01` | `0.0…01` × 2^{1 − bias} |\n| Largest denormalized | all 0s | all 1s | `0.1…1` × 2^{1 − bias} |\n| Smallest positive normalized | `0…01` | all 0s | `1.0…0` × 2^{1 − bias} |\n| Largest normalized | `1…10` | all 1s | `1.1…1` × 2^{field − bias} |\n\nThe largest normalized exponent field is `1…10`, **not** all 1s (that is ∞ and NaN).\n\n**Worked example: Minifloat** (1, 3, 4; bias 3).\n\n- Smallest denormalized: `0 000 0001` = `0.0001` × 2^{−2} = **1/64**\n- Largest denormalized: `0 000 1111` = `0.1111` × 2^{−2} = **15/64**\n- Smallest normalized: `0 001 0000` = `1.0000` × 2^{−2} = **1/4** (= 16/64)\n- Largest normalized: `0 110 1111` = `1.1111` × 2^{6−3} = `1111.1` = **15.5**\n\n**Worked example: 1 sign bit, 4 exponent bits (bias 7), 3 fraction bits.** Denormal exponent 1 − 7 = −6.\n\n- Smallest denormalized: `0 0000 001` = `0.001` × 2^{−6} = 2^{−9} = **1/512**\n- Largest denormalized: `0 0000 111` = `0.111` × 2^{−6} = **7/512**\n- Smallest normalized: `0 0001 000` = `1.000` × 2^{−6} = **1/64** (= 8/512)\n- Largest normalized: `0 1110 111` = `1.111` × 2^{14−7} = `11110000` = **240**\n\n### How the spacing changes\n\nWithin one exponent, neighbours differ by 1 in the last fraction bit. Each time the exponent goes up by one, that step **doubles**.\n\nMinifloat's steps: 1/64 for all the denormals **and** from 0.25 to 0.5; then 1/32 up to 1; 1/16 up to 2; 1/8 up to 4; 1/4 up to 8; and 1/2 from 8 to 15.5.\n\nSo representable values are **dense near zero and sparse far from it**. After 4.0 (`0 101 0000`) the next value is `0 101 0001` = 4.25; after 8.0 it is 8.5. Nothing in between exists.", "questions": [{"id": "lm-1", "type": "blanks", "q": "Format: 1 sign bit, 3 exponent bits (bias 3), 2 fraction bits. Give each landmark as a number (fractions are fine).", "blanks": [{"label": "smallest positive denormalized", "mode": "num", "accept": ["0.0625", "1/16"]}, {"label": "largest denormalized", "mode": "num", "accept": ["0.1875", "3/16"]}, {"label": "smallest positive normalized", "mode": "num", "accept": ["0.25", "1/4"]}, {"label": "largest normalized", "mode": "num", "accept": ["14"]}], "why": "Denormal exponent 1 − 3 = −2. Smallest denormal `0 000 01` = `0.01` × 2^{−2} = **1/16**. Largest denormal `0 000 11` = `0.11` × 2^{−2} = **3/16**. Smallest normalized `0 001 00` = `1.00` × 2^{−2} = **1/4**. Largest normalized `0 110 11` = `1.11` × 2^{3} = **14**. Using field `111` for the largest (28) is the trap: that field is ∞ / NaN."}, {"id": "lm-bits", "type": "short", "mode": "bits", "q": "Format: 1 sign bit, 4 exponent bits, 5 fraction bits. Write the bit pattern of the **largest positive normalized** value.", "accept": ["0111011111"], "why": "Sign `0`, the largest exponent field that is not all 1s (`1110`), fraction all 1s (`11111`): **`0 1110 11111`** (= `1.11111` × 2^{7} = 252). `0 1111 11111` is NaN.", "placeholder": "10 bits"}, {"id": "lm-next", "type": "short", "mode": "num", "q": "In Minifloat, what is the next representable value **above 2.0**?", "accept": ["2.125", "17/8"], "why": "2.0 = `1.0000` × 2^{1} = `0 100 0000`. Add 1 to the last fraction bit: `0 100 0001` = `1.0001` × 2^{1} = `10.001` = **2.125**. The step between 2 and 4 is 1/8. Answering 2.0625 uses the 1/16 step that applies between 1 and 2."}, {"id": "lm-dense", "type": "mc", "q": "Where on the number line are a floating-point format's representable values packed most closely together?", "options": ["Near zero: the step between neighbours doubles each time the exponent goes up by one.", "Near the largest value: bigger exponents give finer steps.", "Nowhere in particular: they are evenly spaced, like integers.", "Around 1.0, where the true exponent is zero."], "answer": 0, "why": "Within one exponent the step is constant, and each larger exponent doubles it. So the densest region is next to zero (the denormals and the smallest normalized numbers share the smallest step) and the values thin out as they grow. Minifloat: steps of 1/64 near zero, 1/2 between 8 and 15.5."}]}, {"id": "rounding", "title": "Rounding: nearest value, ties to even", "read": "Most real numbers fall *between* two representable values. Lecture's rule: the computer stores **the closest representable value**. (Lecture called rounding \"probably one of the most important things\" about floating point.)\n\n### Recipe\n\n1. Binary, normalize, look at the fraction. More bits than the field has → it does not fit exactly.\n2. **Round-down candidate:** keep only the first f fraction bits (f = the field width).\n3. **Round-up candidate:** those same f bits **plus 1** in the last place.\n4. Store whichever candidate is **closer** to the true value.\n5. **Exact tie** (the true value is exactly halfway): take the candidate whose **last fraction bit is 0**. This is *round-to-nearest, ties-to-even*: \"even ends in 0\".\n\nBoth candidates are exactly as wide as the fraction field.\n\n**Worked example: 9.25 in Minifloat** (4 fraction bits).\n9.25 = `1001.01` = `1.00101` × 2^{3}. Five fraction bits: it does not fit.\nDown: `1.0010` × 2^{3} = 9.0. Up: `1.0011` × 2^{3} = 9.5.\n9.25 is exactly halfway → tie → the candidate ending in 0 is `0010` → store **9.0** = `0 110 0010`.\n\n**Worked example: 6.875 in Minifloat.**\n6.875 = `110.111` = `1.10111` × 2^{2}.\nDown: `1.1011` × 2^{2} = 6.75. Up: `1.1100` × 2^{2} = 7.0. A tie again (0.125 each way). The candidate ending in 0 is `1100` → store **7.0** = `0 101 1100`. Ties-to-even is not \"round down\": this one went **up**.\n\n**Worked example: 2.6 in Minifloat.**\n2.6 = `10.10011001…` (it never ends) = `1.010011001…` × 2^{1}.\nDown: `1.0100` × 2^{1} = 2.5. Up: `1.0101` × 2^{1} = 2.625.\n2.6 − 2.5 = 0.1 and 2.625 − 2.6 = 0.025 → closer to **2.625** = `0 100 0101`. Not a tie, so \"even\" never comes into it.\n\n> **Rule:** read it off the dropped bits. First dropped bit 0 → round down. First dropped bit 1 with another 1 anywhere after it → round up. Dropped bits exactly `1000…` → tie → even.\n\nDenormals round the same way; the candidates are neighbouring `0.xxxx` × 2^{1 − bias} values.", "questions": [{"id": "rnd-1", "type": "blanks", "q": "Minifloat (4 fraction bits). **11.25** has to be stored.", "blanks": [{"label": "round-down candidate (decimal)", "mode": "num", "accept": ["11"]}, {"label": "round-up candidate (decimal)", "mode": "num", "accept": ["11.5", "23/2"]}, {"label": "value actually stored", "mode": "num", "accept": ["11"]}, {"label": "bit pattern stored", "mode": "bits", "accept": ["01100110"]}], "why": "11.25 = `1011.01` = `1.01101` × 2^{3}: 5 fraction bits, the field has 4. Down: `1.0110` × 2^{3} = 11. Up: `1.0111` × 2^{3} = 11.5. 11.25 is exactly halfway (a tie), so take the candidate whose last fraction bit is 0: that is the round-down one. Stored: **`0 110 0110`** = **11**. Picking 11.5 is \"round half up\" from school, which is not the rule here."}, {"id": "rnd-2", "type": "blanks", "q": "Minifloat. **1.84375** (= 1 27/32) has to be stored.", "blanks": [{"label": "round-down candidate (decimal)", "mode": "num", "accept": ["1.8125", "29/16"]}, {"label": "round-up candidate (decimal)", "mode": "num", "accept": ["1.875", "15/8"]}, {"label": "value actually stored", "mode": "num", "accept": ["1.875", "15/8"]}, {"label": "bit pattern stored", "mode": "bits", "accept": ["00111110"]}], "why": "1.84375 = `1.11011` × 2^{0}: 5 fraction bits, the field has 4. Down: `1.1101` × 2^{0} = 1.8125. Up: `1.1110` × 2^{0} = 1.875. 1.84375 is exactly halfway (a tie), so take the candidate whose last fraction bit is 0: that is the round-up one. Stored: **`0 011 1110`** = **1.875**. Assuming a tie always rounds down gives 1.8125, whose fraction `1101` ends in 1."}, {"id": "rnd-3", "type": "short", "mode": "num", "q": "Minifloat. What value is actually stored for **7.4**?", "accept": ["7.5", "15/2"], "why": "7.4 = `111.01100110…` = `1.1101100110…` × 2^{2}. Down: `1.1101` × 2^{2} = 7.25. Up: `1.1110` × 2^{2} = 7.5. Distances: 0.15 below, 0.1 above, so the upper one is closer. Stored: **`0 101 1110`** = **7.5**. The dropped bits start `10011…`: a 1 followed by more 1s, so it rounds up. Chopping the extra bits would give 7.25."}, {"id": "rnd-tie", "type": "mc", "q": "A value lies exactly halfway between two neighbouring representable values. Which one is stored?", "options": ["The one whose last fraction bit is 0.", "The smaller of the two, always.", "The larger of the two, always.", "The one whose decimal value is an even whole number."], "answer": 0, "why": "Round-to-nearest, **ties-to-even**: \"even\" means the stored fraction ends in 0. That is sometimes the smaller neighbour (9.25 → 9.0) and sometimes the larger (6.875 → 7.0). It has nothing to do with the decimal value being even: 6.875 is stored as 7.0, an odd number, because 7.0's fraction `1100` ends in 0."}]}, {"id": "overflow-underflow", "title": "Too big, too small: overflow and underflow", "read": "Rounding has two extreme cases.\n\n**Overflow:** the value is too large in size for the format: it would need an exponent beyond the largest normalized one. There is nothing up there to round to, so it is stored as **+∞ or −∞** (the sign is kept).\n\n**Underflow:** the value is not zero, but it is so close to zero that the nearest representable value is **0**. It \"rounds to zero\".\n\nMinifloat's finite values run from −15.5 to +15.5, and its smallest positive value is 1/64:\n\n| Value | What happens | Stored |\n|---|---|---|\n| −20 = −`1.01` × 2^{4}: field 4 + 3 = 7 = `111`, which is reserved | overflow | `1 111 0000` = −∞ |\n| 100 | overflow | `0 111 0000` = +∞ |\n| 1/256 (less than half of 1/64) | underflow | `0 000 0000` = 0 |\n\nLook at −20: its exponent field would be `111`. That fits in 3 bits, but all 1s is reserved, so −20 is still out of range. The largest usable field is `110`.\n\n> **Trap:** \"too small\" means too close to zero, not \"very negative\". −20 in Minifloat is an **overflow** (to −∞), not an underflow.\n\n> **Trap:** overflow has nothing to do with denormalized numbers. Denormals are the tiny values next to 0; overflow happens at the other end.\n\nLecture's hardware picture: overflow is rounding *past* the largest number. When there is nothing higher to round to, the result is ±∞.\n\n### Why denormals matter here\n\nWithout denormals, Minifloat would have nothing between 0 and 0.25, so 0.1 would be stored as 0: an error of 0.1. With denormals, 0.1 is stored as 6/64 = 0.09375 (`0 000 0110`): an error of about 0.006. Denormals do not remove underflow. They push it much closer to zero: in Minifloat only values below 1/128 (half the smallest denormal) still round to 0.", "questions": [{"id": "ou-1", "type": "blanks", "q": "Minifloat (finite values from −15.5 to 15.5; smallest positive value 1/64). Give the value that is actually stored. Type `inf` or `-inf` where needed.", "blanks": [{"label": "48", "mode": "num", "accept": ["inf"]}, {"label": "−17", "mode": "
