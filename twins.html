<style>
:root {

    --code-bg: #14171c; --code-ink: #e3e7ee; --tok-c: #8490a0; --tok-s: #f0a58c; --tok-k: #c8a2f5; --tok-n: #7fd1f0; --tok-p: #f0c060;

  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --card: #1b1f26; --ink: #e8ebf0; --muted: #9aa4b2; --line: #2e343d; --soft: #232831;
  --accent: #6cb6ea; --accent-ink: #0c1620; --accent-soft: #1c2f40;
  --ok: #5fcf8f; --ok-soft: #163324; --no: #ff8a80; --no-soft: #3a1c1a; --mid: #f0c060; --mid-soft: #3a2f12;
  --code-bg: #14171c; --code-ink: #e3e7ee; --tok-c: #8490a0; --tok-s: #f0a58c; --tok-k: #c8a2f5; --tok-n: #7fd1f0; --tok-p: #f0c060;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }

[hidden] { display: none !important; }

.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 860px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.brand { font-weight: 700; color: var(--ink); text-decoration: none; margin-right: auto; white-space: nowrap; }
.topnav { display: flex; gap: 2px; flex-wrap: wrap; }

.topnav a:hover, .topnav a.on { color: var(--ink); background: var(--soft); }
.save-badge, #theme { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
.save-badge.file { color: var(--ok); border-color: var(--ok); }
.save-badge.pending { color: var(--mid); border-color: var(--mid); }

main { max-width: 860px; margin: 0 auto; padding: 22px 16px 90px; }
h1 { font-size: clamp(25px, 4.4vw, 33px); line-height: 1.2; margin: 6px 0 10px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; }
h3 { font-size: 17px; margin: 18px 0 6px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.lede { color: var(--muted); margin: 0 0 14px; max-width: 62ch; }
.muted { color: var(--muted); font-size: 14.5px; }
.back { font-size: 14.5px; text-decoration: none; display: inline-block; margin-bottom: 8px; }

.hero { padding: 6px 0 4px; }
.hero-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.meters { display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 14px; flex: 1; min-width: 280px; }
.meter-top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.meter-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
.meter-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.bar { display: block; height: 7px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s; }

.tools, .drill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 22px 0 8px; }
.drill-grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.tool { display: flex; flex-direction: column; gap: 2px; padding: 11px 13px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.tool:hover { border-color: var(--accent); }
.tool span { font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.drill-stat { margin-top: 6px; font-variant-numeric: tabular-nums; }

.list-title { margin: 26px 0 6px; }
.route { margin: 0 0 12px; font-size: 14.5px; color: var(--muted); }
.route b { color: var(--ink); } .route a { font-weight: 700; }
.sec-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.sec-card { display: grid; grid-template-columns: 38px 1fr 150px; gap: 12px; align-items: center; padding: 13px 15px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.sec-card:hover { border-color: var(--accent); }
.sec-n { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.sec-card.done .sec-n { background: var(--ok-soft); color: var(--ok); }
.sec-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.sec-title { font-weight: 650; line-height: 1.3; }
.star { font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--mid); background: var(--mid-soft); border-radius: 99px; padding: 1px 8px; margin-left: 8px; white-space: nowrap; vertical-align: 2px; }
.sec-blurb { font-size: 14.5px; color: var(--muted); line-height: 1.4; }
.sec-meta { font-size: 12.5px; color: var(--muted); opacity: 0.85; }
.sec-prog { display: flex; flex-direction: column; gap: 5px; }
.sec-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.foot { margin-top: 30px; font-size: 13.5px; color: var(--muted); }

.sec-head { margin-bottom: 14px; }
.rail { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.rail-step { min-width: 34px; height: 34px; padding: 0 10px; display: grid; place-items: center; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rail-step.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.rail-step.cur { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.read { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px 12px; }
.read-label, .qs-label { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.qs-label { margin: 24px 0 8px; color: var(--muted); }
.qs { display: grid; gap: 14px; }
.skip { display: inline-block; margin-top: 16px; font-size: 14px; color: var(--muted); }

.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 12px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 24px; }
.md li { margin: 3px 0; }
.md li > ul, .md li > ol { margin: 3px 0; }
.md h4 { font-size: 16.5px; margin: 18px 0 6px; }
.md code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }
.md pre.code { background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px; font: 14px/1.5 var(--mono); tab-size: 4; }
.md pre.code code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; white-space: pre; }
.tok-c { color: var(--tok-c); font-style: italic; } .tok-s { color: var(--tok-s); } .tok-k { color: var(--tok-k); } .tok-n { color: var(--tok-n); } .tok-p, .tok-v { color: var(--tok-p); }
.tbl { overflow-x: auto; margin: 0 0 12px; }
.md table { border-collapse: collapse; font-size: 15px; min-width: 50%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--soft); font-weight: 650; font-size: 14px; }
.callout { margin: 0 0 12px; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 9px 9px 0; }
.callout.trap { border-color: var(--no); background: var(--no-soft); }
.callout.rule { border-color: var(--ok); background: var(--ok-soft); }
.callout.paper { border-color: var(--mid); background: var(--mid-soft); }
.callout.lecture { border-color: var(--muted); background: var(--soft); }
.md.inline, .md.inline p { display: inline; margin: 0; }

.q-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; scroll-margin-top: 70px; }
.q-card.is-right { border-color: var(--ok); } .q-card.is-wrong { border-color: var(--no); } .q-card.is-mid { border-color: var(--mid); }
.q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.q-num { font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.q-prev { font-size: 12px; border-radius: 99px; padding: 0 8px; }
.q-prev.ok { background: var(--ok-soft); color: var(--ok); } .q-prev.no { background: var(--no-soft); color: var(--no); }
.flag-btn { margin-left: auto; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 8px; padding: 1px 8px; cursor: pointer; }
.flag-btn:hover { border-color: var(--line); } .flag-btn.on { color: var(--mid); border-color: var(--mid); }
.flag-row { margin-bottom: 10px; }
.flag-note { width: 100%; font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--mid); border-radius: 8px; background: var(--card); color: var(--ink); }
.q-text { margin-bottom: 12px; }

.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 11px; align-items: baseline; text-align: left; width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; opacity: 1; color: var(--ink); }
.opt-key { flex: none; font-size: 12.5px; font-weight: 700; color: var(--muted); width: 14px; }
.opt-text code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.incorrect { border-color: var(--no); background: var(--no-soft); }

.short-row { display: flex; align-items: center; gap: 8px; }
.ans-input { font: 15.5px var(--mono); width: 100%; max-width: 420px; padding: 8px 11px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); }
.ans-input:focus, .self-input:focus, .flag-note:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.ans-input.good { border-color: var(--ok); background: var(--ok-soft); } .ans-input.bad { border-color: var(--no); background: var(--no-soft); }
.ans-input:disabled { opacity: 1; color: var(--ink); -webkit-text-fill-color: var(--ink); }
.mark { width: 18px; font-weight: 700; flex: none; } .mark.ok { color: var(--ok); } .mark.no { color: var(--no); }
.fix { font-size: 14px; color: var(--muted); white-space: nowrap; }
.fix code { font-family: var(--mono); background: var(--ok-soft); color: var(--ok); border-radius: 5px; padding: 1px 6px; }
.blanks { display: grid; gap: 8px; }
.blank { display: grid; grid-template-columns: minmax(120px, 44%) 1fr; gap: 10px; align-items: center; }
.blank-label { font-size: 15px; } .blank-label code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
.blank-in { display: flex; align-items: center; gap: 8px; min-width: 0; }
.blank-in .ans-input { max-width: 300px; }
.self-input { width: 100%; font: 14.5px/1.5 var(--mono); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); resize: vertical; tab-size: 4; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.try-again { margin-top: 8px; font-size: 14.5px; color: var(--no); }
.hint { margin-top: 6px; font-size: 14.5px; color: var(--muted); }

.btn { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { font-size: 16.5px; padding: 10px 18px; }
.btn.ghost { background: none; }
.btn.good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.mid { background: var(--mid-soft); border-color: var(--mid); color: var(--mid); }
.btn.bad { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.btn:focus-visible, .opt:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.q-fb { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.verdict { font-weight: 700; margin-bottom: 6px; } .verdict.ok { color: var(--ok); } .verdict.no { color: var(--no); } .verdict.mid { color: var(--mid); }
.ans { margin-bottom: 6px; } .ans > span { color: var(--muted); }
.why { font-size: 15.5px; }
.next-btn { margin-top: 12px; }
.model { margin-top: 12px; padding: 12px 14px; background: var(--soft); border-radius: 10px; }
.model-label { font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
.model-label:first-child { margin-top: 0; }
.rubric { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 4px; }
.rubric label { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.rubric code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
.self-grade { display: flex; gap: 8px; flex-wrap: wrap; }

.quiz-prog { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); margin: 6px 0 12px; font-variant-numeric: tabular-nums; }
.quiz-prog .bar { flex: 1; }
.result { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; text-align: center; }
.result.left { text-align: left; }
.result.left .result-actions { justify-content: flex-start; }
.score { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 14px 0 4px; }
.miss-list { text-align: left; font-size: 14.5px; color: var(--muted); margin: 10px auto; max-width: 60ch; }
.miss-secs { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
.miss-secs li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; }
.cheat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 18px; margin-bottom: 10px; break-inside: avoid; }
.cheat h3 { margin: 0 0 6px; } .cheat h3 a { color: var(--ink); text-decoration: none; }
.cheat ul { margin: 0; padding-left: 20px; } .cheat li { margin: 4px 0; }
.cheat code { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
.clock { position: sticky; top: 52px; z-index: 5; width: max-content; margin: 0 0 12px auto; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; font: 600 14px var(--mono); }
.clock.over { color: var(--no); border-color: var(--no); }
.mock-score { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 18px; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14.5px; z-index: 20; }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .sec-card { grid-template-columns: 34px 1fr; }
  .sec-prog { grid-column: 2; }
  .read { padding: 16px 15px 8px; }
  .q-card { padding: 14px 14px; }
  .blank { grid-template-columns: 1fr; gap: 4px; }
  .star { display: inline-block; margin-left: 0; }
}
@media print {
  .topbar, .back, .foot { display: none; }
  body { background: #fff; }
}

.signin-note { display: block; margin: 18px 0 0; padding: 11px 14px; border: 1px solid var(--mid); background: var(--mid-soft); color: var(--ink); border-radius: var(--radius); text-decoration: none; }
.login { margin-bottom: 14px; }
.login-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.login-form .ans-input { max-width: 220px; font-family: inherit; }

</style>

<script>window.__DATA__ = {"quizAt": "2026-10-14T10:10:00-04:00", "high": [], "route": [], "key": "comp211-quiz2-twins-v1", "title": "COMP 211 · Quiz 2: the practice sets, new numbers", "sections": [{"id": "practice-twins", "title": "Start here: the 9 practice sets, new numbers", "blurb": "One part per official practice set: the 1–4 facts it needs, one worked example, then the same questions with different numbers. Do this, then do the real sets on paper.", "objective": "All five objectives, at practice-set depth", "sources": "The nine Quiz 2 practice sets · TA review session", "minutes": 100, "cheats": ["Float: normal = `1.f` × 2^{stored − bias}; denormal (exponent all 0s) = `0.f` × 2^{1 − bias}; exponent all 1s = infinity or NaN. Answer in fractions.", "Encoding: normalize, add the bias. If the stored exponent comes out 0 or negative, it's denormalized.", "`&a[i] = base + i × sizeof`. Little-endian: right-hand byte at the lowest address.", "Diagram: check the row size, RA first, array index 0 at the **lowest** address, pointer rows hold addresses, cross out a frame when it returns.", "`p[i]` = `*(p + i)`, counted from where `p` points. Pointer − pointer = elements, not bytes.", "Leak = never freed and unreachable. Double free = freed twice. Use after free = used after `free`. Dangling = points at something whose lifetime ended.", "Low → high: OS, text, data, heap (grows up), stack (grows down). Data = globals, statics, string literals.", "2D: index = row × columns + column. Method 2: `malloc` the row pointers, `malloc` each row, free rows then the outer array.", "make: default = first target; rebuild only if missing or older than a dependency. bash: `?` one character, `*` any, `[0-9]` one digit; loop runs once per match."], "chunks": [{"id": "t-fp", "title": "Floating point (practice set: Floating Point)", "read": "**Must know (3 things):**\n\n1. **Normal** (exponent bits not all 0s, not all 1s): value = ±`1.fraction` × 2^{stored − bias}.\n2. **Denormalized** (exponent bits all 0s, fraction not 0): value = ±`0.fraction` × 2^{1 − bias}. The exponent is always **1 − bias**, never 0 − bias.\n3. Exponent all 1s = ±infinity (fraction 0) or NaN (fraction not 0). All 0s everywhere = zero. The TAs expect this special-cases table to be printed on the quiz.\n\n> **On paper:** answer in **fractions**, not decimals (the TAs said so), and check the sign bit last.\n\n### Worked: this part's format\n\nFormat: **1 sign bit, 3 exponent bits (bias 3), 5 fraction bits** (9 bits). Bias 3, so the denormalized exponent is 1 − 3 = **−2**.\n\n**Decode `1 101 01000`.** Sign 1, so negative. Exponent `101` = 5, and 5 − 3 = 2. Significand `1.01000`. Move the point right 2: `101.0` = 5. Answer **−5**.\n\n**Decode `0 000 10100`.** Exponent all 0s, fraction not 0, so denormalized: `0.10100` × 2^{−2}. Move the point left 2: `0.00101` = 1/8 + 1/32 = **5/32**.\n\n**Encode 6.5.** Binary `110.1`. Normalize: `1.101` × 2^{2}. Stored exponent = 2 + 3 = 5 = `101`. Fraction = bits after the point, padded: `10100`. Answer `0 101 10100`.\n\n**Encode 3/64.** Binary `0.000011`. Normalizing gives `1.1` × 2^{−5}, stored exponent −5 + 3 = −2. **Zero or negative means it has to be denormalized.** Rewrite with the fixed exponent −2: `0.0011` × 2^{−2}. Fraction `00110`, exponent `000`. Answer `0 000 00110`.\n\n**Extremes** (the four that are always asked):\n\n| | bits | why |\n|---|---|---|\n| smallest positive normal | `0 001 00000` | exponent can't be `000` |\n| largest normal | `0 110 11111` | exponent can't be `111` |\n| smallest positive denormal | `0 000 00001` | fraction can't be 0 |\n| largest denormal | `0 000 11111` | |\n", "questions": [{"id": "fp-dec-norm", "type": "blanks", "q": "Format: **1 sign bit, 3 exponent bits (bias 3), 5 fraction bits** (9 bits).\n\nDecode `0 110 11000`.", "blanks": [{"label": "true exponent (stored − bias)", "mode": "num", "accept": ["3"]}, {"label": "value", "mode": "num", "accept": ["14"]}], "why": "Exponent `110` = 6, 6 − 3 = 3. `1.11000` × 2^{3} = `1110.0` = **14**. Forgetting the hidden 1 gives 6."}, {"id": "fp-dec-den", "type": "short", "mode": "num", "q": "Format: **1 sign bit, 3 exponent bits (bias 3), 5 fraction bits** (9 bits).\n\nDecode `1 000 01100`. Answer as a fraction.", "accept": ["-3/32"], "why": "Exponent all 0s, so denormalized: −`0.01100` × 2^{−2} = −`0.00011` = −(1/16 + 1/32) = **−3/32**. Using a hidden 1, or exponent 0 − 3, are the two usual mistakes.", "placeholder": "-a/b"}, {"id": "fp-enc-norm", "type": "short", "mode": "bits", "q": "Format: **1 sign bit, 3 exponent bits (bias 3), 5 fraction bits** (9 bits).\n\nEncode **11.5**. Type all 9 bits.", "accept": ["011001110"], "why": "11.5 = `1011.1` = `1.0111` × 2^{3}. Stored exponent 3 + 3 = 6 = `110`. Fraction = `0111` padded to 5 bits = `01110`. Answer `0 110 01110`. Writing the fraction as `10111` (keeping the leading 1) is the usual mistake.", "placeholder": "9 bits"}, {"id": "fp-enc-den", "type": "short", "mode": "bits", "q": "Format: **1 sign bit, 3 exponent bits (bias 3), 5 fraction bits** (9 bits).\n\nEncode **5/128**. Type all 9 bits.", "accept": ["000000101"], "why": "5/128 = 4/128 + 1/128 = `0.0000101`. Normalized it would be `1.01` × 2^{−5}, stored exponent −2, not allowed, so denormalized. With exponent −2: `0.00101` × 2^{−2}. Fraction `00101`, exponent `000`: `0 000 00101`."}, {"id": "fp-extremes", "type": "blanks", "q": "Format: **1 sign bit, 3 exponent bits (bias 3), 5 fraction bits** (9 bits).\n\nGive each value (fraction or decimal).", "blanks": [{"label": "smallest positive normalized", "mode": "num", "accept": ["1/4"]}, {"label": "largest normalized", "mode": "num", "accept": ["63/4"]}, {"label": "smallest positive denormalized", "mode": "num", "accept": ["1/128"]}, {"label": "largest denormalized", "mode": "num", "accept": ["31/128"]}], "why": "`0 001 00000` = 1.0 × 2^{−2} = **1/4**. `0 110 11111` = `1.11111` × 2^{3} = `1111.11` = 15 + 3/4 = **63/4**. `0 000 00001` = `0.00001` × 2^{−2} = 2^{−7} = **1/128**. `0 000 11111` = `0.11111` × 2^{−2} = **31/128**."}]}, {"id": "t-bytes", "title": "Byte addresses and little-endian (practice set: Byte Addresses)", "read": "**Must know (2 things):**\n\n1. **Address of element i = base + i × sizeof(element).** Do `i × size` in decimal, turn it into hex, then add.\n2. **Little-endian: the least significant byte (the right-hand two hex digits) sits at the lowest address.**\n\n### Worked: element addresses\n\nA 30-element `int` array starts at `0xBBBB00005008`, `sizeof(int)` = 4.\n\n- Element 6: 6 × 4 = 24 = `0x18`. `0x5008 + 0x18 = 0x5020`, so `0xBBBB00005020`.\n- Hex add, one column at a time: 8 + 8 = 16 = `0x10`, write 0 carry 1. 0 + 1 + 1 = 2. So `…5020`.\n- An `int` takes 4 addresses: element 6 lives at `…5020`, `…5021`, `…5022`, `…5023`.\n\n### Worked: reading bytes out of a dump\n\n| Address | Data (4 bytes) |\n|---|---|\n| `0xCCCC00002000` | `0x7A31C09E` |\n| `0xCCCC00002004` | `0x15B2D8F4` |\n| `0xCCCC00002008` | `0xE6094C27` |\n\nEach row is one 4-byte value; the address on the left is the address of its **first (lowest) byte**.\n\n- The 4-byte value at `…2004` is just the row: `0x15B2D8F4`.\n- Split it into bytes, **right to left**: `F4` is at `…2004`, `D8` at `…2005`, `B2` at `…2006`, `15` at `…2007`.\n- So the byte at `…2006` is `0xB2`. For an address that isn't a row start, find its row first: `…200B` is in the `…2008` row, offset 3, the leftmost byte: `0xE6`.\n\n> **Trap:** reading left to right (`15` first) is big-endian. Lowest address gets the **right-hand** byte.\n", "questions": [{"id": "ba-elems", "type": "blanks", "q": "A 30-element `int` array starts at `0xBBBB00005008`, `sizeof(int)` = 4. Give the address of each element.", "blanks": [{"label": "element 1", "mode": "hex", "accept": ["0xBBBB0000500C"]}, {"label": "element 12", "mode": "hex", "accept": ["0xBBBB00005038"]}, {"label": "element 25", "mode": "hex", "accept": ["0xBBBB0000506C"]}], "why": "1 × 4 = 4: `0xBBBB0000500C`. 12 × 4 = 48 = `0x30`: `0xBBBB00005038`. 25 × 4 = 100 = `0x64`: `0xBBBB0000506C`. Adding decimal 48 or 100 to the hex digits is the usual mistake."}, {"id": "ba-last-byte", "type": "short", "mode": "hex", "q": "Same array (base `0xBBBB00005008`, 4-byte ints). What is the **last** (highest) byte address that element 3 occupies?", "accept": ["0xBBBB00005017"], "why": "Element 3 starts at base + 12 = `0xBBBB00005014` and covers 4 addresses: `…5014` to **`…5017`**."}, {"id": "ba-dump", "type": "blanks", "q": "Little-endian machine.\n\n| Address | Data (4 bytes) |\n|---|---|\n| `0xCCCC00002000` | `0x7A31C09E` |\n| `0xCCCC00002004` | `0x15B2D8F4` |\n| `0xCCCC00002008` | `0xE6094C27` |\n\nGive the hex value of each **byte**.", "blanks": [{"label": "byte at 0xCCCC00002000", "mode": "hex", "accept": ["9E"]}, {"label": "byte at 0xCCCC00002001", "mode": "hex", "accept": ["C0"]}, {"label": "byte at 0xCCCC00002007", "mode": "hex", "accept": ["15"]}, {"label": "byte at 0xCCCC0000200A", "mode": "hex", "accept": ["09"]}], "why": "Row `…2000` = `7A 31 C0 9E`: lowest address gets the right-hand byte, so `…2000` = **9E**, `…2001` = **C0**. `…2007` is the top byte of the `…2004` row: **15**. `…200A` is offset 2 in the `…2008` row `E6 09 4C 27`: **09**."}, {"id": "ba-split", "type": "mc", "q": "A diagram has **4-byte rows**. An `int64_t` holding 100 starts at `0x…F010`. What goes in the rows?", "options": ["`…F010`: 100 and `…F014`: 0", "`…F010`: 0 and `…F014`: 100", "`…F010`: 100 and `…F014`: 100", "`…F010`: 50 and `…F014`: 50"], "answer": 0, "why": "An 8-byte value needs two 4-byte rows. 100 fits in the low half, the high half is all zeros, and little-endian puts the **low half at the lower address**. The TAs said this is the form little-endian would take on a diagram question."}]}, {"id": "t-lowlevel", "title": "Low-level memory diagrams (practice set: Low-Level Memory Diagrams)", "read": "**Must know (4 things):**\n\n1. **Look at the row size first** (how far apart the addresses are). The practice sets all use 8-byte rows, and `int64_t` and every pointer are 8 bytes, so one thing per row.\n2. **Stack fills downward** from the frame's start address. First row = **RA** (0 for `main`), then locals in the order declared.\n3. **Arrays look upside down: index 0 is at the lowest address.** A 4-element array takes the next 4 rows and `a[0]` is the bottom one.\n4. **A pointer row holds an address.** `p = a` stores the address of `a[0]`. Pointer − pointer = number of **elements** apart, not bytes.\n\n### Worked: one frame\n\n```c\n 1  int main() {\n 2    int64_t a[] = {3, 6, 9, 12};\n 3    int64_t* p = a;\n 4\n 5    p[1] = 60;\n 6    *(p + 3) = 70;\n 7    a[0] = &a[3] - &a[1];\n 8    a[2] = (int64_t) p;\n 9  }\n```\n\n`main` starts at `0xFFFFBBBB0060`. Lay out the rows first, then run the code.\n\n| Address | Contents | Variable |\n|---|---|---|\n| `0xFFFFBBBB0060` | 0 | RA |\n| `0xFFFFBBBB0058` | 12, then 70 | a[3] |\n| `0xFFFFBBBB0050` | 9, then `0xFFFFBBBB0040` | a[2] |\n| `0xFFFFBBBB0048` | 6, then 60 | a[1] |\n| `0xFFFFBBBB0040` | 3, then 2 | a[0] |\n| `0xFFFFBBBB0038` | `0xFFFFBBBB0040` | p |\n\nLine 7: `&a[3] − &a[1]` is 16 bytes apart, 16 / 8 = **2** elements. Line 8 stores the address held in `p`.\n\n### A function call (practice diagram 2)\n\nEach call adds, below the caller's rows: the caller's **RV(callee)** slot, then the callee's **parameters and RA**, then its locals. Label every row `function: name`. Library calls use `arg0`, `arg1`. **RA = the line number of the call.** When a function returns, **cross out its rows** and write the return value in the RV slot.\n\n> **Check this one:** the official answer key puts the callee's **RA above its parameters, first parameter lowest**. Lecture's slides say parameters first, then RA. Ask a TA which one is graded. The questions below don't depend on it.\n", "questions": [{"id": "ll-one-frame", "type": "blanks", "q": "`main`'s frame starts at `0xFFFFAAAA0080`. Every row is 8 bytes.\n\n```c\nint main() {\n  int64_t v[] = {4, 8, 12};\n  int64_t* q = v;\n\n  q[2] = 90;\n  *(q + 1) = &v[2] - &v[0];\n  v[0] = (int64_t) (q + 1);\n}\n```\n\nGive the **final** contents of each row.", "blanks": [{"label": "0xFFFFAAAA0080", "mode": "num", "accept": ["0"]}, {"label": "0xFFFFAAAA0078", "mode": "num", "accept": ["90"]}, {"label": "0xFFFFAAAA0070", "mode": "num", "accept": ["2"]}, {"label": "0xFFFFAAAA0068 (hex)", "mode": "hex", "accept": ["0xFFFFAAAA0070"]}, {"label": "0xFFFFAAAA0060 (hex)", "mode": "hex", "accept": ["0xFFFFAAAA0068"]}], "why": "Rows: `…0080` RA = 0, `…0078` v[2], `…0070` v[1], `…0068` v[0], `…0060` q. `q` = address of v[0] = `…0068`. `q[2]` → v[2] = 90. `&v[2] − &v[0]` = 2 elements → v[1] = 2. `q + 1` = `…0068` + 8 = `…0070` → v[0]. Putting v[0] in the top row is the usual mistake."}, {"id": "ll-call-values", "type": "blanks", "q": "`malloc` returns `0x555555558000`. The diagram is drawn **just before line 16**.\n\n```c\n 5  int64_t* makeRow(int64_t n, int64_t start) {\n 6    int64_t* row = malloc(n * sizeof(int64_t));\n 7    for (int64_t k = 0; k < n; k++) {\n 8      row[k] = start + k;\n 9    }\n10    return row;\n11  }\n12\n13  int main(void) {\n14    int64_t* data = makeRow(3, 7);\n15    data[1] = 50;\n16    free(data);\n17  }\n```\n\nGive the contents of each labelled row (the last value it held, even if the row is crossed out).", "blanks": [{"label": "makeRow: RA", "mode": "num", "accept": ["14"]}, {"label": "malloc: arg0", "mode": "num", "accept": ["24"]}, {"label": "malloc: RA", "mode": "num", "accept": ["6"]}, {"label": "makeRow: k (final value)", "mode": "num", "accept": ["3"]}, {"label": "main: data (hex)", "mode": "hex", "accept": ["0x555555558000"]}], "why": "`makeRow` is called on line 14, `malloc` on line 6: those are the RAs. arg0 = 3 × `sizeof(int64_t)` = 3 × 8 = **24** bytes (not 3). The loop stops when `k` reaches **3**. `data` gets the returned heap address."}, {"id": "ll-call-heap", "type": "blanks", "q": "Same program, just before line 16, `malloc` returned `0x555555558000`.\n\n```c\n 5  int64_t* makeRow(int64_t n, int64_t start) {\n 6    int64_t* row = malloc(n * sizeof(int64_t));\n 7    for (int64_t k = 0; k < n; k++) {\n 8      row[k] = start + k;\n 9    }\n10    return row;\n11  }\n12\n13  int main(void) {\n14    int64_t* data = makeRow(3, 7);\n15    data[1] = 50;\n16    free(data);\n17  }\n```\n\nGive the heap contents.", "blanks": [{"label": "0x555555558000", "mode": "num", "accept": ["7"]}, {"label": "0x555555558008", "mode": "num", "accept": ["50"]}, {"label": "0x555555558010", "mode": "num", "accept": ["9"]}], "why": "`makeRow` writes start + k: 7, 8, 9, lowest index at the lowest address. Line 15 changes `data[1]` to 50. Line 16 hasn't run, so nothing is freed yet."}, {"id": "ll-crossed", "type": "mc", "q": "Same program, just before line 16. Which rows are **crossed out**?\n\n```c\n 5  int64_t* makeRow(int64_t n, int64_t start) {\n 6    int64_t* row = malloc(n * sizeof(int64_t));\n 7    for (int64_t k = 0; k < n; k++) {\n 8      row[k] = start + k;\n 9    }\n10    return row;\n11  }\n12\n13  int main(void) {\n14    int64_t* data = makeRow(3, 7);\n15    data[1] = 50;\n16    free(data);\n17  }\n```", "options": ["Every `makeRow:` and `malloc:` row", "Only the `malloc:` rows", "Every row except `main: RA`", "None, nothing has been freed yet"], "answer": 0, "why": "A frame is crossed out when its function **returns**. Both `malloc` and `makeRow` have returned by line 16. `main`'s rows (RA, `data`, RV(makeRow)) stay. `free` is about the heap, not the stack."}]}, {"id": "t-ptr", "title": "Pointer arithmetic (practice set: Pointer Arithmetic)", "read": "**Must know (3 things):**\n\n1. **`p[i]` is exactly `*(p + i)`.** The index counts from where `p` points, so `p[-1]` is the element before it.\n2. **`p + 1` moves one element, not one byte.** Address goes up by `sizeof` what it points to: `char` 1, `int16_t` 2, `int32_t`/`int`/`float` 4, `int64_t`/`double`/any pointer 8.\n3. `*` reads the value at an address; `&` gives the address of a variable. An array's name is the address of element 0.\n\n### Worked\n\n```c\nint32_t v[5] = {7, 14, 21, 28, 35};\nint32_t* p = v;\n```\n\n- `*(p + 3)` = element 3 = **28**. `*(v + 1)` = **14**. `p[4]` = **35**.\n- `*(++p)`: move `p` to element 1 first, then read: **14**.\n\n```c\nint16_t t[4] = {5, 6, 7, 8};\nint16_t* q = &t[2];\n```\n\n`q` starts at index 2, so add the offset to 2: `*(q - 2)` = t[0] = **5**, `*(q + 1)` = t[3] = **8**, `q[0]` = **7**, `q[-1]` = t[1] = **6**.\n\n**Addresses.** `double* dp` holds `0x3000`. `dp + 1` = `0x3008`, `dp + 2` = `0x3010` (16 = `0x10`, not `0x3016`).\n\n**Chars.** `char s[] = \"SYSTEMS\"; char* cp = s;`\n\n- `*(cp + 3)` = `'T'` (S-Y-S-**T**).\n- `&s[5]` and `&s[2]` are 3 elements apart, and a `char` is 1 byte, so **3 bytes**. For `int32_t` it would be 3 × 4 = 12 bytes.\n- `cp[cp[1] - 'W']`: inside first. `cp[1]` = `'Y'`. `'Y' - 'W'` = 2 letters apart = 2. `cp[2]` = `'S'`.\n", "questions": [{"id": "pa-values", "type": "blanks", "q": "```c\nint32_t g[5] = {11, 22, 33, 44, 55};\nint32_t* p = g;\n```\n\nGive each value.", "blanks": [{"label": "*(p + 4)", "mode": "num", "accept": ["55"]}, {"label": "*(g + 2)", "mode": "num", "accept": ["33"]}, {"label": "p[1]", "mode": "num", "accept": ["22"]}, {"label": "*(++p)", "mode": "num", "accept": ["22"]}], "why": "`p` starts at index 0. Index 4 = 55, index 2 = 33, index 1 = 22. `*(++p)` moves to index 1 first, then reads: 22."}, {"id": "pa-offset", "type": "blanks", "q": "```c\nint16_t w[5] = {9, 8, 7, 6, 5};\nint16_t* r = &w[3];\n```\n\nGive each value.", "blanks": [{"label": "*(r - 3)", "mode": "num", "accept": ["9"]}, {"label": "*(r + 1)", "mode": "num", "accept": ["5"]}, {"label": "r[0]", "mode": "num", "accept": ["6"]}, {"label": "r[-2]", "mode": "num", "accept": ["8"]}], "why": "`r` starts at index 3. 3 − 3 = 0 → 9. 3 + 1 = 4 → 5. `r[0]` = w[3] = 6. 3 − 2 = 1 → 8. Counting from the start of the array instead of from `r` is the mistake."}, {"id": "pa-addr", "type": "blanks", "q": "`int32_t* ip` holds `0x2000` and `double* dp` holds `0x5000`. Give each address.", "blanks": [{"label": "ip + 1", "mode": "hex", "accept": ["0x2004"]}, {"label": "ip + 5", "mode": "hex", "accept": ["0x2014"]}, {"label": "dp + 3", "mode": "hex", "accept": ["0x5018"]}], "why": "`ip` steps by 4: `0x2004`, and 5 × 4 = 20 = `0x14` → `0x2014`. `dp` steps by 8: 3 × 8 = 24 = `0x18` → `0x5018`. `0x2020` and `0x5024` come from adding decimal."}, {"id": "pa-char", "type": "blanks", "q": "```c\nchar word[] = \"POINTER\";\nchar* cp = word;\n```\n\nGive each answer (type the single character without quotes).", "blanks": [{"label": "*(cp + 4)", "mode": "text", "accept": ["T"]}, {"label": "bytes between &word[6] and &word[1]", "mode": "num", "accept": ["5"]}, {"label": "cp[cp[2] - 'G']", "mode": "text", "accept": ["I"]}], "why": "P-O-I-N-**T**: index 4 is `T`. 6 − 1 = 5 elements × 1 byte = 5 bytes. `cp[2]` = `'I'`, `'I' - 'G'` = 2, `cp[2]` = `I`."}]}, {"id": "t-life", "title": "Lifetime and the four memory bugs (practice set: Lifetime)", "read": "**Must know (the four bugs, one line each):**\n\n| Bug | One-line definition | Spot it |\n|---|---|---|\n| **Memory leak** | heap memory that can no longer be reached and was never freed | a pointer is reassigned (or the function ends) with no `free` first |\n| **Double free** | `free` called twice on the same block | two `free(p)` with no new `malloc` between |\n| **Use after free** | reading or writing heap memory after it was freed | `free(p)` and then `*p` or `p[i]` |\n| **Dangling pointer** | a pointer to something whose lifetime has ended | `return &local;` (or keeping a pointer after `free`) |\n\n**Scope vs lifetime:** scope = *where* in the code you can use the name. Lifetime = *how long* the thing exists in memory.\n\n| Lifetime | Applies to | Starts | Ends |\n|---|---|---|---|\n| **Automatic** | locals and parameters | execution enters the block | execution leaves the block |\n| **Dynamic** | `malloc` memory | allocation succeeds | `free` |\n| **Static** | globals and `static` variables | program starts | program ends |\n\n### Worked: the three code fixes the practice set asks for\n\n**Passing a value where a pointer is wanted.** `void update(int* p) { *p = 50; }` called as `update(x);` is wrong: it needs an address. Fix: `update(&x);`\n\n**Arithmetic on the pointer instead of the value.** `p = p * 2;` does not compile (you can't multiply an address). Fix: `*p = *p * 2;`\n\n**Returning the address of a local.** Fix it by giving the value a dynamic lifetime:\n\n```c\nint* makeValue() {\n  int* x = malloc(sizeof(int));\n  if (x == NULL) { return NULL; }\n  *x = 25;\n  return x;\n}\n```\n\nand the caller does `free(p);` when done.\n\n**Double pointer trace.** `int x = 4; int* p = &x; int** q = &p;` Then `*p` and `**q` are both `x`. `*p = *p + **q + 2;` makes x = 4 + 4 + 2 = 10.\n", "questions": [{"id": "lf-bug-a", "type": "mc", "q": "Which bug?\n\n```c\nint* scores = malloc(5 * sizeof(int));\nscores[0] = 90;\nfree(scores);\nscores[1] = 80;\n```", "options": ["Use after free", "Double free", "Memory leak", "Dangling pointer"], "answer": 0, "why": "The block is freed, then written through `scores[1]`. That is a **use after free**. (`scores` is also dangling after the `free`, but the bug the code *commits* is the use.)"}, {"id": "lf-bug-b", "type": "mc", "q": "Which bug?\n\n```c\nchar* buf = malloc(64);\nbuf = malloc(128);\nfree(buf);\n```", "options": ["Memory leak", "Double free", "Use after free", "Dangling pointer"], "answer": 0, "why": "The first 64-byte block's address is overwritten by the second `malloc`, so nothing can ever free it: **memory leak**. Only the 128-byte block is freed."}, {"id": "lf-bug-c", "type": "mc", "q": "Which bug?\n\n```c\ndouble* average(int a, int b) {\n  double avg = (a + b) / 2.0;\n  return &avg;\n}\n```", "options": ["Dangling pointer", "Memory leak", "Use after free", "Double free"], "answer": 0, "why": "`avg` is a local (automatic lifetime). It stops existing when `average` returns, so the returned address points at nothing valid: **dangling pointer**. No heap memory is involved, so it can't be a leak or use after free."}, {"id": "lf-bug-d", "type": "mc", "q": "Which bug?\n\n```c\nint* a = malloc(sizeof(int));\nint* b = a;\nfree(a);\nfree(b);\n```", "options": ["Double free", "Memory leak", "Use after free", "No bug: `a` and `b` are different pointers"], "answer": 0, "why": "`a` and `b` hold the **same address**, so the same block is freed twice: **double free**. Two pointer variables, one block."}, {"id": "lf-lifetime", "type": "blanks", "q": "Name the lifetime type of each (automatic, dynamic or static).", "blanks": [{"label": "a global `int counter;`", "mode": "text", "accept": ["static"]}, {"label": "a function parameter", "mode": "text", "accept": ["automatic"]}, {"label": "the block returned by `malloc`", "mode": "text", "accept": ["dynamic"]}, {"label": "`static int calls;` inside a function", "mode": "text", "accept": ["static"]}], "why": "Globals and anything declared `static` live for the whole program. Parameters and locals are automatic. `malloc` memory is dynamic: it lasts until `free`."}, {"id": "lf-trace", "type": "short", "mode": "num", "q": "What does this print?\n\n```c\nint a = 3;\nint* p = &a;\nint** q = &p;\n\n**q = *p * 2 + **q;\nprintf(\"%d\\n\", a);\n```", "accept": ["9"], "why": "`*p` and `**q` are both `a` = 3. 3 × 2 + 3 = **9**, stored back into `a` through `**q`."}, {"id": "lf-alias", "type": "blanks", "q": "What does this print?\n\n```c\nint a = 1;\nint b = 2;\nint* p = &a;\nint* q = &b;\n\nq = p;\n*q = 9;\nprintf(\"a=%d b=%d\\n\", a, b);\n```", "blanks": [{"label": "a", "mode": "num", "accept": ["9"]}, {"label": "b", "mode": "num", "accept": ["2"]}], "why": "`q = p` copies the **address**: now both point at `a`. `*q = 9` changes `a`. `b` is never touched."}, {"id": "lf-fix", "type": "short", "mode": "code", "q": "The function is `void reset(int* p) { *p = 0; }` and `main` has `int n = 8;`. The call `reset(n);` is wrong. Type the corrected call.", "accept": ["reset(&n);", "reset(&n)"], "why": "`reset` takes an `int*`, so pass the address of `n`: `reset(&n);`"}]}, {"id": "t-mem", "title": "Program memory (practice set: Program Memory)", "read": "**Must know (this is the whole practice set; about 5 minutes of points):**\n\n| Segment | What goes in it |\n|---|---|\n| **Text** (code) | program instructions (machine code) |\n| **Data** | global variables, `static` variables, read-only data such as string literals |\n| **Heap** | dynamically allocated memory (`malloc`, `realloc`) |\n| **Stack** | function call frames: local variables, parameters, return addresses |\n\n**The picture to be able to draw** (low addresses at the bottom):\n\n```\nhigh addresses\n  +---------+\n  |  Stack  |   grows DOWN, toward lower addresses\n  |    v    |\n  |         |\n  |    ^    |\n  |  Heap   |   grows UP, toward higher addresses\n  +---------+\n  |  Data   |\n  +---------+\n  |  Text   |\n  +---------+\n  |   OS    |\nlow addresses\n```\n\nChecklist of five things: **OS, text, data, heap, stack**, plus the two arrows pointing at each other.\n\n> **Trap:** locals are **not** in the data segment. Data = globals, statics, string literals. Locals are on the stack.\n", "questions": [{"id": "pm-where", "type": "blanks", "q": "Which segment holds each one? (text, data, heap or stack)", "blanks": [{"label": "a global `int total;`", "mode": "text", "accept": ["data", "data segment"]}, {"label": "a local `int i` inside `main`", "mode": "text", "accept": ["stack"]}, {"label": "the bytes you get from `malloc(40)`", "mode": "text", "accept": ["heap"]}, {"label": "the compiled machine code of `main`", "mode": "text", "accept": ["text", "code", "text segment", "code segment"]}, {"label": "the string literal `\"hello\"`", "mode": "text", "accept": ["data", "data segment"]}, {"label": "a function's return address", "mode": "text", "accept": ["stack"]}], "why": "Globals, statics and string literals → data. Locals, parameters, return addresses → stack. `malloc` → heap. Instructions → text."}, {"id": "pm-grow", "type": "mc", "q": "Which is right?", "options": ["The stack grows toward lower addresses, the heap toward higher addresses", "The stack grows toward higher addresses, the heap toward lower addresses", "Both grow toward higher addresses", "Both grow toward lower addresses"], "answer": 0, "why": "Stack sits at the top and grows **down**; heap sits above data and grows **up**. They grow toward each other."}, {"id": "pm-order", "type": "short", "mode": "list", "q": "List the five regions from the **lowest** address to the **highest**.", "accept": ["OS text data heap stack", "OS code data heap stack", "operating system text data heap stack"], "why": "OS, text, data, heap, stack. The stack is at the top.", "placeholder": "lowest first"}]}, {"id": "t-2d", "title": "2D arrays (practice set: 2D Arrays)", "read": "**Must know (3 things):**\n\n1. **Row-major: linear index = row × (number of columns) + column.** Multiply by the number of **columns**, not rows.\n2. **Address = base + linear index × sizeof(element).**\n3. **Two ways to malloc a 2D array:**\n   - **Method 1:** one contiguous block, `malloc(R * C * sizeof(int))`, access `a[i * C + j]`. One `malloc`, one `free`.\n   - **Method 2:** an array of row pointers (`int**`), then one `malloc` per row. R + 1 `malloc`s, rows are **not** guaranteed to be next to each other. Access `m[i][j]`, which is `*(*(m + i) + j)`. Free every row, **then** the outer array.\n\n### Worked\n\nAn 8 × 12 array, element `[5][9]`: 5 × 12 + 9 = **69**.\n\nA 6 × 10 `int32_t` array starts at `0xAAAA00001000`. Element `[4][3]`: index 4 × 10 + 3 = 43. Offset 43 × 4 = 172 = `0xAC`. Address `0xAAAA000010AC`.\n\n### The code-writing question (Method 2), the skeleton to memorise\n\n```c\nint** m = malloc(rows * sizeof(int*));      // array of row pointers\nfor (int i = 0; i < rows; i++) {\n  m[i] = malloc(cols * sizeof(int));        // one row\n}\n// use m[i][j]\nfor (int i = 0; i < rows; i++) {\n  free(m[i]);                               // rows first\n}\nfree(m);                                    // outer array last\n```\n\nThe two `sizeof`s differ: `sizeof(int*)` for the outer array, `sizeof(int)` for a row.\n", "questions": [{"id": "d2-linear", "type": "short", "mode": "num", "q": "A 15 × 40 array is stored in row-major order. What is the linear index of the element at row 6, column 11?", "accept": ["251"], "why": "6 × 40 + 11 = **251**. Multiplying by 15 (the number of rows) gives the wrong 101."}, {"id": "d2-addr", "type": "short", "mode": "hex", "q": "A 5 × 8 `int64_t` array is stored in row-major order starting at `0x700000000000`. What is the address of element `[2][5]`?", "accept": ["0x7000000000A8"], "why": "Index 2 × 8 + 5 = 21. Offset 21 × 8 = 168 = `0xA8`. Address `0x7000000000A8`."}, {"id": "d2-mallocs", "type": "short", "mode": "num", "q": "A 4-row, 9-column `int` matrix is allocated with Method 2 (array of row pointers). How many calls to `malloc` are made in total?", "accept": ["5"], "why": "One for the array of 4 row pointers, plus one per row: 1 + 4 = **5**. Method 1 would be 1."}, {"id": "d2-deref", "type": "short", "mode": "code", "q": "`m` is an `int**` matrix (Method 2). `m[2][3]` is one way to reach row 2, column 3. Type the other way, using only `*`, `+` and parentheses.", "accept": ["*(*(m+2)+3)"], "why": "`m[2]` is `*(m + 2)` (the row pointer); then `[3]` is `*(row + 3)`: `*(*(m + 2) + 3)`."}, {"id": "d2-diff", "type": "mc", "q": "What is the difference between the two ways of dynamically allocating a 2D array?", "options": ["One contiguous block, versus an array of pointers to separately allocated rows that may not be contiguous", "One lives on the stack, the other on the heap", "One is row-major, the other is column-major", "One needs `free`, the other is freed automatically"], "answer": 0, "why": "Method 1 = one contiguous block. Method 2 = array of row pointers, each row its own `malloc`, so rows may be scattered. Both are on the heap and both must be freed."}, {"id": "d2-write", "type": "self", "lines": 22, "q": "On paper: write a C program that asks for the number of rows and columns, allocates an `int**` matrix, fills it with `grid[i][j] = i + j`, prints it as a grid, and frees all memory.", "model": "```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n  int rows, cols;\n  printf(\"Enter number of rows: \");\n  scanf(\"%d\", &rows);\n  printf(\"Enter number of columns: \");\n  scanf(\"%d\", &cols);\n\n  int** grid = malloc(rows * sizeof(int*));\n  if (grid == NULL) { return 1; }\n\n  for (int i = 0; i < rows; i++) {\n    grid[i] = malloc(cols * sizeof(int));\n    if (grid[i] == NULL) { return 1; }\n    for (int j = 0; j < cols; j++) {\n      grid[i][j] = i + j;\n    }\n  }\n\n  for (int i = 0; i < rows; i++) {\n    for (int j = 0; j < cols; j++) {\n      printf(\"%d \", grid[i][j]);\n    }\n    printf(\"\\n\");\n  }\n\n  for (int i = 0; i < rows; i++) {\n    free(grid[i]);\n  }\n  free(grid);\n  return 0;\n}\n```", "rubric": ["outer `malloc(rows * sizeof(int*))`", "one `malloc(cols * sizeof(int))` per row, inside a loop", "checks a `malloc` result for `NULL`", "nested loops fill and print with `grid[i][j]`, newline after each row", "frees every row, then the outer array"], "why": "This is the practice set's only code-writing question, with a different fill value. The order that loses points: freeing `grid` before the rows (leaks every row), and using `sizeof(int)` for the outer array."}]}, {"id": "t-make", "title": "make (practice set: make and Makefiles)", "read": "**Must know (4 things):**\n\n1. **Default target = the first target in the file**, whatever it's called. Plain `make` builds it.\n2. **A target is rebuilt only if it's missing or older than one of its dependencies** (make compares timestamps). Otherwise \"nothing to be done\".\n3. `make X` builds only `X` and what `X` depends on. `make X Y` does `X`, then `Y`, in the order typed.\n4. A dependency that doesn't exist and has no rule = **error**, make stops.\n\n### Worked: the Makefile used in this part\n\n```make\nCC = gcc\nCFLAGS = -Wall -g\n\nlaunch: parse render\n\nparse: parse.c\n\t$(CC) $(CFLAGS) -o parse parse.c\n\nrender: render.c\n\t$(CC) $(CFLAGS) -o render render.c\n\nexport: export.c\n\t$(CC) $(CFLAGS) -o export export.c\n\ntidy:\n\trm -f parse render\n```\n\n- **Default target:** `launch` (first target; the `CC =` lines are variables, not targets).\n- **`make render`** runs `gcc -Wall -g -o render render.c` (substitute the variables).\n- **`make`** builds `launch`'s dependencies, `parse` then `render`. It never builds `export`: nothing `launch` needs depends on it.\n- **`make` again, nothing changed:** nothing is rebuilt; both programs are newer than their `.c` files.\n- **Edit only `render.c`, then `make`:** only `render` is rebuilt. `parse.c` didn't change.\n- **`make tidy`** runs `rm -f parse render`. It does not remove `export`.\n- **`make tidy` then `make parse`:** only `parse` is built.\n- **A file named `launch` exists and is newer than everything:** `make` does nothing; it thinks `launch` is up to date.\n", "questions": [{"id": "mk-default", "type": "short", "mode": "text", "q": "```make\nCC = gcc\nCFLAGS = -Wall -g\n\nlaunch: parse render\n\nparse: parse.c\n\t$(CC) $(CFLAGS) -o parse parse.c\n\nrender: render.c\n\t$(CC) $(CFLAGS) -o render render.c\n\nexport: export.c\n\t$(CC) $(CFLAGS) -o export export.c\n\ntidy:\n\trm -f parse render\n```\n\nWhat is the default target?", "accept": ["launch"], "why": "The first target listed is `launch`. Its name doesn't matter, and `CC`/`CFLAGS` are variables."}, {"id": "mk-cmd", "type": "short", "mode": "cmd", "q": "```make\nCC = gcc\nCFLAGS = -Wall -g\n\nlaunch: parse render\n\nparse: parse.c\n\t$(CC) $(CFLAGS) -o parse parse.c\n\nrender: render.c\n\t$(CC) $(CFLAGS) -o render render.c\n\nexport: export.c\n\t$(CC) $(CFLAGS) -o export export.c\n\ntidy:\n\trm -f parse render\n```\n\nWhat exact command runs for `make export`?", "accept": ["gcc -Wall -g -o export export.c"], "why": "Substitute `$(CC)` = `gcc` and `$(CFLAGS)` = `-Wall -g`: `gcc -Wall -g -o export export.c`."}, {"id": "mk-edit", "type": "mc", "q": "```make\nCC = gcc\nCFLAGS = -Wall -g\n\nlaunch: parse render\n\nparse: parse.c\n\t$(CC) $(CFLAGS) -o parse parse.c\n\nrender: render.c\n\t$(CC) $(CFLAGS) -o render render.c\n\nexport: export.c\n\t$(CC) $(CFLAGS) -o export export.c\n\ntidy:\n\trm -f parse render\n```\n\n`make` has just run successfully. You edit only `parse.c` and run `make`. What is rebuilt?", "options": ["Only `parse`", "`parse` and `render`", "`parse`, `render` and `export`", "Nothing"], "answer": 0, "why": "`parse.c` is now newer than `parse`, so `parse` is rebuilt. `render.c` is unchanged, so `render` is up to date. `export` isn't part of `launch` at all."}, {"id": "mk-clean", "type": "mc", "q": "```make\nCC = gcc\nCFLAGS = -Wall -g\n\nlaunch: parse render\n\nparse: parse.c\n\t$(CC) $(CFLAGS) -o parse parse.c\n\nrender: render.c\n\t$(CC) $(CFLAGS) -o render render.c\n\nexport: export.c\n\t$(CC) $(CFLAGS) -o export export.c\n\ntidy:\n\trm -f parse render\n```\n\nYou run `make tidy`, then `make render`, with no source changes. What happens on the second command?", "options": ["Only `render` is built", "`parse` and `render` are built", "Nothing: no source file changed", "An error: `render` was deleted"], "answer": 0, "why": "`tidy` deleted the programs, so `render` is missing and must be built. You asked for `render` only, so `parse` is not built."}, {"id": "mk-order", "type": "short", "mode": "list", "q": "```make\nCC = gcc\nCFLAGS = -Wall -g\n\nlaunch: parse render\n\nparse: parse.c\n\t$(CC) $(CFLAGS) -o parse parse.c\n\nrender: render.c\n\t$(CC) $(CFLAGS) -o render render.c\n\nexport: export.c\n\t$(CC) $(CFLAGS) -o export export.c\n\ntidy:\n\trm -f parse render\n```\n\nIn an empty build (no programs yet) you run `make export parse`. List the targets in the order they are built.", "accept": ["export parse"], "why": "Targets on the command line are built in the order given: `export`, then `parse`."}, {"id": "mk-missing", "type": "mc", "q": "```make\nCC = gcc\nCFLAGS = -Wall -g\n\nlaunch: parse render\n\nparse: parse.c\n\t$(CC) $(CFLAGS) -o parse parse.c\n\nrender: render.c\n\t$(CC) $(CFLAGS) -o render render.c\n\nexport: export.c\n\t$(CC) $(CFLAGS) -o export export.c\n\ntidy:\n\trm -f parse render\n```\n\n`render.c` is deleted and no programs exist yet. What happens when you run `make`?", "options": ["make stops with an error: there is no way to make `render.c`", "It builds `parse` and skips `render` silently", "It builds an empty `render`", "Nothing is built and nothing is printed"], "answer": 0, "why": "`render` needs `render.c`, which doesn't exist and has no rule, so make reports an error and stops. (`parse` comes first, so it may be built before the error.)"}, {"id": "mk-named", "type": "mc", "q": "```make\nCC = gcc\nCFLAGS = -Wall -g\n\nlaunch: parse render\n\nparse: parse.c\n\t$(CC) $(CFLAGS) -o parse parse.c\n\nrender: render.c\n\t$(CC) $(CFLAGS) -o render render.c\n\nexport: export.c\n\t$(CC) $(CFLAGS) -o export export.c\n\ntidy:\n\trm -f parse render\n```\n\nA file named `launch` exists in the directory and is newer than every other file. What does `make` do?", "options": ["Nothing: it believes `launch` is up to date", "Rebuilds `parse` and `render`", "Reports an error", "Deletes `launch` and rebuilds everything"], "answer": 0, "why": "make only looks at timestamps. A `launch` file newer than `parse` and `render` looks up to date, so nothing is built."}]}, {"id": "t-bash", "title": "Bash scripts (practice set: Bash Programming)", "read": "**Must know (definitions the practice set asks word for word):**\n\n- **Shell script:** an executable text file containing a sequence of shell commands; used to group commands and automate tasks.\n- **`#!/bin/bash`** (the shebang, first line): names the interpreter. The program that runs the script is **`/bin/bash`**.\n- **See permissions:** `ls -l`. **Add execute for the user:** `chmod u+x script.sh`.\n- Commands run **top to bottom, in order**.\n\n| Test | True when |\n|---|---|\n| `[ $x -eq 5 ]` | x equals 5 |\n| `[ $x -gt 5 ]` / `-lt` / `-le` | greater than / less than / less or equal |\n| `[ -e f ]` | f exists |\n| `[ -f f ]` | f exists and is a regular file |\n| `[ \"$w\" = \"cat\" ]` | the strings are equal |\n\n**Globs in a `for` loop:** `*` = any characters (including none), `?` = exactly one character, `[0-9]` = exactly one digit. Hidden files (starting with `.`) are never matched. **The loop runs once per matching file.**\n\n### Worked trace\n\n```bash\n#!/bin/bash\ntotal=0\nfor n in 3 6 7 10\ndo\n  if [ $((n % 2)) -eq 0 ]\n  then\n    total=$((total + n))\n  else\n    total=$((total + 2))\n  fi\ndone\necho $total\n```\n\nMake a table, one row per loop pass:\n\n| n | even? | total |\n|---|---|---|\n| 3 | no | 0 + 2 = 2 |\n| 6 | yes | 2 + 6 = 8 |\n| 7 | no | 8 + 2 = 10 |\n| 10 | yes | 10 + 10 = **20** |\n\nPrints `20`.\n\n### Worked glob\n\nFiles: `run1.sh run2.sh runA.sh run12.sh notes.sh .run3.sh`. `for f in run?.sh` matches `run1.sh`, `run2.sh`, `runA.sh` (one character between `run` and `.sh`), so the loop runs **3** times. `run[0-9].sh` matches only `run1.sh` and `run2.sh`.\n", "questions": [{"id": "bs-basics", "type": "blanks", "q": "Type each command or path.", "blanks": [{"label": "the program that runs a script starting with `#!/bin/bash`", "mode": "text", "accept": ["/bin/bash", "bash"]}, {"label": "command to view a file's permissions", "mode": "cmd", "accept": ["ls -l"]}, {"label": "command to add execute permission for the user on `backup.sh`", "mode": "cmd", "accept": ["chmod u+x backup.sh"]}], "why": "The shebang names the interpreter, `/bin/bash`. `ls -l` shows permissions. `chmod u+x backup.sh`: `u` = user, `+x` = add execute."}, {"id": "bs-words", "type": "short", "mode": "num", // Answer normalising + grading. Shared by the page (window.Grade) and validate.js (node).
(function (root) {
  'use strict';

  function clean(raw) {
    return String(raw == null ? '' : raw)
      .replace(/[−–—]/g, '-')
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/ /g, ' ')

      .replace(/^`+|`+$/g, '')
      .trim();
  }

  // Numbers: 12, -3.5, +0.25, 3/8, 2^-3, 1.5*2^3, 1e-8, inf, -inf, nan
  function parseNum(raw) {
    let s = clean(raw).toLowerCase().replace(/\s+/g, '').replace(/×/g, '*');
    if (!s) return null;
    if (s === 'nan') return 'nan';
    if (/^[+-]?(inf|infinity|∞)$/.test(s)) return s[0] === '-' ? -Infinity : Infinity;
    let m = s.match(/^([+-]?)(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (m) return (m[1] === '-' ? -1 : 1) * parseFloat(m[2]) / parseFloat(m[3]);
    m = s.match(/^([+-]?)(?:(\d+(?:\.\d+)?)[*x])?2(?:\^|\*\*)\(?([+-]?\d+)\)?$/);
    if (m) return (m[1] === '-' ? -1 : 1) * (m[2] ? parseFloat(m[2]) : 1) * Math.pow(2, parseInt(m[3], 10));
    if (/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/.test(s)) return parseFloat(s);
    return null;
  }

  const splitList = s => clean(s).split(/\s*(?:->|→|,|;|\bthen\b)\s*|\s+/).filter(Boolean);

  // Each normaliser returns a comparable string, or null when the input isn't valid for the mode.
  const norm = {
    hex(s) {
      const t = clean(s).toLowerCase().replace(/[\s_]/g, '').replace(/^0x/, '');
      if (!/^[0-9a-f]+$/.test(t)) return null;
      return t.replace(/^0+(?=.)/, '');
    },
    bits(s) {
      const t = clean(s).replace(/[\s_|]/g, '').replace(/^0b/i, '');
      return /^[01]+$/.test(t) ? t : null;
    },
    num(s) {
      // "2 bytes" and "3 times" are the number; a count typed with its unit is not a wrong answer
      s = clean(s).replace(/\s*(bytes?|bits?|elements?|times?|digits?|blocks?|calls?|pass(es)?|iterations?|characters?|chars?)$/i, '');
      const v = parseNum(s);
      return v === null ? null : v;
    },
    text(s) {
      return clean(s).toLowerCase().replace(/^["']+|["']+$/g, '').replace(/\s+/g, ' ').replace(/[.!]+$/, '').trim();
    },
    code(s) {
      return clean(s).replace(/\s+/g, '').replace(/;$/, '');
    },
    cmd(s) {
      return clean(s).replace(/\s+/g, ' ');
    },
    list(s) {
      return splitList(s).join(' ');
    },
    set(s) {
      return splitList(s).sort().join(' ');
    },
  };

  function same(mode, a, b) {
    if (a === null || b === null) return false;
    if (mode === 'num') {
      if (a === 'nan' || b === 'nan') return a === b;
      if (!isFinite(a) || !isFinite(b)) return a === b;
      // relative, so 1e-16 and 1e-15 are different answers and tiny denormals are compared exactly
      return Math.abs(a - b) <= 1e-9 * Math.max(Math.abs(a), Math.abs(b));
    }
    return a === b;
  }

  // spec = {mode, accept:[...], acceptRe:[...]}
  function checkOne(spec, raw) {
    const mode = spec.mode || 'text';
    const n = (norm[mode] || norm.text)(raw);
    if (clean(raw) === '') return false;
    for (const a of spec.accept || []) {
      if (same(mode, n, (norm[mode] || norm.text)(a))) return true;
    }
    for (const re of spec.acceptRe || []) {
      if (new RegExp(re, 'i').test(norm.text(raw))) return true;
    }
    return false;
  }

  // -> {ok, parts?}   answer: mc = index | [indices]; short = string; blanks = [strings]; self = 'got'|'part'|'miss'
  function grade(q, answer) {
    if (q.type === 'mc') {
      const want = [].concat(q.answer).slice().sort().join(',');
      const got = [].concat(answer == null ? [] : answer).slice().sort().join(',');
      return { ok: want === got };
    }
    if (q.type === 'short') return { ok: checkOne(q, answer) };
    if (q.type === 'blanks') {
      const parts = q.blanks.map((b, i) => checkOne(b, (answer || [])[i]));
      return { ok: parts.every(Boolean), parts };
    }
    if (q.type === 'self') return { ok: answer === 'got' };
    return { ok: false };
  }

  const api = { clean, parseNum, norm, same, checkOne, grade };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Grade = api;
})(typeof window !== 'undefined' ? window : globalThis);

// Small markdown renderer for the subset described in BRIEF.md. No HTML passes through.
(function (root) {
  'use strict';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function inline(src) {
    const codes = [];
    let s = String(src).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
    // backslash-escaped punctuation (\* \_ \^ \~) is literal
    s = s.replace(/\\([*_^~\\])/g, (_, ch) => '\u0002' + ch.charCodeAt(0) + '\u0002');

      .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w\\])\*([^*\s](?:[^*]*?[^*\s])?)\*(?![\w*])/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<s>$1</s>')

      .replace(/_\{([^}]*)\}/g, '<sub>$1</sub>');

    if (!m) return 'note';
    const k = m[1].trim().toLowerCase();
    if (k === 'trap' || k === 'warning' || k === 'careful') return 'trap';
    if (k === 'rule' || k === 'key idea' || k === 'recipe') return 'rule';

  function blocks(lines) {

    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }

      if (isFence(line)) {
        const indent = line.match(/^\s*/)[0].length;
        const lang = line.trim().slice(3).trim().toLowerCase();
        const body = [];
        i++;
        while (i < lines.length && !isFence(lines[i])) { body.push(lines[i].slice(Math.min(indent, lines[i].match(/^\s*/)[0].length))); i++; }
        i++;
        html += '<pre class="code"' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' + esc(body.join('\n')) + '</code></pre>';
        continue;
      }

      if (isQuote(line)) {
        const inner = [];
        while (i < lines.length && isQuote(lines[i])) { inner.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        html += '<blockquote class="callout ' + calloutClass(inner.join(' ')) + '">' + blocks(inner) + '</blockquote>';
        continue;
      }

      if (isRow(line) && i + 1 < lines.length && isSep(lines[i + 1])) {
        const head = cells(line);
        i += 2;
        let rows = '';
        while (i < lines.length && isRow(lines[i])) {
          rows += '<tr>' + cells(lines[i]).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
          i++;
        }
        html += '<div class="tbl"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        continue;
      }

      if (isHead(line)) {
        html += '<h4>' + inline(line.replace(/^\s*#{1,4}\s+/, '')) + '</h4>';
        i++;
        continue;
      }

      const lm = line.match(listRe);
      if (lm) {
        const base = lm[1].length;
        const ordered = /\d/.test(lm[2]);
        const items = [];
        let inFence = false;
        while (i < lines.length) {
          const l = lines[i];
          const m = l.match(listRe);
          if (inFence) { items[items.length - 1].push(l); if (isFence(l)) inFence = false; i++; continue; }
          if (m && m[1].length === base) { items.push([m[3]]); i++; continue; }
          const ind = l.match(/^\s*/)[0].length;
          if (!l.trim()) {
            // a blank line stays in the list only if the next non-blank line is indented or another item

            break;
          }
          if (ind > base) { if (isFence(l)) inFence = true; items[items.length - 1].push(l.slice(Math.min(ind, base + 2))); i++; continue; }

        }
        const tag = ordered ? 'ol' : 'ul';
        html += '<' + tag + '>' + items.map(it => {
          const inner = blocks(it);

    const m = h.match(/^<p>([\s\S]*)<\/p>$/);
    return m && !/<p>/.test(m[1]) ? m[1] : h;
  }

  function label(src) {
    return String(src == null ? '' : src).split(/(`[^`\n]+`)/).map(part =>
      /^`[^`\n]+`$/.test(part) ? '<code>' + esc(part.slice(1, -1)) + '</code>' : esc(part)).join('');
  }

  const api = { render, renderInline, inline, label, esc };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.MD = api;
