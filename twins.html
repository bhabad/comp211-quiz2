(function (root) {
  'use strict';
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[ri(0, arr.length - 1)];
  const hx = n => '0x' + n.toString(16).toUpperCase();

  // 0x7FFE_3A9C_0F48 for long addresses, 0x4F48 for short ones
  function addr(n) {
    let h = n.toString(16).toUpperCase();
    if (h.length <= 4) return '0x' + h.padStart(4, '0');
    h = h.padStart(Math.ceil(h.length / 4) * 4, '0');
    return '0x' + h.match(/.{4}/g).join('_');
  }

  const TYPES = [
    { t: 'char', n: 1 }, { t: 'int8_t', n: 1 }, { t: 'short', n: 2 }, { t: 'int16_t', n: 2 },
    { t: 'int', n: 4 }, { t: 'int32_t', n: 4 }, { t: 'float', n: 4 },
    { t: 'long', n: 8 }, { t: 'int64_t', n: 8 }, { t: 'double', n: 8 }, { t: 'int *', n: 8, ptr: true },
  ];
  const WIDE = TYPES.filter(T => T.n > 1);
  const decl = (T, name) => T.t + (T.ptr ? '' : ' ') + name;
  const sizeNote = T => `\`sizeof(${T.t})\` = ${T.n}`;

  function base() {
    const low = ri(0, 0x1FF) * 8;
    if (Math.random() < 0.55) return ri(1, 0xE) * 0x1000 + low;
    return 0x7FFE00000000 + ri(0, 0xFFFF) * 0x10000 + ri(0, 0xF) * 0x1000 + low;
  }

  // ---------- element addresses ----------
  function elemAddr() {
    const T = pick(WIDE), len = ri(8, 40), b = base(), v = ri(0, 3);
    const d = `\`${decl(T, `a[${len}]`)}\``;
    if (v === 0) {
      const i = ri(2, len - 1), off = i * T.n;
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}). What is the address of \`a[${i}]\`?`,
        accept: [hx(b + off)],
        why: `\`&a[i] = base + i × size\`. ${i} × ${T.n} = ${off} = \`${hx(off)}\`. \`${addr(b)} + ${hx(off)} = ${addr(b + off)}\`. Convert the offset to hex **before** adding.` };
    }
    if (v === 1) {
      const k = ri(3, len - 1); let j = ri(0, len - 1); if (j === k) j = k - 2;
      const ak = b + k * T.n, diff = (j - k) * T.n;
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${d}: the address of \`a[${k}]\` is \`${addr(ak)}\` (${sizeNote(T)}). What is the address of \`a[${j}]\`?`,
        accept: [hx(ak + diff)],
        why: `\`a[${j}]\` is ${Math.abs(j - k)} element${Math.abs(j - k) === 1 ? '' : 's'} ${j > k ? 'after' : 'before'} \`a[${k}]\`: ${Math.abs(j - k)} × ${T.n} = ${Math.abs(diff)} = \`${hx(Math.abs(diff))}\` bytes. \`${addr(ak)} ${diff < 0 ? '−' : '+'} ${hx(Math.abs(diff))} = ${addr(ak + diff)}\`.` };
    }
    if (v === 2) {
      const i = ri(1, len - 1), s = b + i * T.n;
      return { type: 'blanks',
        q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}). Which addresses does \`a[${i}]\` occupy?`,
        blanks: [{ label: 'first (lowest) address', mode: 'hex', accept: [hx(s)] }, { label: 'last (highest) address', mode: 'hex', accept: [hx(s + T.n - 1)] }],
        why: `Start: ${i} × ${T.n} = \`${hx(i * T.n)}\`, so \`${addr(s)}\`. It is ${T.n} bytes long, so it ends ${T.n - 1} later at \`${addr(s + T.n - 1)}\` (not ${T.n} later: that is the next element).` };
    }
    const i = ri(1, len - 1), x = b + i * T.n + ri(0, T.n - 1);
    return { type: 'short', mode: 'num', placeholder: 'index',
      q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}). Which element (index) contains the byte at address \`${addr(x)}\`?`,
      accept: [String(i)],
      why: `Offset = \`${addr(x)} − ${addr(b)}\` = \`${hx(x - b)}\` = ${x - b} bytes. ${x - b} ÷ ${T.n} = ${i} remainder ${(x - b) % T.n}, so it is inside \`a[${i}]\`.` };
  }

  // ---------- hex warm-up ----------
  function hexWarm() {
    const v = ri(0, 3);
    if (v === 0) {
      const a = ri(0x100, 0xFFF) * 4, d = pick([4, 8, 0xC, 0x10, 0x14, 0x18, 0x1C, 0x20, 0x24, 0x28, 0x30, 0x38, 0x40, 0x48, 0x50, 0x64]);
      return { type: 'short', mode: 'hex', placeholder: '0x…', q: `\`${hx(a)} + ${hx(d)}\` = ?`, accept: [hx(a + d)],
        why: `Add digit by digit in base 16, carrying at 16: \`${hx(a)} + ${hx(d)} = ${hx(a + d)}\` (decimal check: ${a} + ${d} = ${a + d}).` };
    }
    if (v === 1) {
      const d = pick([4, 8, 0xC, 0x10, 0x14, 0x18, 0x1C, 0x20, 0x28, 0x30]), a = ri(0x100, 0xFFF) * 4 + d;
      return { type: 'short', mode: 'hex', placeholder: '0x…', q: `\`${hx(a)} − ${hx(d)}\` = ?`, accept: [hx(a - d)],
        why: `Borrow 16 when a digit goes negative: \`${hx(a)} − ${hx(d)} = ${hx(a - d)}\` (decimal check: ${a} − ${d} = ${a - d}).` };
    }
    if (v === 2) {
      const n = ri(3, 31), s = pick([2, 4, 8]);
      return { type: 'short', mode: 'hex', placeholder: '0x…', q: `An index of ${n} into an array of ${s}-byte elements is an offset of how many bytes? Answer **in hex**.`, accept: [hx(n * s)],
        why: `${n} × ${s} = ${n * s} decimal = \`${hx(n * s)}\` (${Math.floor(n * s / 16)} sixteens and ${(n * s) % 16} ones).` };
    }
    const a = ri(0x100, 0xFFF) * 4, n = ri(2, 30), s = pick([2, 4, 8]);
    return { type: 'short', mode: 'num', placeholder: 'count', q: `Two elements of an array of ${s}-byte values are at \`${hx(a)}\` and \`${hx(a + n * s)}\`. How many elements apart are they?`, accept: [String(n)],
      why: `\`${hx(a + n * s)} − ${hx(a)} = ${hx(n * s)}\` = ${n * s} bytes. ${n * s} ÷ ${s} = ${n} elements.` };
  }

  // ---------- little-endian ----------
  function distinctBytes(n) {
    const out = [];
    while (out.length < n) { const b = ri(0x01, 0xFE); if (!out.includes(b)) out.push(b); }
    return out;
  }
  const b2 = n => n.toString(16).toUpperCase().padStart(2, '0');
  function dumpTable(a, bytes) {
    return '| address | byte |\n|---|---|\n' + bytes.map((x, i) => `| \`${addr(a + i)}\` | \`${b2(x)}\` |`).join('\n');
  }
  function littleEndian() {
    const v = ri(0, 2), a = base();
    if (v === 0) {
      const n = pick([4, 4, 8]), bytes = distinctBytes(n), k = ri(0, n - 1);
      const val = '0x' + bytes.slice().reverse().map(b2).join('');
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `A ${n}-byte value \`${val}\` is stored at address \`${addr(a)}\` on a little-endian machine. Which byte is at address \`${addr(a + k)}\`?`,
        accept: ['0x' + b2(bytes[k])],
        why: `Little-endian: the **least significant byte goes at the lowest address**. From \`${addr(a)}\` upward the bytes are ${bytes.map(b => '`' + b2(b) + '`').join(', ')}. \`${addr(a + k)}\` is byte ${k}, so \`0x${b2(bytes[k])}\`.` };
    }
    if (v === 1) {
      const bytes = distinctBytes(8), n = pick([2, 4, 4, 8]), off = n === 8 ? 0 : ri(0, 8 - n);
      const got = bytes.slice(off, off + n);
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `Memory on a little-endian machine:\n\n${dumpTable(a, bytes)}\n\nWhat value does a \`uint${n * 8}_t\` read from address \`${addr(a + off)}\` have? Answer in hex.`,
        accept: ['0x' + got.slice().reverse().map(b2).join('')],
        why: `Take ${n} bytes starting at \`${addr(a + off)}\`: ${got.map(b => '`' + b2(b) + '`').join(' ')}. The lowest address holds the least significant byte, so write them in **reverse**: \`0x${got.slice().reverse().map(b2).join('')}\`.` };
    }
    const n = pick([2, 4]), bytes = distinctBytes(n);
    const val = '0x' + bytes.slice().reverse().map(b2).join('');
    return { type: 'blanks',
      q: `On a little-endian machine, a \`uint${n * 8}_t\` at address \`${addr(a)}\` is set to \`${val}\`. What is in each byte?`,
      blanks: bytes.map((b, i) => ({ label: `byte at ${addr(a + i)}`, mode: 'hex', accept: ['0x' + b2(b)] })),
      why: `Least significant byte first: ${bytes.map((b, i) => `\`${addr(a + i)}\` = \`${b2(b)}\``).join(', ')}. Only the order of whole **bytes** flips, never the two hex digits inside a byte.` };
  }

  // ---------- pointer arithmetic ----------
  function ptrArith() {
    const T = pick(TYPES.filter(x => !x.ptr)), v = ri(0, 4);
    const p = Math.floor(base() / 8) * 8, n = ri(2, 12);
    const d = `\`${T.t} *p = (${T.t} *)${addr(p)};\``;
    if (v === 0 || v === 1) {
      const expr = v === 0 ? pick([`p + ${n}`, `&p[${n}]`]) : `p - ${n}`;
      const r = v === 0 ? p + n * T.n : p - n * T.n;
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${d} (${sizeNote(T)})\n\nWhat address is \`${expr}\`?`,
        accept: [hx(r)],
        why: `Pointer arithmetic moves in **elements**, not bytes: ${n} × ${T.n} = ${n * T.n} = \`${hx(n * T.n)}\` bytes. \`${addr(p)} ${v === 0 ? '+' : '−'} ${hx(n * T.n)} = ${addr(r)}\`.${T.n > 1 ? ` Adding a raw ${n} gives \`${addr(v === 0 ? p + n : p - n)}\`, which is wrong.` : ''}` };
    }
    if (v === 2) {
      const W = pick(WIDE.filter(x => !x.ptr));
      const dd = `\`${W.t} *p = (${W.t} *)${addr(p)};\``;
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${dd} (${sizeNote(W)})\n\nWhat address is \`(char *)p + ${n}\`?`,
        accept: [hx(p + n)],
        why: `The cast happens first, so the arithmetic is on a \`char *\` and each step is 1 byte: \`${addr(p)} + ${hx(n)} = ${addr(p + n)}\`. Without the cast it would be ${n} × ${W.n} = \`${hx(n * W.n)}\` bytes.` };
    }
    if (v === 3) {
      const W = pick(WIDE.filter(x => !x.ptr)), q = p + n * W.n;
      return { type: 'short', mode: 'num', placeholder: 'number',
        q: `\`${W.t} *p\` holds \`${addr(p)}\` and \`${W.t} *q\` holds \`${addr(q)}\` (${sizeNote(W)}). What is the value of \`q - p\`?`,
        accept: [String(n)],
        why: `Subtracting pointers gives a count of **elements**: \`${addr(q)} − ${addr(p)} = ${hx(n * W.n)}\` = ${n * W.n} bytes, and ${n * W.n} ÷ ${W.n} = ${n}.` };
    }
    const W = pick(WIDE.filter(x => !x.ptr)), times = ri(2, 6);
    return { type: 'short', mode: 'hex', placeholder: '0x…',
      q: `\`${W.t} *p = (${W.t} *)${addr(p)};\` (${sizeNote(W)})\n\nAfter \`p++;\` runs ${times} times, what address does \`p\` hold?`,
      accept: [hx(p + times * W.n)],
      why: `Each \`p++\` advances one element = ${W.n} bytes. ${times} × ${W.n} = \`${hx(times * W.n)}\`. \`${addr(p)} + ${hx(times * W.n)} = ${addr(p + times * W.n)}\`.` };
  }

  // ---------- floating point ----------
  function fpFormat() {
    const k = pick([2, 3, 3, 4]), f = pick([2, 3, 4, 4, 5]);
    return { k, f, bias: (1 << (k - 1)) - 1, maxE: (1 << k) - 1 };
  }
  const fmtText = F => `1 sign bit, ${F.k} exponent bits, ${F.f} fraction bits (${1 + F.k + F.f} bits total, bias = 2^{k−1} − 1)`;
  const bin = (n, w) => n.toString(2).padStart(w, '0');
  const pattern = (F, s, e, m) => `${s} ${bin(e, F.k)} ${bin(m, F.f)}`;
  function fpValue(F, s, e, m) {
    const sg = s ? -1 : 1;
    if (e === 0) return m === 0 ? { cls: 'zero', v: sg * 0 } : { cls: 'denormalized', v: sg * (m / (1 << F.f)) * Math.pow(2, 1 - F.bias) };
    if (e === F.maxE) return m === 0 ? { cls: 'infinity', v: sg * Infinity } : { cls: 'NaN', v: NaN };
    return { cls: 'normalized', v: sg * (1 + m / (1 << F.f)) * Math.pow(2, e - F.bias) };
  }
  const CLS = {
    normalized: ['normalized', 'normal', 'norm'],
    denormalized: ['denormalized', 'denormal', 'denorm', 'subnormal', 'denormalised'],
    zero: ['zero', '0', '+0', '-0'],
    infinity: ['infinity', 'inf', '+infinity', '-infinity', '+inf', '-inf', '∞', '+∞', '-∞'],
    NaN: ['nan', 'not a number'],
  };
  const signed = v => (Object.is(v, -0) ? '−0' : v === 0 ? '+0' : v === Infinity ? '+∞' : v === -Infinity ? '−∞' : (v > 0 ? '+' : '−') + Math.abs(v));
  const numAccept = v => (Number.isNaN(v) ? ['nan'] : v === Infinity ? ['inf'] : v === -Infinity ? ['-inf'] : [String(v)]);

  function fpWhy(F, s, e, m) {
    const r = fpValue(F, s, e, m), frac = bin(m, F.f), sg = s ? 'negative' : 'positive';
    const head = `Bias = 2^{${F.k}−1} − 1 = ${F.bias}. Sign bit ${s} → ${sg}. Exponent field \`${bin(e, F.k)}\` = ${e}. `;
    if (r.cls === 'zero') return head + `All-zero exponent **and** all-zero fraction → **${s ? '−0' : '+0'}**.`;
    if (r.cls === 'infinity') return head + `All-ones exponent with a zero fraction → **${s ? '−∞' : '+∞'}**.`;
    if (r.cls === 'NaN') return head + `All-ones exponent with a non-zero fraction → **NaN** (the sign doesn't matter).`;
    if (r.cls === 'denormalized')
      return head + `All-zero exponent with a non-zero fraction → **denormalized**: no implicit 1, and the exponent is fixed at 1 − bias = ${1 - F.bias}. Value = 0.${frac}₂ × 2^{${1 - F.bias}} = ${m / (1 << F.f)} × ${Math.pow(2, 1 - F.bias)} = **${signed(r.v)}**.`;
    return head + `Neither all zeros nor all ones → **normalized**. True exponent = ${e} − ${F.bias} = ${e - F.bias}. Value = 1.${frac}₂ × 2^{${e - F.bias}} = ${1 + m / (1 << F.f)} × ${Math.pow(2, e - F.bias)} = **${signed(r.v)}**.`;
  }

  function randomPattern(F, allowSpecial) {
    const s = ri(0, 1), r = Math.random();
    if (allowSpecial && r < 0.08) return [s, F.maxE, 0];
    if (allowSpecial && r < 0.16) return [s, F.maxE, ri(1, (1 << F.f) - 1)];
    if (allowSpecial && r < 0.2) return [s, 0, 0];
    if (r < 0.5) return [s, 0, ri(1, (1 << F.f) - 1)];
    return [s, ri(1, F.maxE - 1), ri(0, (1 << F.f) - 1)];
  }

  function fpDecode() {
    const F = fpFormat(), [s, e, m] = randomPattern(F, true), r = fpValue(F, s, e, m);
    return { type: 'blanks',
      q: `Format: ${fmtText(F)}.\n\nDecode \`${pattern(F, s, e, m)}\`.`,
      blanks: [
        { label: 'bias', mode: 'num', accept: [String(F.bias)] },
        { label: 'kind (normalized / denormalized / zero / infinity / NaN)', mode: 'text', accept: CLS[r.cls] },
        { label: 'value (decimal, with its sign; inf or nan if special)', mode: 'num', accept: numAccept(r.v) },
      ],
      why: fpWhy(F, s, e, m) };
  }

  function fpEncode() {
    const F = fpFormat(), [s, e, m] = randomPattern(F, false), r = fpValue(F, s, e, m);
    return { type: 'short', mode: 'bits', placeholder: `${1 + F.k + F.f} bits`,
      q: `Format: ${fmtText(F)}.\n\nEncode **${signed(r.v)}**. Give all ${1 + F.k + F.f} bits.`,
      accept: [pattern(F, s, e, m)],
      why: (r.cls === 'denormalized'
        ? `Bias = ${F.bias}. Try normalized first: |value| = ${Math.abs(r.v)} would need a stored exponent of ${Math.floor(Math.log2(Math.abs(r.v))) + F.bias}, which is ≤ 0, so it has to be **denormalized**: exponent field all zeros, value = 0.f × 2^{${1 - F.bias}}. 0.f = ${Math.abs(r.v)} ÷ ${Math.pow(2, 1 - F.bias)} = ${m / (1 << F.f)} = 0.${bin(m, F.f)}₂. `
        : `Bias = ${F.bias}. |value| = ${Math.abs(r.v)} = 1.${bin(m, F.f)}₂ × 2^{${e - F.bias}}. Stored exponent = ${e - F.bias} + ${F.bias} = ${e} = \`${bin(e, F.k)}\`. Fraction = the bits after the leading 1, padded to ${F.f}: \`${bin(m, F.f)}\`. `)
        + `Sign bit ${s}. Pattern: \`${pattern(F, s, e, m)}\`.` };
  }

  function fpExtremes() {
    const F = fpFormat(), ones = (1 << F.f) - 1;
    const cases = [
      ['largest positive **normalized**', 0, F.maxE - 1, ones, 'largest exponent that is not all ones, fraction all ones'],
      ['smallest positive **normalized**', 0, 1, 0, 'exponent field 1 (the smallest that is not all zeros), fraction all zeros'],
      ['largest positive **denormalized**', 0, 0, ones, 'exponent all zeros, fraction all ones'],
      ['smallest positive **denormalized** (the smallest positive value at all)', 0, 0, 1, 'exponent all zeros, fraction 0…01'],
    ];
    const [name, s, e, m, how] = pick(cases), r = fpValue(F, s, e, m);
    return { type: 'blanks',
      q: `Format: ${fmtText(F)}.\n\nWhat is the ${name} value?`,
      blanks: [
        { label: `bit pattern (${1 + F.k + F.f} bits)`, mode: 'bits', accept: [pattern(F, s, e, m)] },
        { label: 'value (decimal, a fraction, or like 1.75*2^3)', mode: 'num', accept: [String(r.v)] },
      ],
      why: `Pattern: ${how} → \`${pattern(F, s, e, m)}\`. ` + fpWhy(F, s, e, m) };
  }

  // ---------- 2D arrays ----------
  function arr2d() {
    const T = pick(WIDE.filter(x => !x.ptr)), R = ri(3, 9), C = ri(3, 9), b = base(), v = ri(0, 3);
    const i = ri(1, R - 1), j = ri(0, C - 1), lin = i * C + j;
    const d = `\`${T.t} a[${R}][${C}]\``;
    if (v === 0)
      return { type: 'short', mode: 'num', placeholder: 'index',
        q: `${d} is stored in row-major order. What is the linear index (0-based position in the flat block) of \`a[${i}][${j}]\`?`,
        accept: [String(lin)],
        why: `linear index = i × C + j = ${i} × ${C} + ${j} = **${lin}**. Multiply by the number of **columns** (${C}), not rows (${R})${R !== C ? `: ${i} × ${R} + ${j} = ${i * R + j} is the classic slip` : ''}.` };
    if (v === 1)
      return { type: 'short', mode: 'hex', placeholder: '0x…',
        q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}), row-major. What is the address of \`a[${i}][${j}]\`?`,
        accept: [hx(b + lin * T.n)],
        why: `Linear index = ${i} × ${C} + ${j} = ${lin}. Byte offset = ${lin} × ${T.n} = ${lin * T.n} = \`${hx(lin * T.n)}\`. \`${addr(b)} + ${hx(lin * T.n)} = ${addr(b + lin * T.n)}\`.` };
    if (v === 2)
      return { type: 'blanks',
        q: `${d} is row-major. Which element is at linear index ${lin}?`,
        blanks: [{ label: 'row i', mode: 'num', accept: [String(i)] }, { label: 'column j', mode: 'num', accept: [String(j)] }],
        why: `i = ${lin} ÷ ${C} = ${i} (integer division by the column count), j = ${lin} mod ${C} = ${j}. So \`a[${i}][${j}]\`.` };
    return { type: 'blanks',
      q: `${d} starts at \`${addr(b)}\` (${sizeNote(T)}), row-major. Which element is stored at address \`${addr(b + lin * T.n)}\`?`,
      blanks: [{ label: 'row i', mode: 'num', accept: [String(i)] }, { label: 'column j', mode: 'num', accept: [String(j)] }],
      why: `Offset = \`${hx(lin * T.n)}\` = ${lin * T.n} bytes → ${lin * T.n} ÷ ${T.n} = linear index ${lin}. i = ${lin} ÷ ${C} = ${i}, j = ${lin} mod ${C} = ${j}.` };
  }

  // ---------- first-fit heap ----------
  // free list = sorted [start, size] blocks; first fit, split, coalesce; no headers
  function heapSim(size, ops) {
    let free = [[0, size]];
    const live = {}, log = [];
    const show = () => (free.length ? free.map(([s, n]) => `${s}-${s + n - 1}`).join(', ') : 'empty');
    for (const op of ops) {
      if (op.malloc) {
        const idx = free.findIndex(([, n]) => n >= op.malloc);
        if (idx < 0) { live[op.p] = null; log.push([`${op.p} = malloc(${op.malloc})`, 'NULL (no single free block is big enough)', show()]); continue; }
        const [s, n] = free[idx];
        live[op.p] = [s, op.malloc];
        if (n === op.malloc) free.splice(idx, 1); else free[idx] = [s + op.malloc, n - op.malloc];
        log.push([`${op.p} = malloc(${op.malloc})`, `${s}-${s + op.malloc - 1}`, show()]);
      } else {
        if (!live[op.free]) { log.push([`free(${op.free})`, 'free(NULL) does nothing', show()]); continue; }
        const [s, n] = live[op.free];
        delete live[op.free];
        free.push([s, n]);
        free.sort((a, b) => a[0] - b[0]);
        const merged = [];
        for (const blk of free) {
          const last = merged[merged.length - 1];
          if (last && last[0] + last[1] === blk[0]) last[1] += blk[1]; else merged.push(blk.slice());
        }
        free = merged;
        log.push([`free(${op.free})`, `${s}-${s + n - 1} returned`, show()]);
      }
    }
    return { free, live, log, show: show() };
  }

  function firstFit() {
    for (let attempt = 0; attempt < 200; attempt++) {
      const size = pick([800, 1000, 1000, 1200]), ops = [], live = [];
      let np = 0, frees = 0;
      const count = ri(6, 8);
      for (let k = 0; k < count; k++) {
        const last = k === count - 1;

          if (multi || exam) {
            if (!multi) { chosen.clear(); btns.forEach(x => x.classList.remove('sel')); }
            if (chosen.has(oi) && multi) { chosen.delete(oi); b.classList.remove('sel'); } else { chosen.add(oi); b.classList.add('sel'); }
          } else { chosen.add(oi); gradeMc(); }
        };
        return b;
      });
      add(list, btns);
      card.append(list);
      const want = new Set([].concat(q.answer));
      function gradeMc() {
        const ok = Grade.grade(q, multi ? [...chosen] : [...chosen][0]).ok;
        st.ans = [...chosen];
        btns.forEach(b => {
          const i = +b.getAttribute('data-i');
          if (want.has(i)) b.classList.add('correct');
          if (chosen.has(i) && !want.has(i)) b.classList.add('incorrect');
          if (chosen.has(i)) b.classList.add('sel');
        });
        finalize(ok, ok ? 'right' : 'wrong');
      }
      if (multi && !exam) card.append(h('button', { class: 'btn check', type: 'button', onclick: () => { if (chosen.size) gradeMc(); } }, 'Check'));
      getAnswer = () => gradeMc;
    }

    if (q.type === 'short' || q.type === 'blanks') {
      const specs = q.type === 'short' ? [q] : q.blanks;
      const rows = specs.map((sp, i) => {
        const inp = h('input', { type: 'text', class: 'ans-input mode-' + (sp.mode || 'text'), placeholder: sp.placeholder || hintFor(sp.mode), autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': sp.label || 'answer' });
        const mark = h('span', { class: 'mark' });
        const fix = h('span', { class: 'fix' });
        inp.onkeydown = e => {
          if (e.key !== 'Enter') return;
          e.preventDefault(); e.stopPropagation();
          const nxt = rows[i + 1];
          if (nxt && !nxt.inp.value) nxt.inp.focus(); else if (!exam) check();
        };
        return { sp, inp, mark, fix };
      });
      if (q.type === 'short') card.append(h('div', { class: 'short-row' }, rows[0].inp, rows[0].mark));
      else card.append(h('div', { class: 'blanks' }, rows.map(r => h('label', { class: 'blank' }, h('span', { class: 'blank-label', html: MD.label(r.sp.label) }), h('span', { class: 'blank-in' }, r.inp, r.mark, r.fix)))));
      const actions = h('div', { class: 'actions' });
      const showBtn = h('button', { class: 'btn ghost', type: 'button', hidden: true, onclick: () => { paint(true); finalize(false, 'wrong'); } }, 'Show the answer');
      const hint = q.hint ? h('div', { class: 'hint', hidden: true }, md('**Hint:** ' + q.hint, 'inline')) : null;
      const again = h('div', { class: 'try-again', hidden: true }, 'Not yet. Fix it and check again, or show the answer.');
      const typed = () => rows.map(r => r.inp.value.trim().slice(0, 160));
      function paint(final) {
        if (final && st.ans == null) st.ans = typed();
        const res = rows.map(r => Grade.checkOne(r.sp, r.inp.value));
        rows.forEach((r, i) => {
          r.mark.textContent = r.inp.value.trim() || final ? (res[i] ? '✓' : '✗') : '';
          r.mark.className = 'mark ' + (res[i] ? 'ok' : 'no');
          r.inp.classList.toggle('bad', !res[i] && (!!r.inp.value.trim() || final));
          r.inp.classList.toggle('good', res[i]);
          if (final && !res[i] && q.type === 'blanks') r.fix.innerHTML = '→ ' + MD.inline('`' + r.sp.accept[0] + '`');
        });
        return res.every(Boolean);
      }
      function check() {
        if (st.done) return;
        if (!rows.some(r => r.inp.value.trim())) return;
        const ok = paint(false);
        if (st.first === null) { st.first = ok; st.ans = typed(); }
        if (ok) { paint(true); return finalize(st.first, st.first ? 'right' : 'retry'); }
        again.hidden = false; showBtn.hidden = false; if (hint) hint.hidden = false;
        const firstBad = rows.find(r => r.inp.classList.contains('bad') || !r.inp.value.trim());
        if (firstBad) firstBad.inp.focus();
      }
      if (!exam) { actions.append(h('button', { class: 'btn check', type: 'button', onclick: check }, 'Check'), showBtn); card.append(actions, again); if (hint) card.append(hint); }
      getAnswer = () => () => { const ok = paint(true); finalize(ok, ok ? 'right' : 'wrong'); };
      card.focusFirst = () => rows[0].inp.focus({ preventScroll: true });
    }

    if (q.type === 'self') {
      const ta = h('textarea', { class: 'self-input', rows: q.lines || 6, placeholder: 'Write it here, or on paper (better practice for a paper quiz). Then compare.', spellcheck: 'false' });
      const model = h('div', { class: 'model', hidden: true });
      const show = h('button', { class: 'btn check', type: 'button' }, 'Show the model answer');
      const open = () => {
        if (!model.hidden) return;
        model.hidden = false; show.hidden = true;
        model.append(h('div', { class: 'model-label' }, 'Model answer'), md(q.model),
          h('div', { class: 'model-label' }, 'Did yours have these?'),
          h('ul', { class: 'rubric' }, q.rubric.map(r => h('li', {}, h('label', {}, h('input', { type: 'checkbox' }), h('span', { html: MD.renderInline(r) }))))),
          h('div', { class: 'self-grade' },
            h('button', { class: 'btn good', type: 'button', onclick: () => self('got') }, 'Got it'),
            h('button', { class: 'btn mid', type: 'button', onclick: () => self('part') }, 'Partly'),
            h('button', { class: 'btn bad', type: 'button', onclick: () => self('miss') }, 'Missed it')));
      };
      const self = g => { st.ans = [g, ta.value.trim().slice(0, 900)]; finalize(g === 'got', g === 'got' ? 'self-got' : g === 'part' ? 'self-part' : 'wrong'); };
      show.onclick = open;
      card.append(ta, h('div', { class: 'actions' }, exam ? null : show), model);
      getAnswer = () => open;
      card.focusFirst = () => ta.focus({ preventScroll: true });
    }

    card.append(fb);
    return { el: card, st, finish: () => { if (!st.done) getAnswer()(); }, isSelf: q.type === 'self' };
  }
  function hintFor(mode) {
    return { hex: '0x…', bits: 'bits', num: 'number', code: 'C expression', cmd: 'command', list: 'in order: a b c', set: 'any order: a b c' }[mode] || 'answer';
  }
  function answerText(q) {
    if (q.type === 'mc') return [].concat(q.answer).map(i => q.options[i]).join('; ');
    if (q.type === 'short') return '`' + q.accept[0] + '`';
    if (q.type === 'blanks') return q.blanks.map(b => '- ' + b.label.replace(/[*_^~]/g, '\\$&') + ' = `' + b.accept[0] + '`').join('\n');
    return '(see the model answer)';
  }

  // ---------- views ----------
  function page() {
    app.textContent = '';
    for (let i = 0; i < arguments.length; i++) add(app, arguments[i]);
    window.scrollTo(0, 0);
  }
  const go = hash => { if (location.hash === hash) route(); else location.hash = hash; };
  function reveal(el) {
    requestAnimationFrame(() => {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (el.focusFirst) setTimeout(() => el.focusFirst(), 250);
    });
  }

  function secStats(sec) {
    const st = P.sec[sec.id] || { parts: {} };
    const parts = sec.chunks.filter(c => st.parts && st.parts[c.id]).length;
    const keys = Object.keys(QINDEX).filter(k => QINDEX[k].sec === sec);
    const right = keys.filter(k => P.q[k] && P.q[k].ok).length;
    return { parts, total: sec.chunks.length, cp: st.cp, right, qs: keys.length, done: parts === sec.chunks.length && !!st.cp };
  }

  function countdown() {
    const ms = QUIZ_AT - Date.now();
    if (ms <= 0) return 'Quiz 2 was Wed Oct 14';
    const d = Math.floor(ms / 864e5), hr = Math.floor((ms % 864e5) / 36e5);
    return (d ? plural(d, 'day') + ' ' : '') + plural(hr, 'hour') + ' until Quiz 2 · Wed Oct 14, in class';
  }

  function home() {
    const partsDone = SECS.reduce((n, s) => n + secStats(s).parts, 0);
    const right = Object.keys(P.q).filter(k => QINDEX[k] && P.q[k].ok).length;
    const seen = Object.keys(P.q).filter(k => QINDEX[k]).length;
    const missed = missedKeys().length;
    let cont = null;
    if (P.last && SECS.find(s => s.id === P.last.sec)) {
      const s = SECS.find(x => x.id === P.last.sec);
      cont = h('a', { class: 'btn primary big', href: '#/s/' + s.id + '/' + P.last.step }, 'Continue: ' + s.title.replace(/:.*/, '') + (P.last.step > s.chunks.length ? ', checkpoint' : ', part ' + P.last.step) + ' →');
    } else cont = h('a', { class: 'btn primary big', href: '#/s/' + SECS[0].id + '/1' }, 'Start with section 1 →');

    page(
      h('header', { class: 'hero' },
        h('div', { class: 'eyebrow' }, countdown()),
        h('h1', {}, DATA.title || 'COMP 211 · Quiz 2 study guide'),
        h('p', { class: 'lede' }, 'Read a short part, answer a few questions on it, move on. Every section ends with a checkpoint. Your progress saves as you go.'),
        h('div', { class: 'hero-row' }, cont,
          h('div', { class: 'meters' },
            meter('Parts read', partsDone, TOTAL_PARTS),
            meter('Questions right', right, TOTAL_Q, seen ? plural(seen, 'question') + ' tried' : null)))),
      CLOUD && !syncCode ? h('a', { class: 'signin-note', href: '#/save' }, h('b', {}, 'Sign in to save your progress to your account.'), ' Until then it only lives in this browser. →') : null,
      h('nav', { class: 'tools' },
        tool('#/drills', 'Drills', 'Endless practice with fresh numbers'),
        tool('#/missed', 'Missed' + (missed ? ' (' + missed + ')' : ''), 'Redo what you got wrong'),
        tool('#/mock', 'Mock quiz', 'Timed, no feedback until the end'),
        tool('#/cheats', 'Rules to know cold', 'One page, every section'),
        tool('#/save', CLOUD ? 'Account' : 'Saving', CLOUD ? (syncCode ? 'Signed in' + (syncUser ? ' as ' + syncUser : '') : 'Sign in to sync') : fileHandle ? 'Saving to ' + fileHandle.name : 'Back up or move your progress')),
      h('h2', { class: 'list-title' }, 'Sections'),
      !DATA.route.length ? null : h('p', { class: 'route' }, h('b', {}, 'Short on time? '), 'All ' + SECS.length + ' sections are about ' + Math.round(SECS.reduce((n, x) => n + x.minutes, 0) / 60) + ' hours. Do the ★ ones first, in this order: ',
        DATA.route.map((id, i) => { const k = SECS.findIndex(x => x.id === id); return [i ? ' → ' : '', h('a', { href: '#/s/' + id }, String(k + 1))]; }),
        '. For the rest, take the checkpoint first and only read the parts you miss.'),
      h('ol', { class: 'sec-list' }, SECS.map((sec, i) => {
        const s = secStats(sec);
        const pct = Math.round(100 * s.parts / s.total);
        return h('li', {}, h('a', { class: 'sec-card' + (s.done ? ' done' : ''), href: '#/s/' + sec.id },
          h('span', { class: 'sec-n' }, s.done ? '✓' : String(i + 1)),
          h('span', { class: 'sec-main' },
            h('span', { class: 'sec-title' }, sec.title, DATA.high.includes(sec.id) ? h('span', { class: 'star', title: 'High-yield: most quiz points, most practice needed' }, '★ high-yield') : null),
            h('span', { class: 'sec-blurb' }, sec.blurb),
            h('span', { class: 'sec-meta' }, sec.objective + ' · ' + sec.sources + ' · about ' + sec.minutes + ' min')),
          h('span', { class: 'sec-prog' },
            h('span', { class: 'bar' }, h('span', { style: 'width:' + pct + '%' })),
            h('span', { class: 'sec-count' }, s.parts + '/' + s.total + ' parts' + (s.cp ? ' · checkpoint ' + s.cp.best + '%' : '')))));
      })),
      h('p', { class: 'foot' }, 'Unofficial study notes written by a student, not course material. If something looks off, flag it with ⚑ and check the lecture slides. ',
        h('a', { href: '#/flags' }, 'Flagged questions' + (flagCount() ? ' (' + flagCount() + ')' : ''))));
  }
  function meter(label, n, total, sub) {
    return h('div', { class: 'meter' }, h('div', { class: 'meter-top' }, h('span', {}, label), h('b', {}, n + ' / ' + total)),
      h('div', { class: 'bar' }, h('span', { style: 'width:' + (total ? 100 * n / total : 0) + '%' })), sub ? h('div', { class: 'meter-sub' }, sub) : null);
  }
  const tool = (href, title, sub) => h('a', { class: 'tool', href }, h('b', {}, title), h('span', {}, sub));

  function sectionView(sec, step) {
    const st = secState(sec.id);
    const n = sec.chunks.length;
    if (!step) step = P.last && P.last.sec === sec.id ? P.last.step : Math.min(n + 1, sec.chunks.findIndex(c => !st.parts[c.id]) + 1 || n + 1);
    step = Math.max(1, Math.min(n + 1, step));
    P.last = { sec: sec.id, step };
    persist();
    const idx = SECS.indexOf(sec);
    const rail = h('nav', { class: 'rail', 'aria-label': 'Parts' },
      sec.chunks.map((c, i) => h('a', { class: 'rail-step' + (st.parts[c.id] ? ' done' : '') + (i + 1 === step ? ' cur' : ''), href: '#/s/' + sec.id + '/' + (i + 1), title: c.title }, String(i + 1))),
      h('a', { class: 'rail-step cp' + (st.cp ? ' done' : '') + (step === n + 1 ? ' cur' : ''), href: '#/s/' + sec.id + '/' + (n + 1), title: 'Checkpoint' }, st.cp ? 'Checkpoint ' + st.cp.best + '%' : 'Checkpoint'));
    const top = h('header', { class: 'sec-head' },
      h('a', { class: 'back', href: '#/' }, '← All sections'),
      h('div', { class: 'eyebrow' }, 'Section ' + (idx + 1) + ' of ' + SECS.length + ' · ' + sec.objective + ' · ' + sec.sources),
      h('h1', {}, sec.title), rail);
    if (step <= n) chunkView(sec, step - 1, top); else checkpointView(sec, top);
  }

  function chunkView(sec, ci, top) {
    const c = sec.chunks[ci], n = sec.chunks.length, st = secState(sec.id);
    const qs = h('div', { class: 'qs' });
    const nextHash = '#/s/' + sec.id + '/' + (ci + 2);
    const nextLabel = ci + 1 < n ? 'Next part: ' + sec.chunks[ci + 1].title + ' →' : 'Start the checkpoint →';
    const skip = h('a', { class: 'skip', href: nextHash }, ci + 1 < n ? 'Skip to the next part' : 'Skip to the checkpoint');
    let i = 0;
    function showQ() {
      const q = c.questions[i], last = i === c.questions.length - 1;
      const card = questionCard(q, {
        key: sec.id + '/' + q.id,
        num: 'Question ' + (i + 1) + ' of ' + c.questions.length,
        next: last ? { label: nextLabel, fn: () => go(nextHash) } : { label: 'Next question ↓', fn: e => { e.target.remove(); i++; showQ(); } },
        onDone: () => { if (last) { st.parts[c.id] = true; persist(); skip.hidden = true; document.querySelectorAll('.rail-step')[ci].classList.add('done'); } },
      });
      qs.append(card.el);
      if (i > 0) reveal(card.el);
    }
    page(top,
      h('article', { class: 'read' },
        h('div', { class: 'read-label' }, 'Read · part ' + (ci + 1) + ' of ' + n),
        h('h2', {}, c.title), md(c.read)),
      h('div', { class: 'qs-label' }, 'Now answer · ' + plural(c.questions.length, 'question')),
      qs, skip);
    showQ();
  }

  // one-at-a-time quiz used by checkpoints, the missed list and drills-from-content
  function runQuiz(top, items, opt) {
    let i = 0;
    const results = [];
    const holder = h('div', { class: 'qs' });
    const prog = h('div', { class: 'quiz-prog' });
    function show() {
      const it = items[i], last = i === items.length - 1;
      prog.textContent = '';
      prog.append(h('span', {}, 'Question ' + (i + 1) + ' of ' + items.length), h('span', { class: 'bar' }, h('span', { style: 'width:' + (100 * i / items.length) + '%' })));
      holder.textContent = '';
      const card = questionCard(it.q, {
        key: it.key, num: it.label || 'Question ' + (i + 1),
        next: { label: last ? 'See how you did →' : 'Next question →', fn: () => { i++; if (i < items.length) show(); else finish(); } },
        onDone: r => results.push({ it, ok: r.ok }),
      });
      holder.append(card.el);
      window.scrollTo(0, Math.max(0, prog.getBoundingClientRect().top + window.scrollY - 70));
      if (card.el.focusFirst) setTimeout(() => card.el.focusFirst(), 50);
    }
    function finish() {
      const right = results.filter(r => r.ok).length, pct = Math.round(100 * right / items.length);
      const missed = results.filter(r => !r.ok).map(r => r.it);
      if (opt.onFinish) opt.onFinish(pct, right, items.length);
      page(top, h('section', { class: 'result' },
        h('div', { class: 'score' }, right + ' / ' + items.length),
        h('p', {}, pct === 100 ? 'All right on the first try.' : pct >= 80 ? 'Solid. Clean up the misses and move on.' : pct >= 50 ? 'Getting there. Redo the misses, then reread the parts they came from.' : 'This one needs another pass. Reread the parts, then try again.'),
        missed.length ? h('ul', { class: 'miss-list' }, missed.map(m => h('li', {}, md(m.q.q.split('\n')[0].slice(0, 160), 'inline')))) : null,
        h('div', { class: 'result-actions' },
          missed.length ? h('button', { class: 'btn primary', onclick: () => runQuiz(top, missed, { title: opt.title, after: opt.after }) }, 'Retry the ' + missed.length + ' you missed') : null,
          opt.after || null,
          h('a', { class: 'btn', href: '#/' }, 'All sections'))));
    }
    page(top, opt.intro || null, prog, holder);
    show();
  }

  function checkpointView(sec, top) {
    const st = secState(sec.id), idx = SECS.indexOf(sec), nxt = SECS[idx + 1];
    const items = sec.checkpoint.map(q => ({ q, key: sec.id + '/' + q.id }));
    const after = nxt ? h('a', { class: 'btn primary', href: '#/s/' + nxt.id + '/1' }, 'Next section: ' + nxt.title.replace(/:.*/, '') + ' →') : h('a', { class: 'btn primary', href: '#/mock' }, 'Take the mock quiz →');
    const start = () => runQuiz(top, items, {
      after,
      onFinish: pct => {
        st.cp = { best: Math.max(pct, st.cp ? st.cp.best : 0), last: pct, n: (st.cp ? st.cp.n : 0) + 1 };
        persist();
        const r = top.querySelector('.rail-step.cp');
        if (r) { r.textContent = 'Checkpoint ' + st.cp.best + '%'; r.classList.add('done'); }
      },
    });
    page(top, h('section', { class: 'result' },
      h('h2', {}, 'Checkpoint'),
      h('p', {}, plural(items.length, 'question') + ' on the whole section, new numbers, nothing to look back at. Work them on paper like the real quiz.'),
      st.cp ? h('p', { class: 'muted' }, 'Best so far: ' + st.cp.best + '% · last: ' + st.cp.last + '% · ' + plural(st.cp.n, 'attempt')) : null,
      h('div', { class: 'result-actions' }, h('button', { class: 'btn primary big', onclick: start }, st.cp ? 'Take it again' : 'Start the checkpoint'))));
  }

  function simpleHead(title, sub) {
    return h('header', { class: 'sec-head' }, h('a', { class: 'back', href: '#/' }, '← All sections'), h('h1', {}, title), sub ? h('p', { class: 'lede' }, sub) : null);

    paint(); next();
  }

  function missedView() {
    const keys = missedKeys();
    const top = simpleHead('Missed questions', 'Everything you got wrong the last time you saw it. Get one right on the first try and it leaves this list.');
    if (!keys.length) return page(top, h('section', { class: 'result' }, h('p', {}, Object.keys(P.q).length ? 'Nothing here. Every question you have tried, you last got right.' : 'Nothing here yet. Work through a section first.')));
    const bySec = SECS.map(sec => ({ sec, keys: keys.filter(k => QINDEX[k].sec === sec) })).filter(x => x.keys.length);
    const start = ks => runQuiz(top, shuffle(ks).map(k => ({ q: QINDEX[k].q, key: k, label: QINDEX[k].sec.title.replace(/:.*/, '') })), { after: h('a', { class: 'btn', href: '#/missed' }, 'Back to the missed list') });
    page(top,
      h('div', { class: 'result-actions' }, h('button', { class: 'btn primary big', onclick: () => start(keys) }, 'Practice all ' + keys.length)),
      h('ul', { class: 'miss-secs' }, bySec.map(x => h('li', {}, h('span', {}, x.sec.title), h('button', { class: 'btn', onclick: () => start(x.keys) }, plural(x.keys.length, 'question'))))));
  }

  function cheatsView() {
    page(simpleHead('Rules to know cold', 'No cheat sheet is allowed on the quiz, so these have to be in your head.'),
      SECS.map((sec, i) => h('section', { class: 'cheat' }, h('h3', {}, h('a', { href: '#/s/' + sec.id }, (i + 1) + '. ' + sec.title)),
        h('ul', {}, sec.cheats.map(c => h('li', { html: MD.renderInline(c) }))))));
  }

  function flagsView() {
    const keys = flagKeys().sort((a, b) => P.flags[b].t - P.flags[a].t);
    const text = () => keys.map(k => '[' + P.flags[k].where + ']\nNote: ' + (P.flags[k].note || '(none)') + '\nQ: ' + P.flags[k].text + '\nKey: ' + P.flags[k].answer).join('\n\n---\n\n');
    page(simpleHead('Flagged questions', 'Questions you marked as wrong, unclear or badly worded. They are saved with your progress.'),
      keys.length ? h('div', { class: 'result-actions' }, h('button', { class: 'btn', onclick: () => navigator.clipboard.writeText(text()).then(() => toast('Copied.')) }, 'Copy all flags as text')) : h('section', { class: 'result' }, h('p', {}, 'No flags. Use ⚑ on any question.')),
      keys.map(k => h('section', { class: 'q-card' },
        h('div', { class: 'q-head' }, h('span', { class: 'q-num' }, P.flags[k].where), h('button', { class: 'flag-btn on', onclick: () => { P.flags[k] = { t: Date.now(), off: true }; persist(); flagsView(); } }, 'remove')),
        md(P.flags[k].text, 'q-text'), h('div', { class: 'ans' }, h('span', {}, 'Key: '), md(P.flags[k].answer, 'inline')),
        P.flags[k].note ? h('p', { class: 'muted' }, 'Your note: ' + P.flags[k].note) : null)));
  }

  function saveView() {
    const top = simpleHead('Saving your progress', CLOUD
      ? 'Signed in, every answer is saved to your account as you go and follows you to any device. This browser keeps a copy too, so studying offline still works.'
      : 'Progress is saved in this browser automatically, every time you answer. A file is a backup, and the way to move progress to another browser or computer.');
    page(top,
      CLOUD ? loginCard() : null,
      h('section', { class: 'result left' },
        h('h3', {}, 'Save to a file'),
        canFile
          ? h('div', {},
              h('p', {}, fileHandle ? fileNote || 'Saving to ' + fileHandle.name + '.' : pendingHandle ? 'This browser was saving to ' + pendingHandle.name + '. One click to carry on.' : 'Pick a file once. After that every answer is written to it automatically.'),
              h('div', { class: 'result-actions' },
                pendingHandle && !fileHandle ? h('button', { class: 'btn primary', onclick: resumeFile }, 'Resume saving to ' + pendingHandle.name) : null,
                h('button', { class: 'btn' + (fileHandle || pendingHandle ? '' : ' primary'), onclick: connectFile }, fileHandle ? 'Save to a different file' : 'Choose a file to save to')))
          : h('p', {}, 'This browser cannot write to a file directly (Chrome and Edge can). Use Export below instead.'),
        h('h3', {}, 'Move it by hand'),
        h('div', { class: 'result-actions' },
          h('button', { class: 'btn', onclick: exportFile }, 'Export progress file'),
          h('button', { class: 'btn', onclick: importFile }, 'Import a progress file')),
        h('p', { class: 'muted' }, 'Importing merges: for each question the most recent answer wins, and nothing is lost.'),
        h('h3', {}, 'Start over'),
        h('div', { class: 'result-actions' }, h('button', { class: 'btn bad', onclick: () => { if (confirm(syncCode ? 'Erase all progress, in your account and on every device?' : 'Erase all progress in this browser?')) { P = blank(); P.resetAt = Date.now(); persist(); route(); } } }, 'Reset all progress'))));
  }

  function loginCard() {
    const box = h('section', { class: 'result left login' });
    if (syncCode) {
      const when = syncAt ? 'Last synced ' + new Date(syncAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '.' : syncState === 'offline' ? 'Offline right now. Answers are kept in this browser and sent when the connection is back.' : 'Syncing…';
      add(box, [h('h3', {}, 'Signed in' + (syncUser ? ' as ' + syncUser : '')), h('p', {}, when),
        h('div', { class: 'result-actions' },
          h('button', { class: 'btn primary', onclick: () => pushSync().then(() => { toast(syncState === 'ok' ? 'Synced.' : 'Could not reach the server.'); saveView(); }) }, 'Sync now'),
          h('button', { class: 'btn', onclick: () => { signOut(); saveView(); } }, 'Sign out on this device')),
        h('p', { class: 'muted' }, 'Signing out keeps the progress in this browser. It stops syncing until you sign in again.')]);
      return box;
    }
    const title = h('h3', {}, 'Sign in');
    const blurb = h('p', {}, 'Sign in to save your progress to your account.');
    const user = h('input', { type: 'text', class: 'ans-input', name: 'username', autocomplete: 'username', autocapitalize: 'off', spellcheck: 'false', placeholder: 'username', value: syncUser, required: true });
    const pass = h('input', { type: 'password', class: 'ans-input', name: 'password', autocomplete: 'current-password', placeholder: 'password', required: true });
    const err = h('p', { class: 'try-again', hidden: true });
    const btn = h('button', { class: 'btn primary', type: 'submit' }, 'Sign in');
    const form = h('form', { class: 'login-form', onsubmit: async e => {
      e.preventDefault();
      btn.disabled = true; err.hidden = true;
      try { const j = await signIn(user.value, pass.value); toast(j.created ? 'Login created. Progress now saves to your account.' : 'Signed in. Progress synced.'); route(); }
      catch (ex) { err.textContent = ex.message; err.hidden = false; btn.disabled = false; }
    } }, user, pass, btn);
    add(box, [title, blurb, form, err]);
    fetch('api/login').then(r => r.json()).then(j => {
      if (j.exists) return;
      title.textContent = 'Create your login';
      blurb.textContent = 'First time here: pick a username and a password (6 characters or more). That becomes the one login for this site, on every device.';
      pass.setAttribute('autocomplete', 'new-password');
      btn.textContent = 'Create login';
    }).catch(() => {});
    return box;
  }

  function mockView() {
    const top = simpleHead('Mock quiz', 'One question from every section plus extras from the high-yield ones. No feedback until you hand it in. The real quiz is about 45 minutes, on paper, closed notes.');
    function build() {
      const picked = [];
      let selfs = 0;
      const take = sec => {
        const pool = shuffle(sec.checkpoint.concat(...sec.chunks.map(c => c.questions.slice(-1)))).filter(q => !picked.some(p => p.q === q));
        const q = pool.find(x => x.type !== 'self' || selfs < 2);
        if (!q) return;
        if (q.type === 'self') selfs++;
        picked.push({ q, key: sec.id + '/' + q.id, sec });
      };
      SECS.forEach(take);
      SECS.filter(s => DATA.high.includes(s.id)).forEach(take);
      return picked;
    }
    function start() {
      const items = build();
      const endAt = Date.now() + 45 * 60000;
      const clock = h('div', { class: 'clock' });
      const tick = setInterval(() => {
        if (!document.body.contains(clock)) return clearInterval(tick);
        const s = Math.round((endAt - Date.now()) / 1000);
        clock.textContent = s >= 0 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' left' : 'Time is up (' + Math.floor(-s / 60) + ' min over)';
        clock.classList.toggle('over', s < 0);
      }, 500);
      const banner = h('div', { class: 'mock-score', hidden: true });
      const cards = items.map((it, i) => questionCard(it.q, { key: it.key, mode: 'exam', num: 'Question ' + (i + 1) + ' · ' + it.sec.title.replace(/:.*/, ''), onDone: () => score() }));
      let handed = false;
      function score() {
        if (!handed) return;
        const done = cards.filter(c => c.st.done), right = done.filter(c => c.st.ok).length;
        banner.hidden = false;
        banner.textContent = right + ' / ' + cards.length + (done.length < cards.length ? ' so far. Mark the written answers below to finish the score.' : ' · ' + Math.round(100 * right / cards.length) + '%');
        if (done.length === cards.length && !banner.dataset.saved) { banner.dataset.saved = '1'; P.mocks.push({ t: Date.now(), right, total: cards.length }); persist(); }
      }
      const hand = h('button', { class: 'btn primary big', onclick: () => {
        if (!confirm('Hand it in? Unanswered questions count as wrong.')) return;
        handed = true; clearInterval(tick); hand.remove();
        cards.forEach(c => c.finish());
        score(); window.scrollTo(0, 0);
      } }, 'Hand it in');
      page(top, clock, banner, h('div', { class: 'qs' }, cards.map(c => c.el)), h('div', { class: 'result-actions' }, hand));
    }
    page(top, h('section', { class: 'result' },
      P.mocks.length ? h('p', { class: 'muted' }, 'Past mocks: ' + P.mocks.map(m => m.right + '/' + m.total).join(', ')) : null,
      h('div', { class: 'result-actions' }, h('button', { class: 'btn primary big', onclick: start }, 'Start a 45-minute mock'))));
  }

  // ---------- router ----------
  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    document.querySelectorAll('.topnav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + (parts[0] && parts[0] !== 's' ? parts[0] : '')));
    navCounts();
    badge();
    if (parts[0] === 's') {
      const sec = SECS.find(s => s.id === parts[1]);
      if (sec) return sectionView(sec, parseInt(parts[2], 10) || 0);
    }
    if (parts[0] === 'drills') return drillsView(parts[1]);
    if (parts[0] === 'missed') return missedView();
    if (parts[0] === 'cheats') return cheatsView();
    if (parts[0] === 'flags') return flagsView();
    if (parts[0] === 'save') return saveView();
    if (parts[0] === 'mock') return mockView();
    home();
  }
  function navCounts() {
    const m = document.getElementById('nav-missed');
    if (m) m.textContent = 'Missed' + (missedKeys().length ? ' (' + missedKeys().length + ')' : '');
  }
  window.addEventListener('hashchange', route);

  // Enter = the primary "next" button; A–E / 1–5 pick a multiple-choice option
  document.addEventListener('keydown', e => {
    const t = e.target, typing = t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type !== 'checkbox'));
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Enter' && t && (t.tagName === 'BUTTON' || t.tagName === 'A')) return;
    if (e.key === 'Enter' && !typing) {
      const btns = [...document.querySelectorAll('.next-btn')].filter(b => b.offsetParent);
      if (btns.length) { e.preventDefault(); btns[btns.length - 1].click(); }
      return;
    }
    if (typing) return;
    const k = e.key.toLowerCase();
    const n = /^[1-9]$/.test(k) ? +k - 1 : /^[a-i]$/.test(k) ? k.charCodeAt(0) - 97 : -1;
    if (n < 0) return;
    const open = [...document.querySelectorAll('.q-card.q-mc:not(.locked)')].filter(c => c.offsetParent);
    if (open.length !== 1) return;
    const opt = open[0].querySelectorAll('.opt')[n];
    if (opt) opt.click();
  });

  // theme
  const themeBtn = document.getElementById('theme');
  const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem(KEY + '-theme', t); } catch (e) { /* ignore */ } };
  try { const t = localStorage.getItem(KEY + '-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
  if (themeBtn) themeBtn.onclick = () => setTheme((document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark');
  const sb = document.getElementById('save-badge');
  if (sb) sb.onclick = () => (!CLOUD && pendingHandle && !fileHandle ? resumeFile() : go('#/save'));

  route();
  // signed in: fetch what other devices saved, then redraw unless a question is already on screen
  if (syncCode) pushSync().then(() => { if (!document.querySelector('.q-card')) route(); });
})();

</script>
</body>
</html>
